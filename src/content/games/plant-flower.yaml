# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: sci-6-1-3
title: 꽃과 씨의 비밀
emoji: 🌸
summary: 꽃의 구조와 하는 일, 꽃가루받이를 돕는 것, 씨가 퍼지는 여러 가지 방법을 알아봐요.
story: 봄이 오자 꽃밭이 북적북적해졌어요! 꽃이 씨를 만들고, 그 씨가 새로운 곳으로 떠나는 여행을 따라가 보세요.
lessons:
- '7'
- '8'
standards:
- 6과11-02
minutes: 15
teacherGuide:
- 7차시 「꽃」, 8차시 「열매와 씨」 스테이지예요.
- 실제 꽃을 해부하여 관찰한 뒤 정리하는 데 쓰면 좋아요.
stages:
- id: flower
  title: 꽃
  emoji: 🌼
  lesson: '7'
  intro: 꽃의 구조와 하는 일을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과11-02
    cat: 지식·이해
    q: 꽃이 하는 가장 중요한 일은?
    options:
    - 씨를 만든다
    - 물을 흡수한다
    - 양분이 이동하는 통로가 된다
    answer: 씨를 만든다
  - type: sort
    lv: B
    std: 6과11-02
    cat: 지식·이해
    q: 꽃의 각 부분이 하는 일을 짝지어 보세요.
    bins:
    - 암술
    - 수술
    - 꽃잎
    - 꽃받침
    items:
    - text: 꽃가루받이가 이루어진 뒤 씨를 만든다
      bin: 암술
    - text: 꽃가루를 만든다
      bin: 수술
    - text: 곤충을 끌어들이고 암술과 수술을 보호한다
      bin: 꽃잎
    - text: 꽃잎을 받치고 보호한다
      bin: 꽃받침
  - type: choice
    lv: B
    std: 6과11-02
    cat: 지식·이해
    q: 꽃가루받이란 무엇일까요?
    options:
    - 수술에서 만든 꽃가루가 암술로 옮겨지는 것
    - 씨가 바람에 날려 퍼지는 것
    - 뿌리가 물을 흡수하는 것
    answer: 수술에서 만든 꽃가루가 암술로 옮겨지는 것
  - type: multi
    lv: A
    std: 6과11-02
    cat: 지식·이해
    q: 꽃가루받이를 돕는 것을 모두 골라 보세요.
    options:
    - 벌과 나비 같은 곤충
    - 동박새 같은 새
    - 바람
    - 물
    - 돌멩이
    answers:
    - 벌과 나비 같은 곤충
    - 동박새 같은 새
    - 바람
    - 물
    explain: 사과꽃은 곤충, 동백꽃은 새, 벼와 옥수수는 바람, 검정말은 물의 도움으로 꽃가루받이가 이루어져요.
- id: seeds
  title: 열매와 씨
  emoji: 🌰
  lesson: '8'
  intro: 씨가 퍼지는 여러 가지 방법을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과11-02
    cat: 지식·이해
    q: 그림의 왼쪽 위 민들레 씨는 어떻게 퍼질까요?
    options:
    - 바람에 날려서
    - 동물의 털에 붙어서
    - 꼬투리가 터져서
    answer: 바람에 날려서
    photo: illust/pl-seeds
  - type: sort
    lv: B
    std: 6과11-02
    cat: 지식·이해
    q: 씨가 퍼지는 방법에 따라 나누어 보세요.
    bins:
    - 바람에 날려서
    - 동물의 털에 붙어서
    - 꼬투리가 터져서
    - 물에 떠서
    items:
    - text: 민들레
      bin: 바람에 날려서
    - text: 단풍나무
      bin: 바람에 날려서
    - text: 도꼬마리
      bin: 동물의 털에 붙어서
    - text: 도깨비바늘
      bin: 동물의 털에 붙어서
    - text: 봉선화
      bin: 꼬투리가 터져서
    - text: 콩
      bin: 꼬투리가 터져서
    - text: 연꽃
      bin: 물에 떠서
    - text: 코코야자
      bin: 물에 떠서
    photo: illust/pl-seeds
  - type: choice
    lv: A
    std: 6과11-02
    cat: 지식·이해
    q: 식물의 씨가 여러 가지 방법으로 멀리 퍼지면 좋은 점으로 가장 알맞은 것은?
    options:
    - 어미 식물과 떨어진 새로운 곳에서 싹을 틔워 자랄 수 있다
    - 씨가 더 무거워진다
    - 꽃이 더 빨리 핀다
    answer: 어미 식물과 떨어진 새로운 곳에서 싹을 틔워 자랄 수 있다
  - type: multi
    lv: A
    std: 6과11-02
    cat: 지식·이해
    q: 열매가 하는 일을 모두 골라 보세요.
    options:
    - 어린 씨를 보호한다
    - 씨가 멀리 퍼지도록 돕는다
    - 땅속의 물을 흡수한다
    answers:
    - 어린 씨를 보호한다
    - 씨가 멀리 퍼지도록 돕는다
