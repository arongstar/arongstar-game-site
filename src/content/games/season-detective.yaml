template: mission
style: detective
unit: sci-6-2-1
title: 계절 탐정
emoji: 📅
summary: 서울의 월별 태양의 남중 고도, 낮의 길이, 기온 자료를 조사해 계절마다 무엇이 달라지는지, 그리고 왜 여름이 더운지 추론해요.
story: 탐정 사무소에 열두 달 치 하늘 기록이 도착했어요. 태양의 남중 고도와 낮의 길이를 단서로 계절의 비밀을 추론해 주세요.
lessons: ['4', '5']
standards: [6과13-02]
minutes: 12
teacherGuide:
  - 4차시 '남중 고도와 낮의 길이', 5차시 '계절과 기온' 스테이지로 나뉘어 있어요.
  - 남중 고도와 낮의 길이는 서울(북위 37.6°) 각 달 21일을 기준으로 계산한 값이고, 기온은 기상청 평년값(1991~2020)이에요.
  - 교육과정의 '디지털 자료를 활용한 탐구'와 이어서, 한국천문연구원 누리집 같은 곳에서 오늘의 해 뜨는 시각·지는 시각을 찾아보게 할 수 있어요.
stages:
  - id: altitude-daylength
    title: 남중 고도와 낮의 길이
    emoji: 🌞
    lesson: '4'
    intro: 계절에 따라 태양의 남중 고도와 낮의 길이가 어떻게 달라지는지 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6과13-02
        cat: 과정·기능
        bars: &alt
          title: 서울의 월별 태양 남중 고도 (각 달 21일)
          unit: °
          items:
            - { label: "1월", value: 32 }
            - { label: "2월", value: 41 }
            - { label: "3월", value: 52 }
            - { label: "4월", value: 64 }
            - { label: "5월", value: 73 }
            - { label: "6월", value: 76 }
            - { label: "7월", value: 73 }
            - { label: "8월", value: 64 }
            - { label: "9월", value: 52 }
            - { label: "10월", value: 41 }
            - { label: "11월", value: 32 }
            - { label: "12월", value: 29 }
          note: 북위 37.6°에서 계산한 값이에요.
        q: 태양의 남중 고도가 가장 높은 달은?
        options: [6월, 12월, 3월]
        answer: 6월
      - type: choice
        lv: C
        std: 6과13-02
        cat: 과정·기능
        table: &day
          title: 서울의 낮의 길이 (각 달 21일)
          head: [달, 낮의 길이, 달, 낮의 길이]
          rows:
            - ["1월", "약 10시간", "7월", "약 14시간 23분"]
            - ["2월", "약 11시간", "8월", "약 13시간 22분"]
            - ["3월", "약 12시간 6분", "9월", "약 12시간 7분"]
            - ["4월", "약 13시간 21분", "10월", "약 10시간 55분"]
            - ["5월", "약 14시간 20분", "11월", "약 9시간 56분"]
            - ["6월", "약 14시간 46분", "12월", "약 9시간 34분"]
          note: 해 뜨는 시각부터 해 지는 시각까지, 북위 37.6°에서 계산한 값이에요.
        q: 낮의 길이가 가장 짧은 달은?
        options: [12월, 6월, 9월]
        answer: 12월
      - type: choice
        lv: B
        std: 6과13-02
        cat: 과정·기능
        bars: *alt
        table: *day
        q: 두 자료를 함께 조사해 보면, 태양의 남중 고도와 낮의 길이는 어떤 관계가 있을까요?
        options:
          - 남중 고도가 높을수록 낮의 길이가 길다
          - 남중 고도가 높을수록 낮의 길이가 짧다
          - 둘은 아무 관계가 없다
        answer: 남중 고도가 높을수록 낮의 길이가 길다
      - type: sort
        lv: B
        std: 6과13-02
        cat: 지식·이해
        q: 여름과 겨울의 특징을 나누어 보세요.
        bins: [여름, 겨울]
        items:
          - { text: "태양의 남중 고도가 높다", bin: "여름" }
          - { text: "낮의 길이가 길다", bin: "여름" }
          - { text: "낮 12시 무렵 그림자가 짧다", bin: "여름" }
          - { text: "태양의 남중 고도가 낮다", bin: "겨울" }
          - { text: "낮의 길이가 짧다", bin: "겨울" }
          - { text: "낮 12시 무렵 그림자가 길다", bin: "겨울" }
      - type: multi
        lv: A
        std: 6과13-02
        cat: 과정·기능
        bars: *alt
        table: *day
        q: 자료를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 6월의 남중 고도는 12월보다 약 47° 높다
          - 6월 21일의 낮은 12월 21일보다 5시간쯤 길다
          - 3월과 9월은 남중 고도와 낮의 길이가 거의 같다
          - 남중 고도가 가장 낮은 달에 낮이 가장 길다
        answers:
          - 6월의 남중 고도는 12월보다 약 47° 높다
          - 6월 21일의 낮은 12월 21일보다 5시간쯤 길다
          - 3월과 9월은 남중 고도와 낮의 길이가 거의 같다

  - id: temperature
    title: 여름은 왜 더울까?
    emoji: 🌡️
    lesson: '5'
    intro: 남중 고도와 기온의 관계를 추론해요.
    steps:
      - type: choice
        lv: C
        std: 6과13-02
        cat: 과정·기능
        chart: seoul
        q: 서울의 기온 꺾은선을 보면 기온이 가장 높은 계절은?
        options: [여름, 겨울, 봄]
        answer: 여름
      - type: choice
        lv: C
        std: 6과13-02
        cat: 지식·이해
        sun: true
        q: 그림의 슬라이더를 움직여 보세요. 햇빛이 비스듬히 비출 때보다 높은 곳에서 똑바로 비출 때 땅은 어떻게 될까요?
        hint: 1단원 사회에서 썼던 햇볕 실험 그림과 같은 원리예요. 위도 대신 '태양이 비추는 각도'로 생각해 보세요.
        options: [좁은 땅에 햇빛이 모여 더 많이 데워진다, 땅이 덜 데워진다, 아무 차이가 없다]
        answer: 좁은 땅에 햇빛이 모여 더 많이 데워진다
      - type: choice
        lv: B
        std: 6과13-02
        cat: 지식·이해
        bars: *alt
        chart: seoul
        q: 여름에 기온이 높은 까닭을 남중 고도와 낮의 길이로 설명한 것으로 알맞은 것은?
        options:
          - 남중 고도가 높아 같은 넓이의 땅이 받는 태양 에너지가 많고, 낮이 길어 태양 에너지를 오래 받기 때문에
          - 여름에는 태양이 지구에 더 가까이 오기 때문에
          - 여름에는 낮이 짧기 때문에
        answer: 남중 고도가 높아 같은 넓이의 땅이 받는 태양 에너지가 많고, 낮이 길어 태양 에너지를 오래 받기 때문에
      - type: choice
        lv: A
        std: 6과13-02
        cat: 과정·기능
        bars: *alt
        chart: seoul
        q: 남중 고도는 6월에 가장 높은데, 서울의 기온은 8월에 가장 높아요. 이 자료를 근거로 가장 알맞게 추론한 것은?
        options:
          - 땅과 바다가 데워지는 데 시간이 걸려, 기온은 남중 고도가 가장 높은 때보다 늦게 가장 높아진다
          - 8월에 태양의 남중 고도가 가장 높기 때문이다
          - 남중 고도와 기온은 아무 관계가 없다
        answer: 땅과 바다가 데워지는 데 시간이 걸려, 기온은 남중 고도가 가장 높은 때보다 늦게 가장 높아진다
        explain: 하루 중에도 태양 고도가 가장 높은 때보다 기온이 2시간쯤 늦게 가장 높았던 것과 비슷해요.
      - type: multi
        lv: A
        std: 6과13-02
        cat: 지식·이해
        q: 계절에 따라 달라지는 것을 모두 고르세요.
        options:
          - 태양의 남중 고도
          - 낮의 길이
          - 기온
          - 지구에서 태양까지의 거리 때문에 생기는 여름과 겨울
        answers: [태양의 남중 고도, 낮의 길이, 기온]
        explain: 지구는 오히려 1월 초에 태양과 가장 가까워요. 여름이 더운 것은 거리 때문이 아니라 남중 고도와 낮의 길이 때문이에요.
