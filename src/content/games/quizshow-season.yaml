template: quizshow
unit: sci-6-2-1
title: 과학 퀴즈쇼 — 계절의 변화
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 단원 도입 때는 생각 열기로, 정리 때는 복습으로 써요.
lessons: ['1', '8']
standards: [6과13-01, 6과13-02, 6과13-03]
minutes: 20
teacherGuide:
  - 1차시에는 정답을 맞히기보다 '왜 그럴까?' 생각을 여는 데, 8차시에는 단원 정리에 써요.
  - 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
  - name: 하루 관측
    emoji: 🕒
    items:
      - { lv: "C", q: "태양이 땅과 이루는 각을 무엇이라고 할까요?", answer: "태양 고도" }
      - { lv: "B", q: "하루 중 태양 고도가 가장 높을 때 그림자 길이는 어떻게 될까요?", answer: "가장 짧아요." }
      - { lv: "A", q: "태양 고도가 가장 높은 때보다 기온이 2시간쯤 늦게 가장 높아지는 까닭을 설명해 보세요.", answer: "태양 에너지로 땅이 데워지고 데워진 땅이 공기를 데우는 데 시간이 걸리기 때문이에요." }
  - name: 남중 고도
    emoji: 🌞
    items:
      - { lv: "C", q: "태양이 정남쪽에 있을 때의 태양 고도를 무엇이라고 할까요?", answer: "태양의 남중 고도" }
      - { lv: "B", q: "서울에서 태양의 남중 고도가 가장 높은 달과 가장 낮은 달은?", answer: "가장 높은 달: 6월, 가장 낮은 달: 12월" }
      - { lv: "A", q: "남중 고도가 높을 때 기온이 높아지는 까닭을 설명해 보세요.", answer: "햇빛이 좁은 땅에 모여 같은 넓이의 땅이 받는 태양 에너지가 많아지기 때문이에요." }
  - name: 낮의 길이
    emoji: ⏳
    items:
      - { lv: "C", q: "낮의 길이가 가장 긴 계절은?", answer: "여름" }
      - { lv: "B", q: "태양의 남중 고도와 낮의 길이는 어떤 관계가 있을까요?", answer: "남중 고도가 높을수록 낮의 길이가 길어요." }
      - { lv: "A", q: "여름에 기온이 높은 까닭을 남중 고도와 낮의 길이로 함께 설명해 보세요.", answer: "남중 고도가 높아 땅이 받는 태양 에너지가 많고, 낮이 길어 태양 에너지를 오래 받기 때문이에요." }
  - name: 계절의 원인
    emoji: 🌍
    items:
      - { lv: "C", q: "지구가 태양 둘레를 1년에 한 바퀴씩 도는 것을 무엇이라고 할까요?", answer: "공전" }
      - { lv: "B", q: "계절이 바뀌는 까닭은 무엇일까요?", answer: "지구의 자전축이 기울어진 채 공전하기 때문이에요." }
      - { lv: "A", q: "자전축이 기울어지지 않은 채 공전한다면 어떻게 될지 설명해 보세요.", answer: "일 년 내내 남중 고도가 같아져 계절의 변화가 생기지 않아요." }
