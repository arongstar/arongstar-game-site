# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: quizshow
unit: sci-6-1-1
title: 과학 퀴즈쇼 — 산과 염기
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 지시약, 산성·염기성 용액의 성질, 생활 속 이용, 산성화를 정리해요.
