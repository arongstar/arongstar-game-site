categories:
- name: 지시약
  emoji: 🎨
  items:
  - lv: C
    q: 푸른 리트머스 종이를 붉게 만드는 용액은?
    answer: 산성 용액
  - lv: B
    q: 페놀프탈레인 용액을 붉게 만드는 용액은?
    answer: 염기성 용액
  - lv: A
    q: 겉보기 성질이 비슷한 용액을 분류할 때 지시약이 필요한 까닭을 말해 보세요.
    answer: 투명한 용액은 겉모습으로 구별하기 어렵지만, 지시약은 용액의 성질에 따라 색깔이 달라져 분류할 수 있어요.
- name: 용액의 성질
  emoji: 🥚
  items:
  - lv: C
    q: 대리석을 넣었을 때 기포가 생기는 용액은?
    answer: 산성 용액
  - lv: B
    q: 두부를 흐물흐물하게 만드는 용액은?
    answer: 염기성 용액
  - lv: A
    q: 산성 용액에 염기성 용액을 계속 넣으면 용액의 성질은 어떻게 변할까요?
    answer: 산성이 점점 약해지다가 염기성으로 변해요.
- name: 생활 속 산·염기
  emoji: 🏠
  items:
  - lv: C
    q: 생선 비린내를 줄일 때 뿌리는 산성 용액 한 가지는?
    answer: 식초 또는 레몬즙
  - lv: B
    q: 속이 쓰릴 때 먹는 제산제는 산성일까요, 염기성일까요?
    answer: 염기성
  - lv: A
    q: 여러 가지 세제를 섞어 쓰면 안 되는 까닭을 말해 보세요.
    answer: 서로 반응해 해로운 기체가 생길 수 있기 때문이에요.
- name: 산성화
  emoji: 🌧️
  items:
  - lv: C
    q: 대리석 문화재를 녹게 하는 비는?
    answer: 산성비
  - lv: B
    q: 바다가 산성으로 변하면 피해를 입는 생물 한 가지는?
    answer: 산호 또는 조개
  - lv: A
    q: 산성화를 줄이기 위해 우리 반이 실천할 일을 두 가지 말해 보세요.
    answer: 예) 가까운 거리 걷기, 전기 아끼기, 쓰레기 줄이기
