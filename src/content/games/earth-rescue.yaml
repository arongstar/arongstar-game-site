template: mission
style: village
unit: soc-6-2-3
title: 지구촌 위기 대응 본부
emoji: 🌍
summary: 기후 변화, 환경 오염, 빈곤과 분쟁 같은 지구촌 문제의 원인과 영향을 조사하고, 국제기구·국가·기업·개인이 함께하는 해결 방법을 찾아요.
story: 지구촌 위기 대응 본부에 경보가 울렸어요! 세계 곳곳에서 들어온 위기 신호를 분석하고, 지속가능한 미래를 위한 해결 작전을 세워 주세요.
lessons: ['8', '9', '10']
standards: [6사12-02]
minutes: 12
teacherGuide:
  - 8차시 '지구촌 문제 찾기', 9차시 '기후 변화와 환경 문제', 10차시 '지속가능한 미래를 위한 노력' 스테이지로 나뉘어 있어요.
  - 난민·분쟁 문제는 학생 가운데 관련 경험이 있는 학생이 있을 수 있어요. 학급 상황에 맞추어 조심스럽게 다뤄 주세요.
  - 지구 평균 기온 자료는 IPCC 제6차 평가 보고서(2021)와 세계기상기구(2025) 발표를 어림한 값이에요.
stages:
  # ════════════ 지구촌 문제 찾기 ════════════
  - id: find
    title: 지구촌 위기 신호를 찾아라
    emoji: 🚨
    lesson: '8'
    intro: 지구촌을 위협하는 여러 문제를 찾아 분류해요.
    steps:
      - type: sort
        lv: C
        std: 6사12-02
        cat: 지식·이해
        q: 지구촌을 위협하는 문제들을 알맞게 나누어 보세요.
        bins: [환경 문제, 빈곤·기아 문제, 분쟁·난민 문제]
        items:
          - { text: "지구의 기온이 오르는 기후 변화", bin: "환경 문제" }
          - { text: "바다에 쌓이는 플라스틱 쓰레기", photo: "global/plastic", bin: "환경 문제" }
          - { text: "먹을 것이 부족해 굶주리는 어린이", bin: "빈곤·기아 문제" }
          - { text: "깨끗한 물을 구하기 어려운 마을", bin: "빈곤·기아 문제" }
          - { text: "전쟁으로 집을 잃고 떠난 사람들", photo: "global/refugeecamp", bin: "분쟁·난민 문제" }
          - { text: "나라 사이의 영토·종교 갈등", bin: "분쟁·난민 문제" }
      - type: choice
        lv: C
        std: 6사12-02
        cat: 지식·이해
        photo: global/plastic
        q: 사진 속 바닷가에서 볼 수 있는 지구촌 문제는?
        options: [플라스틱 쓰레기로 인한 바다 오염, 인구가 너무 많아지는 문제, 일자리가 부족한 문제]
        answer: 플라스틱 쓰레기로 인한 바다 오염
      - type: choice
        lv: C
        std: 6사12-02
        cat: 지식·이해
        photo: global/refugeecamp
        q: 전쟁이나 박해를 피해 자기 나라를 떠나 다른 나라로 간 사람들을 무엇이라고 할까요?
        options: [난민, 관광객, 유학생]
        answer: 난민

      - type: multi
        lv: B
        std: 6사12-02
        cat: 지식·이해
        q: 지구촌 문제의 특징을 조사해 알맞은 것을 모두 고르세요.
        options:
          - 한 나라만의 문제가 아니라 여러 나라에 영향을 준다
          - 여러 나라가 함께 힘을 모아야 해결할 수 있다
          - 우리 생활과도 이어져 있다
          - 먼 나라의 일이라 우리와는 관계가 없다
        answers:
          - 한 나라만의 문제가 아니라 여러 나라에 영향을 준다
          - 여러 나라가 함께 힘을 모아야 해결할 수 있다
          - 우리 생활과도 이어져 있다
      - type: choice
        lv: B
        std: 6사12-02
        cat: 지식·이해
        photo: global/deforestation
        q: 열대 우림을 넓게 베어 내면 지구촌에 어떤 문제가 생길까요?
        options:
          - 나무가 흡수하던 이산화 탄소가 늘어 기후 변화가 심해지고, 많은 생물이 살 곳을 잃는다
          - 지구가 시원해진다
          - 아무 문제도 생기지 않는다
        answer: 나무가 흡수하던 이산화 탄소가 늘어 기후 변화가 심해지고, 많은 생물이 살 곳을 잃는다

      - type: order
        lv: A
        std: 6사12-02
        cat: 과정·기능
        q: 지구촌 문제는 서로 이어져 있어요. 원인에서 결과로 이어지는 순서대로 놓아 보세요.
        items:
          - 석탄·석유를 많이 태우고 숲을 베어 낸다
          - 공기 중 온실가스가 늘어 지구의 기온이 오른다
          - 가뭄과 홍수가 잦아져 농사가 어려워진다
          - 먹을 것과 물이 부족해 살던 곳을 떠나는 사람들이 생긴다
      - type: multi
        lv: A
        std: 6사12-02
        cat: 지식·이해
        q: 위의 순서를 분석해 알 수 있는 것을 모두 고르세요.
        options:
          - 환경 문제가 빈곤과 난민 문제로 이어지기도 한다
          - 한 가지 문제를 해결하면 다른 문제를 줄이는 데에도 도움이 된다
          - 지구촌 문제들은 서로 아무 관계가 없다
        answers:
          - 환경 문제가 빈곤과 난민 문제로 이어지기도 한다
          - 한 가지 문제를 해결하면 다른 문제를 줄이는 데에도 도움이 된다

  # ════════════ 기후 변화와 환경 ════════════
  - id: climate
    title: 뜨거워지는 지구
    emoji: 🌡️
    lesson: '9'
    intro: 기후 변화와 환경 문제의 원인과 영향을 조사해요.
    steps:
      - type: choice
        lv: C
        std: 6사12-02
        cat: 지식·이해
        photo: global/seaice
        q: 지구의 기온이 오르면서 북극과 높은 산에서 일어나는 일은?
        options: [빙하와 바다 얼음이 녹아 줄어든다, 빙하가 점점 더 두꺼워진다, 아무 변화가 없다]
        answer: 빙하와 바다 얼음이 녹아 줄어든다
      - type: pin
        lv: C
        std: 6사12-02
        cat: 과정·기능
        photo: global/tuvalu
        q: 바닷물 높이가 올라가 땅이 물에 잠길 위기에 놓인 섬나라 투발루는 지도에서 어디일까요?
        hint: 태평양 한가운데, 오스트레일리아의 북동쪽에 있는 작은 섬나라예요.
        pins: [tuvalu, greenland, japan, brazil]
        answer: tuvalu
      - type: choice
        lv: C
        std: 6사12-02
        cat: 지식·이해
        photo: global/drought
        q: 비가 오랫동안 내리지 않아 땅이 메마르고 사막처럼 변해 가는 것을 무엇이라고 할까요?
        options: [사막화, 도시화, 산업화]
        answer: 사막화

      - type: choice
        lv: B
        std: 6사12-02
        cat: 과정·기능
        table:
          title: 산업화 이전(1850~1900년)보다 오른 지구 평균 기온
          head: [기간, 오른 기온]
          rows:
            - ["2011~2020년 평균", "약 1.1℃"]
            - ["2024년 한 해", "약 1.55℃"]
          note: IPCC 제6차 평가 보고서(2021)와 세계기상기구(2025) 발표를 어림한 값이에요.
        q: 표를 조사해서 알 수 있는 것으로 가장 알맞은 것은?
        options:
          - 지구 평균 기온이 산업화 이전보다 높아졌고, 최근에 더 높아지고 있다
          - 지구 평균 기온이 점점 낮아지고 있다
          - 지구 평균 기온은 변하지 않았다
        answer: 지구 평균 기온이 산업화 이전보다 높아졌고, 최근에 더 높아지고 있다
        explain: 1℃쯤은 작아 보이지만, 지구 전체의 평균 기온이 오르면 빙하가 녹고 폭염·가뭄·홍수가 잦아져요.
      - type: sort
        lv: B
        std: 6사12-02
        cat: 지식·이해
        q: 기후 변화의 원인과 결과로 나누어 보세요.
        bins: [원인, 결과]
        items:
          - { text: "석탄·석유를 많이 태운다", bin: "원인" }
          - { text: "숲을 넓게 베어 낸다", bin: "원인" }
          - { text: "자동차와 공장에서 온실가스가 나온다", bin: "원인" }
          - { text: "빙하가 녹는다", bin: "결과" }
          - { text: "바닷물 높이가 올라간다", bin: "결과" }
          - { text: "폭염·가뭄·홍수가 잦아진다", bin: "결과" }
      - type: multi
        lv: B
        std: 6사12-02
        cat: 지식·이해
        photo: global/plastic
        q: 플라스틱 쓰레기 문제를 줄이기 위해 내가 할 수 있는 일을 모두 고르세요.
        options:
          - 장바구니와 텀블러를 쓴다
          - 분리배출을 정확하게 한다
          - 일회용 빨대와 컵을 덜 쓴다
          - 바닷가에 쓰레기를 두고 온다
        answers: [장바구니와 텀블러를 쓴다, 분리배출을 정확하게 한다, 일회용 빨대와 컵을 덜 쓴다]

      - type: choice
        lv: A
        std: 6사12-02
        cat: 지식·이해
        photo: global/tuvalu
        q: 투발루는 온실가스를 아주 적게 내보냈지만 바닷물 높이가 올라 큰 피해를 입고 있어요. 이 사례를 분석한 것으로 가장 알맞은 것은?
        options:
          - 온실가스를 많이 내보낸 나라들도 함께 책임지고, 피해를 입는 나라를 도와야 한다
          - 투발루 사람들이 스스로 해결해야 하는 문제다
          - 바닷물 높이는 온실가스와 관계가 없다
        answer: 온실가스를 많이 내보낸 나라들도 함께 책임지고, 피해를 입는 나라를 도와야 한다
      - type: choice
        lv: A
        std: 6사12-02
        cat: 지식·이해
        photo: global/renewable
        q: 석탄·석유 대신 햇빛과 바람으로 전기를 만드는 것이 지속가능한 미래에 도움이 되는 까닭을 분석하면?
        options:
          - 온실가스를 적게 내보내고, 다 써서 없어질 걱정이 적은 에너지이기 때문에
          - 햇빛과 바람은 밤낮없이 늘 똑같이 있기 때문에
          - 전기를 만들 필요가 없어지기 때문에
        answer: 온실가스를 적게 내보내고, 다 써서 없어질 걱정이 적은 에너지이기 때문에
        explain: 햇빛과 바람은 날씨에 따라 달라서, 전기를 저장하는 기술도 함께 발전시키고 있어요.

  # ════════════ 지속가능한 미래를 위한 노력 ════════════
  - id: solutions
    title: 함께 만드는 지속가능한 미래
    emoji: 🤝
    lesson: '10'
    intro: 국제기구·국가·기업·개인이 함께하는 노력을 알아봐요.
    steps:
      - type: sort
        lv: C
        std: 6사12-02
        cat: 지식·이해
        q: 지구촌 문제를 해결하는 단체를 국제기구와 비정부 기구(NGO)로 나누어 보세요.
        hint: 국제기구는 여러 나라 정부가 함께 만든 단체, 비정부 기구는 시민들이 자발적으로 만든 단체예요.
        bins: [국제기구, 비정부 기구]
        items:
          - { text: "국제 연합(UN)", bin: "국제기구" }
          - { text: "국제 연합 아동 기금(유니세프)", bin: "국제기구" }
          - { text: "세계 보건 기구(WHO)", bin: "국제기구" }
          - { text: "국경 없는 의사회", bin: "비정부 기구" }
          - { text: "그린피스", bin: "비정부 기구" }
          - { text: "세이브 더 칠드런", bin: "비정부 기구" }
      - type: choice
        lv: C
        std: 6사12-02
        cat: 지식·이해
        q: 유니세프(국제 연합 아동 기금)는 어떤 일을 할까요?
        options: [세계 어린이들의 건강과 교육, 권리를 지키는 일, 나라 사이의 무역을 막는 일, 우주를 탐사하는 일]
        answer: 세계 어린이들의 건강과 교육, 권리를 지키는 일

      - type: sort
        lv: B
        std: 6사12-02
        cat: 지식·이해
        q: 지속가능한 미래를 위한 노력을 누가 하는지 나누어 보세요.
        bins: [국제기구, 국가, 기업, 개인]
        items:
          - { text: "전쟁 지역 어린이에게 구호품을 보낸다", bin: "국제기구" }
          - { text: "여러 나라가 온실가스를 줄이기로 약속한다", bin: "국가" }
          - { text: "어려운 나라에 학교와 병원을 지어 준다", bin: "국가" }
          - { text: "재활용 소재로 상품을 만든다", bin: "기업" }
          - { text: "텀블러를 쓰고 대중교통을 이용한다", bin: "개인" }
          - { text: "지구촌 문제를 돕는 단체에 기부한다", bin: "개인" }
      - type: choice
        lv: B
        std: 6사12-02
        cat: 지식·이해
        q: 지속가능발전목표(SDGs)는 무엇일까요?
        options:
          - 2015년 국제 연합에서 정한, 2030년까지 함께 이루기로 한 17가지 목표
          - 한 나라가 혼자 정한 경제 성장 목표
          - 학교에서 정한 시험 목표
        answer: 2015년 국제 연합에서 정한, 2030년까지 함께 이루기로 한 17가지 목표
        explain: 빈곤 없애기, 모두를 위한 교육, 기후 변화 대응 등 사람과 지구를 함께 지키는 목표예요.

      - type: choice
        lv: A
        std: 6사12-02
        cat: 지식·이해
        q: "'지속가능한 발전'의 뜻을 가장 알맞게 탐구한 것은?"
        options:
          - 미래 세대가 쓸 자원과 환경을 해치지 않으면서 지금 세대에게 필요한 것을 채우는 발전
          - 자원을 지금 최대한 많이 써서 빠르게 성장하는 것
          - 발전을 모두 멈추고 옛날처럼 사는 것
        answer: 미래 세대가 쓸 자원과 환경을 해치지 않으면서 지금 세대에게 필요한 것을 채우는 발전
      - type: multi
        lv: A
        std: 6사12-02
        cat: 지식·이해
        q: 지구촌 문제를 해결하려면 왜 여러 주체가 함께해야 할까요? 알맞게 분석한 것을 모두 고르세요.
        options:
          - 국경을 넘는 문제라 한 나라의 힘만으로는 해결하기 어렵다
          - 국가와 국제기구는 규칙과 지원을, 기업은 상품과 기술을, 개인은 생활 속 실천을 맡을 수 있다
          - 개인의 작은 실천이 모이면 기업과 국가의 변화도 이끌 수 있다
          - 국제기구만 노력하면 개인은 아무것도 하지 않아도 된다
        answers:
          - 국경을 넘는 문제라 한 나라의 힘만으로는 해결하기 어렵다
