template: quizshow
unit: soc-6-2-3
title: 지구촌 탐험대 퀴즈쇼 — 세계 인구
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 세계 인구 분포, 인구에 영향을 주는 것, 나라별 인구, 인구 문제를 정리해요.
lessons: ['7']
standards: [6사12-01]
minutes: 20
teacherGuide:
  - 7차시 '재미있게 확인해요'에서 전자칠판에 띄워 진행해요. 모둠 수(2~6)를 고르고 시작해요.
  - 100점은 살펴보기, 200점은 조사하기, 300점은 분석하기 문제예요. 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
  - name: 세계 인구 분포
    emoji: 🌏
    items:
      - lv: C
        q: 세계 인구가 가장 많이 사는 대륙은?
        answer: 아시아 (세계 인구의 약 60%)
      - lv: B
        q: 2022년에 세계 인구는 몇 명을 넘었을까요?
        answer: 80억 명
      - lv: A
        q: 사람이 많이 모여 사는 곳들의 공통점을 두 가지 이상 말해 보세요.
        answer: 넓은 평야나 큰 강 주변, 기후가 알맞은 곳, 바다와 가까워 교통이 편리한 곳, 일자리가 많은 도시 등
  - name: 인구에 영향을 주는 것
    emoji: 🔍
    items:
      - lv: C
        photo: global/greenland
        q: 그린란드에 사람이 적게 사는 까닭은?
        answer: 너무 추워서 농사를 짓기 어렵기 때문이에요.
      - lv: B
        q: 일자리·교통·학교·병원처럼 사람이 만든 환경을 무엇이라고 할까요?
        answer: 인문환경
      - lv: A
        q: 오스트레일리아는 땅이 넓지만 인구 밀도가 매우 낮아요. 그 까닭을 설명해 보세요.
        answer: 땅의 많은 부분이 건조한 사막이라 사람이 살기 어려워, 사람들이 주로 바닷가 도시에 모여 살기 때문이에요.
  - name: 나라별 인구
    emoji: 🧮
    items:
      - lv: C
        q: 지금 세계에서 인구가 가장 많은 나라는?
        answer: 인도
      - lv: B
        q: 일정한 넓이(1㎢)의 땅에 사는 사람의 수를 무엇이라고 할까요?
        answer: 인구 밀도
      - lv: A
        q: 니제르처럼 어린이 비율이 아주 높은 나라에 앞으로 필요한 것은 무엇일지 설명해 보세요.
        answer: 늘어나는 어린이를 위한 학교와 의료 시설, 자라서 일할 일자리를 많이 만들어야 해요.
  - name: 인구 문제
    emoji: 🧩
    items:
      - lv: C
        q: 아이를 적게 낳는 것을 무엇이라고 할까요?
        answer: 저출산
      - lv: B
        q: 65세 이상 인구가 20%를 넘어 우리나라가 2024년에 들어선 사회는?
        answer: 초고령 사회
      - lv: A
        q: 저출산·고령화 문제를 해결하기 위한 방안을 두 가지 이상 제안해 보세요.
        answer: 예) 돌봄 시설 늘리기, 육아 휴직 쉽게 쓰기, 주거 지원, 노인 일자리와 돌봄 서비스 늘리기
