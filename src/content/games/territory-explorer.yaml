# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: shop
unit: soc-6-1-3
title: 세계 영토 탐험
emoji: 🏳️
summary: 우리나라의 위치와 영토를 알아보고, 세계 여러 나라의 영토 크기와 모양을 비교하며 영토의 특징이 생활에 주는 영향을 탐구해요.
story: 세계 여러 나라의 대사관에서 초대장이 왔어요! 우리나라를 먼저 소개하고, 크고 작은 나라, 길쭉하고 둥근 나라들을 찾아가 그 나라 사람들의 생활을 알아보세요.
lessons:
- '6'
- '7'
- '8'
standards:
- 6사09-02
minutes: 15
teacherGuide:
- 6차시 「우리나라의 위치와 영토」, 7차시 「영토의 크기와 모양」, 8차시 「영토의 특징과 생활」 스테이지예요.
- 나라 소개 카드는 「나의 탐험 리포트」에 모여요. 학생이 관심 있는 나라로 카드를 더 만들어 보게 해도 좋아요.
stages:
- id: korea
  title: 우리나라의 위치와 영토
  emoji: 🇰🇷
  lesson: '6'
  intro: 우리나라의 위치와 영토를 알아봐요.
  steps:
  - type: pin
    lv: C
    std: 6사09-02
    cat: 과정·기능
    q: 세계지도에서 우리나라를 찾아보세요.
    pins:
    - korea
    - india
    - russia
    - indonesia
    answer: korea
  - type: choice
    lv: C
    std: 6사09-02
    cat: 지식·이해
    q: 우리나라의 위치를 바르게 설명한 것은?
    options:
    - 아시아 대륙의 동쪽에 있고 태평양과 맞닿아 있다
    - 유럽 대륙의 서쪽에 있다
    - 적도 바로 위에 있다
    answer: 아시아 대륙의 동쪽에 있고 태평양과 맞닿아 있다
  - type: choice
    lv: B
    std: 6사09-02
    cat: 지식·이해
    q: 우리나라는 대략 어느 범위의 위도와 경도에 있을까요?
    options:
    - 북위 33°~43°, 동경 124°~132°
    - 남위 33°~43°, 서경 124°~132°
    - 북위 0°~10°, 동경 0°~10°
    answer: 북위 33°~43°, 동경 124°~132°
    explain: 우리나라의 영토는 한반도와 그 부속 도서로 이루어져 있어요.
  - type: multi
    lv: B
    std: 6사09-02
    cat: 지식·이해
    q: 한 나라의 주권이 미치는 범위인 영역에 들어가는 것을 모두 골라 보세요.
    options:
    - 영토
    - 영해
    - 영공
    - 공해
    answers:
    - 영토
    - 영해
    - 영공
    explain: 영토는 땅, 영해는 바다, 영공은 영토와 영해 위의 하늘이에요.
  - type: choice
    lv: B
    std: 6사09-02
    cat: 지식·이해
    q: 우리나라 영토의 가장 동쪽 끝에 있는 섬은?
    options:
    - 독도
    - 마라도
    - 강화도
    answer: 독도
  - type: choice
    lv: A
    std: 6사09-02
    cat: 과정·기능
    q: 삼면이 바다로 둘러싸인 반도국인 우리나라 위치의 좋은 점을 가장 알맞게 분석한 것은?
    options:
    - 대륙과 바다 양쪽으로 나아가기 좋아 여러 나라와 교류하기 유리하다
    - 다른 나라와 교류하기 어렵다
    - 바다가 없어서 무역을 할 수 없다
    answer: 대륙과 바다 양쪽으로 나아가기 좋아 여러 나라와 교류하기 유리하다
