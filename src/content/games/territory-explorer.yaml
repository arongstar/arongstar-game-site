        value: 10
      note: 면적은 반올림한 값이에요. 대한민국은 남한의 면적이에요.
  - type: choice
    lv: B
    std: 6사09-02
    cat: 과정·기능
    q: 러시아의 영토 면적은 대한민국(남한)의 약 몇 배일까요?
    options:
    - 약 170배
    - 약 17배
    - 약 1,700배
    answer: 약 170배
    bars: *id001
    hint: 1710 ÷ 10 을 계산해 보세요.
  - type: sort
    lv: B
    std: 6사09-02
    cat: 지식·이해
    q: 영토의 모양에 따라 나라를 나누어 보세요.
    bins:
    - 남북으로 긴 나라
    - 섬나라
    - 반도국
    - 바다와 맞닿지 않은 나라
    items:
    - text: 칠레
      bin: 남북으로 긴 나라
    - text: 일본
      bin: 섬나라
    - text: 필리핀
      bin: 섬나라
    - text: 이탈리아
      bin: 반도국
    - text: 몽골
      bin: 바다와 맞닿지 않은 나라
    - text: 스위스
      bin: 바다와 맞닿지 않은 나라
  - type: choice
    lv: A
    std: 6사09-02
    cat: 과정·기능
    q: 남북으로 아주 길쭉한 칠레의 영토 모양이 생활에 주는 영향을 가장 알맞게 분석한 것은?
    options:
    - 북쪽에는 메마른 사막, 남쪽에는 빙하가 있을 만큼 지역마다 기후와 생활 모습이 다양하다
    - 나라 전체의 기후가 똑같다
    - 바다와 맞닿지 않아 어업을 할 수 없다
    answer: 북쪽에는 메마른 사막, 남쪽에는 빙하가 있을 만큼 지역마다 기후와 생활 모습이 다양하다
- id: life
  title: 영토의 특징과 생활
  emoji: 🏘️
  lesson: '8'
  intro: 영토의 특징이 사람들의 생활에 주는 영향을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사09-02
    cat: 지식·이해
    q: 일본, 필리핀 같은 섬나라 사람들의 생활 모습으로 알맞은 것은?
    options:
    - 바다를 이용한 어업과 배를 이용한 교통이 발달했다
    - 바다를 볼 수 없다
    - 사막에서 유목 생활을 한다
    answer: 바다를 이용한 어업과 배를 이용한 교통이 발달했다
  - type: choice
    lv: B
    std: 6사09-02
    cat: 과정·기능
    q: 바다와 맞닿지 않은 몽골이나 스위스가 다른 나라와 무역할 때 쓰는 방법으로 알맞은 것은?
    options:
    - 이웃 나라의 항구를 이용하거나 철도, 도로, 항공으로 물건을 나른다
    - 자기 나라의 항구를 이용한다
    - 무역을 전혀 하지 않는다
    answer: 이웃 나라의 항구를 이용하거나 철도, 도로, 항공으로 물건을 나른다
  - type: choice
    lv: B
    std: 6사09-02
    cat: 과정·기능
    q: 영토가 동서로 아주 넓은 러시아에서 나타나는 생활 모습은?
    options:
    - 지역마다 시각이 달라 여러 개의 표준시를 쓴다
    - 나라 전체가 같은 시각을 쓴다
    - 하루 종일 낮이다
    answer: 지역마다 시각이 달라 여러 개의 표준시를 쓴다
    explain: 러시아는 11개의 표준시를 써요.
  - type: shop
    lv: A
    std: 6사09-02
    cat: 과정·기능
    q: 세계 여행 안내자의 부탁을 듣고, 칠레를 소개하는 카드에 들어갈 알맞은 내용을 모두 골라 보세요.
    customer:
      emoji: 🧳
      name: 세계 여행 안내자
      place: 여행사
      says: 칠레를 처음 가는 여행객에게 위치와 영토의 특징, 생활 모습을 한눈에 알려 주는 카드가 필요해요.
    features:
    - text: 남아메리카 대륙의 서쪽, 남위와 서경에 있다
      fit: true
      why: 위치를 위도와 경도, 대륙으로 함께 나타내요.
    - text: 남북으로 아주 길쭉한 모양이다
      fit: true
      why: 영토 모양의 특징이에요.
    - text: 북쪽은 사막, 남쪽은 빙하가 있어 지역마다 옷차림과 생활이 다르다
      fit: true
      why: 영토의 특징이 생활에 주는 영향이에요.
    - text: 사방이 바다로 둘러싸인 섬나라이다
      fit: false
      why: 칠레는 남아메리카 대륙에 있는 나라예요.
