    std: 6사09-02
    cat: 과정·기능
    q: 그래프에서 영토가 가장 넓은 나라는?
    options:
    - 러시아
    - 캐나다
    - 중국
    answer: 러시아
    bars: &id001
      title: 세계 여러 나라의 영토 면적
      unit: 만 km²
      items:
      - label: 러시아
        value: 1710
      - label: 캐나다
