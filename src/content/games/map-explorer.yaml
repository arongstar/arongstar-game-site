# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: soc-6-1-3
title: 지구본과 세계지도 탐험
emoji: 🌐
summary: 지구본, 세계지도, 디지털 영상 지도의 특징을 비교하고, 위도와 경도로 세계 여러 곳의 위치를 나타내요.
story: 세계 일주 준비물은 지구본, 세계지도, 태블릿! 각각 어떤 점이 좋은지 비교하고, 위도와 경도라는 지구의 주소로 목적지를 찾아보세요.
lessons:
- '2'
- '3'
standards:
- 6사09-01
minutes: 15
teacherGuide:
- 2차시 「세계를 표현하는 자료」, 3차시 「위도와 경도」 스테이지예요.
- 지구본 실험실은 손가락이나 마우스로 끌어 돌릴 수 있어요. 실제 지구본과 함께 쓰면 좋아요.
- 위도·경도 문제는 지도에 30° 간격의 위선과 경선이 그려져 있어요.
stages:
- id: tools
  title: 세계를 표현하는 자료
  emoji: 🗺️
  lesson: '2'
  intro: 지구본, 세계지도, 디지털 영상 지도를 비교해요.
  steps:
  - type: choice
    lv: C
    std: 6사09-01
    cat: 지식·이해
    q: 실험실에서 지구본을 끌어서 돌려 보세요. 지구본의 좋은 점으로 알맞은 것은?
    options:
    - 실제 지구처럼 둥글어 나라의 모양과 면적, 거리를 비교적 정확하게 나타낸다
    - 전 세계를 한눈에 볼 수 있다
    - 접어서 가지고 다니기 편리하다
    answer: 실제 지구처럼 둥글어 나라의 모양과 면적, 거리를 비교적 정확하게 나타낸다
    globe: true
  - type: choice
    lv: C
    std: 6사09-01
    cat: 지식·이해
    q: 그림처럼 교실 벽에 붙인 세계지도의 좋은 점은?
    options:
    - 전 세계를 한눈에 볼 수 있고 가지고 다니기 편리하다
    - 모든 나라의 면적이 실제와 똑같이 나타난다
    - 지구를 돌려 가며 볼 수 있다
    answer: 전 세계를 한눈에 볼 수 있고 가지고 다니기 편리하다
    photo: illust/so-globe-map
  - type: choice
    lv: B
    std: 6사09-01
    cat: 과정·기능
    q: 실험실에서 「그린란드와 오스트레일리아 비교하기」를 눌러 보세요. 알맞게 설명한 것은?
    options:
    - 세계지도에서는 극지방에 가까운 곳이 실제보다 크게 나타난다
    - 세계지도와 지구본에서 두 땅의 크기가 똑같다
    - 지구본에서는 그린란드가 오스트레일리아보다 크다
    answer: 세계지도에서는 극지방에 가까운 곳이 실제보다 크게 나타난다
    globe: true
    explain: 둥근 지구를 평평한 종이에 펼치면 극지방으로 갈수록 실제보다 넓게 늘어나요.
  - type: multi
    lv: B
    std: 6사09-01
    cat: 지식·이해
    q: 그림처럼 디지털 영상 지도를 쓸 때의 좋은 점을 모두 골라 보세요.
    options:
    - 확대하거나 축소하여 원하는 곳을 자세히 볼 수 있다
    - 장소를 검색하고 길을 찾을 수 있다
    - 위성 사진으로 실제 모습을 볼 수 있다
    - 전기나 인터넷이 없어도 언제나 쓸 수 있다
    answers:
    - 확대하거나 축소하여 원하는 곳을 자세히 볼 수 있다
    - 장소를 검색하고 길을 찾을 수 있다
    - 위성 사진으로 실제 모습을 볼 수 있다
    photo: illust/so-satellite
  - type: sort
    lv: A
    std: 6사09-01
    cat: 과정·기능
    q: 목적에 가장 알맞은 공간 자료를 골라 나누어 보세요.
    bins:
    - 지구본
    - 세계지도
    - 디지털 영상 지도
    items:
    - text: 여러 나라의 실제 면적을 정확하게 비교하고 싶다
      bin: 지구본
    - text: 교실 벽에 붙여 두고 전 세계를 한눈에 보고 싶다
      bin: 세계지도
    - text: 여행 가방에 넣어 가며 나라들의 위치를 보고 싶다
      bin: 세계지도
    - text: 학교에서 박물관까지 가는 길을 찾고 싶다
      bin: 디지털 영상 지도
    - text: 외국 도시의 거리를 위성 사진으로 살펴보고 싶다
      bin: 디지털 영상 지도
- id: latlon
  title: 위도와 경도
  emoji: 🧭
  lesson: '3'
  intro: 위도와 경도로 위치를 나타내요.
  steps:
  - type: pin
    lv: C
    std: 6사09-01
    cat: 과정·기능
    q: 지도에 위선과 경선을 그려 두었어요. 적도(위도 0°)가 지나는 나라는?
    pins:
    - kenya
    - egypt
    - uk
    - japan
    answer: kenya
    grid: true
  - type: choice
    lv: C
    std: 6사09-01
    cat: 지식·이해
    q: 영국의 그리니치 천문대를 지나는 경도 0°의 기준선을 무엇이라고 할까요?
    options:
    - 본초 자오선
    - 적도
    - 날짜 변경선
    answer: 본초 자오선
  - type: choice
    lv: B
    std: 6사09-01
    cat: 지식·이해
    q: 위도에 대한 설명으로 알맞은 것은?
    options:
    - 적도를 0°로 하여 북쪽은 북위, 남쪽은 남위로 각각 90°까지 나타낸다
    - 본초 자오선을 0°로 하여 동쪽과 서쪽으로 180°까지 나타낸다
    - 나라의 크기를 나타낸다
    answer: 적도를 0°로 하여 북쪽은 북위, 남쪽은 남위로 각각 90°까지 나타낸다
    explain: 경도는 본초 자오선을 0°로 하여 동쪽은 동경, 서쪽은 서경으로 각각 180°까지 나타내요.
  - type: pin
    lv: B
    std: 6사09-01
    cat: 과정·기능
    q: 북위 약 37°, 동경 약 127°에 있는 나라를 찾아보세요.
    pins:
    - korea
    - brazil
    - egypt
    - canada
    answer: korea
    grid: true
  - type: pin
    lv: A
    std: 6사09-01
    cat: 과정·기능
    q: 북위 약 23°, 서경 약 102°에 있는 나라를 찾아보세요.
    pins:
    - mexico
    - india
    - egypt
    - brazil
    answer: mexico
    grid: true
    hint: 위도가 같아도 동경인지 서경인지에 따라 전혀 다른 곳이에요.
  - type: pin
    lv: A
    std: 6사09-01
    cat: 과정·기능
    q: 남위와 서경으로 위치를 나타내는 나라를 찾아보세요.
    pins:
    - argentina
    - australia
    - egypt
    - japan
    answer: argentina
    grid: true
    explain: 적도 남쪽은 남위, 본초 자오선 서쪽은 서경이에요.
