template: mission
style: detective
unit: soc-6-2-2
title: 경제성장 타임머신
emoji: 📈
summary: 타임머신을 타고 1960년대부터 오늘날까지 우리나라 경제가 성장한 길을 따라가고, 달라진 생활과 빠른 성장이 남긴 문제의 해결 방법을 찾아요.
story: 경제 탐험대의 타임머신이 1960년대에 도착했어요! 시대마다 발달한 산업을 살펴보고, 우리 생활이 어떻게 달라졌는지, 빠른 성장으로 어떤 문제가 생겼는지 조사해 오늘날로 돌아오세요.
lessons: ['7', '8', '9']
standards: [6사11-02]
minutes: 12
teacherGuide:
  - 7차시 '성장 과정', 8차시 '달라진 생활', 9차시 '빠른 성장의 문제와 해결' 스테이지로 나뉘어 있어요.
  - 수출액 그래프와 생활 비교 표는 정부 통계를 어림한 값이에요. 정확한 수치가 필요하면 교과서 자료로 바꿔 주세요.
  - 9차시 🏅 분석하기에서는 '일자리'와 '환경'이 부딪치는 상황에서 모두를 위한 해결 방안을 골라요. 모둠 토의로 이어 가기 좋아요.
stages:
  # ════════════ 성장 과정 ════════════
  - id: history
    title: 산업이 자라 온 길
    emoji: 🏗️
    lesson: '7'
    intro: 1960년대부터 오늘날까지 발달한 산업을 차례로 만나요.
    steps:
      - type: choice
        lv: C
        std: 6사11-02
        cat: 지식·이해
        photo: economy/textile1960s
        q: 1960년대 우리나라에서 많이 발달한 산업은 무엇일까요?
        options: [옷·신발·가발 같은 가벼운 물건을 만드는 경공업, 배와 철강을 만드는 중화학 공업, 반도체를 만드는 첨단 산업]
        answer: 옷·신발·가발 같은 가벼운 물건을 만드는 경공업
      - type: choice
        lv: C
        std: 6사11-02
        cat: 지식·이해
        photo: economy/shipyard
        q: 1970년대에 크게 발달한, 배·철강·석유 화학 제품처럼 무겁고 큰 물건을 만드는 산업은?
        options: [중화학 공업, 경공업, 농업]
        answer: 중화학 공업
      - type: choice
        lv: C
        std: 6사11-02
        cat: 지식·이해
        photo: economy/chip
        q: 오늘날 우리나라가 가장 많이 수출하는 상품 가운데 하나인 이것은 무엇일까요?
        options: [반도체, 가발, 쌀]
        answer: 반도체
      - type: choice
        lv: C
        std: 6사11-02
        cat: 과정·기능
        bars: &exports
          title: 우리나라의 수출액 (어림값)
          unit: 억 달러
          items:
            - { label: "1964년", value: 1 }
            - { label: "1977년", value: 100 }
            - { label: "1995년", value: 1250 }
            - { label: "2011년", value: 5550 }
            - { label: "2023년", value: 6320 }
          note: 산업통상자원부·한국무역협회 자료를 어림한 값이에요.
        q: 그래프를 살펴보면 우리나라의 수출액은 어떻게 변해 왔나요?
        options: [시간이 지나면서 크게 늘었다, 시간이 지나면서 줄었다, 변하지 않았다]
        answer: 시간이 지나면서 크게 늘었다

      - type: order
        lv: B
        std: 6사11-02
        cat: 과정·기능
        q: 우리나라에서 발달한 산업을 시대 순서대로 놓아 보세요.
        hint: 처음에는 기술과 돈이 적게 드는 산업부터 시작했어요.
        items:
          - 섬유·신발·가발 같은 경공업
          - 철강·조선·석유 화학 같은 중화학 공업
          - 자동차·가전제품 같은 기계·전자 산업
          - 반도체·컴퓨터·정보 통신 산업
          - 문화 콘텐츠·바이오 같은 첨단 산업과 서비스 산업
      - type: choice
        lv: B
        std: 6사11-02
        cat: 지식·이해
        q: 1960년대에 경공업이 먼저 발달한 까닭은?
        options:
          - 기술과 돈(자본)은 부족했지만 일할 사람이 많았기 때문에
          - 기술과 돈이 아주 많았기 때문에
          - 다른 나라가 경공업을 하지 못하게 했기 때문에
        answer: 기술과 돈(자본)은 부족했지만 일할 사람이 많았기 때문에
      - type: choice
        lv: B
        std: 6사11-02
        cat: 지식·이해
        photo: economy/expressway
        q: 1970년에 서울과 부산을 잇는 경부 고속 국도가 개통되면서 달라진 점은?
        options:
          - 사람과 물건이 빠르게 오가게 되어 산업 발달에 도움이 되었다
          - 서울과 부산 사이가 더 멀어졌다
          - 공장들이 모두 문을 닫았다
        answer: 사람과 물건이 빠르게 오가게 되어 산업 발달에 도움이 되었다
      - type: choice
        lv: B
        std: 6사11-02
        cat: 과정·기능
        bars: *exports
        q: 수출액이 처음으로 100억 달러를 넘은 해는 그래프에서 언제일까요?
        options: [1977년, 1964년, 1995년]
        answer: 1977년
        explain: 1964년에 1억 달러였던 수출액이 13년 만에 약 100배가 되었어요.

      - type: multi
        lv: A
        std: 6사11-02
        cat: 과정·기능
        bars: *exports
        q: 수출액 그래프를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 1964년부터 1977년까지 수출액이 약 100배로 늘었다
          - 1995년 이후에도 수출액은 계속 늘었다
          - 2011년 수출액은 1995년의 4배가 넘는다
          - 수출액은 시간이 지날수록 줄었다
        answers:
          - 1964년부터 1977년까지 수출액이 약 100배로 늘었다
          - 1995년 이후에도 수출액은 계속 늘었다
          - 2011년 수출액은 1995년의 4배가 넘는다
      - type: choice
        lv: A
        std: 6사11-02
        cat: 지식·이해
        q: 우리나라의 산업이 경공업 → 중화학 공업 → 첨단 산업으로 바뀌어 온 까닭을 가장 알맞게 분석한 것은?
        options:
          - 기술과 자본이 쌓이면서 더 높은 가치를 만드는 산업으로 옮겨 갔기 때문에
          - 다른 나라가 시키는 대로 했기 때문에
          - 경공업 제품을 아무도 사지 않았기 때문에
        answer: 기술과 자본이 쌓이면서 더 높은 가치를 만드는 산업으로 옮겨 갔기 때문에
      - type: multi
        lv: A
        std: 6사11-02
        cat: 지식·이해
        q: 우리나라가 빠르게 경제성장을 할 수 있었던 까닭을 모두 고르세요.
        options:
          - 국민들이 열심히 일하고 교육에 힘썼다
          - 기업이 새로운 기술을 개발했다
          - 정부가 경제 개발 계획을 세우고 고속 국도 같은 시설을 만들었다
          - 다른 나라와 무역을 끊고 혼자 살았다
        answers:
          - 국민들이 열심히 일하고 교육에 힘썼다
          - 기업이 새로운 기술을 개발했다
          - 정부가 경제 개발 계획을 세우고 고속 국도 같은 시설을 만들었다

  # ════════════ 달라진 생활 ════════════
  - id: life
    title: 그때와 지금, 달라진 생활
    emoji: 🏙️
    lesson: '8'
    intro: 경제성장으로 우리 생활이 어떻게 달라졌는지 비교해요.
    steps:
      - type: sort
        lv: C
        std: 6사11-02
        cat: 지식·이해
        q: 1960년대 생활과 오늘날 생활로 나누어 보세요.
        bins: [1960년대, 오늘날]
        items:
          - { text: "연탄으로 방을 데웠어요", bin: "1960년대" }
          - { text: "많은 사람이 농사를 지었어요", bin: "1960년대" }
          - { text: "텔레비전이 있는 집이 드물었어요", bin: "1960년대" }
          - { text: "스마트폰으로 물건을 사요", bin: "오늘날" }
          - { text: "고속 열차로 빠르게 이동해요", bin: "오늘날" }
          - { text: "여러 나라의 음식을 쉽게 먹어요", bin: "오늘날" }
      - type: choice
        lv: C
        std: 6사11-02
        cat: 지식·이해
        q: 경제성장으로 우리 생활은 어떻게 달라졌을까요?
        options:
          - 소득이 늘어 다양한 물건과 서비스를 누리게 되었다
          - 먹을 것이 더 부족해졌다
          - 생활이 하나도 달라지지 않았다
        answer: 소득이 늘어 다양한 물건과 서비스를 누리게 되었다

      - type: multi
        lv: B
        std: 6사11-02
        cat: 과정·기능
        table: &lifetable
          title: 그때와 지금 (어림값)
          head: [항목, 1970년, 오늘날]
          rows:
            - ["자동차 등록 대수", "약 13만 대", "약 2,600만 대 (2024년)"]
            - ["기대 수명", "약 62세", "약 83세 (2023년)"]
            - ["서울~부산 가는 시간 (가장 빠른 열차)", "약 4~5시간", "약 2시간 30분 (KTX)"]
          note: 통계청·국토교통부 자료를 어림한 값이에요.
        q: 표를 조사해서 알 수 있는 것을 모두 고르세요.
        options:
          - 자동차가 아주 많아져 이동이 편리해졌다
          - 사람들이 더 오래 살게 되었다
          - 서울과 부산 사이를 오가는 시간이 줄었다
          - 오늘날 자동차가 1970년보다 줄었다
        answers:
          - 자동차가 아주 많아져 이동이 편리해졌다
          - 사람들이 더 오래 살게 되었다
          - 서울과 부산 사이를 오가는 시간이 줄었다
      - type: choice
        lv: B
        std: 6사11-02
        cat: 지식·이해
        q: 사람들이 더 오래 살게 된 것과 경제성장은 어떤 관계가 있을까요?
        options:
          - 소득이 늘고 의료·위생 시설이 좋아져 건강하게 생활할 수 있게 되었다
          - 경제성장과 기대 수명은 아무 관계가 없다
          - 자동차가 많아져서 오래 살게 되었다
        answer: 소득이 늘고 의료·위생 시설이 좋아져 건강하게 생활할 수 있게 되었다

      - type: choice
        lv: A
        std: 6사11-02
        cat: 과정·기능
        table: *lifetable
        q: 표를 분석해 '자동차가 많아진 것'이 생활에 준 영향을 생각했어요. 좋은 점과 함께 생긴 문제까지 가장 알맞게 탐구한 것은?
        options:
          - 이동은 편리해졌지만 교통 체증과 공기 오염 같은 문제도 생겼다
          - 자동차가 많아져서 좋은 점만 생겼다
          - 자동차가 많아져서 나쁜 점만 생겼다
        answer: 이동은 편리해졌지만 교통 체증과 공기 오염 같은 문제도 생겼다
      - type: choice
        lv: A
        std: 6사11-02
        cat: 지식·이해
        q: 경제성장이 가져온 변화는 모든 사람에게 똑같았을까요?
        options:
          - 전체 소득은 크게 늘었지만, 사람과 지역에 따라 나아진 정도에 차이가 생기기도 했다
          - 모든 사람의 소득이 똑같이 늘었다
          - 아무도 나아지지 않았다
        answer: 전체 소득은 크게 늘었지만, 사람과 지역에 따라 나아진 정도에 차이가 생기기도 했다
        explain: 이 차이는 다음 스테이지 '빠른 성장이 남긴 숙제'에서 더 탐구해요.

  # ════════════ 문제와 해결 ════════════
  - id: problems
    title: 빠른 성장이 남긴 숙제
    emoji: 🧩
    lesson: '9'
    intro: 빠른 경제성장으로 생긴 문제와 해결 방법을 찾아요.
    steps:
      - type: multi
        lv: C
        std: 6사11-02
        cat: 지식·이해
        q: 빠른 경제성장으로 생긴 문제를 모두 고르세요.
        options:
          - 공장 매연과 폐수로 인한 환경 오염
          - 사람들 사이의 소득 차이(빈부 격차)
          - 오랜 시간 일하는 등 근로자가 일하기 힘든 환경
          - 모든 사람이 똑같이 부자가 됨
        answers:
          - 공장 매연과 폐수로 인한 환경 오염
          - 사람들 사이의 소득 차이(빈부 격차)
          - 오랜 시간 일하는 등 근로자가 일하기 힘든 환경
      - type: choice
        lv: C
        std: 6사11-02
        cat: 지식·이해
        card: { emoji: "🏭", title: "공장 옆 강", text: "공장이 많이 생긴 뒤로 마을 강물이 탁해지고 물고기가 줄었어요." }
        q: 이 마을에 생긴 문제는 무엇일까요?
        options: [환경 오염, 소득 격차, 일자리 부족]
        answer: 환경 오염

      - type: sort
        lv: B
        std: 6사11-02
        cat: 지식·이해
        q: 문제와 알맞은 해결 방안을 짝지어 보세요.
        bins: [환경 오염, 소득 격차, 노사 갈등, 수도권 집중]
        items:
          - { text: "오염 물질 배출 기준을 정하고 친환경 에너지를 쓴다", bin: "환경 오염" }
          - { text: "분리배출과 재활용을 생활화한다", bin: "환경 오염" }
          - { text: "어려운 이웃을 돕는 사회 보장 제도를 늘린다", bin: "소득 격차" }
          - { text: "최저임금 제도로 임금의 가장 낮은 기준을 정한다", bin: "소득 격차" }
          - { text: "근로자와 기업이 대화로 함께 해결 방법을 찾는다", bin: "노사 갈등" }
          - { text: "지방에도 공공 기관과 일자리를 늘린다", bin: "수도권 집중" }
      - type: choice
        lv: B
        std: 6사11-02
        cat: 지식·이해
        q: 사회 보장 제도는 무엇일까요?
        options:
          - 질병, 실업, 가난 등으로 어려움을 겪는 사람들이 기본적인 생활을 할 수 있도록 나라가 돕는 제도
          - 기업이 이윤을 더 많이 얻도록 돕는 제도
          - 수출을 늘리기 위한 제도
        answer: 질병, 실업, 가난 등으로 어려움을 겪는 사람들이 기본적인 생활을 할 수 있도록 나라가 돕는 제도

      - type: choice
        lv: A
        std: 6사11-02
        cat: 지식·이해
        card: { emoji: "⚖️", title: "마을 회의", text: "공장은 마을 사람 300명의 일터예요. 그런데 공장 때문에 강물이 오염되고 있어요." }
        q: 일자리와 환경을 함께 지키는 해결 방안으로 가장 알맞은 것은?
