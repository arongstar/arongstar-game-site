- id: talk
  title: Fun Talk 2 — 무슨 동아리야?
  emoji: 🗨️
  lesson: '2'
  intro: 동아리를 묻고 답하는 대화를 들어요.
  steps:
  - type: choice
    lv: C
    std: 6영01-04
    cat: 과정·기능
    q: 대화를 듣고 Amara가 무슨 동아리인지 골라 보세요.
    options:
    - 💃 dance club
    - ⚽ soccer club
    - 🎵 music club
    answer: 💃 dance club
    say:
    - who: Ken
      text: Hi, Amara. What club are you in?
    - who: Amara
      text: I'm in the dance club. How about you?
    - who: Ken
      text: I'm in the soccer club.
    script: show
  - type: choice
    lv: B
    std: 6영02-07
    cat: 지식·이해
    q: 친구가 「What club are you in?」 하고 물어요. 책 동아리인 내가 할 알맞은 대답은?
    options:
    - I'm in the book club.
    - I like book club.
    - I'm in the book.
    answer: I'm in the book club.
  - type: sentence
    lv: B
    std: 6영02-03
    cat: 과정·기능
    q: 친구에게 무슨 동아리인지 묻는 문장을 만들어 보세요.
    answer: What club are you in?
    extra:
    - grade
    - what
  - type: choice
    lv: A
    std: 6영01-04
    cat: 과정·기능
    q: 대화를 듣고 두 사람에 대해 알맞게 말한 것을 골라 보세요.
    options:
    - Leo는 역사 동아리이고 옛날이야기를 좋아한다. Sora는 과학 동아리이다.
    - Leo는 과학 동아리이고 Sora는 역사 동아리이다.
    - 두 사람 모두 역사 동아리이다.
    answer: Leo는 역사 동아리이고 옛날이야기를 좋아한다. Sora는 과학 동아리이다.
    say:
    - who: Sora
      text: Leo, what club are you in?
    - who: Leo
      text: I'm in the history club. I love old stories.
    - who: Sora
      text: Cool! I'm in the science club.
- id: speak
  title: Speak Up — 동아리 묻고 답하기
  emoji: 🗣️
