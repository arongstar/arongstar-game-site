summary: 동아리 이름을 듣고 익히고, 동아리 박람회 대화를 듣고 읽으며 동아리를 묻고 답하는 말을 연습해요.
story: 오늘은 동아리 박람회 날! 여러 동아리 부스를 돌며 친구들에게 무슨 동아리인지 묻고, 나에게 맞는 동아리도 찾아보세요.
