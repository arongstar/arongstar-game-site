template: mission
style: village
unit: sci-6-2-2
title: 성질 변화 실험실
emoji: 🧪
summary: 여러 물질을 섞고, 녹이고, 자르는 실험을 관찰해서 물질의 성질이 달라지는 변화와 달라지지 않는 변화를 비교해요.
story: 과학 탐험대 실험실에 이상한 일이 생겼어요! 섞었더니 거품이 나고, 녹였더니 사라진 것처럼 보이고… 물질의 성질이 정말 달라졌는지 가려내 주세요.
lessons: ['2']
standards: [6과14-01]
minutes: 12
teacherGuide:
  - 2차시 '물질의 성질이 달라지는 변화와 달라지지 않는 변화'에서 해요.
  - 교육과정에 따라 '물리 변화', '화학 변화'라는 용어는 쓰지 않고, 물질의 성질이 달라지는 까닭도 다루지 않아요.
  - 실제 실험(베이킹 소다와 식초, 석회수 등)을 한 뒤에 정리 활동으로 쓰면 좋아요.
stages:
  - id: change
    title: 성질이 달라졌을까?
    emoji: 🔬
    lesson: '2'
    intro: 변화 전과 후를 비교해 물질의 성질이 달라졌는지 판단해요.
    steps:
      - type: choice
        lv: C
        std: 6과14-01
        cat: 과정·기능
        card: { emoji: "🫧", title: "베이킹 소다와 식초", text: "베이킹 소다에 식초를 부었더니 거품이 부글부글 생겼어요." }
        q: 이 변화에서 물질의 성질은 어떻게 되었을까요?
        options: [성질이 다른 새로운 물질(기체)이 생겼다, 성질이 전혀 달라지지 않았다, 물질이 모두 사라졌다]
        answer: 성질이 다른 새로운 물질(기체)이 생겼다
      - type: choice
        lv: C
        std: 6과14-01
        cat: 과정·기능
        card: { emoji: "✂️", title: "종이 자르기", text: "색종이를 가위로 잘게 잘랐어요." }
        q: 잘게 자른 색종이의 성질은 어떻게 되었을까요?
        options: [모양과 크기만 바뀌고 종이의 성질은 그대로다, 종이가 아닌 다른 물질이 되었다]
        answer: 모양과 크기만 바뀌고 종이의 성질은 그대로다
      - type: sort
        lv: C
        std: 6과14-01
        cat: 지식·이해
        q: 변화를 두 가지로 나누어 보세요.
        bins: [성질이 달라지는 변화, 성질이 달라지지 않는 변화]
        items:
          - { text: "베이킹 소다에 식초를 붓자 거품이 생겼다", bin: "성질이 달라지는 변화" }
          - { text: "석회수에 이산화 탄소를 넣자 뿌옇게 흐려졌다", bin: "성질이 달라지는 변화" }
          - { text: "우유에 식초를 넣자 몽글몽글한 덩어리가 생겼다", bin: "성질이 달라지는 변화" }
          - { text: "종이를 가위로 잘랐다", bin: "성질이 달라지지 않는 변화" }
          - { text: "얼음이 녹아 물이 되었다", bin: "성질이 달라지지 않는 변화" }
          - { text: "고무찰흙의 모양을 바꾸었다", bin: "성질이 달라지지 않는 변화" }

      - type: choice
        lv: B
        std: 6과14-01
        cat: 과정·기능
        card: { emoji: "🧂", title: "설탕물", text: "설탕을 물에 넣고 저었더니 설탕이 보이지 않게 녹았어요. 이 설탕물을 오랫동안 증발시켰더니 하얀 알갱이가 남았어요." }
        q: 이 결과를 근거로 설탕이 물에 녹는 변화를 판단하면?
        options:
          - 물을 증발시키면 설탕이 다시 남으므로, 설탕의 성질은 달라지지 않았다
          - 설탕이 보이지 않으므로 다른 물질로 바뀌었다
          - 설탕이 완전히 사라졌다
        answer: 물을 증발시키면 설탕이 다시 남으므로, 설탕의 성질은 달라지지 않았다
      - type: multi
        lv: B
        std: 6과14-01
        cat: 과정·기능
        q: 물질의 성질이 달라졌는지 판단할 수 있는 근거를 모두 고르세요.
        options:
          - 처음에 없던 거품(기체)이 생긴다
          - 색깔이 새롭게 바뀐다
          - 처음과 다른 성질의 덩어리(앙금)가 생긴다
          - 크기나 모양만 바뀐다
        answers: [처음에 없던 거품(기체)이 생긴다, 색깔이 새롭게 바뀐다, 처음과 다른 성질의 덩어리(앙금)가 생긴다]
      - type: sort
        lv: B
        std: 6과14-01
        cat: 지식·이해
        q: 생활 속 변화를 나누어 보세요.
        bins: [성질이 달라지는 변화, 성질이 달라지지 않는 변화]
        items:
          - { text: "철로 된 못이 녹슬었다", bin: "성질이 달라지는 변화" }
          - { text: "나무가 타서 재가 되었다", bin: "성질이 달라지는 변화" }
          - { text: "사과를 깎아 두었더니 갈색으로 변했다", bin: "성질이 달라지는 변화" }
          - { text: "유리컵이 깨졌다", bin: "성질이 달라지지 않는 변화" }
          - { text: "소금이 물에 녹았다", bin: "성질이 달라지지 않는 변화" }
          - { text: "물이 얼어 얼음이 되었다", bin: "성질이 달라지지 않는 변화" }

      - type: choice
        lv: A
        std: 6과14-01
        cat: 과정·기능
        card: { emoji: "🍞", title: "빵 굽기", text: "밀가루 반죽을 오븐에 구웠더니 부풀어 오르고 겉이 갈색으로 바뀌며 고소한 냄새가 났어요. 다 구운 빵은 다시 반죽으로 되돌릴 수 없어요." }
        q: 빵을 굽는 변화를 근거를 들어 판단한 것으로 가장 알맞은 것은?
        options:
          - 색과 냄새가 새롭게 생기고 반죽으로 되돌릴 수 없으므로 성질이 달라지는 변화다
          - 모양만 바뀌었으므로 성질이 달라지지 않는 변화다
          - 크기가 커졌으므로 성질이 달라지지 않는 변화다
        answer: 색과 냄새가 새롭게 생기고 반죽으로 되돌릴 수 없으므로 성질이 달라지는 변화다
      - type: multi
        lv: A
        std: 6과14-01
        cat: 과정·기능
        q: 두 가지 변화를 비교해 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 성질이 달라지지 않는 변화는 모양·크기·상태만 바뀐다
          - 성질이 달라지는 변화에서는 처음과 다른 성질을 가진 물질이 생긴다
          - 겉모습이 크게 바뀌어도 성질은 그대로일 수 있다
          - 겉모습이 바뀌면 언제나 성질도 달라진다
        answers:
          - 성질이 달라지지 않는 변화는 모양·크기·상태만 바뀐다
          - 성질이 달라지는 변화에서는 처음과 다른 성질을 가진 물질이 생긴다
          - 겉모습이 크게 바뀌어도 성질은 그대로일 수 있다
