template: mission
style: shop
unit: sci-6-2-3
title: 전기 지킴이
emoji: 🔌
summary: 전기를 안전하게 쓰는 방법과 효율적으로 쓰는 방법을 조사하고, 우리 집과 학교에서 실천할 계획을 세워요.
story: 전기 연구소에서 '전기 지킴이'를 뽑아요! 위험한 상황을 찾아내고, 전기를 알뜰하게 쓰는 실천 계획을 세워 지킴이 배지를 받아 보세요.
lessons: ['8', '9']
standards: [6과15-04]
minutes: 12
teacherGuide:
  - 8차시 '전기 안전', 9차시 '효율적 사용과 실천 계획' 스테이지로 나뉘어 있어요.
  - 실천 계획 카드는 탐험 리포트에 모여요. 일주일 동안 실천하고 결과를 확인하는 활동으로 이어 가면 좋아요.
stages:
  - id: safety
    title: 전기를 안전하게
    emoji: ⚠️
    lesson: '8'
    intro: 위험한 상황과 안전한 방법을 가려내요.
    steps:
      - type: sort
        lv: C
        std: 6과15-04
        cat: 지식·이해
        q: 전기를 안전하게 쓰는 모습과 위험한 모습으로 나누어 보세요.
        bins: [안전해요, 위험해요]
        items:
          - { text: "마른 손으로 플러그를 잡고 뽑는다", bin: "안전해요" }
          - { text: "콘센트에 덮개를 씌운다", bin: "안전해요" }
          - { text: "젖은 손으로 플러그를 만진다", bin: "위험해요" }
          - { text: "한 콘센트에 플러그를 여러 개 꽂는다", bin: "위험해요" }
          - { text: "전선을 잡아당겨 플러그를 뽑는다", bin: "위험해요" }
          - { text: "콘센트 구멍에 젓가락을 넣는다", bin: "위험해요" }
      - type: choice
        photo: illust/multitap
        lv: B
        std: 6과15-04
        cat: 지식·이해
        q: 한 콘센트에 많은 전기 제품을 한꺼번에 연결하면 위험한 까닭은?
        options: [전선이 지나치게 뜨거워져 불이 날 수 있기 때문에, 전기 제품이 더 잘 작동하기 때문에, 전기 요금이 줄어들기 때문에]
        answer: 전선이 지나치게 뜨거워져 불이 날 수 있기 때문에
      - type: choice
        photo: illust/bathroom-dryer
        lv: A
        std: 6과15-04
        cat: 지식·이해
        card: { emoji: "🛁", title: "욕실의 헤어드라이어", text: "동생이 물이 고인 욕실 바닥에서 헤어드라이어를 쓰려고 해요." }
        q: 가장 알맞은 행동을 고르세요.
        options:
          - 물기가 없는 곳에서, 마른 손으로 쓰도록 알려 준다
          - 물이 있어도 괜찮다고 말한다
          - 헤어드라이어를 물로 씻어 준다
        answer: 물기가 없는 곳에서, 마른 손으로 쓰도록 알려 준다

  - id: efficient
    title: 전기를 알뜰하게
    emoji: ♻️
    lesson: '9'
    intro: 전기를 효율적으로 쓰는 방법을 찾고 실천 계획을 세워요.
    steps:
      - type: multi
        lv: C
        std: 6과15-04
        cat: 지식·이해
        q: 전기를 효율적으로 쓰는 방법을 모두 고르세요.
        options:
          - 쓰지 않는 전기 제품의 플러그를 뽑는다
          - 에너지 소비 효율 등급이 높은(1등급) 제품을 쓴다
          - 전등을 엘이디(LED) 전등으로 바꾼다
          - 냉장고 문을 오래 열어 둔다
        answers: [쓰지 않는 전기 제품의 플러그를 뽑는다, 에너지 소비 효율 등급이 높은(1등급) 제품을 쓴다, 전등을 엘이디(LED) 전등으로 바꾼다]
      - type: shop
        lv: B
        std: 6과15-04
        cat: 과정·기능
        customer: { emoji: "🏠", name: "우리 가족", place: "우리 집", says: "이번 달 전기 요금이 많이 나왔어요. 어떻게 하면 전기를 아낄 수 있을까요?" }
        q: 우리 가족의 전기 절약 실천 계획에 넣을 내용을 모두 골라 보세요.
        features:
          - { text: "외출할 때 멀티탭 스위치 끄기", fit: true, why: "쓰지 않아도 흐르는 대기 전력을 줄여요." }
          - { text: "여름에 에어컨 온도를 너무 낮추지 않기", fit: true, why: "알맞은 온도로 쓰면 전기를 크게 아낄 수 있어요." }
          - { text: "빈방의 전등 끄기", fit: true, why: "필요 없는 전기를 쓰지 않아요." }
          - { text: "휴대폰을 다 충전한 뒤에도 충전기를 계속 꽂아 두기", fit: false, why: "대기 전력이 낭비돼요." }
        planLabels: { title: "🔌 전기 절약 실천 계획 카드 (선택)", name: "계획 이름", slogan: "우리 가족 약속", when: "언제·어떻게 실천을 확인할까?", save: "실천 계획 카드 저장", emoji: "🔌" }
      - type: shop
        photo: illust/empty-classroom
        lv: A
        std: 6과15-04
        cat: 과정·기능
        card: { emoji: "📊", title: "우리 반 전기 사용 조사", text: "점심시간 빈 교실에 전등이 켜져 있는 날이 5일 중 4일이었어요. 쉬는 시간마다 컴퓨터 화면이 켜져 있고, 겨울에 창문을 열어 둔 채 난방기를 틀 때가 많았어요." }
        customer: { emoji: "🏫", name: "우리 반 전기 지킴이 회의", place: "우리 교실", says: "조사 결과를 보고 우리 반에 꼭 맞는 전기 절약 계획을 세우고 싶어요." }
        q: 조사 결과를 분석해 우리 반에 알맞은 실천 계획을 모두 골라 보세요.
        features:
          - { text: "교실을 비울 때 마지막 사람이 전등 끄기 당번하기", fit: true, why: "빈 교실에 전등이 켜진 문제를 직접 해결해요." }
          - { text: "쉬는 시간에 컴퓨터 화면 끄기", fit: true, why: "조사에서 찾은 낭비를 줄여요." }
          - { text: "난방기를 켤 때는 창문 닫기", fit: true, why: "데운 공기가 빠져나가지 않아 전기를 덜 써요." }
          - { text: "조사와 상관없이 복도 게시판 꾸미기", fit: false, why: "조사에서 찾은 문제와 이어져 있지 않아요." }
        planLabels: { title: "🔌 우리 반 실천 계획 카드 (선택)", name: "계획 이름", slogan: "우리 반 약속", when: "실천 결과를 어떻게 확인할까? (예: 일주일 점검표)", save: "실천 계획 카드 저장", emoji: "🔌" }
