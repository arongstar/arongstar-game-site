# 6학년 영어 Lesson 1 — 자동 생성한 뒤 손으로 고쳐도 돼요. (대화·글은 이 사이트에서 새로 쓴 것이에요)
template: mission
style: shop
unit: eng-6-l01
title: Writing Studio — 나를 소개해요
emoji: ✍️
summary: 예시문을 읽고 자신을 소개하는 내용을 떠올린 뒤, 틀에 맞춰 자기소개 글을 써서 카드로 저장해요.
story: 세계 어린이 화상 모임에 보낼 내 소개 카드를 만들어요! 예시문을 참고해 나만의 자기소개 글을 써 보세요.
lessons:
- '5'
standards:
- 6영02-08
- 6영02-03
minutes: 15
teacherGuide:
- 5차시(Let's Write)에 써요. 🧭 단계는 세 문장, 🔎 단계는 다섯 문장, 🏅 단계는 장래 희망까지 여섯 문장을 써요.
- 쓴 글은 「나의 탐험 리포트」에 카드로 모여요. 진짜 집 주소, 전화번호 같은 개인 정보는 쓰지 않도록 지도해 주세요.
