# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: soc-6-1-1
title: 한반도 평화 지도
emoji: 🕊️
summary: 분단으로 나타난 문제점을 알아보고, 분단의 장소가 평화의 장소로 바뀌는 모습과 평화 통일을 위한 노력을 살펴본 뒤 우리가 할 수 있는 일을 찾아요.
story: 한반도 평화 지도에 아직 빈칸이 많아요! 분단의 아픔이 남은 곳을 찾아가 평화의 장소로 바꾸는 사람들을 만나고, 지도를 함께 완성해 보세요.
lessons:
- '2'
- '3'
- '4'
- '5'
standards:
- 6사07-01
minutes: 15
teacherGuide:
- 2~5차시에 한 스테이지씩 써요. 실천 카드는 「나의 탐험 리포트」에 모여요.
- 북한 이탈 주민 학생이 있는 학급에서는 사전에 활동 내용을 살펴보고 배려해 주세요.
stages:
- id: division
  title: 분단의 아픔
  emoji: 💔
  lesson: '2'
  intro: 분단으로 나타난 문제점을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사07-01
    cat: 지식·이해
    q: 그림처럼 오랫동안 헤어져 살던 가족이 잠깐 만나고 다시 헤어져야 하는 아픔을 겪는 사람들을 무엇이라고 할까요?
    options:
    - 이산가족
    - 다문화 가족
    - 핵가족
    answer: 이산가족
    photo: illust/so-family
  - type: multi
    lv: C
    std: 6사07-01
    cat: 지식·이해
    q: 분단으로 나타난 문제점을 모두 골라 보세요.
    options:
    - 가족이 헤어져 서로 만나기 어렵다
    - 전쟁에 대한 불안감이 있다
    - 남북한의 언어와 생활 문화가 점점 달라진다
    - 남북이 함께 쓸 수 있는 땅과 길이 끊겨 있다
    - 우리나라의 사계절이 사라진다
    answers:
    - 가족이 헤어져 서로 만나기 어렵다
    - 전쟁에 대한 불안감이 있다
    - 남북한의 언어와 생활 문화가 점점 달라진다
    - 남북이 함께 쓸 수 있는 땅과 길이 끊겨 있다
  - type: sort
    lv: B
    std: 6사07-01
    cat: 지식·이해
    q: 분단으로 나타난 문제점을 영역에 따라 나누어 보세요.
    bins:
    - 사람들의 아픔
    - 경제적 손실
    - 문화의 차이
    items:
    - text: 이산가족이 서로 소식을 알기 어렵다
      bin: 사람들의 아픔
    - text: 고향에 가지 못하는 사람들이 있다
      bin: 사람들의 아픔
    - text: 나라를 지키는 데 많은 비용이 든다
      bin: 경제적 손실
    - text: 대륙으로 이어지는 철도와 도로를 쓰기 어렵다
      bin: 경제적 손실
    - text: 같은 물건을 서로 다른 말로 부른다
      bin: 문화의 차이
  - type: choice
    lv: A
    std: 6사07-01
    cat: 지식·이해
    q: 남한에서는 「도시락」이라고 하는 것을 북한에서는 「곽밥」이라고 해요. 이런 차이가 생긴 까닭과 문제점을 가장 알맞게 말한 것은?
    options:
    - 오랫동안 분단되어 서로 교류하지 못했기 때문이며, 통일이 되었을 때 서로 소통하기 어려울 수 있다
    - 원래부터 다른 언어를 썼기 때문이며, 아무 문제가 없다
    - 북한이 외국어를 쓰기 때문이다
    answer: 오랫동안 분단되어 서로 교류하지 못했기 때문이며, 통일이 되었을 때 서로 소통하기 어려울 수 있다
    explain: 북한 말은 지역과 시기에 따라 다르게 쓰이기도 해요. 서로의 말을 알아보는 것도 통일을 준비하는 일이에요.
- id: peace-places
  title: 평화의 장소
  emoji: 🏞️
  lesson: '3'
  intro: 분단의 장소가 평화의 장소로 바뀌는 모습을 살펴봐요.
  steps:
  - type: choice
    lv: C
    std: 6사07-01
    cat: 지식·이해
    q: 그림처럼 남북한 사이의 비무장 지대(DMZ)에 두루미 같은 멸종 위기 생물이 많이 사는 까닭은?
    options:
    - 사람들의 출입이 오랫동안 제한되어 자연이 잘 보존되었기 때문이다
    - 사람들이 동물원을 만들었기 때문이다
    - 날씨가 아주 따뜻하기 때문이다
    answer: 사람들의 출입이 오랫동안 제한되어 자연이 잘 보존되었기 때문이다
    photo: illust/so-dmz-nature
  - type: sort
    lv: B
    std: 6사07-01
    cat: 지식·이해
    q: 분단과 관련된 장소에서 하고 있는 평화를 위한 노력을 짝지어 보세요.
    bins:
    - 판문점
    - 임진각 평화누리
    - 비무장 지대(DMZ)
    items:
    - text: 남북한 대표가 만나 회담을 여는 곳
      bin: 판문점
    - text: 고향에 가지 못하는 사람들이 그리움을 달래고 평화를 기원하는 공원
      bin: 임진각 평화누리
    - text: 철책을 따라 걷는 평화의 길이 열리고 생태 탐방이 이루어지는 곳
      bin: 비무장 지대(DMZ)
  - type: choice
    lv: B
    std: 6사07-01
    cat: 과정·기능
    q: 그림처럼 철책에 리본을 달며 평화의 길을 걷는 활동이 가지는 의미로 가장 알맞은 것은?
    options:
    - 분단의 상징이던 장소를 평화와 화해를 바라는 장소로 바꾸어 간다
    - 철책을 더 튼튼하게 만든다
    - 관광객을 줄이기 위한 활동이다
    answer: 분단의 상징이던 장소를 평화와 화해를 바라는 장소로 바꾸어 간다
    photo: illust/so-peace-trail
  - type: choice
    lv: A
    std: 6사07-01
    cat: 과정·기능
    q: 친구가 「분단과 관련된 장소는 슬픈 곳이니 찾아갈 필요가 없어.」라고 말했어요. 가장 알맞게 답한 것은?
    options:
    - 분단의 아픔을 기억하고 평화의 소중함을 배우며 평화를 바라는 마음을 함께 나눌 수 있는 곳이야
    - 맞아, 그런 곳은 모두 없애야 해
    - 경치가 좋아서 사진만 찍으면 되는 곳이야
    answer: 분단의 아픔을 기억하고 평화의 소중함을 배우며 평화를 바라는 마음을 함께 나눌 수 있는 곳이야
- id: efforts
  title: 평화 통일을 위한 노력
  emoji: 🤝
  lesson: '4'
  intro: 남북한이 평화 통일을 위해 해 온 노력을 알아봐요.
  steps:
  - type: multi
    lv: C
    std: 6사07-01
    cat: 지식·이해
    q: 남북한이 평화 통일을 위해 해 온 노력을 모두 골라 보세요.
    options:
    - 남북 정상 회담을 열었다
    - 이산가족이 만날 수 있는 자리를 마련했다
    - 국제 대회에서 남북한 선수가 함께 입장하거나 단일팀을 이루었다
    - 서로 오가는 길을 모두 막았다
    answers:
    - 남북 정상 회담을 열었다
    - 이산가족이 만날 수 있는 자리를 마련했다
    - 국제 대회에서 남북한 선수가 함께 입장하거나 단일팀을 이루었다
  - type: sort
    lv: B
    std: 6사07-01
    cat: 지식·이해
    q: 평화 통일을 위한 노력을 분야에 따라 나누어 보세요.
    bins:
    - 정치 분야
    - 경제 분야
    - 사회·문화 분야
    items:
    - text: 남북 정상 회담
      bin: 정치 분야
    - text: 남북 공동 선언 발표
      bin: 정치 분야
    - text: 남한 기업이 북한 개성에 공장을 짓고 북한 노동자와 함께 물건을 만든 개성 공단
      bin: 경제 분야
    - text: 남북한 스포츠 단일팀
      bin: 사회·문화 분야
    - text: 이산가족 상봉
      bin: 사회·문화 분야
  - type: choice
    lv: A
    std: 6사07-01
    cat: 과정·기능
    q: 정부뿐 아니라 민간단체와 개인도 통일을 위해 노력해야 하는 까닭으로 가장 알맞은 것은?
    options:
    - 통일은 남북한 사람들이 함께 살아가는 일이므로 서로를 이해하려는 많은 사람의 관심과 노력이 필요하기 때문이다
    - 정부는 통일에 관심이 없기 때문이다
    - 개인이 노력하면 바로 통일이 되기 때문이다
    answer: 통일은 남북한 사람들이 함께 살아가는 일이므로 서로를 이해하려는 많은 사람의 관심과 노력이 필요하기 때문이다
- id: my-action
  title: 우리가 할 수 있는 일
  emoji: ✋
  lesson: '5'
  intro: 평화 통일을 위해 우리가 할 수 있는 일을 찾아 실천 카드를 만들어요.
  steps:
  - type: multi
    lv: C
    std: 6사07-01
    cat: 가치·태도
    q: 평화 통일을 위해 초등학생인 우리가 할 수 있는 일을 모두 골라 보세요.
    options:
    - 북한의 생활과 문화에 대해 알아본다
    - 통일과 관련된 행사나 글짓기에 참여한다
    - 북한 이탈 주민 친구를 편견 없이 대한다
    - 통일은 어른들의 일이라 관심을 두지 않는다
    answers:
    - 북한의 생활과 문화에 대해 알아본다
    - 통일과 관련된 행사나 글짓기에 참여한다
    - 북한 이탈 주민 친구를 편견 없이 대한다
  - type: shop
    lv: B
    std: 6사07-01
    cat: 가치·태도
    q: 통일 체험관 선생님의 이야기를 듣고, 우리 반이 할 수 있는 일을 모두 골라 보세요.
    customer:
      emoji: 🏫
      name: 통일 체험관 선생님
      place: 통일 체험관
      says: 통일은 서로를 아는 것부터 시작해요. 여러분 반에서 할 수 있는 일을 찾아 실천해 보세요.
    features:
    - text: 남북한의 같은 말과 다른 말 사전 만들기
      fit: true
      why: 서로의 말을 알면 소통하기 쉬워져요.
    - text: 평화 통일을 바라는 편지나 그림을 전시하기
      fit: true
      why: 많은 사람이 통일에 관심을 가지게 돼요.
    - text: 북한 친구를 놀리는 말 만들기
      fit: false
      why: 편견과 차별은 평화를 해쳐요.
    planLabels: &id001
      title: 🕊️ 평화 통일 실천 카드 만들기 (선택)
      name: 나의 평화 실천
      slogan: 함께 나누고 싶은 한 문장
      when: 언제, 어디에서 실천하거나 알릴까?
      save: 실천 카드 저장
      emoji: 🕊️
  - type: shop
    lv: A
    std: 6사07-01
    cat: 가치·태도
    q: 실천 계획을 세울 때 꼭 들어가야 할 조건을 모두 골라 보세요.
    customer:
      emoji: 📋
      name: 평화 통일 실천단 대장
      place: 우리 반
      says: 말로만 하는 다짐은 금방 잊혀요. 정말 실천할 수 있는 계획을 세워 주세요.
    features:
    - text: 언제, 어디에서, 무엇을 할지 구체적으로 적는다
      fit: true
      why: 구체적일수록 실천하기 쉬워요.
    - text: 분단의 어떤 문제점을 해결하는 데 도움이 되는지 적는다
      fit: true
      why: 실천의 까닭을 알면 꾸준히 할 수 있어요.
    - text: 친구들과 함께할 수 있는 방법을 찾는다
      fit: true
      why: 여럿이 함께하면 더 큰 힘이 돼요.
    - text: 「통일이 되면 좋겠다」만 적는다
      fit: false
      why: 무엇을 실천할지 알 수 없어요.
    planLabels: *id001
