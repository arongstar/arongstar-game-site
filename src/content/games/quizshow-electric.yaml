template: quizshow
unit: sci-6-2-3
title: 과학 퀴즈쇼 — 전기의 이용
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 전기 회로, 전지의 연결, 전자석, 전기 안전과 절약을 정리해요.
lessons: ['1', '10']
standards: [6과15-01, 6과15-02, 6과15-03, 6과15-04]
minutes: 20
teacherGuide:
  - 1차시에는 생각 열기로, 10차시에는 단원 정리로 써요.
  - 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
  - name: 전기 회로
    emoji: 💡
    items:
      - { lv: "C", q: "전지, 전선, 전구 등을 연결해 전기가 흐르도록 한 것은?", answer: "전기 회로" }
      - { lv: "B", q: "전구에 불이 켜지는 전기 회로의 특징은?", answer: "전지, 전선, 전구가 끊어진 곳 없이 하나로 이어져 있어요." }
      - { lv: "A", q: "철 클립은 회로에 연결하면 불이 켜지는데 나무젓가락은 켜지지 않는 까닭을 설명해 보세요.", answer: "철 클립은 전기가 잘 통하고, 나무젓가락은 전기가 잘 통하지 않기 때문이에요." }
  - name: 전지의 연결
    emoji: 🔋
    items:
      - { lv: "C", q: "전지 두 개를 직렬연결하면 전구의 밝기는 어떻게 될까요?", answer: "더 밝아져요." }
      - { lv: "B", q: "전지의 직렬연결은 어떻게 연결하는 것일까요?", answer: "한 전지의 (+)극을 다른 전지의 (−)극에 차례로 이어요." }
      - { lv: "A", q: "전지 두 개를 직렬연결한 회로에 전동기를 연결하면 어떻게 될지 예상하고 까닭을 말해 보세요.", answer: "전지 한 개일 때보다 더 빠르게 돌아요. 전지를 직렬로 더 연결하면 회로에 더 센 전기가 흐르기 때문이에요." }
  - name: 전자석
    emoji: 🧲
    items:
      - { lv: "C", q: "전기가 흐를 때만 자석의 성질을 가지는 자석은?", answer: "전자석" }
      - { lv: "B", q: "전자석의 극을 바꾸려면 어떻게 해야 할까요?", answer: "전지의 연결 방향을 바꿔요." }
      - { lv: "A", q: "고철을 옮길 때 영구 자석 대신 전자석 기중기를 쓰는 까닭을 설명해 보세요.", answer: "전기를 끊으면 자석의 성질이 사라져 원하는 곳에 고철을 내려놓을 수 있기 때문이에요." }
  - name: 전기 안전과 절약
    emoji: 🔌
    items:
      - { lv: "C", q: "젖은 손으로 플러그를 만지면 안 되는 까닭은?", answer: "감전될 수 있기 때문이에요." }
      - { lv: "B", q: "쓰지 않는 전기 제품의 플러그를 뽑으면 무엇을 줄일 수 있을까요?", answer: "대기 전력" }
      - { lv: "A", q: "우리 반에서 실천할 수 있는 전기 절약 계획을 두 가지 세우고, 실천했는지 확인할 방법도 말해 보세요.", answer: "예) 빈 교실 전등 끄기 당번, 쉬는 시간 컴퓨터 화면 끄기 — 일주일 점검표로 확인해요." }
