categories:
- name: 선거
  emoji: 🗳️
  items:
  - lv: C
    q: 국민이 투표로 대표를 뽑는 것은?
    answer: 선거
  - lv: B
    q: 한 사람이 한 표씩 투표하는 민주 선거의 원칙은?
    answer: 평등 선거
  - lv: A
    q: 친구에게 투표용지를 보여 주며 투표하면 안 되는 까닭을 원칙과 관련지어 말해 보세요.
    answer: 비밀 선거의 원칙에 어긋나고, 다른 사람의 눈치를 보지 않고 자유롭게 투표해야 하기 때문이에요.
- name: 국회와 행정부
  emoji: 🏛️
  items:
  - lv: C
    q: 법을 만들거나 고치는 국가기관은?
    answer: 국회
  - lv: B
    q: 법에 따라 나라 살림을 맡아 하는 국가기관은?
    answer: 행정부
  - lv: A
    q: 국회가 예산을 확정하는 일이 행정부를 견제하는 까닭을 말해 보세요.
    answer: 행정부가 나라 살림에 쓸 돈을 함부로 쓰지 못하게 국민의 대표가 살펴보기 때문이에요.
- name: 법원과 권력 분립
  emoji: ⚖️
  items:
  - lv: C
    q: 법에 따라 재판을 하는 국가기관은?
    answer: 법원
  - lv: B
    q: 원칙적으로 세 번까지 재판을 받을 수 있는 제도는?
    answer: 3심 제도
  - lv: A
    q: 권력 분립이 필요한 까닭을 말해 보세요.
    answer: 권력이 한곳에 모여 함부로 쓰이는 것을 막고 국민의 자유와 권리를 지키기 위해서예요.
- name: 미디어
  emoji: 📱
  items:
  - lv: C
    q: 신문, 방송, 영상 누리집처럼 정보를 전하는 수단은?
    answer: 미디어
  - lv: B
    q: 「이번 겨울은 정말 지루할 것이다」는 사실일까요, 의견일까요?
    answer: 의견
  - lv: A
    q: 가짜 뉴스를 가려내는 방법을 두 가지 말해 보세요.
    answer: 예) 출처와 날짜 확인하기, 다른 믿을 만한 미디어와 비교하기
