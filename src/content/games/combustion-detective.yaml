template: mission
style: detective
unit: sci-6-2-2
title: 연소 탐정
emoji: 🔥
summary: 양초와 알코올이 탈 때의 공통점을 찾고, 가상 실험으로 연소의 조건을 밝힌 뒤, 연소 후에 생기는 물질을 확인해요.
story: 탐정 사무소에 '불의 비밀' 사건이 들어왔어요! 촛불과 알코올램프를 조사해서 물질이 타려면 무엇이 필요한지, 타고 나면 무엇이 생기는지 밝혀 주세요.
lessons: ['3', '4', '5', '6']
standards: [6과14-02, 6과14-03]
minutes: 12
teacherGuide:
  - 3차시 '공통 현상', 4차시 '산소', 5차시 '발화점', 6차시 '연소 후 생기는 물질' 스테이지로 나뉘어 있어요.
  - 4차시의 비커 덮기 실험은 가상 실험이에요. 시간은 빠르게 줄여 보여 주고, 실제 실험 전후에 예상과 결과를 비교하는 데 쓰면 좋아요.
  - 교육과정에 따라 그을음은 연소 생성물로 다루지 않아요. 실제 실험 때는 보안경 등 안전 장구를 갖추고 주의할 점을 먼저 지도해 주세요.
stages:
  - id: phenomena
    title: 탈 때 나타나는 공통점
    emoji: 🕯️
    lesson: '3'
    intro: 양초와 알코올이 탈 때 나타나는 현상을 비교해요.
    steps:
      - type: multi
        lv: C
        std: 6과14-02
        cat: 과정·기능
        q: 양초와 알코올이 탈 때 공통으로 나타나는 현상을 모두 고르세요.
        options: [빛이 난다, 열이 난다, 타는 물질의 양이 줄어든다, 물질이 차가워진다]
        answers: [빛이 난다, 열이 난다, 타는 물질의 양이 줄어든다]
      - type: choice
        lv: C
        std: 6과14-02
        cat: 지식·이해
        q: 물질이 산소와 빠르게 반응하여 빛과 열을 내는 현상을 무엇이라고 할까요?
        options: [연소, 증발, 응결]
        answer: 연소
      - type: choice
        lv: B
        std: 6과14-02
        cat: 과정·기능
        card: { emoji: "🔍", title: "관찰 기록", text: "양초: 불꽃 주위가 밝고 따뜻하며 초의 길이가 점점 짧아진다. 알코올램프: 불꽃 주위가 밝고 따뜻하며 알코올의 양이 점점 줄어든다." }
        q: 관찰 기록을 비교해 찾은 공통점으로 가장 알맞은 것은?
        options:
          - 물질이 탈 때 빛과 열이 나고, 타는 물질의 양이 줄어든다
          - 물질이 탈 때 물질의 양이 늘어난다
          - 양초와 알코올은 서로 다르게 탄다
        answer: 물질이 탈 때 빛과 열이 나고, 타는 물질의 양이 줄어든다
      - type: choice
        lv: A
        std: 6과14-02
        cat: 지식·이해
        q: 우리 생활에서 연소할 때 나오는 '빛'과 '열'을 이용하는 예를 바르게 짝지은 것은?
        options:
          - "열: 가스레인지로 음식을 익힌다 / 빛: 캠핑장에서 모닥불로 주변을 밝힌다"
          - "열: 냉장고로 음식을 차갑게 한다 / 빛: 태양광 패널로 전기를 만든다"
          - "열: 선풍기 바람을 쐰다 / 빛: 손전등을 켠다"
        answer: "열: 가스레인지로 음식을 익힌다 / 빛: 캠핑장에서 모닥불로 주변을 밝힌다"

  - id: oxygen
    title: 타려면 산소가 필요할까?
    emoji: 🫙
    lesson: '4'
    intro: 비커를 덮는 가상 실험으로 산소의 역할을 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6과14-02
        cat: 과정·기능
        candle: true
        q: 가상 실험에서 '작은 비커로 덮기'와 '덮지 않기'를 해 보세요. 비커로 덮은 촛불은 어떻게 되나요?
        options: [얼마 뒤 꺼진다, 더 크게 탄다, 덮지 않은 촛불과 똑같다]
        answer: 얼마 뒤 꺼진다
      - type: choice
        lv: B
        std: 6과14-02
        cat: 과정·기능
        candle: true
        q: 작은 비커와 큰 비커로 각각 덮어 보세요. 큰 비커 속 촛불이 더 오래 타는 까닭은?
        options:
          - 큰 비커 안에 공기(산소)가 더 많기 때문에
          - 큰 비커가 더 무겁기 때문에
          - 큰 비커는 빛을 더 많이 통과시키기 때문에
        answer: 큰 비커 안에 공기(산소)가 더 많기 때문에
      - type: choice
        lv: B
        std: 6과14-02
        cat: 과정·기능
        q: 이 실험에서 다르게 한 조건과 같게 한 조건으로 알맞은 것은?
        options:
          - 다르게 한 조건은 비커의 크기, 같게 한 조건은 초의 크기와 종류
          - 다르게 한 조건은 초의 종류, 같게 한 조건은 비커의 크기
          - 모든 조건을 다르게 했다
        answer: 다르게 한 조건은 비커의 크기, 같게 한 조건은 초의 크기와 종류
      - type: choice
        lv: A
        std: 6과14-02
        cat: 지식·이해
        candle: true
        q: 촛불이 타고 있는 비커 안에 산소를 계속 넣어 준다면 어떻게 될지 추리해 보세요.
        options: [촛불이 꺼지지 않고 계속 탄다, 촛불이 바로 꺼진다, 촛불의 색깔만 바뀐다]
        answer: 촛불이 꺼지지 않고 계속 탄다

  - id: ignition
    title: 불을 붙이지 않아도 탈까?
    emoji: 🌡️
    lesson: '5'
    intro: 발화점과 연소의 세 가지 조건을 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6과14-02
        cat: 과정·기능
        card: { emoji: "🔥", title: "철판 가열 실험", text: "철판 가운데를 알코올램프로 가열하고, 가운데에서 같은 거리에 성냥 머리와 나무 조각을 올려놓았어요. 불을 직접 붙이지 않았는데 성냥 머리가 먼저 불이 붙었어요." }
        q: 불을 직접 붙이지 않았는데도 성냥 머리에 불이 붙은 까닭은?
        options: [철판이 뜨거워져 성냥 머리의 온도가 높아졌기 때문에, 산소가 없어졌기 때문에, 성냥 머리가 차가워졌기 때문에]
        answer: 철판이 뜨거워져 성냥 머리의 온도가 높아졌기 때문에
      - type: choice
        lv: B
        std: 6과14-02
        cat: 지식·이해
        q: 물질이 불에 직접 닿지 않아도 타기 시작하는 온도를 무엇이라고 할까요?
        options: [발화점, 녹는점, 끓는점]
        answer: 발화점
        explain: 성냥 머리가 나무 조각보다 먼저 탄 것은 성냥 머리의 발화점이 더 낮기 때문이에요. 물질마다 발화점이 달라요.
      - type: multi
        lv: B
        std: 6과14-02
        cat: 지식·이해
        q: 물질이 연소하는 데 필요한 조건을 모두 고르세요.
        options: [탈 물질, 산소, 발화점 이상의 온도, 물]
        answers: [탈 물질, 산소, 발화점 이상의 온도]
      - type: sort
        lv: A
        std: 6과14-02
        cat: 지식·이해
        q: 불을 끄는 방법은 연소 조건 가운데 무엇을 없앤 것일까요? 분석해 나누어 보세요.
        hint: 연소의 세 가지 조건 가운데 하나라도 없으면 불이 꺼져요.
        bins: [탈 물질을 없앰, 산소를 막음, 온도를 낮춤]
        items:
          - { text: "가스레인지의 밸브를 잠근다", bin: "탈 물질을 없앰" }
          - { text: "촛불 심지를 핀셋으로 집는다", bin: "탈 물질을 없앰" }
          - { text: "알코올램프의 뚜껑을 덮는다", bin: "산소를 막음" }
          - { text: "모래를 덮는다", bin: "산소를 막음" }
          - { text: "물을 뿌린다", bin: "온도를 낮춤" }
      - type: choice
        lv: A
        std: 6과14-02
        cat: 지식·이해
        q: 기름에 불이 붙었을 때 물을 뿌리면 안 되는 까닭과 알맞은 대처를 가장 바르게 말한 것은?
        options:
          - 물이 닿으면 기름이 튀어 불이 더 번질 수 있으므로, 뚜껑이나 젖은 수건으로 덮어 산소를 막는다
          - 물이 기름을 더 차갑게 만들기 때문에 바로 물을 많이 붓는다
          - 기름은 타지 않으므로 그냥 둔다
        answer: 물이 닿으면 기름이 튀어 불이 더 번질 수 있으므로, 뚜껑이나 젖은 수건으로 덮어 산소를 막는다

  - id: products
    title: 타고 나면 무엇이 생길까?
    emoji: 💧
    lesson: '6'
    intro: 연소 후에 생기는 물질을 확인하는 실험을 해석해요.
    steps:
      - type: choice
        lv: C
        std: 6과14-03
        cat: 과정·기능
        card: { emoji: "🧫", title: "석회수 실험", text: "촛불을 비커로 덮어 촛불이 꺼진 뒤, 비커 안에 석회수를 넣고 흔들었더니 석회수가 뿌옇게 흐려졌어요." }
        q: 이 결과로 알 수 있는, 초가 탈 때 생긴 물질은?
        options: [이산화 탄소, 산소, 질소]
        answer: 이산화 탄소
      - type: choice
        lv: C
        std: 6과14-03
        cat: 과정·기능
        card: { emoji: "🟦", title: "염화 코발트 종이 실험", text: "촛불이 꺼진 비커 안쪽 벽에 푸른색 염화 코발트 종이를 붙였더니 붉은색으로 변했어요." }
        q: 이 결과로 알 수 있는, 초가 탈 때 생긴 물질은?
        options: [물, 소금, 산소]
        answer: 물
      - type: sort
        lv: B
        std: 6과14-03
        cat: 과정·기능
        q: 실험 결과와 확인할 수 있는 물질을 짝지어 보세요.
        bins: [물이 생겼다, 이산화 탄소가 생겼다]
        items:
          - { text: "푸른색 염화 코발트 종이가 붉게 변했다", bin: "물이 생겼다" }
          - { text: "비커 안쪽 벽이 뿌옇게 흐려지며 물방울이 맺혔다", bin: "물이 생겼다" }
          - { text: "석회수가 뿌옇게 흐려졌다", bin: "이산화 탄소가 생겼다" }
      - type: choice
        lv: B
        std: 6과14-03
        cat: 지식·이해
        q: 연소 전과 후의 물질을 비교한 결과로 가장 알맞은 것은?
        options:
          - 연소 후에는 물과 이산화 탄소처럼 처음과 성질이 다른 물질이 생긴다
          - 연소 전과 후의 물질은 성질이 똑같다
          - 연소 후에는 아무 물질도 남지 않는다
        answer: 연소 후에는 물과 이산화 탄소처럼 처음과 성질이 다른 물질이 생긴다
      - type: choice
        lv: A
        std: 6과14-03
        cat: 과정·기능
        q: 초가 타면 초의 길이가 줄어들어요. 줄어든 초는 어디로 갔는지 실험 결과를 근거로 가장 알맞게 설명한 것은?
        options:
          - 초를 이루던 물질이 산소와 만나 물과 이산화 탄소 같은 다른 물질로 바뀌어 공기 중으로 나갔다
          - 초는 그냥 사라져 없어졌다
          - 초가 모두 녹아 바닥에 흘러내렸다
        answer: 초를 이루던 물질이 산소와 만나 물과 이산화 탄소 같은 다른 물질로 바뀌어 공기 중으로 나갔다
      - type: multi
        lv: A
        std: 6과14-03
        cat: 지식·이해
        q: 연소 과정을 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 연소하려면 산소가 필요하다
          - 연소 후에는 물과 이산화 탄소가 생긴다
          - 연소는 물질의 성질이 달라지는 변화이다
          - 연소 후에도 처음 물질의 성질은 그대로 남는다
        answers: [연소하려면 산소가 필요하다, 연소 후에는 물과 이산화 탄소가 생긴다, 연소는 물질의 성질이 달라지는 변화이다]
