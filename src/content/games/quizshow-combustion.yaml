template: quizshow
unit: sci-6-2-2
title: 과학 퀴즈쇼 — 물질의 연소
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 물질의 변화, 연소의 조건, 연소 생성물, 이산화 탄소와 생태계를 정리해요.
lessons: ['1', '9']
standards: [6과14-01, 6과14-02, 6과14-03, 6과14-04]
minutes: 20
teacherGuide:
  - 1차시에는 생각 열기로, 9차시에는 단원 정리로 써요.
  - 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
  - name: 물질의 변화
    emoji: 🧪
    items:
      - { lv: "C", q: "종이를 가위로 자르면 종이의 성질이 달라질까요?", answer: "달라지지 않아요. 모양과 크기만 바뀌어요." }
      - { lv: "B", q: "베이킹 소다에 식초를 부었을 때 성질이 달라졌다고 판단할 수 있는 근거는?", answer: "처음에 없던 거품(기체)이 생겼기 때문이에요." }
      - { lv: "A", q: "설탕이 물에 녹아 보이지 않아도 성질이 달라지지 않았다고 할 수 있는 근거는?", answer: "물을 증발시키면 설탕이 다시 남기 때문이에요." }
  - name: 연소의 조건
    emoji: 🔥
    items:
      - { lv: "C", q: "물질이 탈 때 공통으로 나는 것 두 가지는?", answer: "빛과 열" }
      - { lv: "B", q: "불을 직접 붙이지 않아도 물질이 타기 시작하는 온도는?", answer: "발화점" }
      - { lv: "A", q: "연소의 세 가지 조건을 말하고, 알코올램프 뚜껑을 덮으면 불이 꺼지는 까닭을 설명해 보세요.", answer: "탈 물질, 산소, 발화점 이상의 온도 — 뚜껑을 덮으면 산소가 막혀 불이 꺼져요." }
  - name: 연소 생성물
    emoji: 💧
    items:
      - { lv: "C", q: "초가 탈 때 생긴 기체 때문에 석회수가 뿌옇게 흐려졌어요. 어떤 기체일까요?", answer: "이산화 탄소" }
      - { lv: "B", q: "푸른색 염화 코발트 종이가 붉게 변했다면 무엇이 생긴 것일까요?", answer: "물" }
      - { lv: "A", q: "초가 타면 초의 길이가 줄어들어요. 줄어든 초는 어디로 갔을까요?", answer: "초를 이루던 물질이 산소와 만나 물과 이산화 탄소로 바뀌어 공기 중으로 나갔어요." }
  - name: 이산화 탄소와 생태계
    emoji: 🌱
    items:
      - { lv: "C", q: "연료를 많이 태우면 공기 중에 늘어나 지구의 기온을 높이는 기체는?", answer: "이산화 탄소" }
      - { lv: "B", q: "이산화 탄소가 늘어 생기는 생태계 피해의 예를 하나 말해 보세요.", answer: "예) 바다 얼음이 녹아 북극곰이 살 곳을 잃어요. 해수면이 올라가 섬이 물에 잠겨요." }
      - { lv: "A", q: "이산화 탄소를 줄이기 위해 우리가 실천할 수 있는 해결책 두 가지를 제안해 보세요.", answer: "예) 가까운 거리는 걷기, 쓰지 않는 전기 끄기, 나무 심기, 물건 아껴 쓰기" }
