template: mission
style: dex
unit: soc-6-2-1
title: 지형 도감 수집
emoji: 🗂️
summary: 교과서에 나오는 세계의 지형 15곳을 카드로 모아요. 사진을 살펴보고, 특징을 조사하고, 닮은 지형끼리 비교해 분석해요.
story: 탐험 본부에 지형 도감이 텅 비어 있어요! 사진과 지도를 단서로 세계의 지형 카드 15장을 모아 도감을 완성해 주세요.
lessons: ['2']
standards: [6사10-01]
minutes: 15
teacherGuide:
  - 2차시 '지형 경관의 특징 알아보기' 활동 뒤에 개인별로 해요. 단계마다 10~15분이 걸려요.
  - 🧭 살펴보기만 해도 카드 15장을 모두 모을 수 있어요. 빨리 끝낸 학생은 🔎 조사하기, 🏅 분석하기로 넘어가게 해 주세요.
  - 카드를 누르면 지형의 특징과 생활 모습이 나와요. 3~5차시 수업에서 다시 꺼내 볼 수 있어요.
stages:
  - id: cards
    title: 세계의 지형 카드 모으기
    emoji: 🗺️
    lesson: '2'
    intro: 사진을 잘 살펴보고 문제를 풀면 지형 카드를 얻어요.
    steps:
      # ───── 🧭 살펴보기 (C) ─────
      - type: sort
        lv: C
        std: 6사10-01
        cat: 과정·기능
        q: 사진을 살펴보고 지형을 알맞은 바구니에 나누어 담아 보세요.
        hint: 산지는 높은 산이나 화산, 하천은 강과 폭포, 해안은 바다와 맞닿은 곳, 사막은 비가 거의 오지 않는 메마른 땅이에요.
        bins: [산지, 하천, 해안, 사막]
        items:
          - { text: 히말라야산맥, photo: landforms/himalaya, bin: 산지 }
          - { text: 아마존강, photo: landforms/amazon, bin: 하천 }
          - { text: 송네 피오르, photo: landforms/sognefjord, bin: 해안 }
          - { text: 사하라 사막, photo: landforms/sahara, bin: 사막 }
          - { text: 파리나코타 화산, photo: landforms/parinacota, bin: 산지 }
          - { text: 빅토리아 폭포, photo: landforms/victoria, bin: 하천 }
          - { text: 엘 아르코, photo: landforms/elarco, bin: 해안 }
          - { text: 나일강 평야, photo: landforms/nile, bin: 하천 }
        collect: [himalaya, amazon, sognefjord, sahara, parinacota, victoria, elarco, nile]
        explain: 높은 산과 화산은 산지, 강과 폭포는 하천, 바다와 맞닿은 곳은 해안이에요. 사하라처럼 비가 거의 오지 않아 메마른 땅은 사막이에요.
      - type: sort
        lv: C
        std: 6사10-01
        cat: 과정·기능
        q: 남은 지형 카드도 나누어 담아 보세요.
        hint: 하와이에는 화산도 있고 바닷가도 있어요. 사진에 바다가 보이는지 먼저 살펴보세요.
        bins: [산지, 하천, 해안]
        items:
          - { text: 마우나로아, photo: landforms/maunaloa, bin: 산지 }
          - { text: 아비시니아고원, photo: landforms/abyssinia, bin: 산지 }
          - { text: 황허강, photo: landforms/huanghe, bin: 하천 }
          - { text: 호스슈 벤드, photo: landforms/horseshoe, bin: 하천 }
          - { text: 펀디만 갯벌, photo: landforms/fundy, bin: 해안 }
          - { text: 마케나 모래사장, photo: landforms/makena, bin: 해안 }
          - { text: 포트 캠벨 국립 공원, photo: landforms/portcampbell, bin: 해안 }
        collect: [maunaloa, abyssinia, huanghe, horseshoe, fundy, makena, portcampbell]
        explain: 마우나로아는 하와이의 거대한 화산, 아비시니아고원은 높고 평평한 땅이라 산지예요. 황허강과 호스슈 벤드는 강이 만든 지형이고, 나머지 셋은 바닷가 지형이에요.
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/horseshoe
        q: 사진 속 호스슈 벤드의 모습으로 알맞은 것은?
        options:
          - 강이 말발굽 모양으로 크게 휘어 흐른다
          - 모래 언덕이 끝없이 펼쳐져 있다
          - 바다 위에 바위 기둥이 서 있다
          - 눈 덮인 봉우리가 길게 이어져 있다
        answer: 강이 말발굽 모양으로 크게 휘어 흐른다
        explain: 호스슈(horseshoe)는 '말발굽'이라는 뜻이에요. 콜로라도강이 크게 휘어 흐르며 땅을 깊게 깎았어요.
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/sognefjord
        q: 사진 속 송네 피오르의 특징으로 알맞은 것은?
        options:
          - 높은 절벽 사이로 바닷물이 깊숙이 들어와 있다
          - 넓은 모래사장이 펼쳐져 있다
          - 누런 흙탕물이 흐른다
          - 원뿔 모양의 화산이 솟아 있다
        answer: 높은 절벽 사이로 바닷물이 깊숙이 들어와 있다
        explain: 피오르는 높은 절벽 사이로 바닷물이 좁고 길게 들어와 있는 해안 지형이에요.
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/portcampbell
        q: 포트 캠벨 국립 공원에서 볼 수 있는 모습은?
        options:
          - 바다 위에 홀로 서 있는 바위 기둥들
          - 강물이 떨어지는 거대한 폭포
          - 빙하로 덮인 높은 산봉우리
          - 끝없이 이어진 모래 언덕
        answer: 바다 위에 홀로 서 있는 바위 기둥들
        explain: 파도가 절벽을 깎고 남은 바위 기둥들이에요. '열두 사도 바위'라고 불러요.
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/sahara
        q: 사진 속 사하라 사막의 특징으로 알맞은 것은?
        options:
          - 비가 거의 내리지 않아 모래 언덕이 넓게 펼쳐져 있다
          - 일 년 내내 눈과 얼음으로 덮여 있다
          - 큰 강이 숲 사이를 굽이쳐 흐른다
          - 밀물과 썰물 때 갯벌이 드러난다
        answer: 비가 거의 내리지 않아 모래 언덕이 넓게 펼쳐져 있다
      - type: multi
        lv: C
        std: 6사10-01
        cat: 지식·이해
        q: 지형에 따라 사람들의 생활 모습은 어떻게 다를까요? 알맞은 것을 모두 고르세요.
        hint: 사람들은 자기가 사는 곳의 자연환경에 맞추어 살아가요.
        options:
          - 높은 산지에서는 비탈에 계단식 밭을 만들기도 한다
          - 큰 강 주변에서는 강물을 끌어와 농사를 짓는다
          - 아름다운 해안에는 관광객이 많이 찾아온다
          - 세계 어디서나 사람들은 똑같은 모습으로 살아간다
        answers:
          - 높은 산지에서는 비탈에 계단식 밭을 만들기도 한다
          - 큰 강 주변에서는 강물을 끌어와 농사를 짓는다
          - 아름다운 해안에는 관광객이 많이 찾아온다
        explain: 지형이 다르면 사람들의 생활 모습도 달라요. 그래서 세계에는 다양한 삶의 모습이 있어요.

      # ───── 🔎 조사하기 (B) ─────
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/sognefjord
        q: 송네 피오르는 어떻게 만들어졌을까요?
        options:
          - 빙하가 깎아 만든 골짜기에 바닷물이 들어와서
          - 강물이 실어 온 흙이 바닷가에 쌓여서
          - 화산이 폭발해 바다가 움푹 꺼져서
          - 바람이 모래를 날라 와 쌓여서
        answer: 빙하가 깎아 만든 골짜기에 바닷물이 들어와서
        collect: [sognefjord]
        explain: 아주 오래전 빙하가 땅을 U자 모양으로 깊게 깎았고, 빙하가 녹은 뒤 그 골짜기에 바닷물이 들어왔어요.
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/huanghe
        q: 황허강 물이 누렇게 보이는 까닭은 무엇일까요?
        options:
          - 누런 흙(황토)이 쌓인 고원을 지나며 흙을 많이 싣고 흐르기 때문에
          - 강바닥에 누런 모래가 깔려 있기 때문에
          - 강물이 매우 차갑기 때문에
          - 바닷물이 거꾸로 들어오기 때문에
        answer: 누런 흙(황토)이 쌓인 고원을 지나며 흙을 많이 싣고 흐르기 때문에
        collect: [huanghe]
        explain: "'황허'는 누런 강이라는 뜻이에요. 황토 고원의 흙이 강물에 많이 섞여 흘러요."
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/maunaloa
        q: 마우나로아의 생김새를 바르게 설명한 것은?
        options:
          - 묽은 용암이 여러 번 흘러 쌓여 경사가 완만하고 넓게 퍼진 화산이다
          - 빙하가 깎아 만든 뾰족한 봉우리다
          - 파도가 깎아 만든 바위 절벽이다
          - 바람에 날린 모래가 쌓인 언덕이다
        answer: 묽은 용암이 여러 번 흘러 쌓여 경사가 완만하고 넓게 퍼진 화산이다
        collect: [maunaloa]
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/fundy
        q: 펀디만에서 썰물 때 넓은 갯벌과 바위 아랫부분이 드러나는 까닭은?
        options:
          - 밀물과 썰물의 바닷물 높이 차이가 매우 커서
          - 일 년 내내 비가 내리지 않아서
          - 바다가 얼어붙어서
          - 화산이 바닷속에서 솟아올라서
        answer: 밀물과 썰물의 바닷물 높이 차이가 매우 커서
        collect: [fundy]
        explain: 펀디만은 밀물과 썰물 때 바닷물 높이 차이가 가장 클 때 15m가 넘어요. 세계에서 가장 큰 편이에요.
      - type: pin
        lv: B
        std: 6사10-01
        cat: 과정·기능
        q: 나일강 평야는 세계 지도에서 어디일까요? 알맞은 번호를 눌러 보세요.
        hint: 나일강은 아프리카 북동쪽 사막을 지나 지중해로 흘러가요.
        pins: [nile, amazon, huanghe, sognefjord]
        answer: nile
        collect: [nile]
      - type: pin
        lv: B
        std: 6사10-01
        cat: 과정·기능
        q: 히말라야산맥은 세계 지도에서 어디일까요?
        hint: 히말라야산맥은 아시아 대륙의 가운데쯤, 인도의 북쪽에 있어요.
        pins: [parinacota, himalaya, abyssinia, horseshoe]
        answer: himalaya
        collect: [himalaya]
      - type: pin
        lv: B
        std: 6사10-01
        cat: 과정·기능
        q: 포트 캠벨 국립 공원은 세계 지도에서 어디일까요?
        hint: 포트 캠벨 국립 공원은 오스트레일리아 대륙의 남쪽 바닷가에 있어요.
        pins: [elarco, victoria, fundy, portcampbell]
        answer: portcampbell
        collect: [portcampbell]
      - type: sort
        lv: B
        std: 6사10-01
        cat: 지식·이해
        q: 조사한 생활 모습을 알맞은 지형에 나누어 담아 보세요.
        bins: [산지, 하천, 해안]
        items:
          - { text: 비탈에 계단식 밭을 만들고 야크를 길러요, bin: 산지 }
          - { text: 기둥 위에 집을 짓고 배를 타고 다녀요, bin: 하천 }
          - { text: 유람선 관광객을 맞이하고 연어를 길러요, bin: 해안 }
          - { text: 라마와 알파카의 털로 옷감을 만들어요, bin: 산지 }
          - { text: 강물을 끌어와 사막 한가운데서 농사를 지어요, bin: 하천 }
          - { text: 썰물 때 바다 밑을 걸어 보는 관광을 해요, bin: 해안 }
        explain: 사람들은 산지·하천·해안의 특징을 이용하거나 어려움을 이겨 내며 서로 다른 모습으로 살아가요.

      # ───── 🏅 분석하기 (A) ─────
      - type: multi
        lv: A
        std: 6사10-01
        cat: 과정·기능
        photos: [landforms/sognefjord, landforms/fundy]
        q: 송네 피오르와 펀디만 갯벌은 모두 해안 지형이에요. 두 곳을 비교해 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 송네 피오르는 빙하가 깎은 골짜기에 바닷물이 들어와 생겼다
          - 펀디만은 밀물과 썰물 때 물 높이 차이가 커서 갯벌이 넓게 드러난다
          - 두 곳 모두 특별한 경관 덕분에 관광객이 찾아온다
          - 두 곳 모두 파도가 모래를 쌓아 만든 해변이다
        answers:
          - 송네 피오르는 빙하가 깎은 골짜기에 바닷물이 들어와 생겼다
          - 펀디만은 밀물과 썰물 때 물 높이 차이가 커서 갯벌이 넓게 드러난다
          - 두 곳 모두 특별한 경관 덕분에 관광객이 찾아온다
        collect: [sognefjord, fundy]
      - type: choice
        lv: A
        std: 6사10-01
        cat: 과정·기능
        photos: [landforms/maunaloa, landforms/parinacota]
        q: 마우나로아(왼쪽)와 파리나코타 화산(오른쪽)의 생김새를 바르게 비교한 것은?
        options:
          - 마우나로아는 경사가 완만하고 넓게 퍼졌고, 파리나코타는 경사가 급한 원뿔 모양이다
          - 두 화산 모두 경사가 급한 원뿔 모양이다
          - 마우나로아는 원뿔 모양이고, 파리나코타는 넓고 평평하다
          - 두 화산 모두 바닷속에 잠겨 있다
        answer: 마우나로아는 경사가 완만하고 넓게 퍼졌고, 파리나코타는 경사가 급한 원뿔 모양이다
        collect: [maunaloa, parinacota]
        explain: 같은 화산이라도 생김새가 달라요. 마우나로아는 묽은 용암이 멀리 흘러 넓게 퍼졌어요.
      - type: sort
        lv: A
        std: 6사10-01
        cat: 과정·기능
        q: 무엇이 만든 지형일까요? 지형이 만들어진 까닭에 따라 분류해 보세요.
        hint: 깎으면 움푹 파이거나 구멍이 나고, 쌓으면 모래나 흙이 넓게 덮여요.
        bins: [파도가 깎아서, 파도가 쌓아서, 빙하가 깎아서]
        items:
          - { text: 엘 아르코, photo: landforms/elarco, bin: 파도가 깎아서 }
          - { text: 포트 캠벨 국립 공원, photo: landforms/portcampbell, bin: 파도가 깎아서 }
          - { text: 마케나 모래사장, photo: landforms/makena, bin: 파도가 쌓아서 }
          - { text: 송네 피오르, photo: landforms/sognefjord, bin: 빙하가 깎아서 }
        collect: [elarco, portcampbell, makena]
        explain: 엘 아르코의 아치와 포트 캠벨의 바위 기둥은 파도가 깎아 만들었고, 마케나 모래사장은 파도가 모래를 쌓아 만들었어요.
      - type: choice
        lv: A
        std: 6사10-01
