template: mission
style: shop
unit: soc-6-2-3
title: 지구촌 해결 캠페인 기획자
emoji: 📣
summary: 지구촌 문제로 어려움을 겪는 사람들의 이야기를 듣고, 문제의 원인과 이어진 실천 방법을 골라 캠페인을 기획해요.
story: 지구촌 위기 대응 본부에 도움 요청이 도착했어요! 문제의 원인을 살피고, 누구나 실천할 수 있는 해결 캠페인을 기획해 지구촌 친구들을 도와주세요.
lessons: ['11']
standards: [6사12-02]
minutes: 15
teacherGuide:
  - 11차시 '생각을 펼쳐요'에서 해요. 알맞은 실천 방법을 고르면 캠페인 이름·구호·알리는 방법을 적어 캠페인 카드로 저장할 수 있어요.
  - 저장한 캠페인 카드는 탐험 리포트에 모여요. 모둠별로 카드를 모아 포스터·영상 캠페인 활동으로 이어 가면 좋아요.
  - 실천 방법이 '문제의 원인과 이어져 있는지', '누구나 할 수 있는지'를 기준으로 서로 평가해 보게 해 주세요.
stages:
  - id: campaign
    title: 지구촌을 돕는 캠페인
    emoji: 📣
    lesson: '11'
    intro: 문제의 원인과 이어진 실천 방법으로 캠페인을 기획해요.
    steps:
      - type: shop
        lv: C
        std: 6사12-02
        cat: 지식·이해
        photo: global/plastic
        customer: { emoji: "🐢", name: "바다 연구원 하나 씨", place: "우리나라 남해안", says: "해변에 플라스틱 쓰레기가 자꾸 쌓여요. 바다 생물들이 위험해요." }
        q: 바다를 지키는 캠페인에 넣을 실천 방법을 모두 골라 보세요.
        features:
          - { text: "일회용 빨대·컵 대신 다회용품 쓰기", fit: true, why: "바다로 흘러가는 플라스틱 쓰레기를 줄여요." }
          - { text: "가족과 함께 해변 쓰레기 줍기", fit: true, why: "이미 쌓인 쓰레기를 치워 바다 생물을 보호해요." }
          - { text: "물건을 비닐봉지에 하나씩 따로 담기", fit: false, why: "플라스틱 쓰레기가 더 늘어나요." }
          - { text: "바닷가에서 쓴 쓰레기를 모래에 묻어 두기", fit: false, why: "쓰레기가 파도에 쓸려 바다로 들어가요." }
        planLabels: { title: "📣 캠페인 계획 세우기 (선택)", name: "캠페인 이름", slogan: "구호 (외치는 말)", when: "언제·어디서·어떻게 알릴까?", save: "캠페인 카드 저장", emoji: "📣" }
      - type: shop
        lv: C
        std: 6사12-02
        cat: 지식·이해
        photo: global/tuvalu
        customer: { emoji: "🏝️", name: "투발루의 친구 시오네", place: "투발루", says: "바닷물이 점점 높아져서 우리 집 앞마당까지 들어와요. 우리 섬이 사라질까 봐 걱정돼요." }
        q: 투발루 친구를 돕는 캠페인에 넣을 실천 방법을 모두 골라 보세요.
        features:
          - { text: "쓰지 않는 전등과 전자 제품 끄기", fit: true, why: "전기를 아끼면 온실가스가 줄어 기후 변화를 늦출 수 있어요." }
          - { text: "가까운 거리는 걷거나 자전거·대중교통 이용하기", fit: true, why: "자동차에서 나오는 온실가스를 줄여요." }
          - { text: "가까운 곳도 자동차로 다니기", fit: false, why: "온실가스가 더 많이 나와요." }
          - { text: "에어컨을 아주 세게 오래 켜기", fit: false, why: "전기를 많이 써서 온실가스가 늘어요." }
        planLabels: { title: "📣 캠페인 계획 세우기 (선택)", name: "캠페인 이름", slogan: "구호 (외치는 말)", when: "언제·어디서·어떻게 알릴까?", save: "캠페인 카드 저장", emoji: "📣" }

      - type: shop
        lv: B
        std: 6사12-02
        cat: 지식·이해
        photo: global/drought
        customer: { emoji: "💧", name: "물 부족 마을의 이장님", place: "가뭄이 이어지는 어느 마을", says: "몇 달째 비가 오지 않아 우물이 말랐어요. 아이들이 물을 길으러 먼 길을 다녀요." }
        q: 물이 부족한 마을을 돕는 캠페인에 넣을 실천 방법을 조사해 모두 골라 보세요.
        features:
          - { text: "우물과 빗물 저장 시설을 만드는 데 쓰일 모금 활동", fit: true, why: "마을이 스스로 물을 얻고 모아 둘 수 있게 도와요." }
          - { text: "물을 지원하는 국제기구·구호 단체 알리기", fit: true, why: "더 많은 사람이 함께 도울 수 있어요." }
          - { text: "우리도 물을 아껴 쓰는 습관 알리기", fit: true, why: "물은 모두가 함께 쓰는 소중한 자원이에요." }
          - { text: "남은 물을 마음껏 써도 된다고 알리기", fit: false, why: "물 부족 문제를 더 키울 수 있어요." }
        planLabels: { title: "📣 캠페인 계획 세우기 (선택)", name: "캠페인 이름", slogan: "구호 (외치는 말)", when: "언제·어디서·어떻게 알릴까?", save: "캠페인 카드 저장", emoji: "📣" }
      - type: shop
        lv: B
        std: 6사12-02
        cat: 지식·이해
        customer: { emoji: "🏫", name: "난민 학교 선생님", place: "국경 근처의 난민 캠프", says: "전쟁을 피해 온 아이들이 공부를 이어 가고 싶어 해요. 새로운 곳에서 친구도 사귀고 싶어 해요." }
        q: 난민 어린이를 돕는 캠페인에 넣을 실천 방법을 모두 골라 보세요.
        features:
          - { text: "학용품과 책 모으기", fit: true, why: "아이들이 공부를 이어 갈 수 있게 도와요." }
          - { text: "난민에 대한 잘못된 생각을 바로잡는 홍보", fit: true, why: "난민 친구들이 차별 없이 함께 지낼 수 있게 해요." }
          - { text: "난민을 돕는 국제기구 활동 알아보고 알리기", fit: true, why: "유엔 난민 기구처럼 난민을 돕는 기관이 있어요." }
          - { text: "난민 친구를 놀리는 말 퍼뜨리기", fit: false, why: "상처를 주고 차별을 키워요." }
        planLabels: { title: "📣 캠페인 계획 세우기 (선택)", name: "캠페인 이름", slogan: "구호 (외치는 말)", when: "언제·어디서·어떻게 알릴까?", save: "캠페인 카드 저장", emoji: "📣" }

      - type: shop
        lv: A
        std: 6사12-02
        cat: 과정·기능
        photo: global/deforestation
        customer: { emoji: "❓", name: "사진 속 숲의 이야기", place: "사진을 보고 문제를 알아내기", says: "우리 숲이 사라지고 있어요. 이곳에 살던 동물들도 갈 곳을 잃었어요." }
        q: 사진을 분석해 문제를 알아내고, 이 문제를 줄이는 캠페인 실천 방법을 모두 골라 보세요.
        hint: 숲이 왜 사라질까요? 나무와 땅은 무엇으로 쓰일까요?
        features:
          - { text: "숲을 해치지 않고 만든 제품인지 인증 표시 확인하기", fit: true, why: "숲을 지키는 기업의 상품을 고르면 숲 파괴를 줄일 수 있어요." }
          - { text: "종이를 아껴 쓰고 재생 종이 쓰기", fit: true, why: "나무를 베어 내는 양을 줄여요." }
          - { text: "나무 심기와 숲 보호 단체에 기부하기", fit: true, why: "사라진 숲을 되살리는 데 도움이 돼요." }
          - { text: "공책을 한 장씩만 쓰고 버리기", fit: false, why: "종이 낭비로 나무가 더 많이 필요해져요." }
        explain: 사진은 열대 우림을 베어 낸 모습이에요. 숲이 사라지면 기후 변화가 심해지고 많은 생물이 살 곳을 잃어요.
        planLabels: { title: "📣 캠페인 계획 세우기 (선택)", name: "캠페인 이름", slogan: "구호 (외치는 말)", when: "언제·어디서·어떻게 알릴까?", save: "캠페인 카드 저장", emoji: "📣" }
      - type: multi
        lv: A
        std: 6사12-02
        cat: 과정·기능
        q: 좋은 캠페인이 되려면 어떤 조건을 갖추어야 할까요? 분석해 모두 고르세요.
        options:
          - 실천 방법이 문제의 원인과 이어져 있다
          - 누구나 쉽게 따라 할 수 있다
          - 언제, 어디서, 무엇을 할지 구체적이다
          - 사람들을 겁주기만 하고 할 일은 알려 주지 않는다
        answers:
          - 실천 방법이 문제의 원인과 이어져 있다
          - 누구나 쉽게 따라 할 수 있다
          - 언제, 어디서, 무엇을 할지 구체적이다
      - type: choice
        lv: A
        std: 6사12-02
        cat: 과정·기능
        q: 우리 반 캠페인이 효과가 있었는지 알아보는 방법으로 가장 알맞은 것은?
        options:
          - 캠페인 전과 후에 실천한 친구 수나 쓰레기 양을 조사해 비교한다
          - 캠페인 포스터 색깔이 예쁜지만 본다
          - 아무것도 확인하지 않는다
        answer: 캠페인 전과 후에 실천한 친구 수나 쓰레기 양을 조사해 비교한다
