template: mission
style: detective
unit: soc-6-2-1
title: 기후 그래프 탐정
emoji: 🕵️
summary: 기온과 강수량 그래프를 단서로 세계 여러 도시의 기후를 밝혀내고, 기후에 맞춘 사람들의 생활을 추리해요.
story: 탐정 사무소에 그래프만 남긴 사건 파일이 도착했어요. 막대(강수량)와 꺾은선(기온)을 꼼꼼히 살펴 어느 기후인지, 사람들은 어떻게 사는지 밝혀 주세요.
lessons: ['9', '10', '11']
standards: [6사10-02]
minutes: 12
teacherGuide:
  - 사건 1(9차시 열대·건조), 사건 2(10차시 온대·냉대), 사건 3(11차시 한대·고산)으로 나뉘어 있어요.
  - 교과서 '두 도시 기후 그래프 비교'(쿠알라룸푸르·므완자), '세 도시 기후 그래프 비교'(런던·로마·서울) 활동을 게임으로 다시 해 볼 수 있어요.
  - 그래프 자료는 세계기상기구 기준 평년값(대부분 1991~2020년)이에요. 교과서 그래프와 숫자가 조금 다를 수 있어요.
  - 막대는 강수량(mm, 오른쪽 눈금), 빨간 꺾은선은 평균 기온(℃, 왼쪽 눈금)이에요. 처음에 함께 읽는 법을 짚어 주세요.
stages:
  # ════════════ 사건 1: 열대·건조 ════════════
  - id: tropical-dry
    title: '사건 1: 덥고 비가 많은 곳, 덥고 메마른 곳'
    emoji: 🌴
    lesson: '9'
    intro: 쿠알라룸푸르, 므완자, 카이로의 그래프를 조사해요.
    steps:
      - type: pickmonth
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: kualalumpur
        q: 쿠알라룸푸르에서 비가 가장 많이 내리는 달을 그래프에서 눌러 보세요.
        hint: 파란 막대가 강수량이에요. 막대가 가장 높은 달을 찾아보세요.
        answer: [11]
        explain: 11월에 약 356mm로 가장 많아요. 그래도 쿠알라룸푸르는 비가 가장 적은 6월에도 150mm 가까이 내려요.
      - type: choice
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: kualalumpur
        q: 쿠알라룸푸르의 기온은 일 년 동안 어떤가요?
        hint: 빨간 꺾은선의 높이가 달마다 얼마나 달라지는지 보세요.
        options:
          - 일 년 내내 27℃ 안팎으로 덥다
          - 겨울에는 0℃ 아래로 내려간다
          - 여름에만 덥고 나머지는 서늘하다
          - 일 년 내내 10℃보다 낮다
        answer: 일 년 내내 27℃ 안팎으로 덥다
      - type: pickmonth
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: mwanza
        q: 므완자에서 비가 가장 적게 내리는 달을 눌러 보세요.
        answer: [7]
        explain: 7월에는 약 5mm밖에 내리지 않아요. 므완자는 6~8월에 비가 아주 적어요.
      - type: choice
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: cairo
        q: 카이로의 그래프를 보고 알 수 있는 것은?
        options:
          - 일 년 내내 비가 거의 내리지 않는다
          - 여름에 비가 아주 많이 내린다
          - 일 년 내내 기온이 0℃보다 낮다
          - 달마다 비가 200mm씩 내린다
        answer: 일 년 내내 비가 거의 내리지 않는다
        explain: 카이로는 일 년 동안 내리는 비를 모두 더해도 25mm쯤이에요. 서울의 한 달 강수량보다도 훨씬 적어요.
      - type: multi
        lv: C
        std: 6사10-02
        cat: 지식·이해
        q: 덥고 비가 많은 열대 기후와 관련 있는 생활 모습을 모두 고르세요.
        options:
          - 바람이 잘 통하는 얇은 옷을 입는다
          - 바닥을 땅에서 띄워 지은 집에 산다
          - 두꺼운 털옷을 입는다
          - 눈과 얼음으로 집을 짓는다
        answers: [바람이 잘 통하는 얇은 옷을 입는다, 바닥을 땅에서 띄워 지은 집에 산다]

      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        chart: kualalumpur
        hideChartName: true
        q: 이 그래프는 어떤 기후일까요?
        options: [열대 기후, 건조 기후]
        answer: 열대 기후
      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        chart: kualalumpur
        hideChartName: true
        q: 열대 기후라고 판단한 근거로 가장 알맞은 것은?
        options:
          - 일 년 내내 기온이 높고 비가 많이 내린다
          - 겨울이 길고 매우 춥다
          - 비가 거의 내리지 않는다
          - 여름에만 비가 내린다
        answer: 일 년 내내 기온이 높고 비가 많이 내린다
        explain: 이 그래프는 쿠알라룸푸르(말레이시아)예요.
      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        chart: cairo
        hideChartName: true
        q: 이 그래프는 어떤 기후일까요? 그래프를 조사해 판단해 보세요.
        hint: 막대(강수량)가 거의 보이지 않아요.
        options: [건조 기후, 열대 기후]
        answer: 건조 기후
        explain: 이 그래프는 카이로(이집트)예요. 비가 거의 내리지 않아 나일강 물이 아주 중요해요.
      - type: choice
        lv: B
        std: 6사10-02
        cat: 지식·이해
        q: 열대 기후 지역에서 바닥을 땅에서 띄워 집을 짓는 까닭은?
        options:
          - 땅의 습기와 열기를 피하고 바람이 잘 통하게 하며, 벌레나 동물이 들어오지 않게 하려고
          - 눈이 쌓이지 않게 하려고
          - 모래바람을 막으려고
          - 추운 바람을 막으려고
        answer: 땅의 습기와 열기를 피하고 바람이 잘 통하게 하며, 벌레나 동물이 들어오지 않게 하려고
      - type: choice
        lv: B
        std: 6사10-02
        cat: 지식·이해
        q: 건조 기후 지역 사람들이 온몸을 가리는 헐렁하고 긴 옷을 입는 까닭은?
        options:
          - 강한 햇볕과 모래바람을 막고, 옷 안으로 바람이 통하게 하려고
          - 추위를 막으려고
          - 비에 젖지 않으려고
          - 물에 잘 뜨려고
        answer: 강한 햇볕과 모래바람을 막고, 옷 안으로 바람이 통하게 하려고
      - type: choice
        lv: B
        std: 6사10-02
        cat: 지식·이해
        q: 덥고 습한 열대 지역에서 향신료를 많이 넣은 음식이 발달한 까닭으로 알맞은 것은?
        hint: 9차시 [미디어 활동] '기후가 음식에 미치는 영향'을 떠올려 보세요.
        options:
          - 더운 날씨에 음식이 쉽게 상하는 것을 막고 입맛을 돋우려고
          - 추운 날씨에 몸을 녹이려고
          - 비가 오지 않아 물이 부족해서
          - 향신료가 눈 속에서만 자라서
        answer: 더운 날씨에 음식이 쉽게 상하는 것을 막고 입맛을 돋우려고

      - type: multi
        lv: A
        std: 6사10-02
        cat: 과정·기능
        charts: [kualalumpur, mwanza]
        q: 두 도시는 모두 열대 기후예요. 두 그래프를 비교해 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 두 도시 모두 일 년 내내 평균 기온이 20℃보다 높다
          - 쿠알라룸푸르는 일 년 내내 비가 많이 내린다
          - 므완자는 6~8월에 비가 거의 내리지 않는 시기(건기)가 있다
          - 므완자가 쿠알라룸푸르보다 기온이 더 높다
        answers:
          - 두 도시 모두 일 년 내내 평균 기온이 20℃보다 높다
          - 쿠알라룸푸르는 일 년 내내 비가 많이 내린다
          - 므완자는 6~8월에 비가 거의 내리지 않는 시기(건기)가 있다
        explain: 같은 열대 기후라도 비가 내리는 모습이 달라요. 므완자는 쿠알라룸푸르보다 기온이 5℃쯤 낮아요.
      - type: choice
        lv: A
        std: 6사10-02
        cat: 지식·이해
        chart: mwanza
        q: 므완자 그래프를 분석해 농부에게 알맞은 농사 계획을 세운다면?
        options:
          - 비가 많이 오는 시기에 씨를 뿌리고, 비가 거의 없는 6~8월에 대비해 물을 모아 둔다
          - 비가 가장 적은 7월에 물이 많이 필요한 벼를 새로 심는다
          - 일 년 내내 똑같이 농사를 짓는다
          - 겨울 추위에 대비해 비닐하우스를 짓는다
        answer: 비가 많이 오는 시기에 씨를 뿌리고, 비가 거의 없는 6~8월에 대비해 물을 모아 둔다
      - type: choice
        lv: A
        std: 6사10-02
        cat: 지식·이해
        charts: [kualalumpur, cairo]
        q: 쿠알라룸푸르와 카이로의 기후와 집의 관계를 가장 알맞게 탐구한 것은?
        options:
          - 쿠알라룸푸르는 비가 많아 비가 잘 흘러내리는 경사진 지붕이 알맞고, 카이로는 비가 거의 없어 평평한 지붕과 햇볕을 막는 두꺼운 벽이 알맞다
          - 두 도시 모두 눈이 많이 와서 지붕이 뾰족하다
          - 두 도시 모두 비가 많아서 바닥을 띄운다
          - 기후와 집 모양은 아무 관계가 없다
        answer: 쿠알라룸푸르는 비가 많아 비가 잘 흘러내리는 경사진 지붕이 알맞고, 카이로는 비가 거의 없어 평평한 지붕과 햇볕을 막는 두꺼운 벽이 알맞다
      - type: choice
        lv: A
        std: 6사10-02
        cat: 과정·기능
        charts: [kualalumpur, mwanza]
        q: 므완자는 해발 약 1,100m에 있어요. 므완자의 평균 기온이 쿠알라룸푸르보다 5℃쯤 낮은 까닭을 분석하면?
        options:
          - 높은 곳에 있을수록 기온이 낮아지기 때문에
          - 므완자에 비가 더 많이 오기 때문에
          - 므완자가 적도에서 아주 멀기 때문에
          - 므완자가 바닷가에 있기 때문에
        answer: 높은 곳에 있을수록 기온이 낮아지기 때문에
        explain: 이 생각은 사건 3의 '고산 기후'를 푸는 열쇠가 돼요!

  # ════════════ 사건 2: 온대·냉대 ════════════
  - id: temperate-cold
    title: '사건 2: 사계절이 있는 곳, 겨울이 긴 곳'
    emoji: 🍁
    lesson: '10'
    intro: 런던, 로마, 서울, 키루나의 그래프를 조사해요.
    steps:
      - type: pickmonth
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: seoul
        q: 서울에서 비가 가장 많이 내리는 달을 눌러 보세요.
        answer: [7]
        explain: 서울은 장마철인 7월과 8월에 비가 아주 많이 내려요.
      - type: pickmonth
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: rome
        q: 로마에서 비가 가장 적게 내리는 달을 눌러 보세요.
        answer: [7]
        explain: 로마는 서울과 반대로 여름에 비가 적어요.
      - type: choice
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: london
        q: 런던의 강수량 막대를 보고 알 수 있는 것은?
        options:
          - 일 년 내내 비가 비슷한 양으로 고르게 내린다
          - 여름에만 비가 아주 많이 내린다
          - 일 년 내내 비가 거의 내리지 않는다
          - 겨울에만 비가 내린다
        answer: 일 년 내내 비가 비슷한 양으로 고르게 내린다
      - type: pickmonth
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: kiruna
        q: 키루나에서 가장 추운 달을 눌러 보세요.
        hint: 빨간 꺾은선이 가장 낮은 달이에요.
        answer: [1]
      - type: choice
        lv: C
        std: 6사10-02
        cat: 과정·기능
        chart: kiruna
        q: 키루나의 겨울은 어떤가요?
        options:
          - 0℃보다 낮은 추운 날씨가 여러 달 동안 길게 이어진다
          - 겨울에도 25℃가 넘는다
          - 겨울이 한 달뿐이다
          - 겨울에 비가 가장 많이 온다
        answer: 0℃보다 낮은 추운 날씨가 여러 달 동안 길게 이어진다
        explain: 키루나는 10월부터 4월까지 일곱 달 동안 평균 기온이 0℃보다 낮아요.

      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        charts: [rome, seoul, london]
        hideChartName: true
        q: 런던·로마·서울의 그래프예요. 여름에 비가 아주 많이 내리는 그래프는 어느 것일까요?
        options: [그래프 가, 그래프 나, 그래프 다]
        answer: 그래프 나
        explain: 그래프 나는 서울이에요. 7~8월 장마와 태풍 때문에 비가 많아요.
      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        charts: [rome, seoul, london]
        hideChartName: true
        q: 여름에는 비가 적고 겨울에 비가 더 많은 그래프는 어느 것일까요?
        options: [그래프 가, 그래프 나, 그래프 다]
        answer: 그래프 가
        explain: 그래프 가는 로마예요. 여름이 덥고 건조해요.
      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        charts: [rome, seoul, london]
        hideChartName: true
        q: 일 년 내내 비가 고르게 내리고 여름에도 20℃를 넘지 않는 그래프는?
        options: [그래프 가, 그래프 나, 그래프 다]
        answer: 그래프 다
        explain: 그래프 다는 런던이에요. 여름이 서늘하고 겨울도 크게 춥지 않아요.
      - type: choice
        lv: B
        std: 6사10-02
        cat: 지식·이해
        chart: rome
        q: 로마 같은 곳에서 올리브와 포도를 많이 기르는 까닭은?
        options:
          - 여름이 덥고 건조해서 건조에 강한 나무를 기르기 알맞아서
          - 겨울에 눈이 많이 와서
          - 일 년 내내 비가 많이 와서
          - 일 년 내내 추워서
        answer: 여름이 덥고 건조해서 건조에 강한 나무를 기르기 알맞아서
      - type: choice
        lv: B
        std: 6사10-02
        cat: 지식·이해
        chart: seoul
        q: 우리나라에서 벼농사가 발달한 것과 관계있는 기후 특징은?
        options:
          - 여름에 기온이 높고 비가 많이 내린다
          - 여름에 비가 거의 내리지 않는다
          - 일 년 내내 눈이 쌓여 있다
          - 일 년 내내 기온이 같다
        answer: 여름에 기온이 높고 비가 많이 내린다
      - type: choice
        lv: B
        std: 6사10-02
