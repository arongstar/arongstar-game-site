template: bingo
unit: soc-6-2-3
title: 지구촌 탐험 빙고
emoji: 🎯
summary: 3단원에서 배운 인구와 지구촌 문제 낱말로 태블릿 빙고판을 채우고, 전자칠판의 설명을 보고 낱말을 맞혀 표시해요.
lessons: ['12']
standards: [6사12-01, 6사12-02]
minutes: 20
size: 4
teacherGuide:
  - 12차시 단원 정리 '교실 놀이'에서 해요. 전자칠판에는 이 화면을, 학생 태블릿에는 탐험 지도의 「내 빙고판」을 열어요.
  - 학생은 낱말 28개 가운데 16개를 골라 빙고판을 채워요. 설명을 보여 주고, 생각할 시간이 지나면 [정답 공개]를 눌러요.
words:
  - { word: "인구 분포", clue: "사람들이 지구 위 어디에 얼마나 모여 사는지 나타낸 모습이에요." }
  - { word: "아시아", clue: "세계 인구의 약 60%가 사는 대륙이에요." }
  - { word: "인구 밀도", clue: "일정한 넓이(1㎢)의 땅에 사는 사람의 수예요." }
  - { word: "인도", clue: "2023년쯤 중국을 넘어 세계에서 인구가 가장 많은 나라가 되었어요." }
  - { word: "자연환경", clue: "기후·지형·강처럼 자연이 만든 환경으로, 인구 분포에 영향을 줘요." }
  - { word: "인문환경", clue: "일자리·교통·시설처럼 사람이 만든 환경이에요." }
  - { word: "저출산", clue: "아이를 적게 낳는 것이에요." }
  - { word: "고령화", clue: "전체 인구 가운데 노인(65세 이상)의 비율이 높아지는 것이에요." }
  - { word: "초고령 사회", clue: "65세 이상 인구가 20%를 넘은 사회로, 우리나라는 2024년에 들어섰어요." }
  - { word: "합계 출산율", clue: "여성 한 명이 평생 낳을 것으로 예상되는 아이의 수예요." }
  - { word: "인구 급증", clue: "짧은 기간에 인구가 아주 빠르게 늘어나는 것이에요." }
  - { word: "도시 집중", clue: "일자리와 시설을 찾아 사람들이 도시로 몰려드는 것이에요." }
  - { word: "기후 변화", clue: "온실가스가 늘어 지구의 기온이 오르고 날씨가 크게 달라지는 것이에요." }
  - { word: "온실가스", clue: "석탄·석유를 태울 때 많이 나와 지구를 덥게 만드는 기체예요." }
  - { word: "해수면 상승", clue: "빙하가 녹아 바닷물 높이가 올라가는 것으로, 투발루 같은 섬나라가 위협받아요." }
  - { word: "사막화", clue: "비가 오랫동안 내리지 않아 땅이 메마르고 사막처럼 변하는 것이에요." }
  - { word: "열대 우림 파괴", clue: "아마존 같은 숲을 넓게 베어 내 생물이 살 곳을 잃고 기후 변화가 심해지는 문제예요." }
  - { word: "플라스틱 쓰레기", clue: "바다로 흘러가 바다 생물을 위협하는 쓰레기예요." }
  - { word: "난민", clue: "전쟁이나 박해를 피해 자기 나라를 떠나 다른 나라로 간 사람이에요." }
  - { word: "빈곤", clue: "먹을 것·물·집처럼 살아가는 데 꼭 필요한 것이 부족한 상태예요." }
  - { word: "국제기구", clue: "여러 나라 정부가 함께 만들어 지구촌 문제를 해결하는 단체예요." }
  - { word: "국제 연합", clue: "세계 평화와 지구촌 문제 해결을 위해 만든 가장 큰 국제기구로, UN이라고도 해요." }
  - { word: "유니세프", clue: "세계 어린이들의 건강과 교육, 권리를 지키는 국제기구예요." }
  - { word: "비정부 기구", clue: "시민들이 자발적으로 만든 단체로, NGO라고도 해요." }
  - { word: "지속가능한 발전", clue: "미래 세대가 쓸 자원과 환경을 해치지 않으면서 지금 필요한 것을 채우는 발전이에요." }
  - { word: "지속가능발전목표", clue: "2015년 국제 연합이 정한, 2030년까지 함께 이루기로 한 17가지 목표예요." }
  - { word: "재생 에너지", clue: "햇빛·바람처럼 다시 만들어지고 온실가스를 적게 내보내는 에너지예요." }
  - { word: "세계 시민", clue: "지구촌 문제를 나의 문제로 여기고 함께 해결하려고 노력하는 사람이에요." }
