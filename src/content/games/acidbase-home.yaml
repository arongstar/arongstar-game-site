# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: sci-6-1-1
title: 우리 집 산·염기 찾기
emoji: 🏠
summary: 부엌과 욕실에서 산성 용액과 염기성 용액을 이용하는 예를 찾고, 그 성질과 관련지어 설명해요.
story: 우리 집 곳곳에 산성 용액과 염기성 용액이 숨어 있어요! 부엌과 욕실을 돌아다니며 찾아보세요.
lessons:
- '6'
- '7'
standards:
- 6과09-03
minutes: 15
teacherGuide:
- 6차시 「부엌과 욕실 탐험」, 7차시 「알맞게 골라 쓰기」 스테이지로 나뉘어 있어요.
- 생활 속 세제는 반드시 어른과 함께, 사용 설명서에 따라 쓰도록 지도해 주세요.
stages:
- id: find
  title: 부엌과 욕실 탐험
  emoji: 🍋
  lesson: '6'
  intro: 생활 속에서 산성 용액과 염기성 용액을 이용하는 예를 찾아요.
  steps:
  - type: choice
    lv: C
    std: 6과09-03
    cat: 지식·이해
    q: 그림처럼 생선 요리에 레몬즙을 뿌리는 것은 어떤 용액을 이용한 예일까요?
    options:
    - 산성 용액
    - 염기성 용액
    answer: 산성 용액
    photo: illust/ab-fish-lemon
  - type: choice
    lv: C
    std: 6과09-03
    cat: 지식·이해
    q: 그림처럼 머리카락 같은 것으로 막힌 하수구를 뚫는 하수구 세정제는 어떤 용액일까요?
    options:
    - 염기성 용액
    - 산성 용액
    answer: 염기성 용액
    photo: illust/ab-drain
    explain: 염기성 용액은 머리카락처럼 단백질이 들어 있는 물질을 녹이는 성질이 있어요.
  - type: sort
    lv: B
    std: 6과09-03
    cat: 지식·이해
    q: 생활 속 예를 이용하는 용액에 따라 나누어 보세요.
    bins:
    - 산성 용액을 이용
    - 염기성 용액을 이용
    items:
    - text: 식초로 생선 비린내 줄이기
      bin: 산성 용액을 이용
    - text: 변기용 세제로 변기 닦기
      bin: 산성 용액을 이용
    - text: 속이 쓰릴 때 제산제 먹기
      bin: 염기성 용액을 이용
    - text: 하수구 세정제로 막힌 하수구 뚫기
      bin: 염기성 용액을 이용
    - text: 표백제로 욕실 곰팡이 청소하기
      bin: 염기성 용액을 이용
  - type: choice
    lv: A
    std: 6과09-03
    cat: 지식·이해
    q: 생선 비린내는 염기성을 띤 물질 때문이에요. 생선에 레몬즙을 뿌리면 비린내가 줄어드는 까닭을 가장 알맞게 설명한 것은?
    options:
    - 산성인 레몬즙이 비린내를 내는 물질의 염기성을 약하게 하기 때문이다
    - 레몬즙이 생선을 익혀 주기 때문이다
    - 레몬즙도 염기성이라 비린내를 덮기 때문이다
    answer: 산성인 레몬즙이 비린내를 내는 물질의 염기성을 약하게 하기 때문이다
- id: use
  title: 알맞게 골라 쓰기
  emoji: 🧴
  lesson: '7'
  intro: 용액의 성질에 맞게 생활 도구를 골라 안전하게 써요.
  steps:
  - type: multi
    lv: C
    std: 6과09-03
    cat: 지식·이해
    q: 산성 용액을 이용하는 예를 모두 골라 보세요.
    options:
    - 생선에 식초나 레몬즙 뿌리기
    - 변기용 세제로 변기 닦기
    - 속이 쓰릴 때 제산제 먹기
    - 하수구 세정제 쓰기
    answers:
    - 생선에 식초나 레몬즙 뿌리기
    - 변기용 세제로 변기 닦기
  - type: choice
    lv: B
    std: 6과09-03
    cat: 지식·이해
    q: 위에서 나오는 위액은 산성이에요. 위액이 너무 많이 나와 속이 쓰릴 때 먹는 제산제는 어떤 성질을 이용한 것일까요?
    options:
    - 염기성 물질이 위액의 산성을 약하게 한다
    - 산성 물질이 위액을 더 강하게 한다
    - 제산제가 위를 차갑게 식힌다
    answer: 염기성 물질이 위액의 산성을 약하게 한다
    card:
      emoji: 💊
      title: 속이 쓰려요
      text: 급하게 많이 먹었더니 속이 쓰려요. 보건 선생님이 제산제를 주셨어요.
  - type: shop
    lv: A
    std: 6과09-03
    cat: 가치·태도
    q: 청소 도우미의 고민을 듣고, 용액의 성질을 알맞게 이용하는 방법을 모두 골라 보세요.
    customer:
      emoji: 🧽
      name: 우리 집 청소 도우미
      place: 욕실
      says: 세면대 하수구가 머리카락으로 막혔어요. 세제를 어떻게 써야 할지 모르겠어요.
    features:
    - text: 염기성인 하수구 세정제를 사용 설명서에 맞게 쓴다
      fit: true
      why: 염기성 용액은 단백질인 머리카락을 녹여요.
    - text: 고무장갑을 끼고 창문을 열어 환기한다
      fit: true
      why: 세제가 피부에 닿거나 냄새를 들이마시지 않도록 해요.
    - text: 여러 세제를 한꺼번에 섞어 더 세게 만든다
      fit: false
      why: 서로 다른 세제를 섞으면 해로운 기체가 생길 수 있어 위험해요.
    - text: 맨손으로 세정제를 만진다
      fit: false
      why: 피부가 상할 수 있어요.
    plan: false
