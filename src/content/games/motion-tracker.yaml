# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-2
title: 위치 추적자
emoji: 📍
summary: 좌표판 위에서 시간에 따라 물체의 위치가 어떻게 변하는지 관찰하고, 처음 위치와 나중 위치를 (가로, 세로)로 나타내요.
story: 운동회 날, 운동장의 모든 움직임을 기록하는 위치 추적 본부가 문을 열었어요! 시간 막대를 움직이며 무엇이 움직였는지 찾아보세요.
lessons:
- '2'
- '3'
standards:
- 6과10-01
minutes: 15
teacherGuide:
- 2차시 「무엇이 운동할까?」, 3차시 「좌표 평면에 나타내기」 스테이지로 나뉘어 있어요.
- 좌표판의 시간 막대를 움직이면 물체가 움직인 길이 점선으로 남아요.
- 교육과정에 따라 두 위치 사이의 거리는 구하지 않아요.
stages:
- id: moving
  title: 무엇이 운동할까?
  emoji: 🏃
  lesson: '2'
  intro: 운동하는 물체의 공통된 특징을 찾아요.
  steps:
  - type: multi
    lv: C
    std: 6과10-01
    cat: 지식·이해
    q: 운동장에서 운동하는 물체를 모두 골라 보세요.
    options:
    - 달리는 친구
    - 날아가는 공
    - 굴러가는 자전거 바퀴
    - 운동장 가의 나무
    - 교실의 칠판
    answers:
    - 달리는 친구
    - 날아가는 공
    - 굴러가는 자전거 바퀴
    card:
      emoji: 🏟️
      title: 운동회 날 운동장
      text: 친구들이 달리고, 공이 날아가고, 자전거가 지나가요. 나무와 학교 건물은 그 자리에 있어요.
  - type: choice
    lv: C
    std: 6과10-01
    cat: 지식·이해
    q: 운동하는 물체의 공통된 특징은 무엇일까요?
    options:
    - 시간이 지남에 따라 위치가 변한다
    - 색깔이 변한다
    - 크기가 커진다
    answer: 시간이 지남에 따라 위치가 변한다
  - type: choice
    lv: B
    std: 6과10-01
    cat: 과정·기능
    q: 시간 막대를 움직여 보세요. 3초 동안 운동한 것은 무엇일까요?
    options:
    - 강아지
    - 의자
    - 둘 다
    answer: 강아지
    track:
      title: 📍 강아지와 의자의 위치 변화
