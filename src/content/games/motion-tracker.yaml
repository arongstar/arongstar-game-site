  - type: choice
    lv: A
    std: 6과10-01
    cat: 과정·기능
    q: 시간 막대를 움직여 세 물체의 위치 변화를 보고, 가장 바르게 해석한 것을 골라 보세요.
    options:
    - 자동차와 고양이는 위치가 변했으므로 운동했고, 신호등은 위치가 변하지 않았으므로 운동하지 않았다
    - 자동차만 빠르게 움직였으므로 자동차만 운동했다
    - 세 물체 모두 같은 곳에 있으므로 운동하지 않았다
    answer: 자동차와 고양이는 위치가 변했으므로 운동했고, 신호등은 위치가 변하지 않았으므로 운동하지 않았다
