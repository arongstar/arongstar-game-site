- id: plane
  title: 좌표 평면에 나타내기
  emoji: 🗺️
  lesson: '3'
  intro: 물체의 처음 위치와 나중 위치를 (가로, 세로)로 나타내요.
  steps:
  - type: choice
    lv: C
    std: 6과10-01
    cat: 과정·기능
    q: 굴러가는 공의 처음 위치(0초)는 어디일까요?
    options:
    - (1, 1)
    - (5, 3)
    - (0, 0)
    answer: (1, 1)
    track: &id002
      title: 📍 굴러가는 공의 위치 변화
      w: 7
      h: 5
      times: *id001
      items:
      - label: 공
        emoji: ⚽
        pos:
        - - 1
          - 1
        - - 2
          - 2
        - - 3
          - 2
        - - 5
          - 3
  - type: choice
    lv: B
    std: 6과10-01
    cat: 과정·기능
    q: 시간 막대를 끝까지 움직여 보세요. 3초 뒤 공의 나중 위치는 어디일까요?
    options:
    - (5, 3)
    - (3, 5)
    - (1, 1)
    answer: (5, 3)
    track: *id002
    hint: 가로 숫자를 먼저, 세로 숫자를 나중에 읽어요.
  - type: choice
    lv: B
    std: 6과10-01
    cat: 과정·기능
    q: 개미가 0초에 (2, 1)에 있다가 3초 뒤에 (2, 4)에 있었어요. 개미는 어느 쪽으로 움직였을까요?
    options:
    - 세로 방향으로 위쪽
    - 가로 방향으로 오른쪽
    - 움직이지 않았다
    answer: 세로 방향으로 위쪽
    card:
      emoji: 🐜
      title: 개미의 기록
      text: '0초: (2, 1) → 3초: (2, 4)'
  - type: choice
    lv: A
    std: 6과10-01
    cat: 과정·기능
    q: 민수와 지아의 위치 변화를 보고 가장 바르게 설명한 것을 골라 보세요.
    options:
    - 민수는 가로 방향으로 위치가 변했으므로 운동했고, 지아는 위치가 변하지 않았다
    - 두 사람 모두 위치가 변했다
    - 지아가 민수보다 더 많이 운동했다
    answer: 민수는 가로 방향으로 위치가 변했으므로 운동했고, 지아는 위치가 변하지 않았다
