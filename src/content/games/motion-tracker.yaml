  - type: multi
    lv: A
    std: 6과10-01
    cat: 과정·기능
    q: 물체의 위치 변화를 좌표 평면에 나타내면 좋은 점을 모두 골라 보세요.
    options:
    - 처음 위치와 나중 위치를 정확하게 비교할 수 있다
    - 다른 사람에게 위치 변화를 똑같이 전할 수 있다
    - 물체가 운동했는지 쉽게 알 수 있다
    - 물체의 무게를 알 수 있다
    answers:
