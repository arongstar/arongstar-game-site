    - 아시아
    - 유럽
    - 아프리카
    - 오세아니아
    items:
    - text: 면적이 가장 넓고 인구가 가장 많은 대륙
      bin: 아시아
    - text: 아시아와 땅이 이어져 있고 작은 나라들이 많이 모여 있는 대륙
      bin: 유럽
    - text: 적도가 대륙의 가운데를 지나는 대륙
      bin: 아프리카
    - text: 6대륙 가운데 면적이 가장 좁은 대륙
      bin: 오세아니아
  - type: pin
    lv: B
    std: 6사09-02
    cat: 과정·기능
    q: 아시아, 아프리카, 오세아니아 대륙으로 둘러싸인 인도양을 찾아보세요.
    pins:
    - indian
    - pacific
    - atlantic
    - southern
    answer: indian
  - type: choice
    lv: A
    std: 6사09-02
    cat: 과정·기능
    q: 우리나라에서 배를 타고 태평양을 건너 계속 동쪽으로 가면 닿는 대륙은?
    options:
    - 북아메리카
    - 아프리카
    - 유럽
    answer: 북아메리카
  - type: multi
    lv: A
    std: 6사09-02
    cat: 과정·기능
    q: 태평양과 맞닿아 있는 대륙을 모두 골라 보세요.
    options:
    - 아시아
    - 오세아니아
    - 북아메리카
    - 남아메리카
    - 아프리카
    - 유럽
    answers:
    - 아시아
    - 오세아니아
    - 북아메리카
    - 남아메리카
    hint: 세계지도에서 태평양을 둘러싼 땅을 하나씩 짚어 보세요.
