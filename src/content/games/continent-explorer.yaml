# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: soc-6-1-3
title: 대륙과 대양 탐험
emoji: 🧭
summary: 세계지도에서 6대륙과 5대양을 찾고, 대륙별로 어떤 나라들이 있는지 알아봐요.
story: 탐험선이 여섯 대륙과 다섯 대양을 모두 지나는 세계 일주를 시작했어요! 지도에서 대륙과 바다를 찾아 항해 일지를 채워 보세요.
lessons:
- '4'
- '5'
standards:
- 6사09-02
minutes: 15
teacherGuide:
- 4차시 「대륙과 대양」, 5차시 「대륙별 여러 나라」 스테이지예요.
- 대륙은 6대륙(아시아·유럽·아프리카·북아메리카·남아메리카·오세아니아), 대양은 5대양(태평양·대서양·인도양·북극해·남극해)으로 다뤄요. 남극 대륙은 지도 아래쪽이 잘려 있어 핀으로 다루지 않아요.
stages:
- id: continents
  title: 대륙과 대양
  emoji: 🌊
  lesson: '4'
  intro: 세계의 대륙과 대양을 찾아요.
  steps:
  - type: pin
    lv: C
    std: 6사09-02
    cat: 과정·기능
    q: 세계지도에서 아프리카 대륙을 찾아보세요.
    pins:
    - africa
    - asia
    - s-america
    - oceania
    answer: africa
  - type: pin
    lv: C
    std: 6사09-02
    cat: 과정·기능
    q: 세계에서 가장 넓은 바다인 태평양을 찾아보세요.
    pins:
    - pacific
    - atlantic
    - indian
    - arctic
    answer: pacific
  - type: sort
    lv: B
    std: 6사09-02
    cat: 지식·이해
    q: 설명에 알맞은 대륙을 짝지어 보세요.
