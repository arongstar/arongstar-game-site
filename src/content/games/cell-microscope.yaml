# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-3
title: 현미경 세포 탐험
emoji: 🔬
summary: 현미경 사용 순서를 익히고, 가상 현미경으로 양파 표피 세포를 40배·100배·400배로 관찰하며 핵, 세포막, 세포벽을 찾아요.
story: 양파 껍질 속에 아주 작은 방들이 숨어 있대요! 현미경으로 들여다보며 생물을 이루는 기본 단위를 찾아보세요.
lessons:
- '2'
standards:
- 6과11-01
minutes: 15
teacherGuide:
- 2차시에 써요. 「현미경 다루기」에서 사용법을, 「양파 표피 세포 관찰」에서 가상 현미경 관찰을 해요.
- 실제 현미경 관찰 뒤 비교하는 활동으로 쓰면 좋아요. 학교 사정에 따라 만들어진 현미경 표본을 써도 돼요.
- 교육과정에 따라 세포의 구조는 핵, 세포막, 세포벽을 용어 수준에서만 다뤄요.
stages:
- id: scope
  title: 현미경 다루기
  emoji: 🔭
  lesson: '2'
  intro: 현미경을 바르게 사용하는 방법을 익혀요.
  steps:
  - type: choice
    lv: C
    std: 6과11-01
    cat: 지식·이해
    q: 생물을 이루고 있는 기본 단위를 무엇이라고 할까요?
    options:
    - 세포
    - 기관
    - 잎
    answer: 세포
  - type: choice
    lv: C
    std: 6과11-01
    cat: 과정·기능
    q: 그림처럼 현미경으로 양파 표피를 처음 관찰할 때 어떤 배율의 대물렌즈부터 쓸까요?
    options:
    - 가장 낮은 배율
    - 가장 높은 배율
    - 아무 배율이나
    answer: 가장 낮은 배율
    photo: illust/pl-microscope
    explain: 낮은 배율에서 넓게 보며 관찰할 곳을 찾은 뒤 배율을 높여요.
  - type: order
    lv: B
    std: 6과11-01
    cat: 과정·기능
    q: 현미경으로 관찰하는 순서대로 놓아 보세요.
    items:
    - 회전판을 돌려 배율이 가장 낮은 대물렌즈가 오게 한다
    - 전원을 켜고 빛의 양을 조절한다
    - 표본을 재물대 위에 올리고 집게로 고정한다
    - 옆에서 보며 조동 나사로 재물대를 올려 표본과 대물렌즈를 가깝게 한다
    - 접안렌즈로 보며 조동 나사로 재물대를 천천히 내려 물체를 찾는다
    - 미동 나사로 물체가 뚜렷하게 보이도록 조절한다
  - type: choice
    lv: A
    std: 6과11-01
    cat: 과정·기능
    q: 양파 표피 표본을 만들 때 덮개 유리를 한쪽부터 비스듬히 천천히 덮는 까닭은?
    options:
    - 공기 방울이 생기지 않게 하여 세포를 잘 관찰하기 위해서이다
    - 세포를 더 크게 보이게 하기 위해서이다
    - 양파 냄새가 나지 않게 하기 위해서이다
    answer: 공기 방울이 생기지 않게 하여 세포를 잘 관찰하기 위해서이다
  - type: choice
    lv: A
    std: 6과11-01
    cat: 과정·기능
    q: 양파 표피에 아이오딘 용액 같은 염색액을 떨어뜨리는 까닭은?
    options:
    - 세포의 핵 같은 구조가 잘 보이도록 물들이기 위해서이다
    - 세포를 살아 있게 하기 위해서이다
    - 양파 표피를 단단하게 하기 위해서이다
    answer: 세포의 핵 같은 구조가 잘 보이도록 물들이기 위해서이다
- id: cell
  title: 양파 표피 세포 관찰
  emoji: 🧅
  lesson: '2'
  intro: 가상 현미경의 배율을 바꾸며 세포를 관찰해요.
  steps:
  - type: choice
    lv: C
    std: 6과11-01
    cat: 과정·기능
    q: 현미경을 400배로 맞춰 보세요. 세포 안에 진하게 물든 둥근 것은 무엇일까요?
    options:
    - 핵
    - 세포벽
    - 공기 방울
    answer: 핵
    microscope: true
  - type: choice
    lv: B
    std: 6과11-01
    cat: 과정·기능
    q: 배율을 40배 → 100배 → 400배로 높여 보세요. 어떻게 달라지나요?
    options:
    - 보이는 세포의 수는 줄고, 세포 하나는 크게 보인다
    - 보이는 세포의 수가 늘고, 세포는 작게 보인다
    - 아무것도 달라지지 않는다
    answer: 보이는 세포의 수는 줄고, 세포 하나는 크게 보인다
    microscope: true
  - type: sort
    lv: B
    std: 6과11-01
    cat: 지식·이해
    q: 400배에서 [이름 보기]를 눌러 보세요. 설명에 알맞은 이름을 짝지어 보세요.
    bins:
    - 핵
    - 세포막
    - 세포벽
    items:
    - text: 세포 안에 있는 둥근 모양의 구조
      bin: 핵
    - text: 세포를 둘러싸고 있는 얇은 막
      bin: 세포막
    - text: 세포막 바깥을 둘러싸 식물 세포의 모양을 일정하게 해 주는 것
      bin: 세포벽
    microscope: true
  - type: choice
    lv: A
    std: 6과11-01
    cat: 지식·이해
    q: 현미경으로 본 양파 표피 세포는 모두 벽돌처럼 모양이 반듯하고 일정해요. 그 까닭으로 가장 알맞은 것은?
    options:
    - 식물 세포에는 세포막 바깥에 세포벽이 있기 때문이다
    - 세포에 핵이 있기 때문이다
    - 아이오딘 용액으로 물들였기 때문이다
    answer: 식물 세포에는 세포막 바깥에 세포벽이 있기 때문이다
    microscope: true
  - type: multi
    lv: A
    std: 6과11-01
    cat: 과정·기능
    q: 세포 관찰 결과를 정확하게 기록하는 방법을 모두 골라 보세요.
    options:
    - 관찰한 배율을 함께 적는다
    - 현미경으로 본 모습을 본 그대로 그린다
    - 관찰한 날짜와 관찰 대상을 적는다
    - 교과서 그림을 그대로 베낀다
    answers:
    - 관찰한 배율을 함께 적는다
    - 현미경으로 본 모습을 본 그대로 그린다
    - 관찰한 날짜와 관찰 대상을 적는다
