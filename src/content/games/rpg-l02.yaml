quests:
  - id: order
    title: 피자 가게 첫 손님
    emoji: 🍕
    lesson: '1'
    npc: rosa
    steps:
      - { t: talk, who: Rosa, text: "Welcome to Rosa's Pizza! Here's the menu." }
      - { t: talk, who: Rosa, text: "What would you like to have?" }
      - t: choose
        lv: [C]
        std: 6영01-03
        cat: 지식·이해
        q: Rosa 가 한 말 「What would you like to have?」의 뜻은 무엇인가요?
        options: ['무엇을 먹고 싶니?', '무엇을 좋아하니?', '배가 고프니?']
        answer: '무엇을 먹고 싶니?'
      - t: build
        lv: [B, A]
        std: 6영02-07
        q: 손님에게 먹고 싶은 음식을 묻는 질문을 만들어요.
        answer: "What would you like to have?"
        extra: [like, do]
        ko: 무엇을 먹고 싶니?
      - t: choose
        std: 6영01-04
        q: 🔊 Ken 이 주문했어요. Ken 이 먹고 싶은 음식은 무엇인가요?
        say:
          - { who: Rosa, text: "What would you like to have?" }
          - { who: Ken, text: "I'd like to have a potato pizza, please." }
        script: true
        options: ['🥔🍕 감자 피자', '🍗🥪 치킨 샌드위치', '🍅🍝 토마토 스파게티']
        answer: '🥔🍕 감자 피자'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: 🔊 Sora 와 Leo 가 주문했어요. 두 사람이 주문한 음식을 바르게 고른 것은? (대본 없이 들어요)
        say:
          - { who: Rosa, text: "What would you like to have?" }
          - { who: Sora, text: "I'd like to have a fruit salad, please." }
          - { who: Leo, text: "I'd like to have a beef steak, please." }
        options: ['Sora — 과일 샐러드, Leo — 소고기 스테이크', 'Sora — 소고기 스테이크, Leo — 과일 샐러드', 'Sora — 과일 샐러드, Leo — 치킨 샌드위치']
        answer: 'Sora — 과일 샐러드, Leo — 소고기 스테이크'
      - t: speak
        std: 6영02-01
        q: 이제 내 차례! Rosa 에게 치킨 샌드위치를 주문해요.
        target: "I'd like to have a chicken sandwich, please."
        who: Sora
        stress: [chicken, sandwich]
        tone: down
        tip: please 앞에서 살짝 쉬고, 부드럽게 말해요.
      - { t: spell, lv: [C], std: 6영02-02, word: pizza, emoji: 🍕 }
      - { t: spell, lv: [B, A], std: 6영02-02, word: steak, emoji: 🍖 }
      - { t: talk, who: Rosa, text: "Here you are. Enjoy your meal!" }
  - id: taste
    title: 아이스크림 맛 평가단
    emoji: 🍦
    lesson: '2'
    npc: joe
    steps:
      - { t: talk, who: Mr. Joe, text: "Hello! I made new ice cream today." }
      - { t: talk, who: Mr. Joe, text: "Can you try it? How does it taste?" }
      - t: choose
        std: 6영01-03
        cat: 지식·이해
        q: 🍋 레몬 아이스크림을 먹었어요. 알맞은 맛 표현을 골라요.
        options: ["It's sour.", "It's salty.", "It's spicy."]
        answer: "It's sour."
        optionsAudio: true
      - t: choose
        std: 6영01-04
        q: 🔊 Mina 가 맛을 말했어요. 초콜릿 아이스크림은 어떤 맛인가요?
        say:
          - { who: Mr. Joe, text: "How is the chocolate ice cream?" }
          - { who: Mina, text: "Mmm, it's sweet. I love it!" }
        options: ['😋 달콤해요', '🧂 짜요', '🌶️ 매워요']
        answer: '😋 달콤해요'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: 🔊 Ken 은 어떤 아이스크림을 먹었고, 맛이 어땠나요?
        say:
          - { who: Ken, text: "I tried the cheese ice cream." }
          - { who: Ken, text: "It's a little salty, but it's delicious!" }
        options: ['치즈 맛 — 조금 짜지만 맛있어요', '치즈 맛 — 너무 시어요', '복숭아 맛 — 달콤해요']
        answer: '치즈 맛 — 조금 짜지만 맛있어요'
      - t: build
        lv: [B, A]
        std: 6영02-02
        q: 🌶️ 그림을 보고, 맛을 나타내는 문장을 만들어요.
        answer: "It's spicy."
        extra: [sweet]
        ko: 매워요.
        listen: false
      - t: speak
        std: 6영02-01
        q: Mr. Joe 에게 맛을 말해 줘요.
        target: "It's sweet. I love it!"
        who: Mina
        stress: [sweet, love]
        tone: down
      - { t: spell, lv: [C, B], std: 6영02-02, word: sour, emoji: 😖 }
      - { t: spell, lv: [A], std: 6영02-02, word: salty, emoji: 🧂 }
      - { t: talk, who: Mr. Joe, text: "Thank you! You are a great taster." }
  - id: menu
    title: 빵집 메뉴판과 ch 소리
    emoji: 📋
    lesson: '3'
    npc: mina
    steps:
      - { t: talk, who: Mina, text: "I'm making a menu for the bakery. Can you read it?" }
      - t: read
        title: 📋 Mina's Bakery Menu
        lines:
          - { text: "Cheese bread — salty and soft" }
          - { text: "Chocolate cookie — sweet" }
          - { text: "Chicken sandwich — for lunch" }
          - { text: "Peach juice — sweet and cold" }
      - t: choose
        std: 6영01-04
        q: 메뉴판에서 점심으로 먹기 좋다고 한 음식은 무엇인가요?
        options: ['🍗🥪 치킨 샌드위치', '🍫🍪 초콜릿 쿠키', '🍑🧃 복숭아 주스']
        answer: '🍗🥪 치킨 샌드위치'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: 치즈 빵은 어떤 맛이라고 했나요?
        options: [salty and soft, sweet and cold, sour]
        answer: salty and soft
      - { t: talk, who: Mina, text: "Cheese, chocolate, chicken, lunch, peach. They all have the ch sound!" }
      - t: choose
        std: 6영01-02
        q: 🔊 Mina 가 말한 낱말을 골라요.
        say: [{ who: Mina, text: "chip" }]
        options: [chip, ship, sip]
        answer: chip
        optionsAudio: true
        explain: ch 는 「취」처럼 /tʃ/ 소리가 나요.
      - t: choose
        lv: [B, A]
        std: 6영01-02
        q: ch /tʃ/ 소리가 들어 있지 않은 낱말은 무엇일까요?
        options: [lunch, peach, shop]
        answer: shop
        optionsAudio: true
      - { t: spell, lv: [C], std: 6영02-02, word: lunch, emoji: 🍱 }
      - { t: spell, lv: [B, A], std: 6영02-02, word: cheese, emoji: 🧀 }
      - t: build
        lv: [A]
        std: 6영02-03
        q: 대문자와 문장 부호에 주의하며 주문하는 문장을 만들어요.
        answer: "I'd like to have a peach juice, please."
        extra: [i'd, please.]
        ko: 복숭아 주스 주세요.
        listen: false
  - id: snacks
    title: 세계 간식 여행 엽서
    emoji: 🌏
    lesson: '4'
    npc: leo
    steps:
      - { t: talk, who: Leo, text: "My uncle travels around the world. He sent me a postcard about snacks!" }
      - t: read
        title: 📮 Snacks Around the World
        lines:
          - { text: "Hi, Leo! I'm eating snacks around the world." }
          - { text: "In Spain, I had churros. They're long and sweet." }
          - { text: "In Canada, I had poutine. It's fries with cheese. It's salty." }
          - { text: "In Korea, I had tteokbokki. It's spicy, but I love it!" }
          - { text: "What's your favorite snack?" }
      - t: choose
        std: 6영01-05
        q: 이 엽서는 무엇에 관한 글인가요?
        options: ['세계 여러 나라의 간식', '세계 여러 나라의 학교', '세계 여러 나라의 운동']
        answer: '세계 여러 나라의 간식'
      - t: choose
        std: 6영01-04
        q: 떡볶이(tteokbokki)는 어떤 맛이라고 했나요?
        options: ['🌶️ 매워요', '🍬 달콤해요', '😖 셔요']
        answer: '🌶️ 매워요'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: 감자튀김에 치즈를 얹은 짭짤한 간식(poutine)을 먹은 나라는?
        options: [Canada, Spain, Korea]
        answer: Canada
      - t: choose
        lv: [A]
        std: 6영01-04
        q: 츄러스(churros)를 설명한 말로 알맞은 것은?
        options: [long and sweet, round and salty, hot and spicy]
        answer: long and sweet
      - t: choose
        std: 6영01-10
        cat: 가치·태도
        q: 다른 나라 친구가 처음 보는 간식을 소개해 줬어요. 알맞은 태도는?
        options: ['어떤 맛인지 궁금해하며 이야기를 들어요.', '이상한 음식이라고 놀려요.']
        answer: '어떤 맛인지 궁금해하며 이야기를 들어요.'
        explain: 나라마다 즐겨 먹는 간식이 달라요. 서로의 음식 문화를 존중해요.
      - { t: talk, who: Leo, text: "My favorite snack is tteokbokki. What about you?" }
  - id: comic
    title: 주문 만화 완성하기
    emoji: 💬
    lesson: '5'
    npc: sora
    steps:
      - { t: talk, who: Sora, text: "I'm drawing a comic about a restaurant. Can you help me write the words?" }
      - t: read
        title: 💬 Sora's Comic
        lines:
          - { who: Rosa, text: "What would you like to have?" }
          - { who: Ken, text: "I'd like to have tomato spaghetti, please." }
          - { who: Ken, text: "Wow, it's delicious!" }
      - t: build
        lv: [C, B]
        std: 6영02-03
        q: 만화 첫 칸의 질문을 대문자와 물음표에 주의하며 만들어요.
        answer: "What would you like to have?"
        extra: [what]
        ko: 무엇을 먹고 싶니?
      - t: write
        std: 6영02-08
        q: Sora 의 만화를 참고하여 나의 주문 만화 대사를 써요.
        model: "What would you like to have? — I'd like to have tomato spaghetti, please. — Wow, it's delicious!"
        frame: "What would you like to have? — I'd like to have {food}, please. — Wow, it's {taste}!"
        title: 💬 나의 주문 만화
        fields:
          - { id: food, label: 주문할 음식, bank: [a potato pizza, a chicken sandwich, a beef steak, tomato spaghetti, a fruit salad, lemon juice] }
          - { id: taste, label: 맛, bank: [sweet, salty, sour, spicy, delicious] }
      - { t: talk, who: Sora, text: "Great! Our comic is finished." }
