  - 차시마다 퀘스트가 하나씩 있어요(1차시 음식 주문 → 2차시 맛 표현 → 3차시 메뉴판 읽기·파닉스 ch → 4차시 세계 간식 글 → 5차시 주문 만화 쓰기). 6차시에는 Chef Tony 의 「요리 대회 — 주문 왕」(지역 대장)에 도전해요.
