  title: 요리 대회 — 주문 왕
  emoji: 👨‍🍳
  npc: tony
  intro: Chef Tony 의 요리 대회가 열렸어요! 손님들의 주문을 잘 듣고, 맛을 표현하고, 영어로 주문해서 음식 거리의 「주문 왕」이 되어 보세요. 하트 3개를 지켜요.
  win: 👑 음식 거리의 주문 왕!
  steps:
    - { t: talk, who: Chef Tony, text: "Welcome to the cooking contest! Listen to the orders carefully." }
    - t: choose
