# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: quizshow
unit: sci-6-1-2
title: 과학 퀴즈쇼 — 물체의 운동
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 위치 변화, 빠르기 비교, 속력, 교통안전을 정리해요.
lessons:
- '1'
- '8'
standards:
- 6과10-01
- 6과10-02
- 6과10-03
minutes: 20
teacherGuide:
- 1차시에는 생각 열기로, 8차시에는 단원 정리로 써요.
- 계산 문제는 계산기를 써도 좋아요.
categories:
- name: 위치 변화
  emoji: 📍
  items:
  - lv: C
    q: 시간에 따라 위치가 변하는 물체를 무엇이라고 할까요?
    answer: 운동하는 물체
  - lv: B
    q: 공이 (1, 1)에서 (5, 3)으로 움직였어요. 처음 위치는?
    answer: (1, 1)
  - lv: A
    q: 창밖의 나무가 움직이지 않는다고 판단한 근거를 말해 보세요.
    answer: 시간이 지나도 나무의 위치가 변하지 않았기 때문이에요.
- name: 빠르기 비교
  emoji: 🏁
  items:
  - lv: C
    q: 같은 거리를 달렸을 때 더 빠른 사람은 걸린 시간이 길까요, 짧을까요?
    answer: 짧아요.
  - lv: B
    q: 같은 시간 동안 이동했을 때 더 빠른 물체는?
    answer: 이동 거리가 더 긴 물체
  - lv: A
    q: 10초 동안 30 m를 간 킥보드와 50 m를 간 자전거 중 누가 더 빠른지 근거를 들어 말해 보세요.
    answer: 같은 시간 동안 더 먼 거리를 간 자전거가 더 빨라요.
- name: 속력
  emoji: ⏱️
  items:
  - lv: C
    q: 속력을 구하는 식은?
    answer: 이동 거리 ÷ 걸린 시간
  - lv: B
    q: 100 m를 20초에 달린 사람의 속력은?
    answer: 5 m/s
  - lv: A
    q: 40 m를 5초에 간 차와 90 m를 15초에 간 차 중 더 빠른 차는? 까닭도 말해 보세요.
    answer: 앞의 차예요. 속력이 8 m/s로 6 m/s보다 크기 때문이에요.
- name: 교통안전
  emoji: 🚸
  items:
  - lv: C
    q: 자동차가 갑자기 멈출 때 몸을 붙잡아 주는 안전장치는?
    answer: 안전띠
  - lv: B
    q: 도로에서 자동차의 속력을 줄이도록 높게 만든 장치는?
    answer: 과속 방지 턱
  - lv: A
    q: 어린이 보호 구역에서 자동차가 천천히 달려야 하는 까닭을 속력과 관련지어 말해 보세요.
    answer: 속력이 작을수록 멈출 때까지 이동하는 거리가 짧아 사고를 피하기 쉬워요.
