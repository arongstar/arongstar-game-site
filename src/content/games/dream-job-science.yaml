template: mission
style: shop
unit: sci-6-2-4
title: 꿈 직업 속 과학 찾기
emoji: 🧭
summary: 과학자가 아닌 다양한 꿈 직업 속에 숨어 있는 과학을 찾아내고, 나의 진로와 과학을 이어 '나의 진로 카드'를 만들어요.
story: 과학 탐험대의 마지막 임무! 요리사, 소방관, 미용사, 축구 선수… 여러 직업 속에 숨어 있는 과학을 찾아내고, 내가 꿈꾸는 직업에서도 과학을 찾아 주세요.
lessons: ['3']
standards: [6과16-02]
minutes: 15
teacherGuide:
  - 3차시에 해요. 교육과정에 따라 과학자 직업이 아니라 학생이 희망하는 다양한 직업을 기준으로 과학적 요소를 찾아요.
  - 이번 학기 과학(계절, 연소, 전기)과 6학년 1학기 과학에서 배운 내용이 직업 속에서 어떻게 쓰이는지 연결해요.
  - 마지막 문제에서 '나의 진로 카드'를 만들면 탐험 리포트에 모여요. 진로 발표 활동으로 이어 가면 좋아요.
stages:
  - id: jobs
    title: 직업 속 숨은 과학
    emoji: 🔍
    lesson: '3'
    intro: 여러 직업에서 쓰이는 과학을 찾아요.
    steps:
      - type: shop
        lv: C
        std: 6과16-02
        cat: 지식·이해
        customer: { emoji: "👨‍🍳", name: "요리사", place: "식당 주방", says: "맛있는 음식을 만들려면 불과 재료를 잘 다뤄야 해요." }
        q: 요리사의 일에 숨어 있는 과학을 모두 골라 보세요.
        features:
          - { text: "가스 불의 크기를 조절하는 연소의 원리", fit: true, why: "탈 물질과 산소의 양으로 불의 세기를 조절해요." }
          - { text: "기름에 불이 붙었을 때 뚜껑으로 덮어 끄는 방법", fit: true, why: "산소를 막아 불을 끄는 원리예요." }
          - { text: "재료를 익히면 성질이 달라지는 변화", fit: true, why: "익힌 고기는 다시 날고기로 돌아가지 않아요." }
          - { text: "별자리를 보고 계절을 아는 방법", fit: false, why: "요리사의 일과는 관계가 적어요." }
        planLabels: { title: "🧭 진로 카드 만들기 (선택)", name: "직업 이름", slogan: "이 직업 속 과학 한 줄 정리", when: "이 직업을 위해 지금 할 수 있는 준비", save: "진로 카드 저장", emoji: "🧭" }
      - type: shop
        lv: C
        std: 6과16-02
        cat: 지식·이해
        customer: { emoji: "🧑‍🚒", name: "소방관", place: "소방서", says: "불을 끄고 사람들을 안전하게 지키는 일을 해요." }
        q: 소방관의 일에 숨어 있는 과학을 모두 골라 보세요.
        features:
          - { text: "연소의 세 가지 조건을 알고 불을 끄는 방법", fit: true, why: "탈 물질·산소·온도 가운데 하나를 없애 불을 꺼요." }
          - { text: "전기 화재가 났을 때 먼저 전기를 차단하는 방법", fit: true, why: "전기 안전 지식이 필요해요." }
          - { text: "열과 연기를 막는 방화복의 소재", fit: true, why: "물질의 성질을 이용한 옷이에요." }
          - { text: "그림을 예쁘게 그리는 방법", fit: false, why: "소방관의 일과는 관계가 적어요." }
        planLabels: { title: "🧭 진로 카드 만들기 (선택)", name: "직업 이름", slogan: "이 직업 속 과학 한 줄 정리", when: "이 직업을 위해 지금 할 수 있는 준비", save: "진로 카드 저장", emoji: "🧭" }

      - type: sort
        lv: B
        std: 6과16-02
        cat: 지식·이해
        q: 직업과 그 직업에 숨어 있는 과학을 짝지어 보세요.
        bins: [미용사, 축구 선수, 웹툰 작가, 농부]
        items:
          - { text: "파마약과 염색약의 성질(산과 염기)", bin: "미용사" }
          - { text: "공을 차는 힘과 공의 빠르기(물체의 운동)", bin: "축구 선수" }
          - { text: "빛과 색, 디지털 기기를 움직이는 전기", bin: "웹툰 작가" }
          - { text: "계절에 따라 달라지는 기온과 낮의 길이", bin: "농부" }
          - { text: "식물이 잘 자라는 조건(식물의 구조와 기능)", bin: "농부" }
      - type: shop
        lv: B
        std: 6과16-02
        cat: 지식·이해
        customer: { emoji: "🎤", name: "가수", place: "공연장", says: "무대에서 노래를 부르고 사람들과 감동을 나누어요." }
        q: 가수의 일에 숨어 있는 과학을 모두 골라 보세요.
        features:
          - { text: "목소리를 크게 들려주는 마이크와 스피커(전자석 이용)", fit: true, why: "스피커 속에는 전자석이 들어 있어요." }
          - { text: "무대를 밝히는 조명과 전기 회로", fit: true, why: "전기가 흐르는 회로로 조명을 켜고 꺼요." }
          - { text: "목을 건강하게 지키는 몸의 원리", fit: true, why: "우리 몸에 대한 과학도 필요해요." }
          - { text: "고철을 옮기는 기중기 운전", fit: false, why: "가수의 일과는 관계가 적어요." }
        planLabels: { title: "🧭 진로 카드 만들기 (선택)", name: "직업 이름", slogan: "이 직업 속 과학 한 줄 정리", when: "이 직업을 위해 지금 할 수 있는 준비", save: "진로 카드 저장", emoji: "🧭" }

      - type: choice
        lv: A
        std: 6과16-02
        cat: 지식·이해
        q: 여러 직업 속 과학을 찾아보며 알게 된 것으로 가장 알맞은 것은?
        options:
          - 과학자가 아니어도 대부분의 직업이 과학과 관련되어 있어, 과학을 배우면 어떤 진로에서도 도움이 된다
          - 과학은 과학자에게만 필요하다
          - 과학과 관련된 직업은 몇 개뿐이다
        answer: 과학자가 아니어도 대부분의 직업이 과학과 관련되어 있어, 과학을 배우면 어떤 진로에서도 도움이 된다
      - type: shop
        lv: A
        std: 6과16-02
        cat: 과정·기능
        customer: { emoji: "🌟", name: "미래의 나", place: "내가 꿈꾸는 일터", says: "내가 꿈꾸는 직업에도 과학이 숨어 있을까요? 지금부터 무엇을 준비하면 좋을까요?" }
        q: 나의 꿈 직업과 과학을 이어 줄 준비로 알맞은 것을 모두 고른 뒤, 아래에 나의 진로 카드를 만들어 보세요.
        features:
          - { text: "내 꿈 직업에서 쓰이는 과학을 조사해 보기", fit: true, why: "직업 속 과학을 알면 준비할 것이 보여요." }
          - { text: "궁금한 것을 실험하고 기록하는 습관 기르기", fit: true, why: "어떤 직업에서든 문제를 해결하는 힘이 돼요." }
          - { text: "그 직업을 가진 사람을 인터뷰해 보기", fit: true, why: "실제로 어떤 과학 지식이 필요한지 알 수 있어요." }
          - { text: "과학은 내 꿈과 상관없으니 배우지 않기", fit: false, why: "대부분의 직업이 과학과 이어져 있어요." }
        planLabels: { title: "🧭 나의 진로 카드 만들기", name: "나의 꿈 직업", slogan: "이 직업 속에 숨어 있는 과학", when: "이 꿈을 위해 지금부터 할 준비", save: "진로 카드 저장", emoji: "🧭" }
