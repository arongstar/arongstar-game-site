template: quizshow
unit: soc-6-2-1
title: 탐험대 퀴즈쇼 1부 — 세계의 지형
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 100점은 살펴보기, 200점은 조사하기, 300점은 분석하기 문제예요.
lessons: [6~7]
standards: [6사10-01]
minutes: 20
teacherGuide:
  - 6~7차시 '재미있게 확인해요' 시간에 전자칠판에 띄워 진행해요. 모둠 수(2~6)를 고르고 시작해요.
  - 모둠이 차례로 칸을 고르면, 문제를 읽고 30초 동안 모둠끼리 의논한 뒤 말로 답해요.
  - 300점(분석하기) 문제는 정답이 하나가 아니에요. 근거를 들어 설명하면 점수를 주세요.
  - 반 전체 목표 게이지가 있어서, 모든 모둠의 점수를 합쳐 목표를 넘으면 함께 축하해요.
categories:
  - name: 산지
    emoji: ⛰️
    items:
      - lv: C
        photo: landforms/himalaya
        q: 세계에서 가장 높은 산들이 모여 있는 이 산맥의 이름은?
        answer: 히말라야산맥
      - lv: B
        photo: landforms/abyssinia
        q: 높고 위가 평평한 땅이라 열대 지역인데도 서늘해서 큰 도시가 발달한 에티오피아의 지형은?
        answer: 아비시니아고원
      - lv: A
        q: 산지 사람들이 비탈에 계단식 밭을 만드는 까닭을 설명해 보세요.
        answer: 가파른 비탈에 평평한 땅을 만들어 농사를 짓기 위해서예요. 흙이 빗물에 쓸려 내려가는 것도 막아 줘요.
  - name: 하천
    emoji: 🏞️
    items:
      - lv: C
        photo: landforms/victoria
        q: 잠베지강이 넓은 절벽 아래로 떨어지는 이 폭포는?
        answer: 빅토리아 폭포
      - lv: B
        q: 아마존강 주변 사람들이 집의 바닥을 높게 짓는 까닭은?
        answer: 강물이 불어날 때 집이 물에 잠기지 않게 하려고요.
      - lv: A
        q: 나일강 평야와 황허강 하류 평야의 공통점을 두 가지 말해 보세요.
        answer: 강이 실어 온 흙이 쌓인 기름진 평야예요. 그래서 일찍부터 농사와 문명이 발달했어요. (홍수 피해가 있었던 것도 공통점이에요.)
  - name: 해안
    emoji: 🌊
    items:
      - lv: C
        photo: landforms/elarco
        q: 파도가 바위를 깎아 만든 멕시코의 아치 모양 바위는?
        answer: 엘 아르코
      - lv: B
        photo: landforms/fundy
        q: 펀디만에서 썰물 때 바다 밑을 걸어 볼 수 있는 까닭은?
        answer: 밀물과 썰물 때 바닷물 높이 차이가 매우 크기 때문이에요.
      - lv: A
        q: 해안에 관광객이 많아질 때 생기는 좋은 점과 문제점을 하나씩 말해 보세요.
        answer: '좋은 점: 일자리와 소득이 늘어요. 문제점: 쓰레기가 늘고 자연이 훼손될 수 있어요. (근거를 들어 말하면 정답!)'
  - name: 사막·비교
    emoji: 🏜️
    items:
      - lv: C
        photo: landforms/sahara
        q: 세계에서 가장 넓은 열대 사막은?
        answer: 사하라 사막
      - lv: B
        q: 사하라 사막 사람들이 오아시스 주변에 모여 사는 까닭은?
        answer: 물을 얻을 수 있어서 대추야자를 기르고 생활할 수 있기 때문이에요.
      - lv: A
        q: 송네 피오르와 엘 아르코는 둘 다 무언가가 '깎아서' 만들었어요. 각각 무엇이 깎았는지 비교해 보세요.
        answer: 송네 피오르는 빙하가, 엘 아르코는 파도가 깎아서 만들었어요.
