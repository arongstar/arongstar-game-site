teacherGuide:
- 🧭 단계는 우리말 뜻과 소리를, 🔎 단계는 우리말 뜻만, 🏅 단계는 소리만 듣고 두 문장짜리 다리를 놓아요.
- 틀린 블록을 세 번 누르면 다음 낱말을 알려 줘요.
