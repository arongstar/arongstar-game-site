summary: 낱말 블록을 문장 순서대로 눌러 다리를 놓고 시냇물을 건너요. 대문자와 문장 부호 블록도 있어요.
story: 시냇물 건너편에 친구들이 기다려요! 낱말 블록으로 튼튼한 다리를 만들어 건너가 보세요.
