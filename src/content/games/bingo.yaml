template: bingo
unit: soc-6-2-1
title: 탐험 빙고
emoji: 🎯
summary: 단원에서 배운 낱말로 태블릿 빙고판을 채우고, 전자칠판의 설명을 보고 어떤 낱말인지 맞혀 표시해요.
lessons: ['14']
standards: [6사10-01, 6사10-02]
minutes: 20
size: 4
teacherGuide:
  - 14차시 '교실 놀이'에서 해요. 전자칠판에는 이 화면을, 학생 태블릿에는 탐험 지도의 「내 빙고판」을 열어요.
  - 학생은 낱말 28개 가운데 16개를 골라 빙고판을 채워요. (자동 채우기도 있어요)
  - 설명을 보여 주고 생각할 시간이 지나면 [정답 공개]를 눌러요. 그 낱말이 빙고판에 있는 학생만 표시해요.
  - 화면 오른쪽에 지금까지 나온 낱말이 쌓여요. "빙고!"를 외친 학생의 빙고판과 맞춰 보세요.
  - 생각 그물을 완성한 뒤 하면, 단원 낱말을 다시 떠올리는 정리 활동이 돼요.
words:
  - { word: "피오르", clue: "빙하가 깎아 만든 골짜기에 바닷물이 들어와 생긴 좁고 긴 바다예요." }
  - { word: "갯벌", clue: "썰물 때 드러나는 넓은 진흙 땅이에요. 펀디만에서는 이곳을 걸어 다닐 수 있어요." }
  - { word: "고원", clue: "높은 곳에 있으면서 위쪽이 넓고 평평한 땅이에요. 아비시니아에 있어요." }
  - { word: "화산", clue: "땅속의 용암이 뿜어져 나와 생긴 산이에요. 마우나로아와 파리나코타가 그 예예요." }
  - { word: "사막", clue: "비가 거의 내리지 않아 모래나 바위가 넓게 펼쳐진 곳이에요." }
  - { word: "오아시스", clue: "사막에서 물이 솟아 나무가 자라고 마을이 생기는 곳이에요." }
  - { word: "계단식 밭", clue: "가파른 비탈을 계단 모양으로 깎아 만든 밭이에요." }
  - { word: "고상 가옥", clue: "땅의 습기와 열기를 피하려고 바닥을 땅에서 띄워 지은 열대 지역의 집이에요." }
  - { word: "흙벽돌집", clue: "두꺼운 흙벽으로 뜨거운 햇볕과 열기를 막는 건조 기후 지역의 집이에요." }
  - { word: "폭포", clue: "강물이 높은 절벽 아래로 한꺼번에 떨어지는 곳이에요. 빅토리아가 유명해요." }
  - { word: "협곡", clue: "강이 오랫동안 땅을 깊게 깎아 만든 좁고 깊은 골짜기예요. 호스슈 벤드에서 볼 수 있어요." }
  - { word: "평야", clue: "강이 실어 온 흙이 쌓여 생긴 넓고 평평한 땅이에요. 나일강 주변에 있어요." }
  - { word: "관광 산업", clue: "아름다운 경관을 보러 오는 사람들을 맞이해 돈을 버는 산업이에요." }
  - { word: "열대 기후", clue: "일 년 내내 덥고 비가 많이 내리는 기후예요." }
  - { word: "건조 기후", clue: "비가 아주 적게 내리는 기후예요. 카이로가 속해요." }
  - { word: "온대 기후", clue: "사계절이 뚜렷한 기후로, 서울·런던·로마가 속해요." }
  - { word: "냉대 기후", clue: "겨울이 길고 매우 추우며 바늘잎나무 숲이 넓게 펼쳐진 기후예요." }
  - { word: "한대 기후", clue: "가장 따뜻한 달에도 평균 기온이 10℃가 되지 않는 아주 추운 기후예요." }
  - { word: "고산 기후", clue: "적도 가까이에 있어도 높은 곳이라 일 년 내내 봄처럼 서늘한 기후예요." }
  - { word: "강수량", clue: "비나 눈이 내린 양이에요. 기후 그래프에서 막대로 나타내요." }
  - { word: "기온", clue: "공기의 온도예요. 기후 그래프에서 꺾은선으로 나타내요." }
  - { word: "건기", clue: "비가 거의 내리지 않는 시기예요. 므완자는 6~8월이 이 시기예요." }
  - { word: "위도", clue: "적도에서 북쪽이나 남쪽으로 얼마나 떨어져 있는지를 나타내요. 높을수록 햇볕이 약해져요." }
  - { word: "라마", clue: "안데스산맥의 높고 추운 고원에서 기르는, 털이 많은 동물이에요." }
  - { word: "올리브", clue: "여름이 덥고 건조한 로마 같은 곳에서 많이 기르는 나무 열매예요." }
  - { word: "판초", clue: "고산 지역 사람들이 아침저녁 추위를 막으려고 걸치는 망토 모양의 옷이에요." }
  - { word: "오로라", clue: "키루나처럼 추운 북쪽 지역의 밤하늘에 나타나는 빛의 커튼이에요. 관광 상품이 되기도 해요." }
  - { word: "침엽수", clue: "바늘처럼 뾰족한 잎을 가진 나무로, 추운 냉대 기후 지역에 숲을 이뤄요." }
