template: mission
style: shop
unit: sci-6-2-2
title: 이산화 탄소 해결 캠페인
emoji: 🌱
summary: 연소로 생기는 이산화 탄소 때문에 피해를 입는 생태계 사례를 분석하고, 실천할 수 있는 해결책을 제안해 카드로 만들어 공유해요.
story: 연소 탐정이 밝혀낸 이산화 탄소가 지구 곳곳에서 문제를 일으키고 있어요! 피해 사례를 분석하고 모두가 실천할 수 있는 해결책을 제안해 주세요.
lessons: ['7', '8']
standards: [6과14-04]
minutes: 15
teacherGuide:
  - 7~8차시에 해요. 교육과정에 따라 연소 생성물 가운데 이산화 탄소로 인한 생태계 피해 사례를 중심으로 다뤄요.
  - 해결책 카드는 탐험 리포트에 모여요. 학급 누리집이나 패들렛 같은 곳에 카드를 올려 공유하는 활동으로 이어 가면 '제안하고 공유하기'까지 할 수 있어요.
  - 사회 3단원 「지구촌 사람들」의 기후 변화 내용과 연계할 수 있어요.
stages:
  - id: co2
    title: 이산화 탄소와 생태계
    emoji: 🌍
    lesson: '7'
    intro: 피해 사례를 분석하고 해결책을 제안해요.
    steps:
      - type: choice
        lv: C
        std: 6과14-04
        cat: 지식·이해
        q: 석탄·석유·가스 같은 연료가 탈 때 많이 생겨 지구의 기온을 높이는 기체는?
        options: [이산화 탄소, 산소, 수소]
        answer: 이산화 탄소
      - type: shop
        lv: C
        std: 6과14-04
        cat: 지식·이해
        photo: global/seaice
        customer: { emoji: "🐻‍❄️", name: "북극의 얼음 연구원", place: "북극 바다", says: "지구의 기온이 오르면서 바다 얼음이 녹고 있어요. 얼음 위에서 사냥하는 북극곰이 살 곳을 잃고 있어요." }
        q: 연소로 생기는 이산화 탄소를 줄이는 해결책을 모두 골라 보세요.
        features:
          - { text: "가까운 거리는 걷거나 자전거 타기", fit: true, why: "자동차가 연료를 태우며 내보내는 이산화 탄소를 줄여요." }
          - { text: "쓰지 않는 전등과 전자 제품 끄기", fit: true, why: "발전소에서 연료를 덜 태워도 돼요." }
          - { text: "난방 온도를 아주 높게 하기", fit: false, why: "연료를 더 많이 태우게 돼요." }
          - { text: "쓰레기를 마구 태우기", fit: false, why: "이산화 탄소와 해로운 물질이 더 많이 생겨요." }
        planLabels: { title: "🌱 해결책 카드 만들기 (선택)", name: "해결책 이름", slogan: "함께 외칠 구호", when: "어디에 어떻게 공유할까? (예: 학급 누리집, 게시판)", save: "해결책 카드 저장", emoji: "🌱" }

      - type: shop
        lv: B
        std: 6과14-04
        cat: 지식·이해
        photo: global/tuvalu
        customer: { emoji: "🏝️", name: "투발루의 어부", place: "태평양의 섬나라 투발루", says: "바닷물 높이가 올라가 섬이 물에 잠기고, 밭에 짠물이 들어와 농사도 어려워졌어요." }
        q: 피해의 원인을 분석해 알맞은 해결책을 모두 골라 보세요.
        features:
          - { text: "연료를 태우지 않는 햇빛·바람 에너지 늘리기", fit: true, why: "이산화 탄소를 적게 내보내 기온 상승을 늦춰요." }
          - { text: "나무를 심고 숲을 가꾸기", fit: true, why: "나무가 공기 중의 이산화 탄소를 흡수해요." }
          - { text: "물건을 아껴 쓰고 다시 쓰기", fit: true, why: "물건을 만들 때 쓰는 에너지를 줄여요." }
          - { text: "바닷가에 모래주머니만 쌓기", fit: false, why: "당장의 피해는 줄일 수 있지만 원인인 이산화 탄소는 줄이지 못해요." }
        planLabels: { title: "🌱 해결책 카드 만들기 (선택)", name: "해결책 이름", slogan: "함께 외칠 구호", when: "어디에 어떻게 공유할까? (예: 학급 누리집, 게시판)", save: "해결책 카드 저장", emoji: "🌱" }
      - type: order
        lv: B
        std: 6과14-04
        cat: 지식·이해
        q: 연소가 생태계 피해로 이어지는 과정을 순서대로 놓아 보세요.
        items:
          - 석탄·석유 같은 연료를 많이 태운다
          - 공기 중에 이산화 탄소가 늘어난다
          - 지구의 평균 기온이 올라간다
          - 바다 얼음이 녹고 생물이 살 곳을 잃는다

      - type: shop
        lv: A
        std: 6과14-04
        cat: 과정·기능
        photo: global/drought
        customer: { emoji: "❓", name: "사진 속 메마른 호수", place: "사진을 보고 문제를 알아내기", says: "비가 오랫동안 오지 않아 호수가 바닥을 드러냈어요. 물고기와 새들이 사라졌어요." }
        q: 사진 속 피해와 이산화 탄소의 관계를 분석하고, 실천할 수 있는 해결책을 모두 골라 보세요.
        hint: 지구의 기온이 오르면 가뭄과 홍수가 잦아져요.
        features:
          - { text: "우리 학교 에너지 절약 지킴이 활동하기", fit: true, why: "전기를 아끼면 연료를 덜 태워 이산화 탄소가 줄어요." }
          - { text: "대중교통 이용을 알리는 캠페인 공유하기", fit: true, why: "여러 사람이 함께 실천하면 효과가 커져요." }
          - { text: "물을 아껴 쓰는 습관 기르기", fit: true, why: "가뭄 피해를 줄이는 데 도움이 돼요." }
          - { text: "가뭄은 나와 상관없으니 그냥 지내기", fit: false, why: "이산화 탄소는 우리 모두의 생활에서 나와요." }
        planLabels: { title: "🌱 해결책 카드 만들기 (선택)", name: "해결책 이름", slogan: "함께 외칠 구호", when: "어디에 어떻게 공유할까? (예: 학급 누리집, 게시판)", save: "해결책 카드 저장", emoji: "🌱" }
      - type: multi
        lv: A
        std: 6과14-04
        cat: 과정·기능
        q: 좋은 해결책을 제안하고 공유하려면 무엇을 갖추어야 할까요? 모두 고르세요.
        options:
          - 피해의 원인(이산화 탄소)과 이어진 해결책이다
          - 누구나 실천할 수 있다
          - 피해의 현황과 근거 자료를 함께 보여 준다
          - 근거 없이 겁주는 내용만 담는다
        answers:
          - 피해의 원인(이산화 탄소)과 이어진 해결책이다
          - 누구나 실천할 수 있다
          - 피해의 현황과 근거 자료를 함께 보여 준다
