template: mission
style: shop
unit: soc-6-2-1
title: 세계 상점 기획자
emoji: 🛍️
summary: 세계 여러 지역에서 온 손님의 자연환경을 살펴보고, 손님에게 꼭 필요한 상품 기능을 골라 판매 계획을 세워요.
story: 지구 탐험대가 세계 상점을 열었어요! 손님이 사는 곳의 지형과 기후를 떠올려, 그곳 사람들에게 꼭 필요한 상품을 기획해 주세요.
lessons: ['13']
standards: [6사10-01, 6사10-02]
minutes: 15
teacherGuide:
  - 13차시 '생각을 펼쳐요 — 자연환경을 고려한 상품의 판매 계획 세우기'를 게임으로 해요.
  - 손님마다 알맞은 상품 기능을 모두 고르면, 상품 이름·광고 문구·판매 계획을 적어 상품 카드로 저장할 수 있어요. 저장한 상품 카드는 탐험 리포트에 모여요.
  - 🏅 분석하기에서는 손님이 어디에 사는지 알려 주지 않고, 기후 그래프나 사진만으로 상품을 기획해요.
  - 게임이 끝난 뒤 리포트의 상품 카드로 모둠 발표나 상품 박람회를 열 수 있어요.
stages:
  - id: shop
    title: 세계 상점 문 열기
    emoji: 🏪
    lesson: '13'
    intro: 손님의 자연환경에 꼭 맞는 상품을 기획해요.
    steps:
      # ───── 🧭 살펴보기 (C) ─────
      - type: shop
        lv: C
        std: 6사10-02
        cat: 지식·이해
        chart: nuuk
        customer: { emoji: "🎣", name: "어부 아푸타크", place: "누크(그린란드)", says: "바다에서 물고기를 잡는데 바람이 너무 차가워서 손이 꽁꽁 얼어요." }
        q: 아푸타크 씨에게 알맞은 상품 기능을 모두 골라 보세요.
        features:
          - { text: "찬 바닷바람과 물을 막는 두꺼운 방수 털장갑", fit: true, why: "가장 따뜻한 달도 10℃가 안 되는 곳이라 손을 따뜻하게 지켜 줘요." }
          - { text: "얼음 위에서도 미끄러지지 않는 신발", fit: true, why: "오랫동안 얼음과 눈이 있는 곳이라 꼭 필요해요." }
          - { text: "땀이 잘 마르는 얇은 반소매 셔츠", fit: false, why: "너무 추운 곳이라 얇은 옷은 쓸모가 적어요." }
          - { text: "모래바람을 막는 사막용 얼굴 가리개", fit: false, why: "사막의 모래바람을 막는 물건이에요." }
      - type: shop
        lv: C
        std: 6사10-02
        cat: 지식·이해
        chart: kualalumpur
        customer: { emoji: "💼", name: "회사원 아이샤", place: "쿠알라룸푸르(말레이시아)", says: "출근길에 갑자기 비가 쏟아지고, 일 년 내내 너무 더워요." }
        q: 아이샤 씨에게 알맞은 상품 기능을 모두 골라 보세요.
        features:
          - { text: "가방에 쏙 들어가는 작은 우산", fit: true, why: "일 년 내내 비가 많이 와서 늘 들고 다니기 좋아요." }
          - { text: "바람이 잘 통하고 금방 마르는 얇은 옷", fit: true, why: "일 년 내내 27℃ 안팎으로 덥고 습해요." }
          - { text: "귀까지 덮는 두꺼운 털모자", fit: false, why: "겨울이 없는 곳이라 필요 없어요." }
          - { text: "영하에서도 잘 켜지는 난로", fit: false, why: "기온이 0℃ 아래로 내려가지 않아요." }
      - type: shop
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: life/himalaya-yak
        customer: { emoji: "🧗", name: "등산 안내인 다와", place: "히말라야산맥(네팔)", says: "높고 가파른 산길을 매일 오르내리며 등산객을 안내해요." }
        q: 다와 씨에게 알맞은 상품 기능을 모두 골라 보세요.
        features:
          - { text: "가파른 비탈에서도 미끄러지지 않는 튼튼한 등산화", fit: true, why: "높고 가파른 산길을 걸어야 해요." }
          - { text: "높은 곳의 추위를 막는 가볍고 따뜻한 겉옷", fit: true, why: "높이 올라갈수록 기온이 낮아져요." }
          - { text: "물이 불어날 때를 대비한 작은 배", fit: false, why: "큰 강 주변에서 필요한 물건이에요." }
          - { text: "해변에서 쓰는 비치파라솔", fit: false, why: "바닷가 모래사장에서 쓰는 물건이에요." }

      # ───── 🔎 조사하기 (B) ─────
      - type: shop
        lv: B
        std: 6사10-02
        cat: 지식·이해
        chart: cairo
        customer: { emoji: "🧺", name: "시장 상인 카림", place: "카이로(이집트)", says: "하루 종일 바깥 시장에서 장사해요. 햇볕이 너무 뜨겁고 모래바람이 불어요." }
        q: 카림 씨의 기후를 조사해서 알맞은 상품 기능을 모두 골라 보세요.
        features:
          - { text: "햇볕을 가리는 챙 넓은 모자", fit: true, why: "비가 거의 오지 않아 햇볕이 아주 강해요." }
          - { text: "모래바람을 막는 얼굴 가리개 스카프", fit: true, why: "건조한 곳이라 모래바람이 자주 불어요." }
          - { text: "온몸을 가리는 헐렁하고 시원한 긴 옷", fit: true, why: "햇볕을 가리면서도 옷 안으로 바람이 통해요." }
          - { text: "장마철에 신는 긴 장화", fit: false, why: "한 해 강수량이 25mm쯤이라 장화가 필요 없어요." }
          - { text: "두꺼운 솜이불", fit: false, why: "겨울에도 평균 14℃가 넘어 두꺼운 이불은 덜 필요해요." }
      - type: pickmonth
        lv: B
        std: 6사10-02
        cat: 과정·기능
        chart: mwanza
        q: 므완자의 농부 마리아 씨에게 '빗물 모으는 물탱크'를 팔려고 해요. 물탱크를 미리 설치해 빗물을 모으기 시작하기에 가장 좋은 달은? 비가 가장 많이 오는 달을 눌러 보세요.
        hint: 비가 많이 올 때 모아 두어야 6~8월 건기에 쓸 수 있어요.
        answer: [4]
        explain: 므완자는 4월에 비가 가장 많이 와요. 이때 빗물을 모아 두면 비가 거의 오지 않는 6~8월에 쓸 수 있어요.
      - type: shop
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: life/sognefjord-cruise
        customer: { emoji: "🛳️", name: "유람선 회사 사장 잉리드", place: "송네 피오르(노르웨이)", says: "높은 절벽 사이 바다로 관광객을 태우고 다녀요. 관광객이 더 즐겁게 구경했으면 좋겠어요." }
        q: 잉리드 씨의 유람선 관광객에게 알맞은 상품 기능을 모두 골라 보세요.
        features:
          - { text: "높은 절벽과 폭포를 가까이 볼 수 있는 망원경", fit: true, why: "피오르의 높은 절벽 경관이 관광 자원이에요." }
          - { text: "바닷바람과 비를 막는 갑판용 방수 재킷", fit: true, why: "바닷바람이 차고 비도 자주 와요." }
          - { text: "피오르가 생긴 과정을 알려 주는 안내 지도", fit: true, why: "빙하가 깎은 골짜기에 바닷물이 들어온 지형을 알면 구경이 더 즐거워요." }
          - { text: "사막을 건너는 낙타 타기 체험권", fit: false, why: "피오르와 관계없는 사막 관광이에요." }
          - { text: "썰물 때 바다 밑을 걷는 갯벌 신발", fit: false, why: "피오르는 바다가 깊어 갯벌이 드러나지 않아요." }

      # ───── 🏅 분석하기 (A) ─────
      - type: shop
        lv: A
        std: 6사10-02
        cat: 과정·기능
        chart: quito
        hideChartName: true
        customer: { emoji: "🎒", name: "비밀 손님 (어디에 살까요?)", place: "그래프만 보고 알아내기", says: "우리 동네는 일 년 내내 날씨가 비슷해요. 그런데 아침저녁에는 쌀쌀하고, 낮에는 햇볕이 따가워요." }
        q: 그래프를 분석해서 비밀 손님에게 알맞은 상품 기능을 모두 골라 보세요.
        hint: 기온이 일 년 내내 몇 ℃쯤인지, 높은 곳인지 생각해 보세요.
        features:
          - { text: "아침저녁에 걸쳤다가 낮에 벗기 쉬운 판초", fit: true, why: "일 년 내내 14℃쯤이라 쌀쌀한 아침저녁에 걸치기 좋아요." }
          - { text: "높은 곳의 강한 햇볕을 막는 자외선 차단 모자", fit: true, why: "높은 곳은 햇볕이 강해요." }
          - { text: "영하 30℃까지 견디는 두꺼운 털외투", fit: false, why: "영하로 내려가지 않는 곳이라 너무 더워요." }
          - { text: "일 년 내내 쓰는 에어컨", fit: false, why: "일 년 내내 서늘해서 에어컨이 거의 필요 없어요." }
        explain: 비밀 손님은 해발 약 2,850m에 있는 키토(에콰도르)에 살아요. 적도 가까이에 있지만 높아서 고산 기후예요.
      - type: shop
        lv: A
        std: 6사10-01
        cat: 과정·기능
        photo: landforms/fundy
        customer: { emoji: "🗺️", name: "관광 안내소 직원 (어디일까요?)", place: "사진만 보고 알아내기", says: "하루에 두 번 바닷물이 아주 멀리까지 빠져서, 바위 아래까지 걸어 들어갈 수 있어요." }
        q: 사진 속 지형을 분석해서 이곳 관광객에게 알맞은 상품 기능을 모두 골라 보세요.
        features:
          - { text: "바닷물이 빠지고 들어오는 시간을 알려 주는 알림 앱", fit: true, why: "밀물과 썰물의 차이가 매우 커서 물이 들어오는 시간을 꼭 알아야 안전해요." }
          - { text: "진흙 갯벌에서 신는 미끄럼 방지 신발", fit: true, why: "썰물 때 드러난 진흙 바닥을 걸어요." }
          - { text: "바위가 깎인 까닭을 설명하는 안내판", fit: true, why: "바닷물이 바위 아래를 깎아 만든 독특한 경관이 관광 자원이에요." }
          - { text: "사막에서 쓰는 모래바람 마스크", fit: false, why: "바닷가 갯벌과 관계없는 물건이에요." }
        explain: 이곳은 캐나다 펀디만의 호프웰 록스예요.
      - type: multi
        lv: A
        std: 6사10-02
        cat: 지식·이해
        q: 여러 손님의 상품을 기획하면서 알게 된 것을 모두 고르세요.
        options:
          - 상품을 기획할 때는 손님이 사는 곳의 기온과 강수량을 살펴야 한다
          - 산지·해안 같은 지형도 사람들에게 필요한 물건을 바꾼다
          - 같은 상품이라도 어떤 지역에서는 꼭 필요하고, 어떤 지역에서는 필요 없을 수 있다
          - 자연환경은 사람들이 쓰는 물건과 아무 관계가 없다
        answers:
          - 상품을 기획할 때는 손님이 사는 곳의 기온과 강수량을 살펴야 한다
          - 산지·해안 같은 지형도 사람들에게 필요한 물건을 바꾼다
          - 같은 상품이라도 어떤 지역에서는 꼭 필요하고, 어떤 지역에서는 필요 없을 수 있다
