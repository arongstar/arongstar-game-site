# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: sci-6-1-2
title: 교통안전 지킴이
emoji: 🚸
summary: 속력과 관련된 안전 수칙과 안전장치를 조사하고, 우리 학교 앞을 안전하게 만드는 교통안전 실천 계획을 세워요.
story: 학교 앞 길에서 아찔한 일이 자꾸 생기고 있어요! 교통안전 지킴이가 되어 속력과 안전의 관계를 밝히고 실천 카드를 만들어 보세요.
lessons:
- '7'
- '8'
standards:
- 6과10-03
minutes: 15
teacherGuide:
- 7차시 「안전장치 조사」, 8차시 「교통안전 실천」 스테이지예요. 실천 카드는 「나의 탐험 리포트」에 모여요.
- 조사 결과를 학급 누리집 등에 공유하는 활동으로 이어 갈 수 있어요.
stages:
- id: safety
  title: 안전장치 조사
  emoji: 🛡️
  lesson: '7'
  intro: 속력과 관련된 안전 수칙과 안전장치를 조사해요.
  steps:
  - type: choice
    lv: C
    std: 6과10-03
    cat: 지식·이해
    q: 그림처럼 어린이 보호 구역에서 자동차의 속력을 낮추도록 하는 까닭은 무엇일까요?
    options:
    - 속력이 작으면 위험할 때 더 빨리 멈출 수 있어 어린이 교통사고를 줄일 수 있기 때문이다
    - 자동차의 연료를 아끼기 위해서이다
    - 도로를 깨끗하게 하기 위해서이다
    answer: 속력이 작으면 위험할 때 더 빨리 멈출 수 있어 어린이 교통사고를 줄일 수 있기 때문이다
    photo: illust/mo-schoolzone
  - type: multi
    lv: C
    std: 6과10-03
    cat: 지식·이해
    q: 속력과 관련된 안전장치를 모두 골라 보세요.
    options:
    - 안전띠
    - 에어백
    - 과속 방지 턱
    - 자동차 라디오
    - 자동차 색깔
    answers:
    - 안전띠
    - 에어백
    - 과속 방지 턱
    photo: illust/mo-seatbelt
  - type: sort
    lv: B
    std: 6과10-03
    cat: 지식·이해
    q: 안전장치가 있는 곳에 따라 나누어 보세요.
    bins:
    - 자동차에 있는 안전장치
    - 도로에 있는 안전장치
    items:
    - text: 안전띠
      bin: 자동차에 있는 안전장치
    - text: 에어백
      bin: 자동차에 있는 안전장치
    - text: 어린이용 카시트
      bin: 자동차에 있는 안전장치
    - text: 과속 방지 턱
      bin: 도로에 있는 안전장치
    - text: 과속 단속 카메라
      bin: 도로에 있는 안전장치
    - text: 미끄럼 방지 포장
      bin: 도로에 있는 안전장치
  - type: choice
    lv: B
    std: 6과10-03
    cat: 지식·이해
    q: 안전띠는 어떻게 우리를 지켜 줄까요?
    options:
    - 자동차가 갑자기 멈출 때 몸이 앞으로 튀어 나가지 않도록 붙잡아 준다
    - 자동차의 속력을 높여 준다
    - 자동차가 미끄러지지 않게 한다
    answer: 자동차가 갑자기 멈출 때 몸이 앞으로 튀어 나가지 않도록 붙잡아 준다
  - type: choice
    lv: A
    std: 6과10-03
    cat: 지식·이해
    q: 같은 자동차가 느린 속력과 빠른 속력으로 달리다가 똑같이 브레이크를 밟았어요. 가장 알맞게 설명한 것은?
    options:
    - 속력이 클수록 멈출 때까지 더 먼 거리를 이동하므로 더 위험하다
    - 속력과 상관없이 같은 거리에서 멈춘다
    - 속력이 클수록 더 빨리 멈춘다
    answer: 속력이 클수록 멈출 때까지 더 먼 거리를 이동하므로 더 위험하다
    card:
      emoji: 🚗
      title: 브레이크 실험 이야기
      text: 같은 길에서 같은 자동차가 한 번은 천천히, 한 번은 빠르게 달리다가 같은 곳에서 브레이크를 밟았어요.
- id: practice
  title: 교통안전 실천
  emoji: ✅
  lesson: '8'
  intro: 교통안전 수칙을 정리하고 실천 계획을 세워요.
  steps:
  - type: multi
    lv: C
    std: 6과10-03
    cat: 가치·태도
    q: 길을 걸을 때 지켜야 할 교통안전 수칙을 모두 골라 보세요.
    options:
    - 횡단보도에서 좌우를 살핀 뒤 건넌다
    - 걸으면서 스마트폰을 보지 않는다
    - 버스가 완전히 멈춘 뒤에 탄다
    - 초록불이 깜빡이면 뛰어서 건넌다
    - 세워진 차 사이로 갑자기 뛰어나간다
    answers:
    - 횡단보도에서 좌우를 살핀 뒤 건넌다
    - 걸으면서 스마트폰을 보지 않는다
    - 버스가 완전히 멈춘 뒤에 탄다
  - type: shop
    lv: B
    std: 6과10-03
    cat: 가치·태도
    q: 우리 학교 앞을 안전하게 만들기 위한 실천 방법을 모두 골라 보세요.
    customer:
      emoji: 🏫
      name: 우리 학교 녹색 어머니회
      place: 학교 앞 횡단보도
      says: 등굣길에 차가 빠르게 지나가고, 친구들이 급하게 뛰어 건너요.
    features:
    - text: 횡단보도 앞에서 멈추고 손을 들어 건너기
      fit: true
      why: 운전자가 나를 잘 볼 수 있어요.
    - text: 어린이 보호 구역의 속력 제한을 알리는 포스터 붙이기
      fit: true
      why: 운전자가 속력을 줄이도록 알려요.
    - text: 친구와 장난치며 차도로 걷기
      fit: false
      why: 자동차와 부딪힐 수 있어요.
    - text: 등교 시간에 늦으면 빨간불에도 뛰어 건너기
      fit: false
      why: 아주 위험해요.
    planLabels: &id001
      title: 🚸 교통안전 실천 카드 만들기 (선택)
      name: 나의 교통안전 약속
      slogan: 함께 외칠 구호
      when: 언제, 어디에서 실천할까?
      save: 실천 카드 저장
      emoji: 🚸
  - type: shop
    lv: A
    std: 6과10-03
    cat: 가치·태도
    q: 실천을 잘했는지 스스로 확인할 수 있는 교통안전 실천 계획의 조건을 모두 골라 보세요.
    customer:
      emoji: 📋
      name: 교통안전 지킴이 대장
      place: 우리 반
      says: 계획만 세우고 끝나면 소용이 없어요. 정말 실천하고 있는지 확인할 수 있어야 해요.
    features:
    - text: 언제, 어디에서 무엇을 할지 구체적으로 정한다
      fit: true
      why: 구체적일수록 실천하기 쉬워요.
    - text: 일주일 동안 실천 점검표에 표시한다
      fit: true
      why: 실천했는지 스스로 평가할 수 있어요.
    - text: 속력과 안전의 관계를 근거로 까닭을 적는다
      fit: true
      why: 왜 지켜야 하는지 알면 더 잘 지켜요.
    - text: “조심하자” 한 마디만 적는다
      fit: false
      why: 무엇을 해야 할지 알기 어려워요.
    planLabels: *id001
