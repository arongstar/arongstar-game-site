# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: bingo
unit: sci-6-1-4
title: 1학기 과학 탐험 빙고
emoji: 🎯
summary: 6학년 1학기 과학에서 배운 낱말로 태블릿 빙고판을 채우고, 전자칠판의 설명을 보고 낱말을 맞혀 표시해요.
lessons:
- '8'
standards:
- 6과12-01
- 6과12-02
- 6과12-03
minutes: 20
size: 4
teacherGuide:
- 1학기 과학을 마무리하는 교실 놀이로 써요. 전자칠판에는 이 화면을, 학생 태블릿에는 「내 빙고판」을 열어요.
- 산과 염기·물체의 운동·식물의 구조와 기능·지구의 운동 낱말 28개가 섞여 나와요.
words:
- word: 지시약
  clue: 용액의 성질에 따라 색깔이 달라져 용액을 분류할 때 쓰는 물질이에요.
- word: 리트머스 종이
  clue: 푸른색은 산성 용액에서 붉게, 붉은색은 염기성 용액에서 푸르게 변하는 종이예요.
- word: 페놀프탈레인 용액
  clue: 염기성 용액에 넣으면 붉은색으로 변하는 지시약이에요.
- word: 붉은 양배추 지시약
  clue: 산성 용액에서는 붉은색 계열, 염기성 용액에서는 푸른색·노란색 계열로 변해요.
- word: 산성 용액
  clue: 대리석이나 달걀 껍데기를 넣으면 기포가 생기는 용액이에요.
- word: 염기성 용액
  clue: 두부나 삶은 달걀흰자를 흐물흐물하게 녹이는 용액이에요.
- word: 탄산 칼슘
  clue: 대리석, 달걀 껍데기, 조개껍데기에 들어 있는 물질이에요.
- word: 산성비
  clue: 대리석 문화재를 녹이고 숲을 메마르게 하는 비예요.
- word: 운동
  clue: 시간이 지남에 따라 물체의 위치가 변하는 것이에요.
- word: 위치
  clue: (가로, 세로)처럼 좌표 평면에 나타낼 수 있어요.
- word: 속력
  clue: 이동 거리를 걸린 시간으로 나누어 구해요.
- word: 걸린 시간
  clue: 같은 거리를 이동할 때 이것이 짧을수록 빨라요.
- word: 안전띠
  clue: 자동차가 갑자기 멈출 때 몸을 붙잡아 주는 안전장치예요.
- word: 과속 방지 턱
  clue: 도로에 볼록하게 만들어 자동차의 속력을 줄이게 하는 장치예요.
- word: 세포
  clue: 생물을 이루고 있는 기본 단위예요.
- word: 세포벽
  clue: 식물 세포의 세포막 바깥을 둘러싸 모양을 일정하게 해 줘요.
- word: 핵
  clue: 세포 안에 있는 둥근 모양의 구조예요.
- word: 뿌리
  clue: 땅속의 물을 흡수하고 식물을 지지해요.
- word: 줄기
  clue: 뿌리에서 흡수한 물이 잎까지 이동하는 통로예요.
- word: 광합성
  clue: 식물이 빛을 받아 물과 이산화 탄소로 양분을 만드는 일이에요.
- word: 증산 작용
  clue: 잎에 도달한 물이 기공을 통해 수증기로 빠져나가는 일이에요.
- word: 꽃가루받이
  clue: 수술의 꽃가루가 암술로 옮겨지는 것이에요.
- word: 씨
  clue: 꽃이 만들며, 바람이나 동물의 도움으로 멀리 퍼져요.
- word: 자전
  clue: 지구가 자전축을 중심으로 하루에 한 바퀴씩 도는 것이에요.
- word: 공전
  clue: 지구가 태양 둘레를 1년에 한 바퀴씩 도는 것이에요.
- word: 낮과 밤
  clue: 지구가 자전하기 때문에 하루에 한 번씩 번갈아 생겨요.
- word: 오리온자리
  clue: 겨울철 밤하늘의 대표적인 별자리예요.
- word: 남쪽 하늘
  clue: 태양과 별의 움직임을 관찰할 때 바라보는 쪽 하늘이에요.
