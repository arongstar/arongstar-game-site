# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-4
title: 계절 별자리 관측소
emoji: ✨
summary: 지구의 공전 모형에서 지구를 계절별 위치로 옮겨 보며, 계절에 따라 밤하늘에 보이는 별자리가 달라지는 까닭을 알아봐요.
story: 봄에는 사자자리, 겨울에는 오리온자리! 왜 계절마다 다른 별자리가 보일까요? 지구를 태양 둘레로 옮기며 비밀을 밝혀 보세요.
lessons:
- '6'
- '7'
standards:
- 6과12-03
minutes: 15
teacherGuide:
- 6차시 「지구의 공전」, 7차시 「계절별 별자리」 스테이지예요.
- 교육과정에 따라 별자리 이름보다 계절에 따라 보이는 별자리가 달라지는 까닭에 초점을 둬요. 천체 관측 프로그램과 함께 쓰면 좋아요.
stages:
- id: orbit
  title: 지구의 공전
  emoji: 🪐
  lesson: '6'
  intro: 지구가 태양 둘레를 도는 공전을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과12-03
    cat: 지식·이해
    q: 지구가 태양을 중심으로 1년에 한 바퀴씩 도는 것을 무엇이라고 할까요?
    options:
    - 공전
    - 자전
    - 증산
    answer: 공전
  - type: choice
    lv: B
    std: 6과12-03
    cat: 지식·이해
    q: 지구의 자전과 공전을 바르게 비교한 것은?
    options:
    - 자전은 하루에 한 바퀴, 공전은 1년에 한 바퀴 돈다
    - 자전은 1년에 한 바퀴, 공전은 하루에 한 바퀴 돈다
    - 자전과 공전은 같은 것이다
    answer: 자전은 하루에 한 바퀴, 공전은 1년에 한 바퀴 돈다
  - type: choice
    lv: B
    std: 6과12-03
    cat: 과정·기능
    q: 모형에서 지구를 봄 → 여름 → 가을 → 겨울 위치로 차례로 눌러 보세요. 지구는 태양 둘레를 어느 방향으로 공전할까요?
    options:
    - 서쪽에서 동쪽으로
    - 동쪽에서 서쪽으로
    answer: 서쪽에서 동쪽으로
    starseason: true
    explain: 지구의 공전 방향은 자전 방향과 같은 서쪽에서 동쪽이에요. 북극 위에서 내려다보면 시계 반대 방향이에요.
  - type: choice
    lv: A
    std: 6과12-03
    cat: 지식·이해
    q: 지구가 공전하고 있다는 것을 보여 주는 현상으로 가장 알맞은 것은?
    options:
    - 계절에 따라 밤하늘에 보이는 별자리가 달라진다
    - 하루 동안 태양이 동쪽에서 서쪽으로 움직인다
    - 밤에 별이 반짝인다
    answer: 계절에 따라 밤하늘에 보이는 별자리가 달라진다
