    options:
    - 지구가 태양 둘레를 공전하면서 계절마다 밤에 지구가 향하는 쪽의 별자리가 달라지기 때문이다
    - 별자리가 계절마다 우주에서 자리를 옮기기 때문이다
    - 지구가 자전하기 때문이다
