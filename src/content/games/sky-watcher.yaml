    cat: 과정·기능
    q: 시각을 밤늦게까지 바꾸어 보세요. 별자리는 어떻게 움직이나요?
    options:
    - 모양은 그대로이고 동쪽에서 서쪽으로 움직인다
    - 모양이 바뀌면서 서쪽에서 동쪽으로 움직인다
    - 움직이지 않는다
    answer: 모양은 그대로이고 동쪽에서 서쪽으로 움직인다
