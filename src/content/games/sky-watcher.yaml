    lv: C
    std: 6과12-01
    cat: 과정·기능
    q: 시각을 오후 8시로 두어 보세요. 별자리는 어느 쪽 하늘에 있나요?
    options:
    - 동쪽
    - 남쪽
    - 서쪽
    answer: 동쪽
    sky: star
  - type: choice
