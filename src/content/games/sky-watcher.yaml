    lv: A
    std: 6과12-01
    cat: 지식·이해
    q: 하루 동안 태양과 별의 위치 변화에서 찾은 규칙성과 그 까닭을 가장 알맞게 말한 것은?
    options:
    - 모두 동쪽에서 서쪽으로 움직이는 것처럼 보이며, 지구가 자전하기 때문이다
    - 태양만 움직이고 별은 움직이지 않는다
    - 태양과 별이 서로 반대 방향으로 움직인다
    answer: 모두 동쪽에서 서쪽으로 움직이는 것처럼 보이며, 지구가 자전하기 때문이다
