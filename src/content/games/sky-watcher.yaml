# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-4
title: 남쪽 하늘 관측소
emoji: 🔭
summary: 남쪽 하늘을 바라보며 시각을 바꿔 하루 동안 태양과 별자리의 위치가 어떻게 달라지는지 관찰하고 규칙성을 찾아요.
story: 과학 탐험대가 운동장 한가운데에서 남쪽 하늘을 바라보고 섰어요. 아침부터 밤까지 하늘에 일어나는 일을 관측해 보세요.
lessons:
- '2'
- '3'
standards:
- 6과12-01
minutes: 15
teacherGuide:
- 2차시 「하루 동안의 태양」, 3차시 「하루 동안의 별」 스테이지예요.
- 관측소는 남쪽을 바라보는 관측자를 기준으로 해요. 왼쪽이 동쪽, 오른쪽이 서쪽이에요.
- 태양을 직접 맨눈으로 보지 않도록 함께 지도해 주세요.
stages:
- id: sun
  title: 하루 동안의 태양
  emoji: ☀️
  lesson: '2'
  intro: 시각을 바꾸며 태양의 위치 변화를 관찰해요.
  steps:
  - type: choice
    lv: C
    std: 6과12-01
    cat: 과정·기능
    q: 관측소의 시각을 오전 7시로 두어 보세요. 아침에 태양은 어느 쪽 하늘에 있나요?
    options:
    - 동쪽
    - 남쪽
    - 서쪽
    answer: 동쪽
    sky: sun
  - type: choice
    lv: C
    std: 6과12-01
    cat: 지식·이해
    q: 남쪽을 바라보고 서면 동쪽은 어느 쪽일까요?
    options:
    - 왼쪽
    - 오른쪽
    - 뒤쪽
    answer: 왼쪽
    explain: 남쪽을 보고 서면 왼쪽이 동쪽, 오른쪽이 서쪽, 뒤쪽이 북쪽이에요.
  - type: order
    lv: B
    std: 6과12-01
    cat: 과정·기능
    q: 시각을 차례로 바꾸어 보세요. 하루 동안 태양이 있는 곳을 순서대로 놓아 보세요.
    items:
    - 동쪽 하늘
    - 남쪽 하늘
    - 서쪽 하늘
    sky: sun
  - type: choice
    lv: A
    std: 6과12-01
    cat: 지식·이해
    q: 하루 동안 태양이 동쪽에서 서쪽으로 움직이는 것처럼 보이는 까닭으로 가장 알맞은 것은?
    options:
    - 지구가 서쪽에서 동쪽으로 자전하기 때문이다
    - 태양이 지구 둘레를 하루에 한 바퀴 돌기 때문이다
    - 지구가 태양 둘레를 공전하기 때문이다
    answer: 지구가 서쪽에서 동쪽으로 자전하기 때문이다
