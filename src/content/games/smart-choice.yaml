template: mission
style: shop
unit: soc-6-2-2
title: 똑똑한 선택 탐험
emoji: 💰
summary: 정해진 돈으로 꼭 필요한 것부터 고르고, 기준을 세워 비교하며 가계와 기업의 합리적 선택을 연습해요.
story: 경제 탐험대의 첫 임무! 우리 집 살림을 맡은 가계와 물건을 만드는 기업이 되어, 한정된 돈과 자원으로 가장 만족스러운 선택을 해 보세요.
lessons: ['2', '3']
standards: [6사11-01]
minutes: 12
teacherGuide:
  - 2차시는 '가계의 선택', 3차시는 '기업의 선택' 스테이지를 해요.
  - 예산 문제는 정해진 돈 안에서 꼭 필요한 것을 먼저 고르면 정답이에요. 남은 돈을 어떻게 쓸지는 학생마다 달라도 돼요. 왜 그렇게 골랐는지 짝과 이야기하게 하면 좋아요.
  - "'포기한 것의 가치(기회비용)'는 🔎 조사하기부터 나와요. 용어보다 '하나를 고르면 다른 것을 포기하게 된다'는 생각에 집중해 주세요."
stages:
  # ════════════ 가계의 합리적 선택 ════════════
  - id: household
    title: 우리 집 살림꾼, 가계의 선택
    emoji: 🏠
    lesson: '2'
    intro: 정해진 돈으로 가장 만족스럽게 선택해요.
    steps:
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        card: { emoji: "👨‍👩‍👧", title: "우리 집", text: "엄마와 아빠는 회사에서 일해 월급을 받고, 그 돈으로 먹을 것과 입을 것을 사요." }
        q: 이처럼 함께 생활하며 소득을 얻고 필요한 것을 사서 쓰는 경제 단위를 무엇이라고 할까요?
        options: [가계, 기업, 정부]
        answer: 가계
        explain: 가계는 일을 해서 소득을 얻고, 그 소득으로 필요한 물건과 서비스를 사서 쓰는(소비하는) 경제 단위예요.
      - type: sort
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 가계가 하는 일과 기업이 하는 일을 나누어 보세요.
        bins: [가계가 하는 일, 기업이 하는 일]
        items:
          - { text: "회사에서 일하고 월급을 받아요", bin: "가계가 하는 일" }
          - { text: "필요한 물건을 사서 써요", bin: "가계가 하는 일" }
          - { text: "남은 돈을 저축해요", bin: "가계가 하는 일" }
          - { text: "물건을 만들어 팔아요", bin: "기업이 하는 일" }
          - { text: "일할 사람을 뽑아요", bin: "기업이 하는 일" }
          - { text: "새로운 상품을 개발해요", bin: "기업이 하는 일" }
      - type: budget
        lv: C
        std: 6사11-01
        cat: 과정·기능
        q: 운동회 준비물을 사요. 예산은 10,000원이고, 물병과 모자는 꼭 있어야 해요. 예산 안에서 골라 보세요.
        hint: 꼭 필요한 것을 먼저 고른 뒤, 남은 돈을 살펴보세요.
        budget: 10000
        items:
          - { text: "물병", emoji: "🧴", price: 3000, need: true, note: "꼭 필요해요" }
          - { text: "모자", emoji: "🧢", price: 4000, need: true, note: "꼭 필요해요" }
          - { text: "응원 막대", emoji: "🎉", price: 2000 }
          - { text: "캐릭터 스티커", emoji: "⭐", price: 1500 }
          - { text: "아이스크림", emoji: "🍦", price: 2500 }
          - { text: "장난감 로봇", emoji: "🤖", price: 8000 }
        explain: 꼭 필요한 것을 먼저 사고, 남은 3,000원 안에서 더 만족스러운 것을 골랐다면 합리적인 선택이에요.
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 합리적 선택이란 무엇일까요?
        options:
          - 여러 조건을 따져 적은 비용으로 큰 만족을 얻도록 선택하는 것
          - 가장 비싼 것을 고르는 것
          - 친구가 산 것과 똑같은 것을 고르는 것
          - 광고에 나온 것을 바로 고르는 것
        answer: 여러 조건을 따져 적은 비용으로 큰 만족을 얻도록 선택하는 것

      - type: order
        lv: B
        std: 6사11-01
        cat: 과정·기능
        q: 합리적으로 선택하는 과정을 순서대로 놓아 보세요.
        items:
          - 무엇이 필요한지 확인하기
          - 선택 기준 정하기 (가격, 품질, 디자인 등)
          - 정보를 모아 비교하기
          - 선택하고 결과 평가하기
      - type: choice
        lv: B
        std: 6사11-01
        cat: 과정·기능
        table:
          title: 운동화 비교표
          head: [운동화, 가격, 튼튼함, 디자인, 산 사람들의 평가]
          rows:
            - ["가", "45,000원", "★★★", "★★", "오래 신어도 멀쩡해요"]
            - ["나", "60,000원", "★★", "★★★", "예쁘지만 금방 닳아요"]
            - ["다", "35,000원", "★", "★★", "한 달 만에 밑창이 떨어졌어요"]
        q: "지우의 선택 기준은 '오래 신을 수 있을 것, 50,000원 이하'예요. 가장 합리적인 운동화는?"
        options: [운동화 가, 운동화 나, 운동화 다]
        answer: 운동화 가
        explain: 운동화 나는 예산을 넘고, 운동화 다는 값은 싸지만 오래 신을 수 없어요. 기준을 세우고 비교하면 합리적으로 고를 수 있어요.
      - type: budget
        lv: B
        std: 6사11-01
        cat: 과정·기능
        q: 가족 캠핑 장보기를 맡았어요. 예산은 30,000원이고 쌀, 물, 모기 기피제는 꼭 필요해요.
        budget: 30000
        items:
          - { text: "쌀", emoji: "🍚", price: 9000, need: true, note: "꼭 필요해요" }
          - { text: "생수 묶음", emoji: "💧", price: 3000, need: true, note: "꼭 필요해요" }
          - { text: "모기 기피제", emoji: "🦟", price: 6000, need: true, note: "꼭 필요해요" }
          - { text: "고기", emoji: "🥩", price: 12000 }
          - { text: "라면", emoji: "🍜", price: 5000 }
          - { text: "과자", emoji: "🍪", price: 4000 }
          - { text: "물총", emoji: "🔫", price: 7000 }
      - type: choice
        lv: B
        std: 6사11-01
        cat: 지식·이해
        card: { emoji: "📚", title: "5,000원의 고민", text: "5,000원으로 보고 싶던 책과 영화 중 하나만 고를 수 있어서, 책을 샀어요." }
        q: 책을 사면서 포기하게 된 것은 무엇일까요?
        options:
          - 영화를 보며 얻을 수 있었던 즐거움
          - 책을 읽는 즐거움
          - 아무것도 포기하지 않았다
        answer: 영화를 보며 얻을 수 있었던 즐거움
        explain: 하나를 고르면 다른 것을 포기하게 돼요. 이렇게 포기한 것의 가치를 '기회비용'이라고 해요. 기회비용까지 생각하면 더 합리적으로 선택할 수 있어요.

      - type: choice
        lv: A
        std: 6사11-01
        cat: 과정·기능
        table:
          title: 학급비로 살 공 비교표
          head: [공, 가격, 함께 놀 수 있는 사람, 튼튼함]
          rows:
            - ["축구공", "28,000원", "많음 (20명 이상)", "★★★"]
            - ["농구공", "35,000원", "많음 (10명 이상)", "★★★"]
            - ["탁구공 세트", "12,000원", "적음 (2~4명)", "★"]
            - ["피구공", "18,000원", "많음 (20명 이상)", "★★"]
        q: "학급 회의에서 정한 기준은 ① 반 친구들이 함께 놀 수 있고 ② 오래 쓸 수 있으며 ③ 30,000원 이하예요. 가장 합리적인 선택은?"
        options: [축구공, 농구공, 탁구공 세트, 피구공]
        answer: 축구공
        explain: 농구공은 예산을 넘고, 탁구공 세트는 함께 놀 수 있는 사람이 적고, 피구공은 축구공보다 덜 튼튼해요. 세 기준을 모두 가장 잘 만족하는 것은 축구공이에요.
      - type: multi
        lv: A
        std: 6사11-01
        cat: 과정·기능
        q: 합리적 선택이 아니어서 고쳐야 할 행동을 모두 고르세요.
        options:
          - 광고를 보자마자 필요한지 생각하지 않고 샀다
          - 친구가 가진 것과 똑같아서 샀다
          - 가격과 품질을 비교한 뒤 샀다
          - 정말 필요한지 먼저 생각해 보았다
        answers:
          - 광고를 보자마자 필요한지 생각하지 않고 샀다
          - 친구가 가진 것과 똑같아서 샀다
      - type: budget
        lv: A
        std: 6사11-01
        cat: 과정·기능
        q: 한 달 용돈 20,000원으로 계획을 세워요. 교통 카드 충전과 저축은 꼭 하기로 했어요. 나머지를 합리적으로 골라 보세요.
        hint: 미래를 위한 저축도 꼭 필요한 선택이에요.
        budget: 20000
        items:
          - { text: "교통 카드 충전", emoji: "🚌", price: 8000, need: true, note: "꼭 필요해요" }
          - { text: "저축", emoji: "🐷", price: 3000, need: true, note: "미래를 위해 꼭 하기로 했어요" }
          - { text: "친구 생일 선물", emoji: "🎁", price: 5000 }
          - { text: "공책과 연필", emoji: "✏️", price: 3000 }
          - { text: "간식", emoji: "🍫", price: 4000 }
          - { text: "게임 아이템", emoji: "🎮", price: 6000 }
          - { text: "읽고 싶던 책", emoji: "📖", price: 7000 }
      - type: choice
        lv: A
        std: 6사11-01
        cat: 지식·이해
        q: 가계가 합리적으로 선택하면 어떤 점이 좋을까요? 가장 알맞게 탐구한 것을 고르세요.
        options:
          - 한정된 소득으로 더 큰 만족을 얻고, 저축으로 미래도 대비할 수 있다
          - 돈을 많이 쓸수록 무조건 만족이 커진다
          - 소득이 저절로 늘어난다
        answer: 한정된 소득으로 더 큰 만족을 얻고, 저축으로 미래도 대비할 수 있다

  # ════════════ 기업의 합리적 선택 ════════════
  - id: firm
    title: 작은 기업 사장님의 선택
    emoji: 🏭
    lesson: '3'
    intro: 이윤을 얻기 위해 기업은 무엇을, 얼마나, 어떻게 만들지 선택해요.
    steps:
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        photo: economy/factory
        q: 기업이 물건을 만들어 파는 가장 큰 목적은 무엇일까요?
        options: [이윤(이익)을 얻기 위해, 세금을 걷기 위해, 물건을 공짜로 나누어 주기 위해]
        answer: 이윤(이익)을 얻기 위해
      - type: sort
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 기업이 하는 선택을 알맞게 나누어 보세요.
        bins: ["무엇을 만들까?", "얼마나 만들까?", "어떻게 만들까?"]
        items:
          - { text: "여름에 잘 팔릴 새 상품 정하기", bin: "무엇을 만들까?" }
          - { text: "새로운 맛의 아이스크림 개발하기", bin: "무엇을 만들까?" }
          - { text: "주문량에 맞추어 생산량 정하기", bin: "얼마나 만들까?" }
          - { text: "작년 판매량을 보고 수량 정하기", bin: "얼마나 만들까?" }
          - { text: "기계를 쓸지 사람을 더 뽑을지 정하기", bin: "어떻게 만들까?" }
          - { text: "재료를 어디에서 살지 정하기", bin: "어떻게 만들까?" }
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 기업이 소비자에게 설문 조사를 하는 까닭은?
        options:
          - 소비자가 원하는 상품을 만들어 많이 팔기 위해
          - 소비자에게 세금을 걷기 위해
          - 상품을 만들지 않기 위해
        answer: 소비자가 원하는 상품을 만들어 많이 팔기 위해

      - type: choice
        lv: B
        std: 6사11-01
        cat: 과정·기능
        bars:
          title: 우리 학교 학생들이 먹고 싶은 간식 (설문 조사)
          unit: 명
          items:
            - { label: "아이스크림", value: 58 }
            - { label: "과일 컵", value: 42 }
            - { label: "떡볶이", value: 35 }
            - { label: "샐러드", value: 12 }
          note: 예시 자료예요.
        q: 학교 앞 가게(기업)가 새 상품을 하나 만들려고 해요. 조사 결과를 보면 무엇을 만드는 것이 가장 합리적일까요?
        options: [아이스크림, 샐러드, 사장님이 좋아하는 메뉴]
        answer: 아이스크림
      - type: multi
        lv: B
        std: 6사11-01
        cat: 과정·기능
        q: 새 상품을 만들기 전에 기업이 더 조사해야 할 것을 모두 고르세요.
        options:
          - 만드는 데 드는 비용
          - 근처 다른 가게가 파는 상품과 가격
          - 소비자가 낼 수 있는 가격
          - 사장님 가족이 좋아하는 색깔
        answers: [만드는 데 드는 비용, 근처 다른 가게가 파는 상품과 가격, 소비자가 낼 수 있는 가격]
      - type: choice
        lv: B
        std: 6사11-01
        cat: 과정·기능
        table:
          title: 빵 만드는 방법 비교 (품질은 같아요)
          head: [방법, 하루에 만드는 빵, 하루에 드는 비용, 빵 1개를 만드는 비용]
          rows:
            - ["가. 사람이 손으로", "100개", "500,000원", "5,000원"]
            - ["나. 기계와 사람이 함께", "300개", "900,000원", "3,000원"]
        q: 같은 품질의 빵을 만든다면 어느 방법이 더 합리적일까요?
        options: [나 방법, 가 방법]
        answer: 나 방법
        explain: 빵 1개를 만드는 비용이 적으면 같은 값에 팔아도 이윤이 더 커요. 기업도 비용과 얻는 것을 비교해 선택해요.
      - type: choice
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 가계와 기업이 합리적으로 선택할 때 공통으로 따지는 것은?
        options:
          - 드는 비용과 얻는 만족(이익)을 비교한다
          - 무조건 가장 싼 것만 고른다
          - 다른 사람이 정해 준 대로 한다
        answer: 드는 비용과 얻는 만족(이익)을 비교한다

      - type: choice
        lv: A
        std: 6사11-01
        cat: 과정·기능
        bars:
          title: 아이스크림 가게의 계절별 판매량
          unit: 개
          items:
            - { label: "봄", value: 2400 }
            - { label: "여름", value: 6800 }
            - { label: "가을", value: 2100 }
            - { label: "겨울", value: 600 }
          note: 예시 자료예요.
        q: 그래프를 분석해 겨울을 앞둔 가게 사장님에게 가장 합리적인 계획을 골라 보세요.
        options:
          - 겨울에는 아이스크림을 적게 만들고, 핫초코 같은 따뜻한 상품을 함께 판다
          - 겨울에도 여름처럼 아이스크림을 많이 만든다
          - 겨울에는 가게 문을 닫고 일하는 사람을 모두 내보낸다
