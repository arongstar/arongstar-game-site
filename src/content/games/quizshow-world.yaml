categories:
- name: 공간 자료
  emoji: 🗺️
  items:
  - lv: C
    q: 실제 지구를 작게 줄여 둥글게 만든 모형은?
    answer: 지구본
  - lv: B
    q: 확대·축소하고 길을 찾을 수 있는 지도는?
    answer: 디지털 영상 지도
  - lv: A
    q: 세계지도에서 그린란드가 실제보다 크게 보이는 까닭을 말해 보세요.
    answer: 둥근 지구를 평평하게 펼치면 극지방으로 갈수록 실제보다 넓게 늘어나기 때문이에요.
- name: 위도와 경도
  emoji: 🧭
  items:
  - lv: C
    q: 위도 0°인 선은?
    answer: 적도
  - lv: B
    q: 경도 0°인 기준선은?
    answer: 본초 자오선
  - lv: A
    q: 적도 남쪽, 본초 자오선 서쪽에 있는 곳의 위치는 어떻게 나타낼까요?
    answer: 남위와 서경으로 나타내요.
- name: 대륙과 대양
  emoji: 🌊
  items:
  - lv: C
    q: 세계에서 가장 넓은 바다는?
    answer: 태평양
  - lv: B
    q: 면적이 가장 넓고 인구가 가장 많은 대륙은?
    answer: 아시아
  - lv: A
    q: 5대양의 이름을 모두 말해 보세요.
    answer: 태평양, 대서양, 인도양, 북극해, 남극해
- name: 여러 나라의 영토
  emoji: 🏳️
  items:
  - lv: C
    q: 영토가 가장 넓은 나라는?
    answer: 러시아
  - lv: B
    q: 바다와 맞닿지 않은 나라의 예를 한 가지 말해 보세요.
    answer: 몽골, 스위스 등
  - lv: A
    q: 반도국인 우리나라 위치의 좋은 점을 말해 보세요.
    answer: 대륙과 바다 양쪽으로 나아가기 좋아 여러 나라와 교류하기 유리해요.
