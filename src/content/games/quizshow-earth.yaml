# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: quizshow
unit: sci-6-1-4
title: 과학 퀴즈쇼 — 지구의 운동
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 태양과 별의 위치 변화, 자전과 낮과 밤, 공전과 계절별 별자리를 다뤄요.
lessons:
- '1'
standards:
- 6과12-01
- 6과12-02
- 6과12-03
minutes: 20
teacherGuide:
- 1차시 생각 열기나 단원 정리로 써요.
- 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
- name: 하늘 관찰
  emoji: 🌄
  items:
  - lv: C
    q: 남쪽을 보고 섰을 때 오른쪽은 어느 방위일까요?
    answer: 서쪽
  - lv: B
    q: 하루 동안 태양은 어느 쪽에서 어느 쪽으로 움직이는 것처럼 보일까요?
    answer: 동쪽에서 서쪽으로
  - lv: A
    q: 밤사이 별자리의 모양과 위치는 어떻게 변하는지 설명해 보세요.
    answer: 모양은 그대로이고 동쪽에서 서쪽으로 위치가 변해요.
- name: 자전
  emoji: 🔄
  items:
  - lv: C
    q: 지구가 하루에 한 바퀴씩 스스로 도는 것은?
    answer: 자전
  - lv: B
    q: 지구는 어느 방향으로 자전할까요?
    answer: 서쪽에서 동쪽으로
  - lv: A
    q: 낮과 밤이 생기는 까닭을 말해 보세요.
    answer: 지구가 자전하면서 태양 빛을 받는 쪽은 낮, 받지 못하는 쪽은 밤이 되기 때문이에요.
- name: 공전
  emoji: 🪐
  items:
  - lv: C
    q: 지구가 태양 둘레를 1년에 한 바퀴씩 도는 것은?
    answer: 공전
  - lv: B
    q: 지구가 공전하는 방향은?
    answer: 서쪽에서 동쪽으로
  - lv: A
    q: 자전과 공전의 차이점을 두 가지 말해 보세요.
    answer: 자전은 스스로 하루에 한 바퀴, 공전은 태양 둘레를 1년에 한 바퀴 돌아요.
- name: 계절별 별자리
  emoji: ✨
  items:
  - lv: C
    q: 겨울철 대표 별자리는?
    answer: 오리온자리
  - lv: B
    q: 여름철 밤하늘에서 볼 수 있는 별자리 한 가지는?
    answer: 거문고자리, 백조자리, 독수리자리 등
  - lv: A
    q: 여름에 오리온자리가 보이지 않는 까닭은?
    answer: 오리온자리가 태양과 같은 방향에 있어 낮에 떠 있기 때문이에요.
