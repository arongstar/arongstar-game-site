categories:
- name: 분단의 아픔
  emoji: 💔
  items:
  - lv: C
    q: 전쟁 등으로 헤어져 서로 만나지 못하는 가족은?
    answer: 이산가족
  - lv: B
    q: 분단으로 나타난 문제점 두 가지를 말해 보세요.
    answer: 예) 이산가족의 아픔, 전쟁에 대한 불안, 언어·문화의 차이, 국방비 부담
  - lv: A
    q: 남북한의 말이 달라진 까닭과 이를 줄이기 위한 노력을 말해 보세요.
    answer: 오랫동안 교류하지 못했기 때문이에요. 서로의 말을 알아보고 교류를 늘려요.
- name: 평화의 장소
  emoji: 🏞️
  items:
  - lv: C
    q: 남북한 대표가 만나 회담을 여는 곳은?
    answer: 판문점
  - lv: B
    q: 비무장 지대에 멸종 위기 생물이 많이 사는 까닭은?
    answer: 사람의 출입이 제한되어 자연이 잘 보존되었기 때문이에요.
  - lv: A
    q: 분단의 장소를 평화의 장소로 바꾸는 노력의 예를 들고 그 의미를 말해 보세요.
    answer: 예) DMZ 평화의 길 — 분단의 상징을 평화와 화해의 장소로 바꾸어 가요.
- name: 민주화
  emoji: 🗳️
  items:
  - lv: C
    q: 1960년 부정 선거에 맞서 학생과 시민들이 일어난 사건은?
    answer: 4·19 혁명
  - lv: B
    q: 6월 민주 항쟁의 결과 국민이 직접 뽑게 된 것은?
    answer: 대통령
  - lv: A
    q: 지방 자치제가 실시되어 달라진 우리 생활을 예를 들어 말해 보세요.
    answer: 주민이 지역의 대표를 직접 뽑고 지역의 일에 참여해요.
- name: 산업화
  emoji: 🏭
  items:
  - lv: C
    q: 산업화로 많아진 집의 형태는?
    answer: 아파트
  - lv: B
    q: 산업화로 사람들이 시골에서 도시로 옮겨 간 까닭은?
    answer: 도시에 일자리가 많아졌기 때문이에요.
  - lv: A
    q: 빠른 산업화로 생긴 문제 한 가지와 해결 방안을 말해 보세요.
    answer: 예) 환경 오염 — 친환경 에너지 사용, 쓰레기 줄이기
