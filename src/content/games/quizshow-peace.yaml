# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: quizshow
unit: soc-6-1-1
title: 사회 퀴즈쇼 — 평화 통일과 민주화·산업화
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 분단의 문제점, 평화의 장소, 민주화, 산업화로 달라진 생활을 정리해요.
