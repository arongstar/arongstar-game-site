template: mission
style: detective
unit: sci-6-2-1
title: 공전 모형 실험실
emoji: 🌍
summary: 지구 모형을 태양 둘레로 돌리며 자전축을 기울였을 때와 똑바로 세웠을 때를 비교해, 계절이 바뀌는 까닭을 밝혀요.
story: 과학 탐험대가 우주 실험실에서 지구 모형을 손에 넣었어요! 자전축의 기울기를 켜고 끄며 계절이 생기는 진짜 까닭을 실험으로 밝혀 주세요.
lessons: ['6', '7']
standards: [6과13-03]
minutes: 12
teacherGuide:
  - 6차시 '기울어진 채 공전하면', 7차시 '기울어지지 않는다면' 스테이지로 나뉘어 있어요.
  - 모형 그림에서 지구를 누르면 계절이 바뀌고, [자전축 기울기] 버튼으로 23.5°와 0°를 바꿀 수 있어요. 오른쪽 아래에 우리나라의 낮 12시 무렵 태양 높이가 나와요.
  - 교실에서 전등과 지구본으로 하는 모형 실험과 함께 쓰면 좋아요. 이때 바꾸는 조건은 '자전축 기울기' 하나뿐이라는 점(변인 통제)을 강조해 주세요.
stages:
  - id: tilted
    title: 기울어진 채 공전하는 지구
    emoji: 🔄
    lesson: '6'
    intro: 자전축이 기울어진 채 공전할 때 우리나라의 태양 높이를 관찰해요.
    steps:
      - type: choice
        lv: C
        std: 6과13-03
        cat: 과정·기능
        orbit: true
        q: 모형에서 지구를 '6월'과 '12월' 위치로 옮겨 보세요. 우리나라의 남중 고도가 더 높은 때는?
        options: [6월, 12월, 같다]
        answer: 6월
      - type: choice
        lv: C
        std: 6과13-03
        cat: 지식·이해
        q: 지구가 태양 둘레를 1년에 한 바퀴씩 도는 것을 무엇이라고 할까요?
        options: [공전, 자전, 남중]
        answer: 공전
      - type: multi
        lv: B
        std: 6과13-03
        cat: 과정·기능
        orbit: true
        q: 자전축이 기울어진 채 공전할 때 관찰한 결과를 모두 고르세요.
        options:
          - 지구의 위치에 따라 우리나라의 남중 고도가 달라진다
          - 남중 고도가 높을 때 땅이 받는 태양 에너지가 많다
          - 3월과 9월에는 남중 고도가 비슷하다
          - 지구의 위치와 관계없이 남중 고도가 늘 같다
        answers:
          - 지구의 위치에 따라 우리나라의 남중 고도가 달라진다
          - 남중 고도가 높을 때 땅이 받는 태양 에너지가 많다
          - 3월과 9월에는 남중 고도가 비슷하다
      - type: order
        lv: B
        std: 6과13-03
        cat: 지식·이해
        q: 계절이 바뀌는 까닭을 순서대로 놓아 보세요.
        items:
          - 지구의 자전축이 기울어진 채 태양 둘레를 공전한다
          - 지구의 위치에 따라 태양의 남중 고도가 달라진다
          - 땅이 받는 태양 에너지의 양이 달라진다
          - 기온이 달라져 계절이 바뀐다
      - type: choice
        lv: A
        std: 6과13-03
        cat: 지식·이해
        orbit: true
        q: 우리나라가 여름일 때 남반구의 오스트레일리아는 어떤 계절일까요? 모형을 근거로 추론해 보세요.
        hint: 자전축이 기울어져서 6월에는 북반구가 태양 쪽으로 기울어 있어요.
        options:
          - 남반구는 태양 반대쪽으로 기울어 있어 남중 고도가 낮으므로 겨울이다
          - 똑같이 여름이다
          - 계절이 없다
        answer: 남반구는 태양 반대쪽으로 기울어 있어 남중 고도가 낮으므로 겨울이다

  - id: upright
    title: 자전축이 기울어지지 않는다면?
    emoji: ⚖️
    lesson: '7'
    intro: 자전축 기울기를 0°로 바꾸어 비교 실험을 해요.
    steps:
      - type: choice
        lv: C
        std: 6과13-03
        cat: 과정·기능
        orbit: true
        q: 자전축 기울기를 0°로 끈 뒤 지구를 여러 위치로 옮겨 보세요. 우리나라의 남중 고도는 어떻게 되나요?
        options: [어느 위치에서나 같다, 6월에 가장 높다, 12월에 가장 높다]
        answer: 어느 위치에서나 같다
      - type: choice
        lv: B
        std: 6과13-03
        cat: 지식·이해
        orbit: true
        q: 자전축이 기울어지지 않은 채 공전한다면 우리나라에는 어떤 일이 생길까요?
        options:
          - 일 년 내내 남중 고도가 같아 계절의 변화가 생기지 않는다
          - 여름이 더 길어진다
          - 겨울만 계속된다
        answer: 일 년 내내 남중 고도가 같아 계절의 변화가 생기지 않는다
      - type: choice
        lv: B
        std: 6과13-03
        cat: 과정·기능
        q: 이 모형 실험에서 '다르게 한 조건'과 '같게 한 조건'으로 알맞은 것은?
        options:
          - 다르게 한 조건은 자전축 기울기, 같게 한 조건은 전등(태양)과의 거리와 지구본의 위치 등
          - 다르게 한 조건은 전등의 밝기, 같게 한 조건은 자전축 기울기
          - 모든 조건을 다르게 했다
        answer: 다르게 한 조건은 자전축 기울기, 같게 한 조건은 전등(태양)과의 거리와 지구본의 위치 등
      - type: multi
        lv: A
        std: 6과13-03
        cat: 과정·기능
        orbit: true
        q: 두 실험(23.5°와 0°)을 비교·분석해 내릴 수 있는 결론을 모두 고르세요.
        options:
          - 자전축이 기울어진 것이 계절에 따라 남중 고도가 달라지는 까닭이다
          - 지구가 공전하지 않고 한 자리에 있으면 기울어져 있어도 계절이 바뀌지 않는다
          - 계절 변화는 자전축이 기울어진 채 공전하기 때문에 생긴다
          - 계절은 태양이 지구 둘레를 돌기 때문에 생긴다
        answers:
          - 자전축이 기울어진 것이 계절에 따라 남중 고도가 달라지는 까닭이다
          - 지구가 공전하지 않고 한 자리에 있으면 기울어져 있어도 계절이 바뀌지 않는다
          - 계절 변화는 자전축이 기울어진 채 공전하기 때문에 생긴다
      - type: choice
        lv: A
        std: 6과13-03
        cat: 지식·이해
        q: 친구가 "여름에는 지구가 태양과 가까워서 더워."라고 말했어요. 탐구 결과를 근거로 가장 알맞게 고쳐 준 말은?
        options:
          - 계절은 거리 때문이 아니라, 자전축이 기울어진 채 공전해서 남중 고도와 낮의 길이가 달라지기 때문에 생겨
          - 맞아, 거리 때문에 계절이 생겨
          - 계절은 달이 지구 둘레를 돌기 때문에 생겨
        answer: 계절은 거리 때문이 아니라, 자전축이 기울어진 채 공전해서 남중 고도와 낮의 길이가 달라지기 때문에 생겨
        explain: 실제로 지구는 1월 초에 태양과 가장 가까워요. 거리 때문이라면 우리나라는 1월이 가장 더워야 하겠지요?
