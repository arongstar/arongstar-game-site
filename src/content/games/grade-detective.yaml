- 6영02-07
- 6영02-10
minutes: 15
teacherGuide:
- 1차시(Fun Talk 1 · Listen and Do)에 써요. 「Key Words」, 「Listen and Do」, 「Speak Up」 세 스테이지예요.
- 🔊 듣기는 미리 만든 영어 음성이에요. 🐢 천천히 버튼으로 느리게 들을 수 있어요. 대본은 답한 뒤에 볼 수 있어요.
- 따라 말하기의 녹음은 학생 기기 안에서만 다시 듣고 저장하거나 보내지 않아요. 「말 알아듣기」는 기본으로 꺼져 있어요.
