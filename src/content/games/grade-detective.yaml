# 6학년 영어 Lesson 1 — 자동 생성한 뒤 손으로 고쳐도 돼요. (대화·글은 이 사이트에서 새로 쓴 것이에요)
template: mission
style: detective
unit: eng-6-l01
title: Grade Detective — 학년 탐정
emoji: 🎧
summary: 서수(first~sixth)를 듣고 익히고, 학년을 묻고 답하는 대화를 들으며 세부 정보와 순서를 찾은 뒤, 강세와 억양에 맞게 따라 말해요.
story: 새 학년 첫날, 강당에 여러 학년 친구들이 모였어요! 탐정이 되어 누가 몇 학년인지 귀 기울여 알아내 보세요.
lessons:
- '1'
standards:
- 6영01-03
- 6영01-04
- 6영01-07
- 6영02-02
