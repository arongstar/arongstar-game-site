    - I'm sixth grade.
    - I'm in the six grade.
    answer: I'm in the sixth grade.
    say:
    - who: Leo
      text: What grade are you in?
    script: show
    explain: 학년은 순서를 나타내는 말(sixth)을 써서 완전한 문장 I'm in the ... grade. 로 말해요.
  - type: speak
    lv: A
    std: 6영02-10
    cat: 가치·태도
    q: 이번에는 묻고 답하는 말을 자신 있게 이어서 말해 보세요.
    target: What grade are you in? I'm in the sixth grade.
    stress:
    - grade
    - sixth
    tip: 묻는 말은 끝을 내리고, 잠깐 쉬었다가 대답해요.
