- id: speak
  title: Speak Up — 학년 묻고 답하기
  emoji: 🗣️
  lesson: '1'
  intro: 강세와 억양에 맞게 따라 말해요.
  steps:
  - type: speak
    lv: C
    std: 6영02-01
    cat: 과정·기능
    q: 본보기를 듣고 따라 말해 보세요.
