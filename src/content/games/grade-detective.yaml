    who: Sora
    stress:
    - grade
    tone: down
    tip: What 같은 의문사로 묻는 말은 끝을 내려요. grade 를 힘주어 말해요.
  - type: speak
    lv: B
    std: 6영02-01
    cat: 과정·기능
    q: 본보기를 듣고 따라 말해 보세요.
    target: I'm in the sixth grade.
    who: Leo
    stress:
    - sixth
    tone: down
    tip: 학년을 나타내는 sixth 를 힘주어 말해요. th 는 혀끝을 이 사이에 살짝 대요.
  - type: choice
    lv: A
    std: 6영02-07
    cat: 지식·이해
    q: Leo가 물어요. 6학년인 내가 할 알맞은 대답은?
