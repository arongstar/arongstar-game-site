# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: soc-6-1-1
title: 생활 문화 타임머신
emoji: 📻
summary: 4·19 혁명부터 6월 민주 항쟁까지 시민들의 노력과, 민주화와 산업화로 달라진 생활 문화를 과거와 오늘을 비교하며 알아봐요.
story: 타임머신을 타고 1960년대로 출발! 시민들이 민주주의를 지키려 한 순간과, 공장과 고속 국도가 생기며 달라진 생활 모습을 직접 보고 오늘로 돌아와요.
lessons:
- '6'
- '7'
- '8'
- '9'
standards:
- 6사07-02
minutes: 15
teacherGuide:
- 6·7차시 「민주화와 달라진 생활」, 8차시 「산업화와 달라진 생활」, 9차시 「오늘날의 생활 문화와 과제」 스테이지예요.
- 역사적 사건은 그림 대신 상황 카드로 보여 줘요. 교과서 사진 자료와 함께 쓰면 좋아요.
- 경제성장 과정은 6학년 2학기 2단원 「경제성장 타임머신」과 이어져요.
stages:
- id: democracy
  title: 민주화와 달라진 생활
  emoji: 🗳️
  lesson: '6'
  intro: 시민들의 노력으로 민주주의가 발전한 과정과 달라진 생활을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사07-02
    cat: 지식·이해
    q: 1987년 6월, 시민들이 대통령을 국민이 직접 뽑을 수 있게 해 달라고 요구한 사건은?
    options:
    - 6월 민주 항쟁
    - 4·19 혁명
    - 3·1 운동
    answer: 6월 민주 항쟁
    card:
      emoji: 📣
      title: 1987년 6월
      text: 전국의 학생과 시민들이 「대통령 직선제」를 외쳤어요. 그 결과 국민이 대통령을 직접 뽑을 수 있게 헌법이 바뀌었어요.
  - type: order
    lv: B
    std: 6사07-02
    cat: 지식·이해
    q: 민주주의를 위한 시민들의 노력을 일어난 차례대로 놓아 보세요.
    items:
    - 4·19 혁명 (1960년)
    - 5·18 민주화 운동 (1980년)
    - 6월 민주 항쟁 (1987년)
    - 지방 자치제 전면 실시 (1995년)
  - type: multi
    lv: B
    std: 6사07-02
    cat: 지식·이해
    q: 민주화로 달라진 생활 모습을 모두 골라 보세요.
    options:
    - 국민이 대통령을 직접 뽑는다
    - 주민이 시장, 도지사 같은 지역의 대표를 직접 뽑는다
    - 다양한 의견을 자유롭게 말하고 신문과 방송으로 전한다
    - 모든 사람이 같은 직업을 가진다
    answers:
    - 국민이 대통령을 직접 뽑는다
    - 주민이 시장, 도지사 같은 지역의 대표를 직접 뽑는다
    - 다양한 의견을 자유롭게 말하고 신문과 방송으로 전한다
  - type: choice
    lv: A
    std: 6사07-02
    cat: 과정·기능
    q: 오늘날 우리 동네 놀이터를 고치는 일을 주민 투표와 주민 회의로 정했어요. 이 모습과 가장 관련 깊은 민주화의 결과는?
    options:
    - 지방 자치제가 실시되어 주민이 지역의 일에 직접 참여하게 되었다
    - 경부 고속 국도가 개통되었다
    - 컬러 텔레비전 방송이 시작되었다
    answer: 지방 자치제가 실시되어 주민이 지역의 일에 직접 참여하게 되었다
    card:
      emoji: 🛝
      title: 우리 동네 놀이터
      text: 낡은 놀이터를 어떻게 고칠지 주민들이 회의를 열고 투표로 정했어요.
- id: industry
  title: 산업화와 달라진 생활
  emoji: 🏭
  lesson: '8'
  intro: 산업화로 달라진 생활 문화를 과거와 오늘을 비교하며 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사07-02
    cat: 과정·기능
    q: 두 그림을 비교해 보세요. 오늘날(오른쪽)에 많아진 집의 모습은?
    options:
    - 높은 아파트
    - 초가집
    - 움집
    answer: 높은 아파트
    photos: &id001
    - illust/so-life-past
    - illust/so-life-now
  - type: sort
    lv: B
    std: 6사07-02
    cat: 지식·이해
    q: 생활 모습의 변화를 민주화와 산업화 가운데 더 관련 깊은 것으로 나누어 보세요.
    bins:
    - 민주화로 달라진 생활
    - 산업화로 달라진 생활
    items:
    - text: 대통령을 국민이 직접 뽑는다
      bin: 민주화로 달라진 생활
    - text: 지역 대표를 주민이 직접 뽑는다
      bin: 민주화로 달라진 생활
    - text: 많은 사람이 일자리를 찾아 도시로 옮겨 갔다
      bin: 산업화로 달라진 생활
    - text: 냉장고, 세탁기 같은 가전제품이 널리 쓰인다
      bin: 산업화로 달라진 생활
    - text: 고속 국도가 생겨 먼 곳도 빨리 오간다
      bin: 산업화로 달라진 생활
  - type: choice
    lv: B
    std: 6사07-02
    cat: 과정·기능
    q: 표를 보고 알 수 있는 생활의 변화로 가장 알맞은 것은?
    options:
    - 한 가구에 함께 사는 사람 수가 점점 줄었다
    - 한 가구에 함께 사는 사람 수가 점점 늘었다
    - 가구원 수는 변하지 않았다
    answer: 한 가구에 함께 사는 사람 수가 점점 줄었다
    bars:
      title: 평균 가구원 수의 변화
      unit: 명
      items:
      - label: 1970년
        value: 5.2
      - label: 1990년
        value: 3.7
      - label: 2010년
        value: 2.7
      - label: 2020년
        value: 2.3
      note: '자료: 통계청 인구주택총조사 (소수 첫째 자리까지 나타냄)'
  - type: choice
    lv: A
    std: 6사07-02
    cat: 과정·기능
    q: 산업화 과정에서 가구원 수가 줄어든 까닭을 가장 알맞게 추론한 것은?
    options:
    - 일자리를 찾아 도시로 옮겨 가는 사람이 늘고, 부모와 자녀만 사는 가족이 많아졌기 때문이다
    - 사람들이 시골로 많이 이사했기 때문이다
    - 집이 점점 넓어졌기 때문이다
    answer: 일자리를 찾아 도시로 옮겨 가는 사람이 늘고, 부모와 자녀만 사는 가족이 많아졌기 때문이다
    photos: *id001
- id: today
  title: 오늘날의 생활 문화와 과제
  emoji: 📱
  lesson: '9'
  intro: 오늘날의 생활 문화와 앞으로 해결할 과제를 생각해요.
  steps:
  - type: multi
    lv: C
    std: 6사07-02
    cat: 지식·이해
    q: 오늘날 우리 생활 문화의 모습을 모두 골라 보세요.
    options:
    - 인터넷과 스마트폰으로 정보를 나눈다
    - 우리 노래와 드라마가 세계 여러 나라에서 사랑받는다
    - 여가 시간에 다양한 문화생활을 즐긴다
    - 대부분의 사람이 연탄으로 난방을 한다
    answers:
    - 인터넷과 스마트폰으로 정보를 나눈다
    - 우리 노래와 드라마가 세계 여러 나라에서 사랑받는다
    - 여가 시간에 다양한 문화생활을 즐긴다
  - type: sort
    lv: B
    std: 6사07-02
    cat: 과정·기능
    q: 빠른 산업화로 생긴 문제와 해결 노력을 짝지어 보세요.
    bins:
    - 환경 오염
    - 도시 문제
    - 노동 문제
    items:
    - text: 공장 매연으로 공기가 나빠졌다 → 친환경 에너지를 늘린다
      bin: 환경 오염
    - text: 도시에 사람이 몰려 집과 교통이 부족하다 → 대중교통과 새 도시를 만든다
      bin: 도시 문제
    - text: 오랜 시간 일하는 노동자가 많았다 → 노동자의 권리를 지키는 법을 만든다
      bin: 노동 문제
  - type: choice
    lv: A
    std: 6사07-02
    cat: 가치·태도
    q: 민주화와 산업화로 달라진 오늘날의 생활 문화를 더 좋게 만들기 위해 시민으로서 할 일로 가장 알맞은 것은?
    options:
    - 선거와 지역의 일에 참여하고, 환경과 이웃을 생각하며 생활한다
    - 편리하니까 자원을 마음껏 쓴다
    - 나와 상관없는 일에는 관심을 두지 않는다
    answer: 선거와 지역의 일에 참여하고, 환경과 이웃을 생각하며 생활한다
