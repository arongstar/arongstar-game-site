template: mission
style: detective
unit: sci-6-2-3
title: 전자석 연구소
emoji: 🧲
summary: 가상 전자석으로 전지의 수와 연결 방향을 바꾸며 전자석의 성질을 탐색하고, 영구 자석과 비교한 뒤 생활 속 쓰임을 조사해요.
story: 과학 탐험대가 못과 에나멜선, 전지로 신기한 자석을 만들었어요! 스위치를 켜고 끄며 전자석의 비밀을 밝히고, 우리 주변 어디에 숨어 있는지 찾아보세요.
lessons: ['5', '6', '7']
standards: [6과15-03]
minutes: 12
teacherGuide:
  - 5차시 '전자석 만들기', 6차시 '영구 자석과 비교', 7차시 '전자석의 쓰임' 스테이지로 나뉘어 있어요.
  - 전자석 그림에서 전지 수, 전지 방향, 스위치를 바꾸면 붙는 클립 수와 못 끝의 극이 바뀌어요. 클립 수는 이해를 돕는 예시 값이에요.
  - 교육과정에 따라 '전류에 의한 자기장' 개념은 다루지 않아요.
stages:
  - id: make
    title: 전자석 만들기
    emoji: 🔩
    lesson: '5'
    intro: 전자석을 만들고 스위치를 켜고 꺼 봐요.
    steps:
      - type: choice
        lv: C
        std: 6과15-03
        cat: 과정·기능
        magnet: true
        q: 스위치를 켜고 끄며 클립을 관찰해 보세요. 스위치를 끄면 어떻게 되나요?
        options: [클립이 떨어진다, 클립이 더 많이 붙는다, 변화가 없다]
        answer: 클립이 떨어진다
      - type: choice
        lv: C
        std: 6과15-03
        cat: 지식·이해
        q: 전기가 흐를 때만 자석의 성질을 가지는 자석을 무엇이라고 할까요?
        options: [전자석, 영구 자석, 나침반]
        answer: 전자석
      - type: order
        lv: B
        std: 6과15-03
        cat: 과정·기능
        q: 전자석을 만드는 순서대로 놓아 보세요.
        items:
          - 둥근머리 볼트(못)에 종이테이프를 감는다
          - 그 위에 에나멜선을 한쪽 방향으로 촘촘하게 감는다
          - 에나멜선 양 끝의 겉면을 사포로 벗겨 낸다
          - 에나멜선을 전지, 스위치와 연결해 회로를 만든다
      - type: multi
        lv: A
        std: 6과15-03
        cat: 과정·기능
        card:
          emoji: 🔧
          title: 클립이 붙지 않아요!
          text: 친구가 만든 전자석에 스위치를 켰는데 클립이 하나도 붙지 않아요.
        q: 클립이 붙지 않은 까닭으로 알맞은 것을 모두 골라 보세요.
        options:
          - 에나멜선 끝의 겉면을 벗겨 내지 않았다
          - 전지를 다 써서 전기가 거의 흐르지 않는다
          - 회로의 연결 부분이 떨어져 있다
          - 에나멜선을 한쪽 방향으로 감았다
        answers:
          - 에나멜선 끝의 겉면을 벗겨 내지 않았다
          - 전지를 다 써서 전기가 거의 흐르지 않는다
          - 회로의 연결 부분이 떨어져 있다
        explain: 에나멜선 겉면은 전기가 통하지 않는 물질로 덮여 있어 끝을 벗겨야 하고, 회로가 끊기거나 전지가 다 되면 전기가 흐르지 않아 전자석이 되지 않아요. 한쪽 방향으로 감는 것은 올바른 방법이에요.

  - id: compare
    title: 영구 자석과 비교하기
    emoji: ⚖️
    lesson: '6'
    intro: 전지의 수와 방향을 바꾸며 전자석의 성질을 탐색해요.
    steps:
      - type: choice
        lv: C
        std: 6과15-03
        cat: 과정·기능
        magnet: true
        q: 전지를 1개에서 2개로 바꿔 보세요. 붙는 클립의 수는 어떻게 되나요?
        options: [많아진다, 적어진다, 같다]
        answer: 많아진다
        explain: 전지 두 개를 직렬연결하면 전자석의 세기가 더 세져요.
      - type: choice
        lv: B
        std: 6과15-03
        cat: 과정·기능
        magnet: true
        q: 전지의 연결 방향을 바꿔 보세요. 나침반 바늘과 못 끝의 극은 어떻게 되나요?
        options:
          - 나침반 바늘이 반대로 돌고, 못 끝의 극이 바뀐다
          - 아무 변화가 없다
          - 클립이 모두 떨어진다
        answer: 나침반 바늘이 반대로 돌고, 못 끝의 극이 바뀐다
      - type: sort
        lv: B
        std: 6과15-03
        cat: 지식·이해
        q: 전자석과 영구 자석의 성질을 나누어 보세요.
        bins: [전자석만, 영구 자석만, 둘 다]
        items:
          - { text: "전기가 흐를 때만 자석의 성질이 있다", bin: "전자석만" }
          - { text: "전지의 수로 세기를 바꿀 수 있다", bin: "전자석만" }
          - { text: "전지의 방향으로 극을 바꿀 수 있다", bin: "전자석만" }
          - { text: "늘 자석의 성질을 가지고 있다", bin: "영구 자석만" }
          - { text: "N극과 S극이 있다", bin: "둘 다" }
          - { text: "철로 된 물체를 끌어당긴다", bin: "둘 다" }
      - type: multi
        lv: A
        std: 6과15-03
        cat: 과정·기능
        magnet: true
        q: 실험 결과를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 전자석의 세기는 전지의 수에 따라 달라진다
          - 전자석의 극은 전지의 연결 방향에 따라 달라진다
          - 전자석은 스위치로 자석의 성질을 켜고 끌 수 있다
          - 전자석은 전기가 흐르지 않아도 클립을 붙잡는다
        answers:
          - 전자석의 세기는 전지의 수에 따라 달라진다
          - 전자석의 극은 전지의 연결 방향에 따라 달라진다
          - 전자석은 스위치로 자석의 성질을 켜고 끌 수 있다

  - id: uses
    title: 우리 주변의 전자석
    emoji: 🏗️
    lesson: '7'
    intro: 전자석이 사용되는 예를 조사해요.
    steps:
      - type: multi
        lv: C
        std: 6과15-03
        cat: 지식·이해
        q: 전자석이 사용되는 물건을 모두 고르세요.
        options: [고철을 옮기는 전자석 기중기, 스피커, 선풍기 속 전동기, 나무 숟가락]
        answers: [고철을 옮기는 전자석 기중기, 스피커, 선풍기 속 전동기]
      - type: choice
        photo: illust/scrapyard
        lv: B
        std: 6과15-03
        cat: 지식·이해
        card: { emoji: "🏗️", title: "고철 처리장", text: "커다란 전자석 기중기가 고철 더미를 들어 올려 트럭에 옮겨 싣고 있어요." }
        q: 고철을 옮길 때 영구 자석이 아니라 전자석 기중기를 쓰는 까닭은?
        options:
          - 전기를 끊으면 자석의 성질이 사라져 원하는 곳에 고철을 내려놓을 수 있기 때문에
          - 전자석이 더 가볍기 때문에
          - 영구 자석은 철을 끌어당기지 못하기 때문에
        answer: 전기를 끊으면 자석의 성질이 사라져 원하는 곳에 고철을 내려놓을 수 있기 때문에
      - type: choice
        photo: illust/maglev
        lv: A
        std: 6과15-03
        cat: 지식·이해
        card: { emoji: "🚄", title: "자기 부상 열차", text: "전자석의 힘으로 열차를 선로 위에 살짝 띄워 달리게 해요." }
        q: 자기 부상 열차에서 영구 자석보다 전자석이 알맞은 까닭을 분석한 것으로 가장 알맞은 것은?
        options:
          - 전기로 자석의 세기와 극을 조절할 수 있어 열차를 띄우고 움직이는 힘을 알맞게 바꿀 수 있기 때문에
          - 전자석은 전기가 없어도 늘 같은 힘을 내기 때문에
          - 영구 자석은 극이 없기 때문에
        answer: 전기로 자석의 세기와 극을 조절할 수 있어 열차를 띄우고 움직이는 힘을 알맞게 바꿀 수 있기 때문에
      - type: shop
        lv: A
        std: 6과15-03
        cat: 과정·기능
        customer: { emoji: "🏫", name: "우리 학교 발명 동아리", place: "과학실", says: "전자석의 성질을 이용해 생활을 편리하게 만드는 발명품을 만들고 싶어요." }
        q: 전자석의 성질을 제대로 이용한 발명 아이디어를 모두 골라 보세요.
        features:
          - { text: "버튼을 누르면 떨어진 철 클립을 모았다가, 버튼을 떼면 상자에 내려놓는 클립 수거기", fit: true, why: "전기가 흐를 때만 자석이 되는 성질을 이용했어요." }
          - { text: "전지 수를 바꿔 들어 올리는 힘을 조절하는 장난감 기중기", fit: true, why: "전지의 수에 따라 세기가 달라지는 성질을 이용했어요." }
          - { text: "나무 블록을 끌어당기는 전자석 장난감", fit: false, why: "자석은 나무를 끌어당기지 못해요." }
          - { text: "전기 없이도 늘 붙어 있는 전자석 냉장고 자석", fit: false, why: "전자석은 전기가 흐를 때만 자석의 성질을 가져요." }
        planLabels: { title: "💡 발명 아이디어 카드 (선택)", name: "발명품 이름", slogan: "한 줄 소개", when: "어디에 쓰면 좋을까?", save: "발명 카드 저장", emoji: "💡" }
