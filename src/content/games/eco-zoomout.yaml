template: zoomout
unit: soc-6-2-2
title: 줌아웃! 이건 어떤 경제활동?
emoji: 🔭
summary: 아주 크게 확대된 사진이 조금씩 넓어지면, 모둠끼리 어떤 경제활동의 모습인지 맞혀요. 빨리 맞힐수록 점수가 높아요.
lessons: ['1']
standards: [6사11-01, 6사11-02, 6사11-03]
minutes: 15
ask: 이 사진은 어떤 경제활동의 모습일까요? 무엇을 만들거나 사고팔고 있을까요?
vote: 🙋 이 경제활동과 관련된 경험이 있는 사람?
voteTitle: 🙋 우리 반이 가장 많이 경험한 경제활동
outro: 이 단원에서 가계와 기업, 우리나라의 경제성장, 세계와의 무역을 하나씩 탐험해 봐요!
teacherGuide:
  - 1차시 단원 도입에서 전자칠판에 띄워요. 탐험할 장면 수를 고르고 시작해요.
  - 사진은 처음에 6배로 확대돼 있어요. [더 넓게 보기]를 누를 때마다 점수가 300 → 200 → 100 → 50점으로 줄어요.
  - 정답을 공개하면 이 단원의 어느 소주제와 이어지는지 알려 줘요. "이 경제활동과 관련된 경험이 있는 사람?"으로 손을 든 학생 수를 세어 두면 마지막에 순위가 나와요.
  - 교과서의 '단원에서 공부할 내용 확인하기', '탐구 질문 만들기'와 이어져요. 궁금한 점은 학생 태블릿의 탐험 질문 수첩에 적게 해 주세요.
rounds:
  - photo: economy/market
    name: 전통 시장
    tag: 시장
    desc: 물건을 사고파는 곳이에요. 가계는 필요한 물건을 사고, 상인은 물건을 팔아 소득을 얻어요. (소주제 1)
    focus: [48, 62]
    question: 시장에는 어떤 종류가 있을까요? 눈에 보이지 않는 시장도 있을까요?
  - photo: economy/mart
    name: 대형 마트
    tag: 시장
    desc: 여러 기업이 만든 상품이 모여 있어요. 가계는 가격과 품질을 비교해 합리적으로 선택해요. (소주제 1)
    focus: [86, 78]
    question: 물건을 살 때 무엇을 비교하나요?
  - photo: economy/factory
    name: 자동차 공장
    tag: 기업
    desc: 기업은 이윤을 얻기 위해 무엇을, 얼마나, 어떻게 만들지 선택해요. 사람과 로봇이 함께 자동차를 만들어요. (소주제 1)
    focus: [55, 22]
    question: 이곳에서 일하는 사람들에게는 어떤 권리가 있을까요?
  - photo: economy/shipyard
    name: 조선소
    tag: 경제성장
    desc: 1970년대부터 발달한 중화학 공업의 하나로, 큰 배를 만들어 다른 나라에 팔아요. (소주제 2)
    focus: [58, 58]
  - photo: economy/chip
    name: 반도체
    tag: 수출
    desc: 오늘날 우리나라에서 가장 많이 수출하는 상품 가운데 하나예요. (소주제 2·3)
    focus: [38, 60]
    question: 반도체는 우리 생활 속 어디에 쓰일까요?
  - photo: economy/port
    name: 컨테이너 항구
    tag: 무역
    desc: 다른 나라와 사고파는 상품이 컨테이너에 실려 배로 오가요. (소주제 3)
    focus: [80, 63]
    question: 컨테이너 안에는 어떤 물건이 들어 있을까요?
  - photo: economy/coffee
    name: 커피 농장
    tag: 수입
    desc: 커피는 덥고 비가 많은 곳에서 잘 자라서, 우리나라는 브라질·베트남 같은 나라에서 수입해요. (소주제 3)
    focus: [40, 72]
  - photo: economy/oil
    name: 석유
    tag: 수입
    desc: 우리나라에는 석유가 거의 나지 않아 사우디아라비아 같은 나라에서 수입해요. (소주제 3)
    focus: [55, 40]
  - photo: economy/banana
    name: 바나나 농장
    tag: 수입
    desc: 우리나라가 먹는 바나나는 대부분 필리핀처럼 덥고 비가 많은 나라에서 수입해요. (소주제 3)
    focus: [11, 68]
