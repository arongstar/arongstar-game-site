summary: 영어 RPG 첫 번째 지역이에요. 학교 친구들에게 퀘스트를 받아 학년·동아리를 묻고 답하고, 낱말 요정을 친구로 만들고, 학교 퀴즈 대회에 도전해요.
story: Lingo 섬에 도착한 첫날! 학교 곳곳의 친구들이 도움을 기다리고 있어요. ❗ 표시가 있는 친구에게 말을 걸어 퀘스트를 해결해 보세요.
