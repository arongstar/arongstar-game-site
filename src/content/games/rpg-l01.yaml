          - { who: Amara, text: "I'm in the dance club." }
        script: true
        options: ['💃 춤 동아리', '⚽ 축구 동아리', '📚 책 동아리']
        answer: '💃 춤 동아리'
      - t: choose
        lv: [C, B]
        std: 6영01-03
        cat: 지식·이해
        q: 🎨 그림에 알맞은 동아리를 골라요.
        options: [art club, book club, soccer club]
        answer: art club
        optionsAudio: true
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: Mina 는 무슨 동아리인가요? (대본 없이 들어요)
        say:
          - { who: Ben, text: "Mina, what club are you in?" }
          - { who: Mina, text: "I'm in the cooking club. I make cookies." }
        options: ['🍳 요리 동아리', '🎵 음악 동아리', '🏸 배드민턴 동아리']
        answer: '🍳 요리 동아리'
      - t: build
        std: 6영02-07
        q: 동아리를 묻는 질문을 만들어요.
        answer: "What club are you in?"
        extra: [grade]
        ko: 너는 무슨 동아리니?
      - t: build
        lv: [A]
        std: 6영02-07
        q: 소리만 듣고, Leo 가 동아리를 대답하는 문장을 만들어요.
        answer: "I'm in the history club."
        extra: [art]
      - t: speak
        std: 6영02-01
        q: Amara 에게 동아리를 물어봐요. 끝을 내려 말해요.
        target: "What club are you in?"
        who: Leo
        stress: [club]
        tone: down
      - { t: talk, who: Amara, text: "Great job! The club fair is so much fun." }
  - id: thsound
    title: 도서관 게시판과 th 소리
    emoji: 📌
    lesson: '3'
    npc: ben
    steps:
      - { t: talk, who: Ben, text: "Look! There's a notice on the library board." }
      - t: read
        title: 📌 Book Club News
        lines:
          - { text: "Are you in the third grade or the fourth grade?" }
          - { text: "Do you like books?" }
          - { text: "Come to the book club!" }
          - { text: "We meet in the library on Thursday." }
      - t: choose
        std: 6영01-04
        q: 책 동아리는 어디에서 모이나요?
        options: ['📖 도서관', '🚪 교실', '⚽ 운동장']
        answer: '📖 도서관'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: 책 동아리는 무슨 요일에 모이나요?
        options: [Monday, Thursday, Friday]
        answer: Thursday
      - { t: talk, who: Ben, text: "Listen! Third, Thursday, thank you. They all have the th sound." }
      - t: choose
        std: 6영01-02
        q: 🔊 Ben 이 말한 낱말을 골라요.
        say: [{ who: Ben, text: "three" }]
        options: [three, tree, free]
        answer: three
        optionsAudio: true
        explain: three 는 혀끝을 이 사이에 두고 내는 th /θ/ 소리로 시작해요.
      - t: choose
        lv: [B, A]
        std: 6영01-02
        q: th /θ/ 소리가 들어 있지 않은 낱말은 무엇일까요?
        options: [math, think, sing]
        answer: sing
        optionsAudio: true
      - { t: spell, lv: [C], std: 6영02-02, word: math, emoji: ➗ }
      - { t: spell, lv: [B, A], std: 6영02-02, word: third, emoji: 3️⃣ }
      - t: build
        lv: [A]
        std: 6영02-03
        q: 대문자와 문장 부호에 주의하며 게시판 문장을 완성해요.
        answer: "We meet in the library on Thursday."
        extra: [thursday, we]
        listen: false
        ko: 우리는 목요일에 도서관에서 만나요.
  - id: letter
    title: 세계 친구의 편지 읽기
    emoji: ✉️
    lesson: '4'
    npc: leo
    steps:
      - { t: talk, who: Leo, text: "I got a letter from my cousin Max. Can you read it with me?" }
      - t: read
        title: ✉️ A Letter from Max
        lines:
          - { who: Max, text: "Hi, Leo! How are you?" }
          - { who: Max, text: "I'm in the fifth grade now." }
          - { who: Max, text: "In my school, fifth graders are the oldest students." }
          - { who: Max, text: "I'm in the science club. We make small robots." }
          - { who: Max, text: "What grade are you in? Write back soon!" }
      - t: choose
        std: 6영01-05
        q: 이 편지는 무엇에 관한 글인가요?
        options: ['Max 의 학교생활 소개', 'Max 의 여행 계획', 'Max 의 생일 초대']
        answer: 'Max 의 학교생활 소개'
      - t: choose
        std: 6영01-04
        q: Max 는 무슨 동아리인가요?
        options: ['🔬 과학 동아리', '🎨 미술 동아리', '🏛️ 역사 동아리']
        answer: '🔬 과학 동아리'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: Max 는 동아리에서 무엇을 만드나요?
        options: [robots, cookies, pictures]
