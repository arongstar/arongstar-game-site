# 영어 RPG 「Lingo Island 대모험」 — Lesson 1 지역: Lingo 학교
# 대화·글·등장인물은 이 사이트에서 새로 썼어요. 의사소통 기능·낱말은 동아출판(정은숙 외) 6학년 Lesson 1 을 따랐어요.
