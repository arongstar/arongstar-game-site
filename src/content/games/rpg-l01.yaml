quests:
  - id: grade
    title: 새 친구의 학년 알아내기
    emoji: 🔍
    lesson: '1'
    npc: ken
    steps:
      - { t: talk, who: Ken, text: "Hi! I'm Ken. I'm new here." }
      - { t: talk, who: Ken, text: "I want to make friends. Can you help me?" }
      - t: choose
        lv: [C]
        std: 6영01-03
        cat: 지식·이해
        q: Ken 이 어떤 말을 배우고 싶어 해요. 「너는 몇 학년이니?」에 알맞은 영어를 골라요.
        options: ["What grade are you in?", "What club are you in?", "How are you?"]
        answer: "What grade are you in?"
        optionsAudio: true
      - t: build
        lv: [B, A]
        std: 6영02-07
        q: 낱말 블록으로 학년을 묻는 질문을 만들어요.
        answer: "What grade are you in?"
        extra: [club]
        ko: 너는 몇 학년이니?
      - t: choose
        std: 6영01-04
        q: 질문하자 Ken 이 대답했어요. Ken 은 몇 학년인가요?
        say: [{ who: Ken, text: "I'm in the fourth grade." }]
        options: ['3학년', '4학년', '6학년']
        answer: '4학년'
      - t: choose
        lv: [B, A]
        std: 6영01-04
        q: 이번에는 Sora 와 Ben 의 대화예요. Ben 은 몇 학년인가요?
        say:
          - { who: Sora, text: "What grade are you in, Ben?" }
          - { who: Ben, text: "I'm in the third grade. What about you?" }
          - { who: Sora, text: "I'm in the sixth grade." }
        options: ['2학년', '3학년', '6학년']
        answer: '3학년'
      - t: speak
        std: 6영02-01
        q: 나의 학년을 Ken 에게 말해 봐요. 들어 보고 따라 말해요.
        target: "I'm in the sixth grade."
        who: Sora
        stress: [sixth, grade]
        tone: down
        tip: sixth 의 th 는 혀끝을 이 사이에 살짝 물고 바람을 내보내요.
      - { t: spell, lv: [B, A], std: 6영02-02, word: sixth, emoji: 6️⃣ }
      - { t: talk, who: Ken, text: "Thank you! Now I know my new friends." }
  - id: club
    title: 동아리 박람회 안내하기
    emoji: 🎪
    lesson: '2'
    npc: amara
    steps:
      - { t: talk, who: Amara, text: "Welcome to the club fair!" }
      - { t: talk, who: Amara, text: "Let's find out what club everyone is in." }
      - t: choose
