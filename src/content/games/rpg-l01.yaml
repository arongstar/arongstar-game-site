      - t: choose
        std: 6영01-10
        cat: 가치·태도
        q: Max 의 학교에서는 몇 학년이 가장 높은 학년인가요?
        options: ['5학년', '6학년']
        answer: '5학년'
        explain: 나라와 학교마다 초등학교에서 가장 높은 학년이 달라요. 우리와 다른 점을 알고 존중해요.
      - t: build
        lv: [B, A]
        std: 6영02-07
        q: Max 에게 답장을 써요. 학년을 묻는 질문에 대답하는 문장을 만들어요.
        answer: "I'm in the sixth grade."
        extra: [fifth]
        ko: 나는 6학년이야.
