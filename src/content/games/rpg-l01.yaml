minutes: 40
teacherGuide:
  - 차시마다 퀘스트가 하나씩 있어요(1차시 학년 → 2차시 동아리 → 3차시 읽기·파닉스 th → 4차시 세계 친구 글 → 5차시 자기소개 글). 6차시에는 김 선생님의 「학교 퀴즈 대회」(지역 대장)에 도전해요.
  - 🧭 살펴보기는 대본·우리말 도움이 많고, 🔎 조사하기는 대본 없이 듣고 문장을 만들며, 🏅 분석하기는 소리만 듣고 철자·말하기까지 해요. 단계마다 기록이 따로 저장돼요.
  - ✨ 낱말 요정은 지도 곳곳에 나타나요. 세 문제 중 두 개를 맞히면 친구가 돼 도감에 모여요. 다른 지역의 낱말도 복습 문제로 섞여 나와요.
  - 학생 기기마다 기록이 저장돼요. ⚙️ 설정에서 이 지역만, 또는 영어 RPG 전체를 처음부터 다시 할 수 있어요(다른 교과 기록은 그대로).
