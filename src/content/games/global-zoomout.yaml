template: zoomout
unit: soc-6-2-3
title: 줌아웃! 사람들은 어디에 살까?
emoji: 🔭
summary: 아주 크게 확대된 사진이 조금씩 넓어지면, 모둠끼리 어디인지, 사람이 많이 살지 적게 살지 맞혀요.
lessons: ['1']
standards: [6사12-01, 6사12-02]
minutes: 15
ask: 여기는 어떤 곳일까요? 이곳에는 사람이 많이 살까요, 적게 살까요?
vote: 🙋 이곳에서 한번 살아 보고 싶은 사람?
voteTitle: 🙋 우리 반이 가장 살아 보고 싶은 곳
outro: 사람들은 왜 어떤 곳에는 많이, 어떤 곳에는 적게 살까요? 이번 단원에서 탐험해 봐요!
teacherGuide:
  - 1차시 단원 도입에서 전자칠판에 띄워요. 사진이 넓어질수록 점수가 300 → 200 → 100 → 50점으로 줄어요.
  - 정답을 공개하면 그곳에 사람이 많이 사는지 적게 사는지와 그 까닭이 나와요. 1단원 「세계의 자연환경」에서 배운 지형·기후와 이어서 이야기해 주세요.
  - 마지막 사진(투발루)은 2소주제 '지구촌 문제'로 이어지는 질문을 던져요.
rounds:
  - photo: global/city
    name: 사람이 북적이는 큰 도시
    tag: 인구가 많아요
    desc: 일자리가 많고 교통·학교·병원 같은 시설이 잘 갖추어져 사람들이 모여들어요. (인문환경)
    focus: [50, 50]
    question: 사람들은 왜 큰 도시로 모여들까요?
  - photo: global/farmland
    name: 벼농사를 짓는 아시아의 평야
    tag: 인구가 많아요
    desc: 덥고 비가 많은 여름과 넓은 평야 덕분에 많은 사람이 먹을 쌀을 기를 수 있어 옛날부터 사람이 많이 살았어요.
    focus: [50, 50]
  - photo: landforms/sahara
    name: 사하라 사막
    tag: 인구가 적어요
    desc: 비가 거의 내리지 않아 물과 먹을 것을 얻기 어려워 사람이 아주 적게 살아요.
    focus: [40, 60]
  - photo: global/greenland
    name: 그린란드의 작은 마을
    tag: 인구가 적어요
    desc: 너무 추워 농사를 짓기 어렵고, 사람들은 주로 바닷가에 작은 마을을 이루어 살아요.
    focus: [50, 50]
  - photo: landforms/amazon
    name: 아마존 열대 우림
    tag: 인구가 적어요
    desc: 덥고 습하며 숲이 빽빽해 길을 내기 어려워 사람이 적게 살아요.
    focus: [55, 45]
  - photo: landforms/himalaya
    name: 히말라야산맥
    tag: 인구가 적어요
    desc: 너무 높고 추워 사람이 살기 어려워요. 낮은 골짜기에 작은 마을이 있어요.
    focus: [55, 25]
  - photo: global/tuvalu
    name: 태평양의 섬나라 투발루
    tag: 지구촌 문제
    desc: 아름다운 섬나라지만, 바닷물 높이가 올라가 땅이 물에 잠길 위기에 놓여 있어요. (소주제 2)
    focus: [50, 50]
    question: 이 섬나라는 왜 위기에 놓였을까요? 우리와는 어떤 관계가 있을까요?
