template: mission
style: detective
unit: soc-6-2-3
title: 인구 구조 탐정
emoji: 👶
summary: 나라마다 어린이·어른·노인이 얼마나 되는지 비교해 인구 특징을 밝혀내고, 저출산·고령화와 인구 급증 문제의 해결 방안을 찾아요.
story: 탐정 사무소에 여러 나라의 '인구 구성 막대'가 도착했어요. 어린이가 많은 나라, 노인이 많은 나라를 가려내고, 각 나라에 필요한 인구 정책을 제안해 주세요.
lessons: ['5', '6']
standards: [6사12-01]
minutes: 12
teacherGuide:
  - 5차시 '여러 나라의 인구 특징', 6차시 '인구 문제와 해결 방안' 스테이지로 나뉘어 있어요.
  - 나이별 인구 구성(0~14세·15~64세·65세 이상)과 합계 출산율은 세계은행·통계청 자료를 어림한 값이에요.
  - 6차시 🏅 분석하기에서는 고령화가 빠른 시골 군의 인구 정책을 기획해 카드로 저장해요. 저장한 카드는 탐험 리포트에 모여요.
stages:
  # ════════════ 여러 나라의 인구 특징 ════════════
  - id: structure
    title: 나라마다 다른 인구 구성
    emoji: 📊
    lesson: '5'
    intro: 어린이·어른·노인의 비율로 나라의 인구 특징을 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6사12-01
        cat: 과정·기능
        agebars: &ages
          title: 나라별 나이에 따른 인구 구성 (어림값)
          items:
            - { label: "대한민국", young: 11, adult: 70, old: 19 }
            - { label: "일본", young: 11, adult: 60, old: 29 }
            - { label: "미국", young: 17, adult: 65, old: 18 }
            - { label: "인도", young: 25, adult: 68, old: 7 }
            - { label: "니제르", young: 49, adult: 48, old: 3 }
          note: 세계은행·통계청 자료(2023~2024년)를 어림한 값이에요.
        q: 어린이(0~14세) 비율이 가장 높은 나라는 어디일까요?
        hint: 초록색 부분이 가장 긴 나라를 찾아보세요.
        options: [니제르, 일본, 대한민국]
        answer: 니제르
        explain: 아프리카의 니제르는 사람 두 명 가운데 한 명꼴이 어린이예요.
      - type: choice
        lv: C
        std: 6사12-01
        cat: 과정·기능
        agebars: *ages
        q: 노인(65세 이상) 비율이 가장 높은 나라는 어디일까요?
        options: [일본, 인도, 니제르]
        answer: 일본
      - type: choice
        lv: C
        std: 6사12-01
        cat: 지식·이해
        q: "'저출산'은 무슨 뜻일까요?"
        options: [아이를 적게 낳는 것, 노인이 많아지는 것, 인구가 빠르게 늘어나는 것]
        answer: 아이를 적게 낳는 것

      - type: choice
        lv: B
        std: 6사12-01
        cat: 과정·기능
        bars: &tfr
          title: 우리나라의 합계 출산율 변화
          unit: 명
          items:
            - { label: "1970년", value: 4.53 }
            - { label: "1983년", value: 2.06 }
            - { label: "2000년", value: 1.48 }
            - { label: "2018년", value: 0.98 }
            - { label: "2023년", value: 0.72 }
          note: 통계청 자료예요. 합계 출산율은 여성 한 명이 평생 낳을 것으로 예상되는 아이의 수예요.
        q: 우리나라의 합계 출산율이 처음으로 1명보다 낮아진 해는 그래프에서 언제일까요?
        options: [2018년, 2000년, 1983년]
        answer: 2018년
        explain: 2023년에는 0.72명으로 세계에서 가장 낮은 수준이에요.
      - type: sort
        lv: B
        std: 6사12-01
        cat: 지식·이해
        agebars: *ages
        q: 인구 특징에 따라 나라를 나누어 보세요.
        bins: [노인 비율이 높은 나라, 어린이 비율이 높은 나라]
        items:
          - { text: "일본 (노인 29%)", bin: "노인 비율이 높은 나라" }
          - { text: "대한민국 (노인 19%)", bin: "노인 비율이 높은 나라" }
          - { text: "니제르 (어린이 49%)", bin: "어린이 비율이 높은 나라" }
          - { text: "인도 (어린이 25%)", bin: "어린이 비율이 높은 나라" }
      - type: choice
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 나라마다 인구 특징이 다른 까닭으로 가장 알맞은 것은?
        options:
          - 경제 발전 정도, 의료 수준, 교육과 생활 문화가 나라마다 다르기 때문에
          - 나라마다 날짜를 세는 방법이 다르기 때문에
          - 아무 까닭이 없다
        answer: 경제 발전 정도, 의료 수준, 교육과 생활 문화가 나라마다 다르기 때문에

      - type: multi
        lv: A
        std: 6사12-01
        cat: 과정·기능
        agebars: *ages
        q: 나이별 인구 구성 막대를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 대한민국은 일하는 나이(15~64세) 인구 비율이 가장 높다
          - 일본은 열 명 가운데 세 명꼴이 노인이다
          - 니제르는 어린이가 노인보다 15배쯤 많다
          - 인도의 노인 비율은 일본보다 높다
        answers:
          - 대한민국은 일하는 나이(15~64세) 인구 비율이 가장 높다
          - 일본은 열 명 가운데 세 명꼴이 노인이다
          - 니제르는 어린이가 노인보다 15배쯤 많다
      - type: choice
        lv: A
        std: 6사12-01
        cat: 지식·이해
        bars: *tfr
        q: 합계 출산율 그래프와 인구 구성 막대를 함께 분석하면, 앞으로 우리나라의 인구는 어떻게 바뀔까요?
        options:
          - 태어나는 아이가 줄어 어린이와 일하는 나이 인구는 줄고, 노인 비율은 더 높아질 것이다
          - 어린이 비율이 빠르게 늘어날 것이다
          - 인구 구성은 지금과 똑같이 유지될 것이다
        answer: 태어나는 아이가 줄어 어린이와 일하는 나이 인구는 줄고, 노인 비율은 더 높아질 것이다
      - type: choice
        lv: A
        std: 6사12-01
        cat: 지식·이해
        agebars: *ages
        q: 니제르처럼 어린이 비율이 아주 높은 나라에 앞으로 가장 필요한 것은 무엇일까요?
        options:
          - 늘어나는 어린이를 위한 학교와, 자라서 일할 일자리를 많이 만드는 것
          - 노인 요양 시설을 가장 먼저 많이 짓는 것
          - 학교를 줄이는 것
        answer: 늘어나는 어린이를 위한 학교와, 자라서 일할 일자리를 많이 만드는 것

  # ════════════ 인구 문제와 해결 ════════════
  - id: problems
    title: 인구 문제, 어떻게 풀까?
    emoji: 🧩
    lesson: '6'
    intro: 저출산·고령화와 인구 급증 문제의 해결 방안을 찾아요.
    steps:
      - type: sort
        lv: C
        std: 6사12-01
        cat: 지식·이해
        q: 인구 문제를 알맞게 나누어 보세요.
        bins: [저출산·고령화로 생기는 문제, 인구가 빠르게 늘어 생기는 문제]
        items:
          - { text: "일할 사람이 줄어든다", bin: "저출산·고령화로 생기는 문제" }
          - { text: "노인을 돌보는 데 드는 비용이 늘어난다", bin: "저출산·고령화로 생기는 문제" }
          - { text: "학생이 없어 문을 닫는 시골 학교가 생긴다", bin: "저출산·고령화로 생기는 문제" }
          - { text: "식량과 물이 부족해진다", bin: "인구가 빠르게 늘어 생기는 문제" }
          - { text: "학교와 일자리가 모자란다", bin: "인구가 빠르게 늘어 생기는 문제" }
          - { text: "도시에 집이 모자라고 혼잡해진다", bin: "인구가 빠르게 늘어 생기는 문제" }
      - type: choice
        lv: C
        std: 6사12-01
        cat: 지식·이해
        q: 65세 이상 노인이 전체 인구의 20% 이상인 사회를 무엇이라고 할까요?
        options: [초고령 사회, 다문화 사회, 정보화 사회]
        answer: 초고령 사회
        explain: 우리나라는 2024년 12월에 65세 이상 인구가 20%를 넘어 초고령 사회가 되었어요.

      - type: multi
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 저출산 문제를 해결하기 위한 방안을 모두 고르세요.
        options:
          - 아이를 맡길 수 있는 돌봄 시설을 늘린다
          - 부모가 육아 휴직을 쉽게 쓸 수 있게 한다
          - 아이를 키우는 가정의 집 마련을 돕는다
          - 부모가 일하는 시간을 더 늘린다
        answers:
          - 아이를 맡길 수 있는 돌봄 시설을 늘린다
          - 부모가 육아 휴직을 쉽게 쓸 수 있게 한다
          - 아이를 키우는 가정의 집 마련을 돕는다
      - type: multi
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 고령화에 대비하는 방안을 모두 고르세요.
        options:
          - 노인이 일할 수 있는 일자리를 만든다
          - 노인의 건강 관리와 돌봄 서비스를 늘린다
          - 계단 대신 경사로를 만드는 등 누구나 다니기 편한 시설을 늘린다
          - 노인은 집 밖에 나오지 못하게 한다
        answers:
          - 노인이 일할 수 있는 일자리를 만든다
          - 노인의 건강 관리와 돌봄 서비스를 늘린다
          - 계단 대신 경사로를 만드는 등 누구나 다니기 편한 시설을 늘린다
      - type: choice
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 인구가 빠르게 늘어나는 나라에서 하는 노력으로 알맞은 것은?
        options:
          - 교육을 늘리고 의료 서비스를 넓히며, 식량 생산을 늘린다
          - 학교를 모두 닫는다
          - 다른 나라와의 교류를 끊는다
        answer: 교육을 늘리고 의료 서비스를 넓히며, 식량 생산을 늘린다

      - type: shop
        lv: A
        std: 6사12-01
        cat: 과정·기능
        card: { emoji: "🏡", title: "행복군 인구 자료", text: "인구 1만 2천 명 · 65세 이상 41% · 지난해 태어난 아기 38명 · 초등학교 3곳 중 1곳이 문 닫을 위기" }
        customer: { emoji: "🧑‍💼", name: "행복군 군수님", place: "행복군(가상의 시골 군)", says: "노인은 많고 아이는 적어요. 젊은 사람들이 떠나지 않고 함께 살고 싶은 마을을 만들고 싶어요." }
        q: 자료를 분석해 행복군에 알맞은 인구 정책을 모두 골라 보세요.
        features:
          - { text: "청년이 일할 수 있는 일자리와 살 집 마련 지원", fit: true, why: "젊은 사람들이 떠나지 않고 머물게 해요." }
          - { text: "아이를 맡길 수 있는 돌봄 센터", fit: true, why: "아이를 키우기 좋은 마을이 되면 젊은 가족이 늘어날 수 있어요." }
          - { text: "혼자 사는 노인을 찾아가는 건강·돌봄 서비스", fit: true, why: "노인 비율이 41%라 돌봄이 꼭 필요해요." }
          - { text: "새 초등학교를 세 곳 더 짓기", fit: false, why: "지금 있는 학교도 학생이 부족해요." }
          - { text: "마을 버스 운행을 줄이기", fit: false, why: "운전이 어려운 노인들의 이동이 더 힘들어져요." }
        planLabels: { title: "📋 인구 정책 카드 만들기 (선택)", name: "정책 이름", slogan: "정책을 알리는 한 줄 구호", when: "누구를 위해 언제부터 할까?", save: "정책 카드 저장", emoji: "📋" }
      - type: choice
        lv: A
        std: 6사12-01
        cat: 지식·이해
        q: 인구 구조 탐정 활동을 정리한 것으로 가장 알맞은 것은?
        options:
          - 나라마다 인구 특징이 달라 겪는 인구 문제도 다르며, 그 특징에 맞는 해결 방안을 찾아야 한다
          - 모든 나라는 같은 인구 문제를 겪는다
          - 인구 문제는 해결할 방법이 없다
        answer: 나라마다 인구 특징이 달라 겪는 인구 문제도 다르며, 그 특징에 맞는 해결 방안을 찾아야 한다
