template: mission
style: village
unit: soc-6-2-1
title: 이 마을에 살려면?
emoji: 🏘️
summary: 산지·하천·해안 마을을 차례로 찾아가 사람들이 어떻게 사는지 고르고, "왜 그렇게 살까?"의 근거를 찾아요.
story: 탐험대가 세계 곳곳의 마을에 도착했어요. 마을 사람들의 생활 모습을 살피고, 그 까닭을 자연환경에서 찾아 마을 기록장을 채워 주세요.
lessons: ['3', '4', '5']
standards: [6사10-01]
minutes: 12
teacherGuide:
  - 산지(3차시) · 하천(4차시) · 해안(5차시) 마을로 나뉘어 있어요. 그날 배운 마을만 하면 돼요.
  - 🔎 조사하기부터는 생활 모습을 고른 뒤 '왜?'의 근거를 고르는 문제가 나와요. 근거를 말로 설명해 보게 하면 좋아요.
  - 해안 마을의 🏅 분석하기는 5차시 [미디어 활동] '관광 산업의 영향'과 이어져요.
stages:
  # ════════════════ 산지 마을 ════════════════
  - id: mountain
    title: 산지 마을
    emoji: ⛰️
    lesson: '3'
    intro: 높고 가파른 산과 고원에 사는 사람들을 만나요.
    steps:
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: life/himalaya-terrace
        q: 히말라야산맥의 산지 마을에서 볼 수 있는 이 밭은 어떤 모습인가요?
        options:
          - 비탈을 계단 모양으로 깎아 만든 밭
          - 넓고 평평한 들판에 만든 밭
          - 물 위에 띄워 만든 밭
          - 모래 위에 만든 밭
        answer: 비탈을 계단 모양으로 깎아 만든 밭
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: life/parinacota-llama
        q: 파리나코타 화산 주변의 높은 고원에서 사람들이 기르는 동물은?
        options: [라마와 알파카, 낙타, 물소, 펭귄]
        answer: 라마와 알파카
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: life/maunaloa-observatory
        q: 마우나로아 화산 높은 곳에 있는 이 시설은 무엇일까요?
        options: [대기를 관측하는 관측소, 스키장, 물고기를 기르는 양식장, 배가 드나드는 항구]
        answer: 대기를 관측하는 관측소
      - type: choice
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: life/abyssinia-coffee
        q: 아비시니아고원(에티오피아)에서 많이 기르는 작물은?
        options: [커피, 벼, 대추야자, 올리브]
        answer: 커피
        explain: 에티오피아는 '커피의 고향'이라고 불려요.
      - type: multi
        lv: C
        std: 6사10-01
        cat: 지식·이해
        photo: life/himalaya-yak
        q: 사진은 히말라야산맥의 산길에서 짐을 나르는 야크예요. 산지 사람들의 생활 모습으로 알맞은 것을 모두 고르세요.
        options:
          - 비탈에 계단식 밭을 만든다
          - 추위에 강한 야크나 라마를 기른다
          - 높은 산을 오르는 등산객을 안내한다
          - 큰 배로 사람과 짐을 실어 나른다
        answers:
          - 비탈에 계단식 밭을 만든다
          - 추위에 강한 야크나 라마를 기른다
          - 높은 산을 오르는 등산객을 안내한다

      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: life/himalaya-terrace
        q: 히말라야 사람들이 비탈에 계단식 밭을 만드는 까닭은?
        hint: 평평한 땅이 거의 없는 비탈에서 농사를 지으려면 어떻게 해야 할까요?
        options:
          - 비탈이 가팔라서 평평한 땅을 만들어 농사를 짓기 위해
          - 강물이 넘치는 것을 막기 위해
          - 바닷물이 밭에 들어오지 않게 하기 위해
          - 모래바람을 막기 위해
        answer: 비탈이 가팔라서 평평한 땅을 만들어 농사를 짓기 위해
        explain: 계단식 밭은 비가 올 때 흙이 쓸려 내려가는 것도 막아 줘요.
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: life/parinacota-llama
        q: 파리나코타 주변 사람들이 라마와 알파카를 기르는 까닭은?
        options:
          - 높고 추운 곳에서도 잘 살고, 털로 따뜻한 옷감을 만들 수 있어서
          - 더운 사막에서 물 없이도 오래 걸을 수 있어서
          - 강에서 물고기를 잘 잡아서
          - 관광객이 타고 바다를 건널 수 있어서
        answer: 높고 추운 곳에서도 잘 살고, 털로 따뜻한 옷감을 만들 수 있어서
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: landforms/abyssinia
        q: 아비시니아고원에 에티오피아의 수도 아디스아바바 같은 큰 도시가 생긴 까닭은?
        hint: 적도 가까이의 낮은 땅은 아주 더워요. 높은 곳은 어떨까요?
        options:
          - 적도 가까운 곳이지만 높아서 서늘하고, 위쪽이 넓고 평평해서
          - 바닷가에 있어서 배가 드나들기 좋아서
          - 일 년 내내 눈이 쌓여 있어서
          - 큰 강이 고원 위로 흘러서
        answer: 적도 가까운 곳이지만 높아서 서늘하고, 위쪽이 넓고 평평해서
      - type: choice
        lv: B
        std: 6사10-01
        cat: 지식·이해
        photo: life/maunaloa-observatory
        q: 대기 관측소를 마우나로아 높은 곳에 세운 까닭은?
        options:
          - 높고 주변에 큰 도시가 없어 공기가 맑아서
          - 바다와 가까워 물고기를 잡기 좋아서
          - 땅이 평평해 농사를 짓기 좋아서
          - 비가 많이 와서
        answer: 높고 주변에 큰 도시가 없어 공기가 맑아서
      - type: sort
        lv: B
        std: 6사10-01
        cat: 지식·이해
        q: 조사한 생활 모습을 알맞은 산지 마을에 나누어 담아 보세요.
        bins: [히말라야산맥, 파리나코타 화산, 아비시니아고원]
        items:
          - { text: 야크를 기르고 등산객을 안내해요, bin: 히말라야산맥 }
          - { text: 가파른 비탈에 계단식 밭을 만들어요, bin: 히말라야산맥 }
          - { text: 라마·알파카 털로 옷감을 짜요, bin: 파리나코타 화산 }
          - { text: 높은 호숫가 고원에서 가축을 놓아 길러요, bin: 파리나코타 화산 }
          - { text: 서늘하고 평평한 땅에 수도가 자리 잡았어요, bin: 아비시니아고원 }
          - { text: 커피를 길러 다른 나라에 팔아요, bin: 아비시니아고원 }

      - type: multi
        lv: A
        std: 6사10-01
        cat: 과정·기능
        photos: [landforms/himalaya, landforms/abyssinia]
        q: 히말라야산맥과 아비시니아고원을 비교해 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 두 곳 모두 높은 산지에 속한다
          - 히말라야는 뾰족한 봉우리가 이어진 산맥이고, 아비시니아고원은 위가 평평한 고원이다
          - 위가 평평한 아비시니아고원이 큰 도시가 자리 잡기에 더 알맞다
          - 두 곳 모두 사람이 전혀 살지 않는다
        answers:
          - 두 곳 모두 높은 산지에 속한다
          - 히말라야는 뾰족한 봉우리가 이어진 산맥이고, 아비시니아고원은 위가 평평한 고원이다
          - 위가 평평한 아비시니아고원이 큰 도시가 자리 잡기에 더 알맞다
      - type: multi
        lv: A
        std: 6사10-01
        cat: 지식·이해
        photo: life/maunaloa-observatory
        q: 마우나로아 관측소 사례를 탐구해서 알 수 있는 것을 모두 고르세요.
        options:
          - 사람들은 높은 산의 맑은 공기라는 특징을 살려 새로운 일을 하기도 한다
          - 산지의 자연환경은 어려움만이 아니라 기회가 되기도 한다
          - 관측소는 바닷가 낮은 곳에만 지을 수 있다
        answers:
          - 사람들은 높은 산의 맑은 공기라는 특징을 살려 새로운 일을 하기도 한다
          - 산지의 자연환경은 어려움만이 아니라 기회가 되기도 한다
      - type: choice
        lv: A
        std: 6사10-01
        cat: 지식·이해
        q: 처음 가 보는 산지 마을이 있어요. 비탈이 가파르고 평평한 땅이 거의 없어요. 이 마을 사람들의 생활 모습을 가장 알맞게 예상한 것은?
        hint: 지금까지 만난 산지 마을들을 떠올려 보세요.
        options:
          - 비탈에 계단식 밭을 만들거나 풀밭에 가축을 놓아 기를 것이다
          - 넓은 논에서 큰 기계로 벼농사를 지을 것이다
          - 큰 항구에서 배를 타고 고기잡이를 할 것이다
          - 오아시스 주변에서 대추야자를 기를 것이다
        answer: 비탈에 계단식 밭을 만들거나 풀밭에 가축을 놓아 기를 것이다
      - type: choice
        lv: A
        std: 6사10-01
        cat: 지식·이해
        q: 산지 마을 탐구를 한 문장으로 정리한다면 무엇이 가장 알맞을까요?
        options:
          - 산지 사람들은 높고 가파르며 서늘한 자연환경에 맞추어 농사 방법, 기르는 동물, 하는 일을 정하며 살아간다
          - 산지 사람들은 자연환경과 상관없이 모두 똑같이 살아간다
          - 산지는 너무 높아서 아무도 살지 않는다
          - 산지 사람들은 모두 관광 일만 한다
        answer: 산지 사람들은 높고 가파르며 서늘한 자연환경에 맞추어 농사 방법, 기르는 동물, 하는 일을 정하며 살아간다

