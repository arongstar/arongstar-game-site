title: World Kids Meeting — 세계 어린이 화상 모임
emoji: 📖
summary: 세 나라 어린이의 자기소개 글을 듣고 읽으며 세부 정보와 중심 내용을 파악하고, 다른 나라의 초등학교에 대해 알아봐요.
story: 세계 어린이 화상 모임이 열렸어요! 케냐, 일본, 캐나다 친구들의 자기소개를 읽고 새 친구를 사귀어 보세요.
