- 4차시(Before You Read · Read · After You Read)에 써요.
- 읽기 글은 🔊 듣기로 들으며 따라 읽을 수 있어요. 읽는 줄에 테두리가 생겨요.
- '문화: 나라마다 초등학교 학년 수가 달라요(우리나라·일본 6년, 프랑스 5년).'
