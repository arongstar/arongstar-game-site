template: mission
style: shop
unit: soc-6-2-2
title: 수출 상품 기획자
emoji: 🌐
summary: 세계 여러 나라의 손님이 사는 곳의 자연환경과 생활을 살펴, 우리 기업이 수출할 상품을 기획하고 판매 계획을 세워요.
story: 우리 반이 세운 수출 회사에 세계 곳곳에서 주문 문의가 들어왔어요! 손님 나라의 기후와 생활을 조사해서 꼭 필요한 상품을 기획해 주세요.
lessons: ['13']
standards: [6사11-03, 6사11-01]
minutes: 15
teacherGuide:
  - 13차시 '생각을 펼쳐요'에서 무역 항구 탐험을 마친 뒤 해요. 1단원 「세계의 자연환경」에서 배운 기후 그래프를 다시 써요.
  - 손님에게 알맞은 상품 기능을 고르면 상품 이름·광고 문구·판매 계획을 적어 상품 카드로 저장할 수 있어요. 저장한 카드는 탐험 리포트에 모여요.
  - 모둠별로 상품 카드를 모아 '우리 반 수출 박람회'를 열면 발표 활동으로 이어 갈 수 있어요.
stages:
  - id: export
    title: 세계로 가는 우리 상품
    emoji: ✈️
    lesson: '13'
    intro: 손님 나라의 자연환경과 생활에 꼭 맞는 수출 상품을 기획해요.
    steps:
      - type: shop
        lv: C
        std: 6사11-03
        cat: 지식·이해
        chart: kualalumpur
        customer: { emoji: "🛵", name: "배달 가게 사장 하산", place: "쿠알라룸푸르(말레이시아)", says: "일 년 내내 덥고 비가 자주 와요. 배달하는 직원들이 덥고 비에 젖어서 힘들어해요." }
        q: 하산 씨의 가게에 수출할 상품 기능을 모두 골라 보세요.
        features:
          - { text: "바람이 잘 통하고 빨리 마르는 얇은 우비", fit: true, why: "비가 자주 오고 일 년 내내 더워서 얇고 빨리 마르는 우비가 필요해요." }
          - { text: "목에 거는 휴대용 선풍기", fit: true, why: "일 년 내내 27℃ 안팎이라 더위를 식혀 줘요." }
          - { text: "두꺼운 털장갑", fit: false, why: "기온이 0℃ 아래로 내려가지 않아 필요 없어요." }
          - { text: "눈 치우는 삽", fit: false, why: "눈이 오지 않는 곳이에요." }
      - type: shop
        lv: C
        std: 6사11-03
        cat: 지식·이해
        chart: kiruna
        customer: { emoji: "🎿", name: "스키장 직원 엘사", place: "키루나(스웨덴)", says: "겨울이 길고 아주 추워요. 밖에서 오래 일하면 손발이 꽁꽁 얼어요." }
        q: 엘사 씨에게 수출할 상품 기능을 모두 골라 보세요.
        features:
          - { text: "오래 따뜻한 발열 내의", fit: true, why: "0℃보다 추운 달이 일곱 달이나 돼요." }
          - { text: "장갑을 낀 채로 쓸 수 있는 터치 장갑", fit: true, why: "추운 밖에서도 장갑을 벗지 않고 휴대폰을 쓸 수 있어요." }
          - { text: "얇은 모시 셔츠", fit: false, why: "너무 추운 곳이라 맞지 않아요." }
          - { text: "모래바람 막는 얼굴 가리개", fit: false, why: "사막에서 쓰는 물건이에요." }

      - type: shop
        lv: B
        std: 6사11-03
        cat: 지식·이해
        chart: cairo
        customer: { emoji: "🧳", name: "여행사 직원 누르", place: "카이로(이집트)", says: "사막 관광을 오는 손님이 많아요. 햇볕이 아주 뜨겁고 모래바람이 불어요." }
        q: 누르 씨의 여행사에 수출할 상품 기능을 조사해서 모두 골라 보세요.
        features:
          - { text: "자외선을 막는 선크림과 챙 넓은 모자", fit: true, why: "비가 거의 오지 않아 햇볕이 아주 강해요." }
          - { text: "모래 먼지를 막는 마스크와 고글", fit: true, why: "건조한 사막이라 모래바람이 자주 불어요." }
          - { text: "오래 시원함을 유지하는 보냉 물병", fit: true, why: "연평균 기온이 22℃가 넘고 여름에는 아주 더워요." }
          - { text: "큰 장우산", fit: false, why: "한 해 강수량이 25mm쯤이라 우산이 거의 필요 없어요." }
          - { text: "전기 난로", fit: false, why: "가장 추운 1월에도 평균 14℃가 넘어요." }
      - type: shop
        lv: B
        std: 6사11-01
        cat: 지식·이해
        customer: { emoji: "🏬", name: "친환경 매장 주인 레나", place: "베를린(독일)", says: "우리 손님들은 환경을 생각하는 상품을 좋아해요. 물건을 만든 회사가 근로자를 존중하는지도 꼼꼼히 살펴봐요." }
        q: 레나 씨의 매장에 수출할 상품 기획으로 알맞은 것을 모두 골라 보세요.
        features:
          - { text: "재활용 소재로 만든 가방", fit: true, why: "환경을 생각하는 소비자에게 알맞아요." }
          - { text: "전기를 적게 쓰는 가전제품", fit: true, why: "에너지를 아끼고 환경 오염을 줄여요." }
          - { text: "근로자의 권리를 지켜 만들었다는 인증을 받은 옷", fit: true, why: "근로자를 존중하는 기업의 상품을 찾는 손님에게 알맞아요." }
          - { text: "한 번 쓰고 버리는 플라스틱 장식품", fit: false, why: "쓰레기가 많이 생겨 환경을 생각하는 손님에게 맞지 않아요." }
      - type: choice
        lv: B
        std: 6사11-03
        cat: 지식·이해
        q: 같은 상품이라도 나라마다 잘 팔리는 정도가 다른 까닭은?
        options:
          - 나라마다 자연환경과 생활 모습, 사람들이 원하는 것이 다르기 때문에
          - 모든 나라 사람들이 똑같은 것을 원하기 때문에
          - 상품 이름이 나라마다 같기 때문에
        answer: 나라마다 자연환경과 생활 모습, 사람들이 원하는 것이 다르기 때문에

      - type: shop
        lv: A
        std: 6사11-03
        cat: 과정·기능
        chart: nuuk
        hideChartName: true
        customer: { emoji: "❓", name: "비밀 손님 (어느 나라일까요?)", place: "그래프만 보고 알아내기", says: "우리 동네는 바다로 둘러싸여 있고, 여름에도 서늘해요. 고기잡이를 하는 사람이 많아요." }
        q: 그래프를 분석해서 비밀 손님에게 수출할 상품 기능을 모두 골라 보세요.
        hint: 가장 따뜻한 달의 기온과 일 년 내내 내리는 비·눈의 양을 살펴보세요.
        features:
          - { text: "바닷바람과 물을 막는 방수 방한복", fit: true, why: "가장 따뜻한 달도 10℃가 안 되고, 바다에서 일해요." }
          - { text: "미끄러지지 않는 겨울 장화", fit: true, why: "오랫동안 눈과 얼음이 있어요." }
          - { text: "여름용 냉방 선풍기", fit: false, why: "여름에도 서늘해 거의 필요 없어요." }
          - { text: "열대 과일 냉장 보관함", fit: false, why: "손님의 생활과 관계가 적어요." }
        explain: 비밀 손님은 그린란드 누크에 살아요.
      - type: multi
        lv: A
        std: 6사11-03
        cat: 지식·이해
        q: 수출 상품을 기획할 때 꼭 생각해야 할 것을 분석해 모두 고르세요.
        options:
          - 손님 나라의 자연환경과 기후
          - 손님 나라 사람들의 생활 모습과 문화
          - 다른 나라 상품과 비교한 품질과 가격
          - 우리나라에서 잘 팔리면 어느 나라에서나 잘 팔린다는 생각
        answers:
          - 손님 나라의 자연환경과 기후
          - 손님 나라 사람들의 생활 모습과 문화
          - 다른 나라 상품과 비교한 품질과 가격
      - type: choice
        lv: A
        std: 6사11-03
        cat: 지식·이해
        q: 우리 기업이 상품을 수출하면 우리나라와 손님 나라에 어떤 영향이 있을지 가장 알맞게 탐구한 것은?
        options:
          - 우리 기업은 이윤과 일자리를 얻고, 손님 나라는 필요한 상품을 얻어 두 나라 모두 도움을 받는다
          - 우리나라만 이익을 보고 손님 나라는 손해만 본다
          - 두 나라 모두 아무 영향이 없다
        answer: 우리 기업은 이윤과 일자리를 얻고, 손님 나라는 필요한 상품을 얻어 두 나라 모두 도움을 받는다
