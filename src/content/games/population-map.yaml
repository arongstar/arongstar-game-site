template: mission
style: village
unit: soc-6-2-3
title: 세계 인구 지도 탐험
emoji: 🗺️
summary: 80억 지구촌 사람들이 어디에 모여 살고 어디에 적게 사는지 지도와 그래프로 조사하고, 그 까닭을 자연환경과 인문환경에서 찾아요.
story: 지구 탐험대가 세계 인구 지도를 받았어요! 사람이 북적이는 곳과 텅 빈 곳을 찾아내고, 왜 그곳에 사람이 많거나 적은지 밝혀 주세요.
lessons: ['2', '3', '4']
standards: [6사12-01]
minutes: 12
teacherGuide:
  - 2차시 '세계 인구 분포', 3차시 '인구 분포에 영향을 주는 것', 4차시 '인구가 많은 나라와 인구 밀도' 스테이지로 나뉘어 있어요.
  - 3차시는 1단원 「세계의 자연환경」과 이어져요. 사막·극지·높은 산지·열대 우림에 사람이 적은 까닭을 1단원의 지형·기후와 함께 떠올리게 해 주세요.
  - 인구 자료는 국제 연합(UN) 세계 인구 전망 2024년 추계를 어림한 값이에요.
stages:
  # ════════════ 세계 인구 분포 ════════════
  - id: distribution
    title: 사람들은 어디에 모여 살까?
    emoji: 🌏
    lesson: '2'
    intro: 세계 인구가 많은 곳과 적은 곳을 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6사12-01
        cat: 과정·기능
        bars: &continents
          title: 대륙별 인구 비율 (2024년, 어림값)
          unit: "%"
          items:
            - { label: "아시아", value: 59 }
            - { label: "아프리카", value: 18 }
            - { label: "유럽", value: 9 }
            - { label: "남아메리카", value: 8 }
            - { label: "북아메리카", value: 5 }
            - { label: "오세아니아", value: 1 }
          note: 국제 연합 세계 인구 전망 2024를 어림한 값이에요. 남아메리카에는 멕시코·중앙아메리카를 함께 넣었어요.
        q: 그래프를 살펴보면 세계 인구가 가장 많이 사는 대륙은 어디일까요?
        options: [아시아, 유럽, 오세아니아]
        answer: 아시아
        explain: 세계 사람 열 명 가운데 여섯 명쯤이 아시아에 살아요. 2022년에 세계 인구는 80억 명을 넘었어요.
      - type: sort
        lv: C
        std: 6사12-01
        cat: 지식·이해
        q: 사람이 많이 모여 사는 곳과 아주 적게 사는 곳으로 나누어 보세요.
        bins: [사람이 많이 사는 곳, 사람이 적게 사는 곳]
        items:
          - { text: "중국 동부와 우리나라·일본", bin: "사람이 많이 사는 곳" }
          - { text: "인도와 방글라데시", bin: "사람이 많이 사는 곳" }
          - { text: "서유럽", bin: "사람이 많이 사는 곳" }
          - { text: "사하라 사막", photo: "landforms/sahara", bin: "사람이 적게 사는 곳" }
          - { text: "그린란드", bin: "사람이 적게 사는 곳" }
          - { text: "아마존 열대 우림", photo: "landforms/amazon", bin: "사람이 적게 사는 곳" }
      - type: pin
        lv: C
        std: 6사12-01
        cat: 과정·기능
        q: 사람이 아주 적게 사는 사하라 사막은 지도에서 어디일까요?
        pins: [sahara, westeurope, bangladesh, china]
        answer: sahara

      - type: choice
        lv: B
        std: 6사12-01
        cat: 과정·기능
        bars: *continents
        q: 그래프를 조사해 보면 아시아에는 세계 인구의 약 몇 %가 살까요?
        options: [약 60%, 약 10%, 약 30%]
        answer: 약 60%
      - type: pin
        lv: B
        std: 6사12-01
        cat: 과정·기능
        q: 인구가 아주 많이 모여 사는 남아시아의 방글라데시는 지도에서 어디일까요?
        hint: 인도의 동쪽, 큰 강들이 바다로 흘러드는 곳이에요.
        pins: [bangladesh, mongolia, australia, canada]
        answer: bangladesh
      - type: multi
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 사람이 많이 모여 사는 곳들의 공통점을 조사해 모두 고르세요.
        options:
          - 넓은 평야나 큰 강 주변이 많다
          - 기후가 너무 덥거나 춥지 않고 비가 알맞게 온다
          - 바다와 가까워 교통이 편리한 곳이 많다
          - 일 년 내내 얼음으로 덮여 있다
        answers:
          - 넓은 평야나 큰 강 주변이 많다
          - 기후가 너무 덥거나 춥지 않고 비가 알맞게 온다
          - 바다와 가까워 교통이 편리한 곳이 많다

      - type: choice
        lv: A
        std: 6사12-01
        cat: 지식·이해
        q: 세계 인구 분포의 특징을 가장 알맞게 분석한 것은?
        options:
          - 세계 인구는 고르게 퍼져 있지 않고, 아시아 동부·남부와 유럽처럼 살기 좋은 곳에 몰려 있다
          - 세계 인구는 모든 대륙에 똑같이 나뉘어 산다
          - 세계 인구는 대부분 사막과 극지방에 산다
        answer: 세계 인구는 고르게 퍼져 있지 않고, 아시아 동부·남부와 유럽처럼 살기 좋은 곳에 몰려 있다
      - type: multi
        lv: A
        std: 6사12-01
        cat: 과정·기능
        bars: *continents
        q: 그래프를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 아시아와 아프리카에 세계 인구의 4분의 3이 넘게 산다
          - 오세아니아는 땅에 비해 인구가 아주 적다
          - 유럽 인구는 아프리카 인구의 절반쯤이다
          - 모든 대륙의 인구 비율이 비슷하다
        answers:
          - 아시아와 아프리카에 세계 인구의 4분의 3이 넘게 산다
          - 오세아니아는 땅에 비해 인구가 아주 적다
          - 유럽 인구는 아프리카 인구의 절반쯤이다

  # ════════════ 인구 분포에 영향을 주는 것 ════════════
  - id: factors
    title: 왜 그곳에 많이(적게) 살까?
    emoji: 🔍
    lesson: '3'
    intro: 자연환경과 인문환경에서 인구 분포의 까닭을 찾아요.
    steps:
      - type: sort
        lv: C
        std: 6사12-01
        cat: 지식·이해
        q: 인구 분포에 영향을 주는 것을 자연환경과 인문환경으로 나누어 보세요.
        hint: 자연환경은 자연이 만든 것, 인문환경은 사람이 만든 것이에요.
        bins: [자연환경, 인문환경]
        items:
          - { text: "기후", bin: "자연환경" }
          - { text: "지형", bin: "자연환경" }
          - { text: "강과 물", bin: "자연환경" }
          - { text: "일자리", bin: "인문환경" }
          - { text: "교통", bin: "인문환경" }
          - { text: "학교·병원 같은 시설", bin: "인문환경" }
      - type: choice
        lv: C
        std: 6사12-01
        cat: 지식·이해
        photo: landforms/sahara
        q: 사하라 사막에 사람이 아주 적게 사는 까닭은?
        options: [비가 거의 내리지 않아 물과 먹을 것을 얻기 어렵기 때문에, 너무 추워서, 비가 너무 많이 와서]
        answer: 비가 거의 내리지 않아 물과 먹을 것을 얻기 어렵기 때문에
      - type: choice
        lv: C
        std: 6사12-01
        cat: 지식·이해
        photo: global/greenland
        q: 그린란드 같은 북극 가까운 곳에 사람이 적게 사는 까닭은?
        options: [너무 추워서 농사를 짓기 어렵기 때문에, 너무 더워서, 땅이 모두 평야여서]
        answer: 너무 추워서 농사를 짓기 어렵기 때문에

      - type: choice
        lv: B
        std: 6사12-01
        cat: 지식·이해
        photo: global/farmland
        q: 벼농사를 많이 짓는 아시아 동부·남부 지역에 사람이 많이 사는 까닭은?
        options:
          - 덥고 비가 많은 여름과 넓은 평야 덕분에 많은 사람이 먹을 쌀을 기를 수 있기 때문에
          - 일 년 내내 눈이 와서
          - 땅이 모두 사막이어서
        answer: 덥고 비가 많은 여름과 넓은 평야 덕분에 많은 사람이 먹을 쌀을 기를 수 있기 때문에
      - type: sort
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 자연환경 때문에 사람이 적게 사는 곳을 까닭에 따라 나누어 보세요.
        hint: 1단원에서 배운 지형과 기후를 떠올려 보세요.
        bins: [너무 건조해요, 너무 추워요, 너무 높아요, 숲이 빽빽하고 덥고 습해요]
        items:
          - { text: "사하라 사막", bin: "너무 건조해요" }
          - { text: "그린란드", bin: "너무 추워요" }
          - { text: "시베리아 북부", bin: "너무 추워요" }
          - { text: "히말라야산맥 높은 곳", bin: "너무 높아요" }
          - { text: "아마존 열대 우림", bin: "숲이 빽빽하고 덥고 습해요" }
      - type: choice
        lv: B
        std: 6사12-01
        cat: 지식·이해
        photo: global/city
        q: 큰 도시에 사람이 많이 모여 사는 까닭은?
        options:
          - 일자리가 많고 교통·학교·병원 같은 시설이 잘 갖추어져 있기 때문에
          - 도시는 기후가 가장 춥기 때문에
          - 도시에는 일자리가 없기 때문에
        answer: 일자리가 많고 교통·학교·병원 같은 시설이 잘 갖추어져 있기 때문에
        explain: 일자리·교통·시설처럼 사람이 만든 환경을 인문환경이라고 해요.

      - type: choice
        lv: A
        std: 6사12-01
        cat: 지식·이해
        photo: landforms/abyssinia
        q: 에티오피아의 아비시니아고원은 적도 가까이에 있지만 사람이 많이 살아요. 이 사례를 분석해 알 수 있는 것은?
        hint: 1단원 '이 마을에 살려면?'에서 만난 고원을 떠올려 보세요.
        options:
          - 높은 곳이라 서늘해 살기 좋기 때문에, 같은 위도라도 지형에 따라 인구 분포가 달라진다
          - 적도 근처에는 사람이 전혀 살 수 없다
          - 높은 곳일수록 무조건 사람이 적다
        answer: 높은 곳이라 서늘해 살기 좋기 때문에, 같은 위도라도 지형에 따라 인구 분포가 달라진다
      - type: multi
        lv: A
        std: 6사12-01
        cat: 지식·이해
        q: 오늘날 인구 분포에 인문환경의 영향이 점점 커지는 까닭을 분석해 모두 고르세요.
        options:
          - 기술과 교통이 발달해 자연환경의 어려움을 이겨 낼 수 있게 되었다
          - 사람들이 일자리를 찾아 도시로 많이 옮겨 간다
          - 사막에도 물을 끌어와 큰 도시를 만들기도 한다
          - 자연환경은 이제 인구 분포에 아무 영향을 주지 않는다
        answers:
          - 기술과 교통이 발달해 자연환경의 어려움을 이겨 낼 수 있게 되었다
          - 사람들이 일자리를 찾아 도시로 많이 옮겨 간다
          - 사막에도 물을 끌어와 큰 도시를 만들기도 한다

  # ════════════ 인구가 많은 나라와 인구 밀도 ════════════
  - id: countries
    title: 인구가 많은 나라, 적은 나라
    emoji: 🧮
    lesson: '4'
    intro: 나라별 인구와 인구 밀도를 비교해요.
    steps:
      - type: choice
        lv: C
        std: 6사12-01
        cat: 과정·기능
        bars: &topcountries
          title: 인구가 많은 나라 (2024년, 어림값)
          unit: 억 명
          items:
            - { label: "인도", value: 14.5 }
            - { label: "중국", value: 14.2 }
            - { label: "미국", value: 3.4 }
            - { label: "인도네시아", value: 2.8 }
            - { label: "파키스탄", value: 2.5 }
            - { label: "나이지리아", value: 2.3 }
            - { label: "브라질", value: 2.1 }
          note: 국제 연합 세계 인구 전망 2024를 어림한 값이에요. 대한민국은 약 0.52억 명(5,200만 명)이에요.
        q: 그래프에서 인구가 가장 많은 나라는 어디일까요?
        options: [인도, 미국, 브라질]
        answer: 인도
        explain: 인도는 2023년쯤 중국보다 인구가 많아져 세계에서 인구가 가장 많은 나라가 되었어요.
      - type: pin
        lv: C
        std: 6사12-01
        cat: 과정·기능
        q: 세계에서 인구가 가장 많은 나라인 인도는 지도에서 어디일까요?
        pins: [india, brazil, usa, australia]
        answer: india

      - type: choice
        lv: B
        std: 6사12-01
        cat: 지식·이해
        q: 인구 밀도는 무엇을 뜻할까요?
        options:
          - 일정한 넓이(1㎢)의 땅에 사는 사람의 수
          - 한 나라에 사는 전체 사람의 수
          - 한 해에 태어나는 아기의 수
        answer: 일정한 넓이(1㎢)의 땅에 사는 사람의 수
      - type: choice
        lv: B
        std: 6사12-01
        cat: 과정·기능
        table: &density
          title: 여러 나라의 인구 밀도 (어림값)
          head: [나라, 1㎢에 사는 사람]
          rows:
            - ["방글라데시", "약 1,300명"]
            - ["대한민국", "약 510명"]
            - ["일본", "약 330명"]
            - ["미국", "약 37명"]
            - ["캐나다", "약 4명"]
            - ["오스트레일리아", "약 3명"]
            - ["몽골", "약 2명"]
          note: 국제 연합 자료를 어림한 값이에요.
        q: 표를 조사해 보면 인구 밀도가 가장 높은 나라는?
        options: [방글라데시, 대한민국, 몽골]
        answer: 방글라데시
      - type: pin
        lv: B
        std: 6사12-01
        cat: 과정·기능
        table: *density
        q: 표에서 인구 밀도가 가장 낮은 몽골은 지도에서 어디일까요?
        pins: [mongolia, bangladesh, japan, nigeria]
        answer: mongolia

      - type: choice
        lv: A
        std: 6사12-01
        cat: 지식·이해
        table: *density
        q: 오스트레일리아는 땅이 아주 넓은데 인구 밀도가 매우 낮아요. 그 까닭을 가장 알맞게 분석한 것은?
        hint: 1단원에서 배운 기후 분포를 떠올려 보세요.
        options:
          - 땅의 많은 부분이 건조한 사막이라 사람이 살기 어려워, 사람들이 주로 바닷가 도시에 모여 살기 때문에
          - 오스트레일리아는 일 년 내내 눈으로 덮여 있기 때문에
          - 오스트레일리아에는 도시가 하나도 없기 때문에
        answer: 땅의 많은 부분이 건조한 사막이라 사람이 살기 어려워, 사람들이 주로 바닷가 도시에 모여 살기 때문에
      - type: multi
        lv: A
        std: 6사12-01
        cat: 과정·기능
        bars: *topcountries
