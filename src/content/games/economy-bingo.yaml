template: bingo
unit: soc-6-2-2
title: 경제 탐험 빙고
emoji: 🎯
summary: 2단원에서 배운 경제 낱말로 태블릿 빙고판을 채우고, 전자칠판의 설명을 보고 어떤 낱말인지 맞혀 표시해요.
lessons: ['14']
standards: [6사11-01, 6사11-02, 6사11-03]
minutes: 20
size: 4
teacherGuide:
  - 14차시 단원 정리 '교실 놀이'에서 해요. 전자칠판에는 이 화면을, 학생 태블릿에는 탐험 지도의 「내 빙고판」을 열어요.
  - 학생은 낱말 28개 가운데 16개를 골라 빙고판을 채워요. 설명을 보여 주고, 생각할 시간이 지나면 [정답 공개]를 눌러요.
words:
  - { word: "가계", clue: "일을 해서 소득을 얻고 필요한 물건을 사서 쓰는 경제 단위예요." }
  - { word: "기업", clue: "이윤을 얻기 위해 물건이나 서비스를 만들어 파는 경제 단위예요." }
  - { word: "시장", clue: "물건이나 서비스를 사고파는 곳이에요. 온라인 쇼핑몰처럼 눈에 보이지 않기도 해요." }
  - { word: "합리적 선택", clue: "여러 조건을 따져 적은 비용으로 큰 만족을 얻도록 고르는 것이에요." }
  - { word: "기회비용", clue: "하나를 고를 때 포기하게 되는 다른 것의 가치예요." }
  - { word: "소득", clue: "일을 하거나 재산을 이용해 벌어들이는 돈이에요." }
  - { word: "저축", clue: "미래를 위해 소득의 일부를 쓰지 않고 모아 두는 것이에요." }
  - { word: "이윤", clue: "기업이 상품을 팔아 번 돈에서 만드는 데 든 비용을 뺀 이익이에요." }
  - { word: "근로자", clue: "기업에서 일하고 그 대가로 임금을 받는 사람이에요." }
  - { word: "근로 계약서", clue: "일을 시작할 때 일하는 시간과 임금 등을 적어 서로 약속하는 문서예요." }
  - { word: "최저임금", clue: "근로자가 최소한의 생활을 할 수 있도록 법으로 정한 임금의 가장 낮은 기준이에요." }
  - { word: "노동조합", clue: "근로자들이 모여 함께 권리를 지키려고 만든 단체예요." }
  - { word: "사회적 책임", clue: "기업이 이윤만이 아니라 환경·소비자·근로자를 생각해 다해야 할 의무예요." }
  - { word: "공정 거래 위원회", clue: "기업들이 공정하게 경쟁하는지 살피고 불공정한 행동을 막는 기관이에요." }
  - { word: "과장 광고", clue: "상품을 사실보다 부풀려 소비자를 속이는 광고예요." }
  - { word: "경공업", clue: "섬유·신발·가발처럼 가벼운 물건을 만드는 공업으로, 1960년대에 발달했어요." }
  - { word: "중화학 공업", clue: "철강·조선·석유 화학처럼 무겁고 큰 물건을 만드는 공업으로, 1970년대에 발달했어요." }
  - { word: "반도체", clue: "오늘날 우리나라의 대표 수출 상품으로, 전자 기기의 두뇌 역할을 해요." }
  - { word: "경부 고속 국도", clue: "1970년에 개통되어 서울과 부산을 빠르게 이어 준 길이에요." }
  - { word: "환경 오염", clue: "빠른 경제성장 과정에서 공장 매연과 폐수 등으로 생긴 문제예요." }
  - { word: "빈부 격차", clue: "사람들 사이의 소득과 재산의 차이가 크게 벌어지는 문제예요." }
  - { word: "사회 보장 제도", clue: "질병·실업·가난으로 어려운 사람이 기본적인 생활을 할 수 있도록 나라가 돕는 제도예요." }
  - { word: "무역", clue: "나라와 나라 사이에 물건이나 서비스를 사고파는 것이에요." }
  - { word: "수출", clue: "우리나라의 물건이나 서비스를 다른 나라에 파는 것이에요." }
  - { word: "수입", clue: "다른 나라의 물건이나 서비스를 사 오는 것이에요." }
  - { word: "원유", clue: "우리나라에서 거의 나지 않아 사우디아라비아 같은 나라에서 가장 많이 수입하는 자원이에요." }
  - { word: "상호 의존", clue: "나라와 나라가 무역으로 필요한 것을 주고받으며 서로 기대어 사는 것이에요." }
  - { word: "자유 무역 협정", clue: "나라끼리 관세를 줄이거나 없애 무역을 더 자유롭게 하기로 한 약속으로, FTA라고도 해요." }
