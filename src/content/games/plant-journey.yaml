# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: sci-6-1-3
title: 물방울의 식물 여행
emoji: 💧
summary: 물방울이 되어 뿌리 → 줄기 → 잎으로 여행하며 뿌리의 흡수, 줄기의 물 이동, 잎의 광합성과 증산 작용을 실험 결과로 알아봐요.
story: 나는 땅속의 작은 물방울! 봉선화 뿌리 속으로 빨려 들어가 잎 끝까지 여행을 떠나요. 가는 곳마다 식물 기관이 하는 일을 밝혀 보세요.
lessons:
- '3'
- '4'
- '5'
- '6'
standards:
- 6과11-02
minutes: 15
teacherGuide:
- 3차시 뿌리, 4차시 줄기, 5차시 잎(광합성), 6차시 잎(증산 작용) 스테이지예요.
- 실험 그림은 이해를 돕는 AI 그림이에요. 실제 실험 뒤 결과를 비교하는 데 쓰면 좋아요.
- 물과 양분의 이동을 통해 식물의 기관이 서로 연결되어 있음을 강조해 주세요.
stages:
- id: root
  title: 뿌리
  emoji: 🥕
  lesson: '3'
  intro: 뿌리가 하는 일을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과11-02
    cat: 지식·이해
    q: 뿌리가 하는 일로 가장 알맞은 것은?
    options:
    - 땅속의 물을 흡수한다
    - 빛을 받아 양분을 만든다
    - 꽃가루를 만든다
    answer: 땅속의 물을 흡수한다
  - type: choice
    lv: B
    std: 6과11-02
    cat: 과정·기능
    q: 그림처럼 뿌리가 있는 양파와 뿌리를 자른 양파를 물에 올려 두었어요. 며칠 뒤 결과로 알 수 있는 것은?
    options:
    - 뿌리가 있는 양파 쪽 물이 더 많이 줄어, 뿌리가 물을 흡수한다는 것을 알 수 있다
    - 두 컵의 물이 똑같이 줄어, 뿌리는 하는 일이 없다
    - 뿌리를 자른 양파 쪽 물이 더 많이 줄었다
    answer: 뿌리가 있는 양파 쪽 물이 더 많이 줄어, 뿌리가 물을 흡수한다는 것을 알 수 있다
    photo: illust/pl-onion-roots
  - type: choice
    lv: B
    std: 6과11-02
    cat: 지식·이해
    q: 뿌리에 솜털처럼 난 가는 뿌리털이 많으면 좋은 점은?
    options:
    - 물을 더 잘 흡수할 수 있다
    - 꽃이 더 많이 핀다
    - 줄기가 더 굵어진다
    answer: 물을 더 잘 흡수할 수 있다
  - type: multi
    lv: A
    std: 6과11-02
    cat: 지식·이해
    q: 뿌리가 하는 일을 모두 골라 보세요.
    options:
    - 물을 흡수한다
    - 식물을 지지한다
    - 무나 고구마처럼 양분을 저장하기도 한다
    - 빛을 받아 양분을 만든다
    answers:
    - 물을 흡수한다
    - 식물을 지지한다
    - 무나 고구마처럼 양분을 저장하기도 한다
- id: stem
  title: 줄기
  emoji: 🌿
  lesson: '4'
  intro: 줄기에서 물이 어떻게 이동하는지 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과11-02
    cat: 지식·이해
    q: 줄기가 하는 일로 알맞은 것은?
    options:
    - 뿌리에서 흡수한 물이 이동하는 통로가 된다
    - 씨를 만든다
    - 땅속의 물을 흡수한다
    answer: 뿌리에서 흡수한 물이 이동하는 통로가 된다
  - type: choice
    lv: B
    std: 6과11-02
    cat: 과정·기능
    q: 봉선화를 붉은 색소 물에 꽂아 두었다가 줄기를 잘랐어요. 그림의 단면에 붉게 물든 부분이 뜻하는 것은?
    options:
    - 물이 이동하는 통로
    - 양분을 저장하는 곳
    - 꽃가루가 지나가는 길
    answer: 물이 이동하는 통로
    photo: illust/pl-stem-dye
    explain: 가로로 자르면 붉은 점이 둥글게 늘어서 있고, 세로로 자르면 붉은 줄이 길게 이어져 있어요.
  - type: sort
    lv: B
    std: 6과11-02
    cat: 지식·이해
    q: 줄기의 생김새에 따라 식물을 나누어 보세요.
    bins:
    - 곧은줄기
    - 감는줄기
    - 기는줄기
    items:
    - text: 해바라기
      bin: 곧은줄기
    - text: 옥수수
      bin: 곧은줄기
    - text: 나팔꽃
      bin: 감는줄기
    - text: 등나무
      bin: 감는줄기
    - text: 딸기
      bin: 기는줄기
    - text: 고구마
      bin: 기는줄기
  - type: choice
    lv: A
    std: 6과11-02
    cat: 과정·기능
    q: 봉선화를 붉은 색소 물에 꽂은 지 하루 뒤, 줄기뿐 아니라 잎의 잎맥까지 붉게 물들었어요. 이 결과로 알 수 있는 것은?
    options:
    - 뿌리로 흡수한 물은 줄기를 거쳐 잎까지 이동하며, 식물의 기관은 서로 연결되어 있다
    - 잎이 물을 흡수했다
    - 붉은 색소는 잎에서만 만들어진다
    answer: 뿌리로 흡수한 물은 줄기를 거쳐 잎까지 이동하며, 식물의 기관은 서로 연결되어 있다
- id: leaf-food
  title: 잎과 광합성
  emoji: ☀️
  lesson: '5'
  intro: 잎에서 만든 양분을 실험으로 확인해요.
  steps:
  - type: choice
    lv: C
    std: 6과11-02
    cat: 지식·이해
    q: 식물이 빛을 받아 물과 이산화 탄소로 양분을 만드는 것을 무엇이라고 할까요?
    options:
    - 광합성
    - 증산 작용
    - 꽃가루받이
    answer: 광합성
  - type: choice
    lv: B
    std: 6과11-02
    cat: 과정·기능
    q: 그림은 빛을 받은 잎과 알루미늄 포일로 싸 둔 잎에 아이오딘-아이오딘화 칼륨 용액을 떨어뜨린 결과예요. 알 수 있는 것은?
    options:
    - 빛을 받은 잎에서만 녹말이 만들어졌다
    - 포일로 싼 잎에서만 녹말이 만들어졌다
    - 두 잎 모두 녹말이 없다
    answer: 빛을 받은 잎에서만 녹말이 만들어졌다
    photo: illust/pl-iodine
    explain: 녹말은 아이오딘-아이오딘화 칼륨 용액과 만나 청람색으로 변해요.
  - type: order
    lv: B
    std: 6과11-02
    cat: 과정·기능
    q: 광합성 산물 확인 실험의 순서대로 놓아 보세요.
    items:
    - 하루 전에 잎 하나를 알루미늄 포일로 싸 둔다
    - 다음 날 빛을 받은 뒤 두 잎을 딴다
    - 잎을 에탄올에 넣고 물중탕하여 초록색을 뺀다
    - 잎을 물로 헹군 뒤 아이오딘-아이오딘화 칼륨 용액을 떨어뜨린다
    - 두 잎의 색깔 변화를 비교한다
  - type: choice
    lv: A
    std: 6과11-02
    cat: 과정·기능
    q: 이 실험에서 한 잎만 알루미늄 포일로 싸 두는 까닭으로 가장 알맞은 것은?
    options:
    - 빛을 받는 조건만 다르게 하여 빛이 있어야 양분이 만들어지는지 비교하기 위해서이다
    - 잎이 마르지 않게 하기 위해서이다
    - 잎을 따뜻하게 하기 위해서이다
    answer: 빛을 받는 조건만 다르게 하여 빛이 있어야 양분이 만들어지는지 비교하기 위해서이다
- id: leaf-water
  title: 잎과 증산 작용
  emoji: 💨
  lesson: '6'
  intro: 잎에 도달한 물이 어떻게 되는지 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과11-02
    cat: 지식·이해
    q: 뿌리에서 흡수한 물이 잎에서 수증기가 되어 식물 밖으로 빠져나가는 것을 무엇이라고 할까요?
    options:
    - 증산 작용
    - 광합성
    - 흡수
    answer: 증산 작용
  - type: choice
    lv: B
    std: 6과11-02
    cat: 과정·기능
    q: 그림처럼 잎이 있는 모종과 잎을 모두 딴 모종에 비닐봉지를 씌워 햇빛이 드는 곳에 두었어요. 결과로 알 수 있는 것은?
    options:
    - 잎이 있는 쪽 비닐봉지 안에 물방울이 더 많이 생겨, 물이 주로 잎을 통해 빠져나간다는 것을 알 수 있다
    - 두 비닐봉지에 물방울이 똑같이 생겼다
    - 잎을 딴 쪽에 물방울이 더 많이 생겼다
    answer: 잎이 있는 쪽 비닐봉지 안에 물방울이 더 많이 생겨, 물이 주로 잎을 통해 빠져나간다는 것을 알 수 있다
    photo: illust/pl-transpiration
  - type: order
    lv: A
    std: 6과11-02
    cat: 지식·이해
    q: 물이 식물 안에서 이동하는 길을 순서대로 놓아 보세요.
    items:
    - 뿌리털이 땅속의 물을 흡수한다
    - 뿌리
    - 줄기
    - 잎
    - 잎의 기공을 통해 수증기로 빠져나간다
  - type: multi
    lv: A
    std: 6과11-02
    cat: 지식·이해
    q: 증산 작용이 식물에게 도움이 되는 점을 모두 골라 보세요.
    options:
    - 뿌리에서 흡수한 물을 잎까지 끌어올리는 데 도움을 준다
    - 식물의 온도를 조절하는 데 도움을 준다
    - 꽃가루를 멀리 퍼뜨린다
    answers:
    - 뿌리에서 흡수한 물을 잎까지 끌어올리는 데 도움을 준다
    - 식물의 온도를 조절하는 데 도움을 준다
