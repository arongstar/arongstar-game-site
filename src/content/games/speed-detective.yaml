# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-2
title: 속력 탐정
emoji: ⏱️
summary: 달리기 경주 실험실에서 같은 거리, 같은 시간, 서로 다른 거리와 시간의 기록을 비교하고 속력을 구해 빠르기를 비교해요.
story: 운동회 기록지가 뒤죽박죽 섞였어요! 속력 탐정이 되어 누가 가장 빨랐는지 증거로 밝혀 보세요.
lessons:
- '4'
- '5'
- '6'
standards:
- 6과10-02
minutes: 15
teacherGuide:
- 4차시 「같은 거리 달리기」, 5차시 「같은 시간 동안 이동하기」, 6차시 「속력 구하기」 스테이지예요.
- 경주 실험실의 [출발]을 누르면 기록에 따라 선수가 움직여요. 화면 속 시간은 빠르게 줄여 보여 줘요.
- 교육과정에 따라 한 방향으로 움직이는 물체만 다루고, 속력 단위 바꾸기는 다루지 않아요. 계산기를 써도 좋아요.
stages:
- id: same-dist
  title: 같은 거리 달리기
  emoji: 🏁
  lesson: '4'
  intro: 같은 거리를 이동한 물체의 빠르기를 비교해요.
  steps:
  - type: choice
    lv: C
    std: 6과10-02
    cat: 과정·기능
    q: '[출발]을 눌러 50 m 달리기를 해 보세요. 가장 빠른 사람은 누구일까요?'
    options:
    - 하린
    - 지우
    - 도윤
    - 서아
    answer: 하린
    race: &id001
      title: 🏃 50 m 달리기 기록
      items:
      - label: 지우
        emoji: 🏃
        dist: 50
        time: 9
      - label: 하린
        emoji: 🏃‍♀️
        dist: 50
        time: 8
      - label: 도윤
        emoji: 🏃‍♂️
        dist: 50
        time: 10
      - label: 서아
        emoji: 🏃‍♀️
        dist: 50
        time: 11
  - type: choice
    lv: B
    std: 6과10-02
    cat: 지식·이해
    q: 그림처럼 같은 거리를 달린 사람들의 빠르기는 어떻게 비교할까요?
    options:
    - 걸린 시간이 짧을수록 빠르다
    - 걸린 시간이 길수록 빠르다
    - 키가 클수록 빠르다
    answer: 걸린 시간이 짧을수록 빠르다
    photo: illust/mo-race
  - type: order
    lv: A
    std: 6과10-02
    cat: 과정·기능
    q: 50 m 달리기 기록을 보고 빠른 사람부터 순서대로 놓아 보세요.
    items:
    - 하린
    - 지우
    - 도윤
    - 서아
    race: *id001
- id: same-time
  title: 같은 시간 동안 이동하기
  emoji: ⏲️
  lesson: '5'
  intro: 같은 시간 동안 이동한 거리로 빠르기를 비교해요.
  steps:
  - type: choice
    lv: C
    std: 6과10-02
    cat: 과정·기능
    q: '[출발]을 눌러 보세요. 10초 동안 가장 빠르게 이동한 것은 무엇일까요?'
    options:
    - 자전거
    - 킥보드
    - 걷기
    answer: 자전거
    race:
      title: 🛴 10초 동안 이동한 거리
      items:
      - label: 자전거
        emoji: 🚲
        dist: 50
        time: 10
      - label: 킥보드
        emoji: 🛴
        dist: 30
        time: 10
      - label: 걷기
        emoji: 🚶
        dist: 12
        time: 10
  - type: choice
    lv: B
    std: 6과10-02
    cat: 지식·이해
    q: 같은 시간 동안 이동한 물체의 빠르기는 어떻게 비교할까요?
    options:
    - 이동 거리가 길수록 빠르다
    - 이동 거리가 짧을수록 빠르다
    - 비교할 수 없다
    answer: 이동 거리가 길수록 빠르다
  - type: order
    lv: A
    std: 6과10-02
    cat: 과정·기능
    q: 종이비행기가 모두 3초 동안 날았어요. 기록을 보고 빠른 종이비행기부터 순서대로 놓아 보세요.
    items:
    - 나 비행기
    - 가 비행기
    - 다 비행기
    table:
      title: ✈️ 3초 동안 날아간 거리
      head:
      - 종이비행기
      - 날아간 거리
      rows:
      - - 가 비행기
        - 6 m
      - - 나 비행기
        - 9 m
      - - 다 비행기
        - 4.5 m
- id: speed
  title: 속력 구하기
  emoji: 🧮
  lesson: '6'
  intro: 이동 거리와 걸린 시간으로 속력을 구해 빠르기를 비교해요.
  steps:
  - type: choice
    lv: C
    std: 6과10-02
    cat: 지식·이해
    q: 속력을 구하는 방법으로 알맞은 것은?
    options:
    - 이동 거리 ÷ 걸린 시간
    - 걸린 시간 ÷ 이동 거리
    - 이동 거리 × 걸린 시간
    answer: 이동 거리 ÷ 걸린 시간
  - type: choice
    lv: B
    std: 6과10-02
    cat: 과정·기능
    q: 자전거 선수는 60 m를 5초 동안 이동했어요. 자전거 선수의 속력은?
    options:
    - 12 m/s
    - 300 m/s
    - 5 m/s
    answer: 12 m/s
    race:
      title: 🏊 여러 선수의 기록
      items:
      - label: 수영 선수
        emoji: 🏊
        dist: 100
        time: 50
      - label: 육상 선수
        emoji: 🏃
        dist: 100
        time: 10
      - label: 자전거 선수
        emoji: 🚴
        dist: 60
        time: 5
    hint: 60 ÷ 5 를 계산해 보세요. 계산기를 써도 좋아요.
  - type: choice
    lv: B
    std: 6과10-02
    cat: 지식·이해
    q: 「12 m/s」의 뜻으로 알맞은 것은?
    options:
    - 1초 동안 12 m를 이동하는 빠르기
    - 12초 동안 1 m를 이동하는 빠르기
    - 12 m를 이동하는 데 걸린 시간
    answer: 1초 동안 12 m를 이동하는 빠르기
    explain: m/s 는 「미터 매 초」라고 읽어요.
  - type: choice
    lv: A
    std: 6과10-02
    cat: 과정·기능
    q: 세 자동차의 기록을 보고 속력을 구해 보세요. 가장 빠른 자동차는?
    options:
    - 나
    - 다
    - 가
    answer: 나
    race:
      title: 🏅 이동 거리와 걸린 시간이 모두 달라요
      items:
      - label: 가
        emoji: 🚗
        dist: 60
        time: 12
      - label: 나
        emoji: 🚙
        dist: 40
        time: 5
      - label: 다
        emoji: 🚕
        dist: 90
        time: 15
    hint: 가 60÷12, 나 40÷5, 다 90÷15 를 계산해 보세요.
    explain: 가는 5 m/s, 나는 8 m/s, 다는 6 m/s 예요. 가장 멀리 간 「다」가 아니라 속력이 가장 큰 「나」가 가장 빨라요.
  - type: multi
    lv: A
    std: 6과10-02
    cat: 지식·이해
    q: 속력이 크다는 것의 뜻을 모두 골라 보세요.
    options:
    - 같은 시간 동안 더 먼 거리를 이동한다
    - 같은 거리를 더 짧은 시간에 이동한다
    - 항상 더 오랜 시간 동안 움직인다
    - 물체가 더 무겁다
    answers:
    - 같은 시간 동안 더 먼 거리를 이동한다
    - 같은 거리를 더 짧은 시간에 이동한다
