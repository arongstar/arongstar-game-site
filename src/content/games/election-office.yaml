# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: village
unit: soc-6-1-2
title: 우리 반 선거 관리 위원회
emoji: 🗳️
summary: 선거의 의미와 역할, 민주 선거의 네 가지 원칙, 선거 과정을 알아보고 바람직한 유권자의 태도를 길러요.
story: 우리 반 회장 선거가 다가왔어요! 선거 관리 위원이 되어 모두가 공정하게 참여하는 선거를 치러 보세요.
lessons:
- '2'
- '3'
- '4'
standards:
- 6사08-01
minutes: 15
teacherGuide:
- 2차시 「선거는 왜 중요할까?」, 3차시 「민주 선거의 원칙」, 4차시 「선거 과정과 태도」 스테이지예요.
- 실제 학급 회장 선거나 모의 선거와 함께 하면 좋아요. 우리나라는 만 18세 이상 국민이 투표할 수 있어요.
stages:
- id: meaning
  title: 선거는 왜 중요할까?
  emoji: 🏛️
  lesson: '2'
  intro: 민주주의에서 선거의 의미와 역할을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사08-01
    cat: 지식·이해
    q: 그림처럼 국민이 투표로 대표를 뽑는 것을 무엇이라고 할까요?
    options:
    - 선거
    - 재판
    - 회의
    answer: 선거
    photo: illust/so-vote
  - type: multi
    lv: B
    std: 6사08-01
    cat: 지식·이해
    q: 민주주의에서 선거가 하는 역할을 모두 골라 보세요.
    options:
    - 국민이 나라의 주인으로서 주권을 행사한다
    - 국민의 뜻을 대신할 대표를 뽑는다
    - 대표가 일을 잘했는지 다음 선거에서 평가한다
    - 선거에서 이긴 사람이 마음대로 법을 정하게 한다
    answers:
    - 국민이 나라의 주인으로서 주권을 행사한다
    - 국민의 뜻을 대신할 대표를 뽑는다
    - 대표가 일을 잘했는지 다음 선거에서 평가한다
  - type: choice
    lv: A
    std: 6사08-01
    cat: 가치·태도
    q: 「내 한 표로는 아무것도 바뀌지 않아.」라고 말하는 친구에게 해 줄 말로 가장 알맞은 것은?
    options:
    - 한 사람 한 사람의 표가 모여 대표를 정하고, 투표는 나라의 주인으로서 내 뜻을 나타내는 방법이야
    - 맞아, 투표는 안 해도 돼
    - 다른 사람에게 대신 투표해 달라고 하면 돼
    answer: 한 사람 한 사람의 표가 모여 대표를 정하고, 투표는 나라의 주인으로서 내 뜻을 나타내는 방법이야
- id: principles
  title: 민주 선거의 원칙
  emoji: ⚖️
  lesson: '3'
  intro: 민주 선거의 네 가지 원칙을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사08-01
    cat: 지식·이해
    q: 누구에게 투표했는지 다른 사람이 알 수 없게 하는 원칙은?
    options:
    - 비밀 선거
    - 보통 선거
    - 평등 선거
    answer: 비밀 선거
  - type: sort
    lv: B
    std: 6사08-01
    cat: 지식·이해
    q: 설명에 알맞은 민주 선거의 원칙을 짝지어 보세요.
    bins:
    - 보통 선거
    - 평등 선거
    - 직접 선거
    - 비밀 선거
    items:
    - text: 일정한 나이가 되면 누구나 투표할 수 있다
      bin: 보통 선거
    - text: 누구나 한 사람이 한 표씩 투표한다
      bin: 평등 선거
    - text: 다른 사람이 대신하지 않고 자신이 직접 투표한다
      bin: 직접 선거
    - text: 누구에게 투표했는지 알 수 없게 한다
      bin: 비밀 선거
  - type: sort
    lv: A
    std: 6사08-01
    cat: 과정·기능
    q: 그림의 학급 선거에서 일어난 일이 어떤 원칙을 어긴 것인지 분석해 보세요.
    bins:
    - 보통 선거
    - 평등 선거
    - 직접 선거
    - 비밀 선거
    items:
    - text: 키가 큰 친구들만 투표할 수 있게 했다
      bin: 보통 선거
    - text: 반장은 두 표씩 투표하게 했다
      bin: 평등 선거
    - text: 결석한 친구 대신 짝꿍이 투표했다
      bin: 직접 선거
    - text: 투표용지를 친구에게 보여 주며 적었다
      bin: 비밀 선거
    photo: illust/so-class-election
- id: process
  title: 선거 과정과 태도
  emoji: 📋
  lesson: '4'
  intro: 선거가 이루어지는 과정과 바람직한 태도를 알아봐요.
  steps:
  - type: order
    lv: C
    std: 6사08-01
    cat: 지식·이해
    q: 선거 과정을 차례대로 놓아 보세요.
    items:
    - 후보자 등록
    - 선거 운동
    - 투표
    - 개표
    - 당선인 결정
  - type: multi
    lv: B
    std: 6사08-01
    cat: 가치·태도
    q: 후보자가 지켜야 할 바람직한 태도를 모두 골라 보세요.
    options:
    - 실천할 수 있는 공약을 내세운다
    - 다른 후보를 존중하며 정정당당하게 겨룬다
    - 선거 결과를 받아들인다
    - 친구들에게 간식을 주며 표를 부탁한다
    answers:
    - 실천할 수 있는 공약을 내세운다
    - 다른 후보를 존중하며 정정당당하게 겨룬다
    - 선거 결과를 받아들인다
  - type: shop
    lv: A
    std: 6사08-01
    cat: 가치·태도
    q: 선거 관리 위원장의 고민을 듣고, 유권자로서 바람직한 태도를 모두 골라 보세요.
    customer:
      emoji: 🧑‍⚖️
      name: 선거 관리 위원장
      place: 우리 반 회장 선거
      says: 친구들이 인기나 친한 정도만 보고 투표하려고 해요. 어떻게 투표해야 할까요?
    features:
    - text: 후보자의 공약을 꼼꼼히 비교하고 실천할 수 있는지 따져 본다
      fit: true
      why: 공약을 보고 판단해야 반을 위해 일할 대표를 뽑을 수 있어요.
    - text: 선거에 빠지지 않고 참여한다
      fit: true
      why: 참여해야 내 뜻을 나타낼 수 있어요.
    - text: 선거 결과가 마음에 들지 않아도 존중하고 함께 협력한다
      fit: true
      why: 민주주의는 결과를 존중하는 것에서 시작해요.
    - text: 친한 친구라서 무조건 뽑는다
      fit: false
      why: 공약과 자질을 보고 판단해야 해요.
    plan: false
