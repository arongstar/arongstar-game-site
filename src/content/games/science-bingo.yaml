template: bingo
unit: sci-6-2-4
title: 2학기 과학 탐험 빙고
emoji: 🎯
summary: 6학년 2학기 과학에서 배운 낱말로 태블릿 빙고판을 채우고, 전자칠판의 설명을 보고 낱말을 맞혀 표시해요.
lessons: ['4']
standards: [6과16-01, 6과16-02]
minutes: 20
size: 4
teacherGuide:
  - 2학기 과학을 마무리하는 교실 놀이로 써요. 전자칠판에는 이 화면을, 학생 태블릿에는 「내 빙고판」을 열어요.
  - 계절의 변화·물질의 연소·전기의 이용·과학과 나의 진로 낱말 28개가 섞여 나와요.
words:
  - { word: "태양 고도", clue: "태양이 땅과 이루는 각이에요." }
  - { word: "남중 고도", clue: "태양이 정남쪽에 있을 때의 태양 고도로, 하루 중 가장 높아요." }
  - { word: "그림자", clue: "태양 고도가 높을수록 짧아지고, 낮을수록 길어져요." }
  - { word: "낮의 길이", clue: "해가 뜰 때부터 질 때까지의 시간으로, 여름에 길고 겨울에 짧아요." }
  - { word: "자전축", clue: "지구가 스스로 도는 중심축으로, 23.5° 기울어져 있어요." }
  - { word: "공전", clue: "지구가 태양 둘레를 1년에 한 바퀴씩 도는 것이에요." }
  - { word: "계절의 변화", clue: "지구의 자전축이 기울어진 채 공전하기 때문에 생겨요." }
  - { word: "연소", clue: "물질이 산소와 빠르게 반응하여 빛과 열을 내는 현상이에요." }
  - { word: "산소", clue: "물질이 타는 데 꼭 필요한 기체로, 비커로 덮으면 촛불이 꺼지는 까닭이 돼요." }
  - { word: "발화점", clue: "불을 직접 붙이지 않아도 물질이 타기 시작하는 온도예요." }
  - { word: "탈 물질", clue: "연소의 세 가지 조건 가운데 하나로, 양초·나무·알코올 같은 것이에요." }
  - { word: "석회수", clue: "이산화 탄소를 만나면 뿌옇게 흐려지는 물이에요." }
  - { word: "염화 코발트 종이", clue: "물에 닿으면 푸른색에서 붉은색으로 변하는 종이예요." }
  - { word: "이산화 탄소", clue: "연소 후에 생기며, 늘어나면 지구의 기온을 높이는 기체예요." }
  - { word: "생태계", clue: "생물과 그 둘레의 환경이 서로 영향을 주고받으며 이루는 세계예요." }
  - { word: "전기 회로", clue: "전지, 전선, 전구 등을 연결해 전기가 흐르도록 한 것이에요." }
  - { word: "스위치", clue: "전기 회로를 이었다 끊었다 하며 전구를 켜고 끄는 장치예요." }
  - { word: "직렬연결", clue: "한 전지의 (+)극을 다른 전지의 (−)극에 차례로 잇는 연결이에요." }
  - { word: "전자석", clue: "전기가 흐를 때만 자석의 성질을 가지는 자석이에요." }
  - { word: "영구 자석", clue: "전기가 흐르지 않아도 늘 자석의 성질을 가지는 자석이에요." }
  - { word: "에나멜선", clue: "겉에 얇은 막을 입힌 전선으로, 못에 감아 전자석을 만들어요." }
  - { word: "대기 전력", clue: "전기 제품을 쓰지 않아도 플러그가 꽂혀 있으면 새어 나가는 전기예요." }
  - { word: "감전", clue: "몸에 전기가 흘러 다치는 것으로, 젖은 손으로 플러그를 만지면 위험해요." }
  - { word: "엘이디 전등", clue: "같은 밝기를 내면서 전기를 적게 쓰는 전등이에요." }
  - { word: "미래 사회", clue: "지금의 자료를 근거로 고령화·기후 변화 같은 문제를 예상해 보는 앞으로의 사회예요." }
  - { word: "돌봄 로봇", clue: "고령화 사회에서 노인의 생활을 도울 수 있는 과학 기술의 예예요." }
  - { word: "진로", clue: "앞으로 내가 나아갈 길로, 대부분 과학과 이어져 있어요." }
  - { word: "재생 에너지", clue: "햇빛·바람처럼 연료를 태우지 않아 이산화 탄소를 적게 내보내는 에너지예요." }
