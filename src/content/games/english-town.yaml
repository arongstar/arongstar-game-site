title: English Town — 우리 학교 탐험
emoji: 🗺️
summary: 내 캐릭터로 학교를 돌아다니며 친구들에게 영어로 학년과 동아리를 묻고, 대답을 듣고 친구 카드를 모아요. 도서관·트랙·시냇물에서는 미니게임이 열려요.
story: 새 학년 첫날, 학교 곳곳에 새 친구들이 기다리고 있어요! 친구에게 다가가 영어로 말을 걸고, 6학년 친구 3명을 찾아보세요. 코인을 모아 캐릭터를 꾸밀 수도 있어요.
