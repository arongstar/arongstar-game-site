minutes: 20
teacherGuide:
- 1·2차시에 써요. 학생이 친구를 누르면 걸어가서 대화가 시작돼요. 대화마다 학년 묻기 → 듣기 → 동아리 묻기 → 듣기 순서예요.
- 🧭 단계는 질문을 고르고 대본을 보며 들어요. 🔎 단계는 낱말 카드로 질문을 만들고 대본 없이 들어요. 🏅 단계는 질문을 직접 소리 내어 말하고(녹음·스스로 확인) 들어요.
- 코인과 꾸미기, 친구 카드는 학생 기기에만 저장돼요. 맵의 도서관·트랙·시냇물을 누르면 단어 외우기, Listen & Jump, Word Bridge 로 이어져요.
