categories:
- name: 세포
  emoji: 🔬
  items:
  - lv: C
    q: 생물을 이루는 기본 단위는?
    answer: 세포
  - lv: B
    q: 식물 세포에서 세포막 바깥을 둘러싸 모양을 일정하게 해 주는 것은?
    answer: 세포벽
  - lv: A
    q: 현미경의 배율을 높이면 보이는 세포의 수와 크기는 어떻게 될까요?
    answer: 보이는 세포의 수는 줄고, 세포는 크게 보여요.
- name: 뿌리와 줄기
  emoji: 🌿
  items:
  - lv: C
    q: 땅속의 물을 흡수하는 식물의 기관은?
    answer: 뿌리
  - lv: B
    q: 붉은 색소 물에 꽂은 봉선화 줄기를 자르면 붉게 물든 부분은 무엇일까요?
    answer: 물이 이동하는 통로
  - lv: A
    q: 뿌리와 줄기, 잎이 서로 연결되어 있다는 증거를 실험으로 말해 보세요.
    answer: 붉은 색소 물이 뿌리와 줄기를 거쳐 잎의 잎맥까지 물들어요.
- name: 잎
  emoji: ☀️
  items:
  - lv: C
    q: 잎에서 빛을 받아 양분을 만드는 것은?
    answer: 광합성
  - lv: B
    q: 녹말을 만나면 청람색으로 변하는 용액은?
    answer: 아이오딘-아이오딘화 칼륨 용액
  - lv: A
    q: 잎이 있는 모종의 비닐봉지에만 물방울이 많이 생긴 까닭을 설명해 보세요.
    answer: 뿌리에서 흡수한 물이 잎의 기공을 통해 수증기로 빠져나가는 증산 작용 때문이에요.
- name: 꽃과 씨
  emoji: 🌸
  items:
  - lv: C
    q: 꽃가루를 만드는 꽃의 부분은?
    answer: 수술
  - lv: B
    q: 도꼬마리 씨는 어떻게 퍼질까요?
    answer: 동물의 털에 붙어서
  - lv: A
    q: 벌이 없는 곳에서도 벼가 꽃가루받이를 할 수 있는 까닭은?
    answer: 벼는 바람의 도움으로 꽃가루받이를 하기 때문이에요.
