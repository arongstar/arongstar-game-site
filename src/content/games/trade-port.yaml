template: mission
style: village
unit: soc-6-2-2
title: 무역 항구 탐험
emoji: 🚢
summary: 우리 집 냉장고와 항구의 컨테이너에서 무역 사례를 찾고, 나라끼리 무역을 하는 까닭과 서로 기대어 사는 모습을 탐구해요.
story: 경제 탐험대가 커다란 무역 항구에 도착했어요! 오늘 들어온 컨테이너와 나가는 컨테이너를 조사해서, 나라와 나라가 왜 물건을 주고받는지 밝혀 주세요.
lessons: ['11', '12', '13']
standards: [6사11-03]
minutes: 12
teacherGuide:
  - 11차시 '무역의 의미', 12차시 '무역이 일어나는 까닭', 13차시 '서로 기대어 사는 세계' 스테이지로 나뉘어 있어요.
  - 12차시는 1단원 「세계의 자연환경」과 이어져요. 커피·바나나처럼 기후 때문에 무역을 하는 사례를 1단원의 기후 그래프와 함께 떠올리게 해 주세요.
  - 수출·수입 품목 표는 최근 무역 통계를 바탕으로 한 대표 품목이에요. 해마다 순위는 조금씩 달라질 수 있어요.
stages:
  # ════════════ 무역의 의미 ════════════
  - id: meaning
    title: 무역이란 무엇일까?
    emoji: 📦
    lesson: '11'
    intro: 우리 생활 속 무역 사례를 찾아봐요.
    steps:
      - type: choice
        lv: C
        std: 6사11-03
        cat: 지식·이해
        photo: economy/port
        q: 무역이란 무엇일까요?
        options:
          - 나라와 나라 사이에 물건이나 서비스를 사고파는 것
          - 한 동네 안에서 물건을 나누어 쓰는 것
          - 물건을 공짜로 주는 것
        answer: 나라와 나라 사이에 물건이나 서비스를 사고파는 것
      - type: sort
        lv: C
        std: 6사11-03
        cat: 지식·이해
        q: 수출과 수입으로 나누어 보세요.
        hint: 수출은 다른 나라에 파는 것, 수입은 다른 나라에서 사 오는 것이에요.
        bins: [수출, 수입]
        items:
          - { text: "우리나라 회사가 만든 자동차를 미국에 판다", bin: "수출" }
          - { text: "우리나라 반도체를 다른 나라에 판다", bin: "수출" }
          - { text: "다른 나라 사람들이 돈을 내고 케이팝 공연 영상을 본다", bin: "수출" }
          - { text: "브라질에서 커피를 사 온다", bin: "수입" }
          - { text: "칠레에서 포도를 사 온다", bin: "수입" }
          - { text: "오스트레일리아에서 철광석을 사 온다", bin: "수입" }
      - type: choice
        lv: C
        std: 6사11-03
        cat: 지식·이해
        photo: economy/port
        q: 사진 속 항구에서는 어떤 일이 일어날까요?
        options:
          - 무역 상품을 담은 컨테이너를 배에 싣고 내린다
          - 농부들이 벼농사를 짓는다
          - 학생들이 수업을 한다
        answer: 무역 상품을 담은 컨테이너를 배에 싣고 내린다

      - type: multi
        lv: B
        std: 6사11-03
        cat: 과정·기능
        card: { emoji: "🧊", title: "우리 집 냉장고 탐험", text: "바나나(필리핀), 커피(베트남), 포도(칠레), 소고기(오스트레일리아), 김치(대한민국)" }
        q: 우리 집 냉장고를 조사한 결과로 알 수 있는 것을 모두 고르세요.
        options:
          - 우리 생활 곳곳에 다른 나라에서 수입한 물건이 있다
          - 우리나라는 여러 나라와 무역을 한다
          - 우리가 먹는 것은 모두 우리나라에서 만든다
        answers: [우리 생활 곳곳에 다른 나라에서 수입한 물건이 있다, 우리나라는 여러 나라와 무역을 한다]
      - type: pin
        lv: B
        std: 6사11-03
        cat: 과정·기능
        q: 우리나라가 바나나를 많이 수입하는 필리핀은 지도에서 어디일까요?
        hint: 필리핀은 우리나라의 남쪽, 적도 가까운 바다 위의 섬나라예요.
        pins: [philippines, chile, brazil, germany]
        answer: philippines
      - type: pin
        lv: B
        std: 6사11-03
        cat: 과정·기능
        q: 우리나라가 포도를 수입하는 칠레는 지도에서 어디일까요?
        hint: 칠레는 남아메리카 서쪽 바닷가를 따라 길쭉하게 생긴 나라예요.
        pins: [chile, australia, vietnam, usa]
        answer: chile
        explain: 칠레는 우리나라와 계절이 반대여서, 우리나라가 겨울일 때 여름 과일인 포도를 보낼 수 있어요. 2004년에 우리나라가 처음으로 자유 무역 협정을 맺은 나라이기도 해요.
      - type: choice
        lv: B
        std: 6사11-03
        cat: 지식·이해
        q: 다음 중 '서비스'를 사고파는 무역의 예는?
        options:
          - 다른 나라 여행객이 우리나라에 와서 관광하고 돈을 쓴다
          - 바나나를 배로 실어 온다
          - 자동차를 배에 실어 보낸다
        answer: 다른 나라 여행객이 우리나라에 와서 관광하고 돈을 쓴다
        explain: 물건뿐 아니라 관광, 영화·게임 같은 문화 콘텐츠, 교육 같은 서비스도 무역해요.

      - type: multi
        lv: A
        std: 6사11-03
        cat: 과정·기능
        table: &tradetable
          title: 우리나라의 대표 수출품과 수입품 (최근)
          head: [구분, 대표 품목]
          rows:
            - ["수출", "반도체, 자동차, 석유 제품, 선박, 일반 기계"]
            - ["수입", "원유, 반도체, 천연가스, 석탄, 정밀 기계"]
          note: 한국무역협회 무역 통계를 바탕으로 정리했어요. 해마다 순위는 조금씩 달라요.
        q: 표를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 우리나라는 원유·천연가스 같은 자원을 많이 수입한다
          - 자동차·선박 같은 공업 제품을 많이 수출한다
          - 반도체는 수출도 하고 수입도 한다
          - 우리나라의 수출품은 대부분 농산물이다
        answers:
          - 우리나라는 원유·천연가스 같은 자원을 많이 수입한다
          - 자동차·선박 같은 공업 제품을 많이 수출한다
          - 반도체는 수출도 하고 수입도 한다
      - type: choice
        lv: A
        std: 6사11-03
        cat: 지식·이해
        table: *tradetable
        q: 우리나라가 반도체를 수출도 하고 수입도 하는 까닭을 가장 알맞게 탐구한 것은?
        options:
          - 반도체는 종류가 많아서, 우리나라가 잘 만드는 것은 팔고 필요한 다른 종류는 사 오기 때문에
          - 반도체를 만들 줄 몰라서
          - 수출한 반도체를 다시 돌려받기 때문에
        answer: 반도체는 종류가 많아서, 우리나라가 잘 만드는 것은 팔고 필요한 다른 종류는 사 오기 때문에

  # ════════════ 무역이 일어나는 까닭 ════════════
  - id: reasons
    title: 나라끼리 왜 무역을 할까?
    emoji: 🤝
    lesson: '12'
    intro: 나라마다 잘 만들 수 있는 것이 다른 까닭을 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6사11-03
        cat: 지식·이해
        photo: economy/oil
        q: 우리나라가 석유를 수입하는 까닭은 무엇일까요?
        options: [우리나라에는 석유가 거의 나지 않기 때문에, 석유가 너무 많아서, 석유를 쓰지 않아서]
        answer: 우리나라에는 석유가 거의 나지 않기 때문에
      - type: choice
        lv: C
        std: 6사11-03
        cat: 지식·이해
        photo: economy/coffee
        q: 우리나라가 커피를 수입하는 까닭은 무엇일까요?
        hint: 1단원에서 배운 기후를 떠올려 보세요.
        options:
          - 커피는 덥고 비가 많은 열대 지역에서 잘 자라기 때문에
          - 커피는 추운 곳에서만 자라기 때문에
          - 우리나라 사람들은 커피를 마시지 않기 때문에
        answer: 커피는 덥고 비가 많은 열대 지역에서 잘 자라기 때문에
      - type: pin
        lv: C
        std: 6사11-03
        cat: 과정·기능
        q: 우리나라가 원유를 가장 많이 수입하는 나라인 사우디아라비아는 지도에서 어디일까요?
        hint: 아라비아반도에 있는 나라예요. 아프리카와 아시아 사이를 찾아보세요.
        pins: [saudi, brazil, germany, australia]
        answer: saudi

      - type: sort
        lv: B
        std: 6사11-03
        cat: 지식·이해
        q: 무역이 일어나는 까닭에 따라 나누어 보세요.
        bins: [자원이 달라서, 기후가 달라서, 기술이 달라서]
        items:
          - { text: "사우디아라비아에서 원유를 사 온다", bin: "자원이 달라서" }
          - { text: "오스트레일리아에서 철광석을 사 온다", photo: "economy/ironore", bin: "자원이 달라서" }
          - { text: "필리핀에서 바나나를 사 온다", photo: "economy/banana", bin: "기후가 달라서" }
          - { text: "브라질에서 커피를 사 온다", bin: "기후가 달라서" }
          - { text: "여러 나라가 우리나라의 반도체를 사 간다", bin: "기술이 달라서" }
          - { text: "우리나라가 독일의 정밀 기계를 사 온다", bin: "기술이 달라서" }
      - type: pin
        lv: B
        std: 6사11-03
        cat: 과정·기능
        photo: economy/ironore
        q: 철광석을 많이 수입해 오는 오스트레일리아는 지도에서 어디일까요?
        pins: [australia, brazil, chile, china]
        answer: australia
      - type: choice
        lv: B
        std: 6사11-03
        cat: 지식·이해
        q: 나라와 나라 사이에 무역이 일어나는 까닭을 가장 알맞게 설명한 것은?
        options:
          - 나라마다 자원, 자연환경, 기술이 달라 잘 만들 수 있는 것이 다르기 때문에 서로 필요한 것을 사고판다
          - 모든 나라가 똑같은 것을 만들 수 있기 때문에
          - 다른 나라 물건이 무조건 더 좋기 때문에
        answer: 나라마다 자원, 자연환경, 기술이 달라 잘 만들 수 있는 것이 다르기 때문에 서로 필요한 것을 사고판다

      - type: choice
        lv: A
        std: 6사11-03
        cat: 과정·기능
        table:
          title: 두 나라가 하루에 만들 수 있는 양
          head: [나라, 컴퓨터만 만들면, 바나나만 기르면]
          rows:
            - ["가 나라", "10대", "20상자"]
            - ["나 나라", "2대", "40상자"]
        q: 두 나라 모두 컴퓨터와 바나나가 필요해요. 표를 분석해 두 나라가 더 많이 얻을 수 있는 방법을 고르세요.
        options:
          - 가 나라는 컴퓨터를, 나 나라는 바나나를 집중해서 만들고 서로 바꾼다
          - 두 나라 모두 컴퓨터와 바나나를 조금씩 직접 만든다
          - 가 나라는 바나나를, 나 나라는 컴퓨터를 집중해서 만든다
        answer: 가 나라는 컴퓨터를, 나 나라는 바나나를 집중해서 만들고 서로 바꾼다
        explain: 각 나라가 더 잘 만드는 것에 집중하고 무역하면, 두 나라 모두 혼자 만들 때보다 더 많이 얻을 수 있어요.
      - type: choice
        lv: A
        std: 6사11-03
        cat: 지식·이해
        q: 만약 우리나라가 다른 나라와 무역을 하지 않는다면 어떻게 될까요?
        options:
          - 석유가 없어 공장과 자동차가 멈추고, 반도체를 팔지 못해 기업과 일자리도 어려워진다
          - 아무 변화가 없다
          - 물건이 더 많아지고 값이 싸진다
        answer: 석유가 없어 공장과 자동차가 멈추고, 반도체를 팔지 못해 기업과 일자리도 어려워진다
      - type: multi
        lv: A
        std: 6사11-03
        cat: 과정·기능
        table: *tradetable
        q: 표를 분석해 우리나라 무역의 특징을 모두 고르세요.
        options:
          - 자원이 부족해 원료를 수입한다
          - 수입한 원료로 공업 제품을 만들어 수출한다
          - 기술이 필요한 첨단 제품을 많이 수출한다
          - 다른 나라와 거의 무역을 하지 않는다
        answers:
          - 자원이 부족해 원료를 수입한다
          - 수입한 원료로 공업 제품을 만들어 수출한다
          - 기술이 필요한 첨단 제품을 많이 수출한다

  # ════════════ 서로 기대어 사는 세계 ════════════
  - id: interdependence
    title: 무역으로 이어진 세계
    emoji: 🌐
    lesson: '13'
    intro: 무역으로 서로 기대고, 또 경쟁하는 나라들을 만나요.
    steps:
      - type: choice
        lv: C
        std: 6사11-03
        cat: 지식·이해
        q: 나라와 나라가 무역으로 서로 필요한 것을 주고받으며 기대어 사는 것을 무엇이라고 할까요?
        options: [상호 의존, 자급자족, 독점]
        answer: 상호 의존
      - type: multi
        lv: C
        std: 6사11-03
        cat: 지식·이해
        q: 무역 덕분에 우리 생활에서 좋아진 점을 모두 고르세요.
        options:
          - 우리나라에서 나지 않는 과일도 먹을 수 있다
          - 여러 나라의 다양한 상품을 고를 수 있다
          - 우리 기업이 만든 물건을 세계에 팔 수 있다
          - 물건을 고를 수 있는 폭이 좁아진다
        answers:
          - 우리나라에서 나지 않는 과일도 먹을 수 있다
          - 여러 나라의 다양한 상품을 고를 수 있다
          - 우리 기업이 만든 물건을 세계에 팔 수 있다

      - type: choice
        lv: B
        std: 6사11-03
        cat: 지식·이해
        card: { emoji: "☕", title: "커피 농장의 가뭄", text: "커피를 많이 기르는 나라에 큰 가뭄이 들어 커피 생산이 크게 줄었어요." }
        q: 우리나라에는 어떤 일이 생길까요?
        options:
          - 수입하는 커피가 줄어 커피 값이 오를 수 있다
          - 우리나라와는 아무 관계가 없다
          - 우리나라 커피 값이 내려간다
        answer: 수입하는 커피가 줄어 커피 값이 오를 수 있다
        explain: 무역으로 이어진 나라들은 멀리 떨어져 있어도 서로 영향을 주고받아요.
      - type: choice
        lv: B
        std: 6사11-03
        cat: 지식·이해
        q: 자유 무역 협정(FTA)은 무엇일까요?
        options:
