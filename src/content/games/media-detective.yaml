# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: soc-6-1-2
title: 미디어 탐정
emoji: 🔎
summary: 민주주의에서 미디어의 의미와 역할을 알아보고, 기사와 광고, 영상 속 정보를 비판적으로 분석하여 올바르게 이용하는 방법을 익혀요.
story: 학교 단톡방에 깜짝 놀랄 소식이 퍼지고 있어요! 미디어 탐정이 되어 정보가 믿을 만한지 단서를 찾아 밝혀 보세요.
lessons:
- '9'
- '10'
standards:
- 6사08-03
minutes: 15
teacherGuide:
- 9차시 「미디어의 역할」, 10차시 「비판적으로 분석하기」 스테이지예요. 다짐 카드는 「나의 탐험 리포트」에 모여요.
- 학생들이 자주 보는 미디어(영상, 웹툰, 단체 대화방)의 실제 사례로 이어서 이야기 나누면 좋아요.
stages:
- id: role
  title: 미디어의 역할
  emoji: 📺
  lesson: '9'
  intro: 민주주의에서 미디어의 의미와 역할을 알아봐요.
  steps:
  - type: multi
    lv: C
    std: 6사08-03
    cat: 지식·이해
    q: 그림 속 여러 가지 미디어 가운데 정보를 전하는 미디어를 모두 골라 보세요.
    options:
    - 텔레비전 뉴스
    - 신문
    - 라디오
    - 누리 소통망(SNS)과 영상 누리집
    - 연필
    answers:
    - 텔레비전 뉴스
    - 신문
    - 라디오
    - 누리 소통망(SNS)과 영상 누리집
    photo: illust/so-media
  - type: multi
    lv: B
    std: 6사08-03
    cat: 지식·이해
    q: 민주주의에서 미디어가 하는 역할을 모두 골라 보세요.
    options:
    - 사회의 여러 소식과 정보를 전한다
    - 사람들의 다양한 의견을 전하고 토론의 장을 만든다
    - 국가기관이 일을 잘하는지 감시하고 비판한다
    - 한 가지 의견만 옳다고 정해 준다
    answers:
    - 사회의 여러 소식과 정보를 전한다
    - 사람들의 다양한 의견을 전하고 토론의 장을 만든다
    - 국가기관이 일을 잘하는지 감시하고 비판한다
  - type: sort
    lv: A
    std: 6사08-03
    cat: 과정·기능
    q: 미디어 속 문장을 사실과 의견으로 나누어 보세요.
    bins:
    - 사실
    - 의견
    items:
    - text: 어제 우리 시에 첫눈이 3 cm 내렸다
      bin: 사실
    - text: 시청은 다음 달에 도서관을 새로 연다고 발표했다
      bin: 사실
    - text: 새 도서관은 세상에서 가장 멋진 건물이다
      bin: 의견
    - text: 이번 겨울은 정말 지루할 것이다
      bin: 의견
    explain: 사실은 확인할 수 있는 내용이고, 의견은 생각이나 느낌이에요. 미디어를 볼 때 둘을 구분해야 해요.
- id: critical
  title: 비판적으로 분석하기
  emoji: 🕵️
  lesson: '10'
  intro: 정보를 비판적으로 분석하고 올바르게 이용해요.
  steps:
  - type: multi
    lv: C
    std: 6사08-03
    cat: 과정·기능
    q: 그림처럼 깜짝 놀랄 소식을 보았을 때 믿을 만한지 확인하는 방법을 모두 골라 보세요.
    options:
    - 누가 쓴 글인지 출처를 확인한다
    - 언제 쓴 글인지 날짜를 확인한다
    - 다른 믿을 만한 미디어에서도 같은 내용을 전하는지 비교한다
    - 제목이 놀라우면 바로 친구들에게 퍼뜨린다
    answers:
    - 누가 쓴 글인지 출처를 확인한다
    - 언제 쓴 글인지 날짜를 확인한다
    - 다른 믿을 만한 미디어에서도 같은 내용을 전하는지 비교한다
    photo: illust/so-fakenews
  - type: choice
    lv: B
    std: 6사08-03
    cat: 과정·기능
    q: 다음 글에서 가장 의심해야 할 점은?
    options:
    - 출처와 날짜가 없고, 확인할 수 없는 내용을 자극적인 말로 전하고 있다
    - 글이 짧다
    - 느낌표가 하나 있다
    answer: 출처와 날짜가 없고, 확인할 수 없는 내용을 자극적인 말로 전하고 있다
    card:
      emoji: 📢
      title: 【충격】 내일부터 학교 급식 사라진다!!!
      text: '“아는 사람한테 들었는데 진짜래요. 빨리 퍼뜨려 주세요!” (글쓴이: 알 수 없음, 날짜: 없음)'
  - type: choice
    lv: B
    std: 6사08-03
    cat: 과정·기능
    q: 인기 크리에이터가 영상에서 장난감을 칭찬하는데, 영상 아래에 작게 「유료 광고 포함」이라고 적혀 있어요. 이 영상을 볼 때 알맞은 태도는?
    options:
    - 광고라는 점을 알고, 장점만 말하지 않는지 따져 보며 본다
    - 좋아하는 크리에이터니까 모두 믿는다
    - 광고는 모두 거짓이니 무시한다
    answer: 광고라는 점을 알고, 장점만 말하지 않는지 따져 보며 본다
  - type: shop
    lv: A
    std: 6사08-03
    cat: 가치·태도
    q: 미디어를 올바르게 이용하는 방법을 모두 골라 다짐 카드를 만들어 보세요.
    customer:
      emoji: 🧑‍💻
      name: 미디어 탐정 대장
      place: 우리 반
      says: 미디어를 만들고 나누는 사람도 책임이 있어요. 우리 반 미디어 이용 약속을 정해 주세요.
    features:
    - text: 남의 사진이나 글을 쓸 때 출처를 밝히고 허락을 받는다
      fit: true
      why: 저작권을 지키는 일이에요.
    - text: 내 이름, 주소, 전화번호 같은 개인 정보를 함부로 올리지 않는다
      fit: true
      why: 개인 정보를 보호해야 해요.
    - text: 사실을 확인한 뒤에 정보를 나눈다
      fit: true
      why: 잘못된 정보가 퍼지는 것을 막아요.
    - text: 재미있으면 친구를 놀리는 댓글도 단다
      fit: false
      why: 악성 댓글은 다른 사람에게 큰 상처를 줘요.
    planLabels:
      title: 📱 미디어 이용 다짐 카드 만들기 (선택)
      name: 나의 미디어 다짐
      slogan: 친구에게 알려 주고 싶은 한 문장
      when: 언제, 어디에서 실천할까?
      save: 다짐 카드 저장
      emoji: 📱
