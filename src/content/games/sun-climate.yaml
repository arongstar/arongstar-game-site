template: mission
style: sun
unit: soc-6-2-1
title: 햇볕 따라 기후 지도
emoji: ☀️
summary: 위도를 바꾸며 햇볕이 퍼지는 모습을 실험하고, 세계 도시를 알맞은 기후에 놓아 기후 분포를 알아내요. 나라마다 전통 의상이 다른 까닭도 찾아봐요.
story: 탐험 본부의 햇볕 실험실이에요! 같은 햇빛이 적도와 북극에서 어떻게 다르게 닿는지 실험하고, 그 결과로 세계 기후 지도를 완성해 주세요.
lessons: ['8']
standards: [6사10-02]
minutes: 15
teacherGuide:
  - 8차시 [스스로 활동] '위도별로 받는 햇볕의 양을 고려하여 각 도시의 위치에 맞는 기후 쓰기'를 게임으로 해요.
  - 햇볕 실험 그림에서 슬라이더로 위도를 바꾸면, 같은 굵기의 햇빛이 넓게 퍼지며 땅이 받는 햇볕이 약해지는 것을 볼 수 있어요. 위도 60°에서는 넓이가 적도의 2배가 돼요.
  - "'[생각을 열어요] 나라마다 전통 의상이 다른 까닭'과 이어지는 사진 문제가 있어요."
  - 🏅 분석하기에서는 키토(고산)·카이로(건조)·런던처럼 위도만으로 설명되지 않는 기후를 다뤄요.
stages:
  - id: sun-map
    title: 햇볕 실험과 세계 기후 지도
    emoji: 🌍
    lesson: '8'
    intro: 위도에 따라 햇볕이 어떻게 달라지는지 실험하고 도시의 기후를 찾아요.
    steps:
      # ───── 🧭 살펴보기 (C) ─────
      - type: choice
        lv: C
        std: 6사10-02
        cat: 과정·기능
        sun: true
        q: 그림의 슬라이더로 위도를 바꿔 보세요. 같은 양의 햇빛이 가장 좁은 땅에 모여 비추는 곳은 어디인가요?
        hint: 빨간 선이 햇빛이 닿는 땅의 넓이예요. 빨간 선이 가장 짧은 위도를 찾아보세요.
        options: [적도 부근, 위도 60° 부근, 북극 가까운 곳]
        answer: 적도 부근
        explain: 적도 부근은 햇빛이 거의 똑바로 비추어 좁은 땅에 햇볕이 모여요. 그래서 땅이 가장 뜨겁게 데워져요.
      - type: choice
        lv: C
        std: 6사10-02
        cat: 지식·이해
        sun: true
        q: 적도에서 북극 쪽으로 갈수록 기온은 대체로 어떻게 될까요?
        options: [대체로 낮아진다, 대체로 높아진다, 변하지 않는다]
        answer: 대체로 낮아진다
        explain: 위도가 높아질수록 햇볕이 넓게 퍼져 약해지기 때문에 대체로 기온이 낮아져요.
      - type: pin
        lv: C
        std: 6사10-02
        cat: 과정·기능
        q: 적도에 가장 가까운 도시를 지도에서 찾아 눌러 보세요.
        hint: 주황색 점선이 적도예요.
        pins: [kualalumpur, london, nuuk, seoul]
        answer: kualalumpur
        explain: 쿠알라룸푸르(말레이시아)는 북위 3°쯤으로 적도와 아주 가까워요.
      - type: sort
        lv: C
        std: 6사10-02
        cat: 지식·이해
        q: 적도와 가까운 도시와 북극과 가까운 도시를 나누어 보세요.
        bins: [적도와 가까워 더운 곳, 북극과 가까워 추운 곳]
        items:
          - { text: "쿠알라룸푸르 (북위 3°)", bin: "적도와 가까워 더운 곳" }
          - { text: "므완자 (남위 3°)", bin: "적도와 가까워 더운 곳" }
          - { text: "누크 (북위 64°)", bin: "북극과 가까워 추운 곳" }
          - { text: "키루나 (북위 68°)", bin: "북극과 가까워 추운 곳" }
      - type: choice
        lv: C
        std: 6사10-02
        cat: 지식·이해
        photo: clothes/inuit
        q: 사진 속 옷차림을 하는 사람들은 어떤 곳에 살까요?
        hint: 옷이 얇은가요, 두꺼운가요?
        options: [북극과 가까운 아주 추운 곳, 적도 가까운 덥고 습한 곳, 비가 거의 오지 않는 뜨거운 사막]
        answer: 북극과 가까운 아주 추운 곳
        explain: 동물 털과 가죽으로 만든 두꺼운 옷은 아주 추운 곳에서 몸을 따뜻하게 지켜 줘요.

      # ───── 🔎 조사하기 (B) ─────
      - type: choice
        lv: B
        std: 6사10-02
        cat: 과정·기능
        sun: true
        q: 위도를 60°로 맞추어 보세요. 같은 햇빛이 닿는 넓이는 적도와 비교해 어떻게 되나요?
        hint: 그림 아래의 '햇볕이 퍼지는 넓이' 숫자를 읽어 보세요.
        options: [약 2배로 넓게 퍼진다, 적도와 같다, 절반으로 좁아진다]
        answer: 약 2배로 넓게 퍼진다
        explain: 넓이가 2배가 되면 같은 땅이 받는 햇볕은 절반쯤으로 약해져요. 그래서 위도가 높은 곳은 더 추워요.
      - type: sort
        lv: B
        std: 6사10-02
        cat: 과정·기능
        q: 위도를 보고 도시를 알맞은 기후에 놓아 세계 기후 지도를 완성해 보세요.
        hint: 적도 가까이 → 열대, 중간 위도 → 온대, 북쪽으로 갈수록 냉대 → 한대예요.
        bins: [열대, 온대, 냉대, 한대]
        items:
          - { text: "쿠알라룸푸르 (북위 3°)", bin: "열대" }
          - { text: "므완자 (남위 3°)", bin: "열대" }
          - { text: "서울 (북위 38°)", bin: "온대" }
          - { text: "로마 (북위 42°)", bin: "온대" }
          - { text: "런던 (북위 51°)", bin: "온대" }
          - { text: "키루나 (북위 68°)", bin: "냉대" }
          - { text: "누크 (북위 64°)", bin: "한대" }
        explain: 누크는 키루나보다 조금 남쪽이지만 그린란드의 차가운 바다와 빙하 때문에 여름에도 10℃가 넘지 않아 한대 기후예요.
      - type: pin
        lv: B
        std: 6사10-02
        cat: 과정·기능
        q: 한대 기후인 누크(북위 64°)는 지도에서 어디일까요?
        pins: [nuuk, kualalumpur, cairo, quito]
        answer: nuuk
      - type: sort
        lv: B
        std: 6사10-02
        cat: 지식·이해
        q: 전통 옷차림을 알맞은 기후 지역에 나누어 담아 보세요.
        hint: 옷의 두께, 몸을 가린 정도, 머리에 쓴 것을 살펴보세요.
        bins: [열대, 건조, 냉대·한대, 고산]
        items:
          - { text: "얇고 바람이 잘 통하는 옷", photo: "clothes/malay", bin: "열대" }
          - { text: "온몸과 얼굴을 가리는 헐렁한 옷", photo: "clothes/tuareg", bin: "건조" }
          - { text: "동물 털로 만든 두꺼운 옷", photo: "clothes/inuit", bin: "냉대·한대" }
          - { text: "두꺼운 양털로 짠 옷", photo: "clothes/sami", bin: "냉대·한대" }
          - { text: "판초와 털실 모자", photo: "clothes/andes", bin: "고산" }
      - type: choice
        lv: B
        std: 6사10-02
        cat: 지식·이해
        q: 나라마다 전통 의상이 다른 까닭으로 가장 알맞은 것은?
        options:
          - 기후가 달라 더위·추위·햇볕·모래바람을 막는 방법이 다르기 때문에
          - 나라마다 좋아하는 색깔이 다르기 때문에
          - 옷을 만드는 기계가 다르기 때문에
          - 아무 까닭 없이 우연히 다르게 되었기 때문에
        answer: 기후가 달라 더위·추위·햇볕·모래바람을 막는 방법이 다르기 때문에

      # ───── 🏅 분석하기 (A) ─────
      - type: multi
        lv: A
        std: 6사10-02
        cat: 과정·기능
        sun: true
        q: 기후가 위도만으로는 설명되지 않는 사례를 모두 고르세요.
        hint: 높이, 비가 오는 양, 바다처럼 위도 말고 다른 까닭을 찾아보세요.
        options:
          - 키토는 적도 가까이 있지만 해발 약 2,850m의 높은 곳이라 일 년 내내 서늘하다
          - 카이로는 위도가 서울과 크게 다르지 않지만 비가 거의 오지 않는 건조 기후다
          - 므완자는 적도 가까이 있지만 높은 곳(약 1,100m)이라 쿠알라룸푸르보다 서늘하다
          - 누크는 쿠알라룸푸르보다 북쪽에 있어 훨씬 춥다
        answers:
          - 키토는 적도 가까이 있지만 해발 약 2,850m의 높은 곳이라 일 년 내내 서늘하다
          - 카이로는 위도가 서울과 크게 다르지 않지만 비가 거의 오지 않는 건조 기후다
          - 므완자는 적도 가까이 있지만 높은 곳(약 1,100m)이라 쿠알라룸푸르보다 서늘하다
        explain: 누크가 추운 것은 위도로 설명할 수 있어요. 나머지는 높이나 비가 오는 양 같은 다른 까닭이 있어요.
      - type: choice
        lv: A
        std: 6사10-02
        cat: 과정·기능
        charts: [london, seoul]
        q: 런던(북위 51°)은 서울(북위 38°)보다 훨씬 북쪽에 있어요. 두 그래프의 1월 기온을 비교해 분석한 것으로 알맞은 것은?
        options:
          - 런던이 더 북쪽인데도 겨울이 서울보다 따뜻하다. 기후는 위도뿐 아니라 바다·바람 같은 다른 영향도 받는다
          - 런던이 더 북쪽이라 겨울이 서울보다 훨씬 춥다
          - 두 도시의 1월 기온은 똑같다
          - 서울은 적도에 있어서 겨울이 없다
        answer: 런던이 더 북쪽인데도 겨울이 서울보다 따뜻하다. 기후는 위도뿐 아니라 바다·바람 같은 다른 영향도 받는다
        explain: 런던의 1월 평균 기온은 약 6℃, 서울은 약 -2℃예요. 런던은 따뜻한 바닷바람의 영향을 받아요.
      - type: sort
        lv: A
        std: 6사10-02
        cat: 과정·기능
        q: 이번에는 위도만 보지 말고 높이와 강수량까지 생각해서 도시를 기후에 놓아 보세요.
        hint: 높은 곳의 도시와 비가 거의 오지 않는 도시를 먼저 찾아보세요.
        bins: [열대, 건조, 온대, 고산]
        items:
          - { text: "아부자 (북위 9°, 덥고 여름에 비가 많음)", bin: "열대" }
          - { text: "므완자 (남위 3°, 해발 1,100m, 연평균 23℃)", bin: "열대" }
          - { text: "카이로 (북위 30°, 연 강수량 25mm)", bin: "건조" }
          - { text: "리옹 (북위 46°, 사계절이 뚜렷함)", bin: "온대" }
          - { text: "키토 (적도 바로 아래, 해발 2,850m, 연평균 14℃)", bin: "고산" }
        explain: 므완자도 꽤 높은 곳이지만 연평균 23℃로 여전히 더워 열대 기후예요. 키토는 훨씬 더 높아 일 년 내내 14℃쯤인 고산 기후예요.
      - type: choice
        lv: A
        std: 6사10-02
        cat: 지식·이해
        q: 오늘 탐구한 세계의 기후 분포를 가장 알맞게 정리한 것은?
        options:
          - 대체로 적도에서 극으로 갈수록 열대 → 온대 → 냉대 → 한대가 나타나지만, 높이와 강수량 등에 따라 고산·건조 기후 같은 다른 기후도 나타난다
          - 기후는 오직 위도로만 정해진다
          - 적도 가까운 곳은 모두 열대 기후다
          - 북쪽에 있는 도시일수록 반드시 더 춥다
        answer: 대체로 적도에서 극으로 갈수록 열대 → 온대 → 냉대 → 한대가 나타나지만, 높이와 강수량 등에 따라 고산·건조 기후 같은 다른 기후도 나타난다
