template: mission
style: village
unit: soc-6-2-2
title: 착한 기업 경영자
emoji: 🏭
summary: 시장에서 가계와 기업이 만나는 모습을 살피고, 근로자의 권리를 지키며 자유롭게, 그리고 책임 있게 기업을 운영해 봐요.
story: 경제 탐험대원이 작은 기업의 경영자가 되었어요! 시장에서 소비자를 만나고, 함께 일하는 근로자를 존중하며, 사회에 도움이 되는 착한 기업을 만들어 보세요.
lessons: ['4', '5', '6']
standards: [6사11-01]
minutes: 12
teacherGuide:
  - 4차시 '시장', 5차시 '근로자의 권리', 6차시 '기업의 자유와 사회적 책임' 스테이지로 나뉘어 있어요.
  - 근로자의 권리는 학생들이 나중에 일하게 될 때 꼭 필요한 내용이에요. 근로 계약서, 최저임금, 쉬는 시간, 안전한 일터를 실제 생활과 이어 이야기해 주세요.
  - 6차시 🏅 분석하기에서는 환경·사회 공헌·근로자 안전 같은 기업의 사회적 책임(ESG)을 경영자 입장에서 골라 봐요.
stages:
  # ════════════ 시장 ════════════
  - id: market
    title: 시장에서 만나는 가계와 기업
    emoji: 🛒
    lesson: '4'
    intro: 가계와 기업이 시장에서 무엇을 주고받는지 알아봐요.
    steps:
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        photo: economy/market
        q: 시장이란 무엇일까요?
        options: [물건이나 서비스를 사고파는 곳, 물건을 만드는 곳, 돈을 만드는 곳]
        answer: 물건이나 서비스를 사고파는 곳
      - type: sort
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 눈에 보이는 시장과 눈에 보이지 않는 시장으로 나누어 보세요.
        hint: 사는 사람과 파는 사람이 직접 만나는지 생각해 보세요.
        bins: [눈에 보이는 시장, 눈에 보이지 않는 시장]
        items:
          - { text: "전통 시장", bin: "눈에 보이는 시장" }
          - { text: "대형 마트", bin: "눈에 보이는 시장" }
          - { text: "동네 문구점", bin: "눈에 보이는 시장" }
          - { text: "온라인 쇼핑몰", bin: "눈에 보이지 않는 시장" }
          - { text: "텔레비전 홈 쇼핑", bin: "눈에 보이지 않는 시장" }
          - { text: "중고 물건 거래 앱", bin: "눈에 보이지 않는 시장" }
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        photo: economy/mart
        q: 마트에서 가계와 기업은 각각 무엇을 할까요?
        options:
          - 가계는 필요한 물건을 사고, 기업은 만든 물건을 판다
          - 가계는 물건을 만들고, 기업은 물건을 산다
          - 가계와 기업 모두 아무것도 하지 않는다
        answer: 가계는 필요한 물건을 사고, 기업은 만든 물건을 판다

      - type: order
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 가계와 기업이 시장에서 서로 주고받는 흐름을 순서대로 놓아 보세요.
        items:
          - 가계의 구성원이 기업에서 일한다
          - 기업이 일한 대가로 임금을 준다
          - 가계가 임금(소득)으로 기업의 상품을 산다
          - 기업이 판매한 돈으로 다시 상품을 만든다
      - type: multi
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 가계와 기업이 서로에게 주는 것을 모두 고르세요.
        options:
          - 가계는 기업에 일할 수 있는 힘(노동력)을 준다
          - 기업은 가계에 임금을 준다
          - 가계는 기업의 상품을 사고 그 값을 낸다
          - 기업은 가계에서 세금을 걷는다
        answers:
          - 가계는 기업에 일할 수 있는 힘(노동력)을 준다
          - 기업은 가계에 임금을 준다
          - 가계는 기업의 상품을 사고 그 값을 낸다
        explain: 세금은 기업이 아니라 나라(정부)가 걷어요.
      - type: choice
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 온라인 쇼핑몰 같은 눈에 보이지 않는 시장이 가계에 주는 좋은 점은?
        options:
          - 시간과 장소에 관계없이 여러 상품의 가격을 비교해 살 수 있다
          - 물건을 공짜로 받을 수 있다
          - 물건을 직접 만져 볼 수 있다
        answer: 시간과 장소에 관계없이 여러 상품의 가격을 비교해 살 수 있다

      - type: multi
        lv: A
        std: 6사11-01
        cat: 과정·기능
        card: { emoji: "🥐", title: "빵집이 하나에서 셋으로", text: "마을에 하나뿐이던 빵집 근처에 빵집 두 곳이 새로 문을 열었어요." }
        q: 빵집들 사이에 경쟁이 생기면 어떤 일이 일어날지 분석해 알맞은 것을 모두 고르세요.
        options:
          - 빵 가격이 내려가거나 품질이 좋아질 수 있다
          - 소비자가 고를 수 있는 빵이 많아진다
          - 빵집들은 새로운 빵을 개발하려고 노력한다
          - 경쟁이 생기면 소비자는 무조건 손해를 본다
        answers:
          - 빵 가격이 내려가거나 품질이 좋아질 수 있다
          - 소비자가 고를 수 있는 빵이 많아진다
          - 빵집들은 새로운 빵을 개발하려고 노력한다
        explain: 시장경제에서는 기업이 자유롭게 경쟁하면서 더 좋은 상품을 더 알맞은 값에 만들려고 노력해요.
      - type: choice
        lv: A
        std: 6사11-01
        cat: 지식·이해
        q: 가계가 상품을 사지 않으면 기업은 어떻게 될까요? 가계와 기업의 관계를 가장 알맞게 탐구한 것은?
        options:
          - 상품이 팔리지 않아 생산을 줄이고 일자리도 줄 수 있다. 가계와 기업은 서로 기대어 있다
          - 기업은 가계와 관계없이 계속 성장한다
          - 가계가 사지 않으면 기업의 이윤이 늘어난다
        answer: 상품이 팔리지 않아 생산을 줄이고 일자리도 줄 수 있다. 가계와 기업은 서로 기대어 있다

  # ════════════ 근로자의 권리 ════════════
  - id: workers
    title: 함께 일하는 근로자의 권리
    emoji: 👷
    lesson: '5'
    intro: 일하는 사람이 존중받는 일터를 만들어요.
    steps:
      - type: multi
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 근로자의 권리로 알맞은 것을 모두 고르세요.
        options:
          - 일한 만큼 정당한 임금을 받는다
          - 정해진 쉬는 시간과 휴일이 있다
          - 안전한 곳에서 일한다
          - 사장님이 시키면 밤새 쉬지 않고 일해야 한다
        answers:
          - 일한 만큼 정당한 임금을 받는다
          - 정해진 쉬는 시간과 휴일이 있다
          - 안전한 곳에서 일한다
      - type: sort
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 근로자의 권리가 지켜진 일터와 지켜지지 않은 일터로 나누어 보세요.
        bins: [권리가 지켜졌어요, 권리가 지켜지지 않았어요]
        items:
          - { text: "일을 시작할 때 근로 계약서를 썼어요", bin: "권리가 지켜졌어요" }
          - { text: "위험한 기계 옆에서 안전 장비를 받았어요", bin: "권리가 지켜졌어요" }
          - { text: "점심시간에 쉴 수 있었어요", bin: "권리가 지켜졌어요" }
          - { text: "약속한 임금을 몇 달째 받지 못했어요", bin: "권리가 지켜지지 않았어요" }
          - { text: "다쳤는데 치료를 받지 못했어요", bin: "권리가 지켜지지 않았어요" }
          - { text: "쉬는 날 없이 매일 일해야 했어요", bin: "권리가 지켜지지 않았어요" }
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 근로 계약서는 무엇일까요?
        options:
          - 일을 시작할 때 일하는 시간, 임금, 하는 일 등을 적어 서로 약속하는 문서
          - 물건을 살 때 받는 영수증
          - 학교에서 받는 성적표
        answer: 일을 시작할 때 일하는 시간, 임금, 하는 일 등을 적어 서로 약속하는 문서

      - type: choice
        lv: B
        std: 6사11-01
        cat: 지식·이해
        card: { emoji: "🏪", title: "편의점에서 일하는 형", text: "18살 민수 형이 편의점에서 일을 시작했어요. 사장님은 근로 계약서를 쓰지 않았고, 최저임금보다 적은 돈을 주었어요." }
        q: 무엇이 문제일까요?
        options:
          - 근로 계약서를 쓰지 않았고, 최저임금보다 적게 주어 근로자의 권리를 지키지 않았다
          - 민수 형이 일을 너무 잘해서 문제다
          - 아무 문제가 없다
        answer: 근로 계약서를 쓰지 않았고, 최저임금보다 적게 주어 근로자의 권리를 지키지 않았다
        explain: 일을 시작하면 근로 계약서를 써야 하고, 법으로 정한 최저임금 이상을 주어야 해요.
      - type: choice
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 나라에서 최저임금을 정해 두는 까닭은?
        options:
          - 근로자가 최소한의 생활을 할 수 있도록 임금의 가장 낮은 기준을 정하려고
          - 기업이 임금을 마음대로 적게 주도록 하려고
          - 모든 사람이 똑같은 임금을 받게 하려고
        answer: 근로자가 최소한의 생활을 할 수 있도록 임금의 가장 낮은 기준을 정하려고
      - type: multi
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 근로자의 권리를 지키는 방법을 모두 고르세요.
        options:
          - 일을 시작할 때 근로 계약서를 쓴다
          - 근로자들이 노동조합을 만들어 함께 의견을 낸다
          - 권리가 지켜지지 않으면 고용노동부 같은 기관에 도움을 요청한다
          - 부당한 일을 당해도 참고 아무 말도 하지 않는다
        answers:
          - 일을 시작할 때 근로 계약서를 쓴다
          - 근로자들이 노동조합을 만들어 함께 의견을 낸다
          - 권리가 지켜지지 않으면 고용노동부 같은 기관에 도움을 요청한다

      - type: multi
        lv: A
        std: 6사11-01
        cat: 지식·이해
        q: 근로자의 권리를 지키면 기업에도 좋은 까닭을 분석해 모두 고르세요.
        options:
          - 일하는 사람이 만족하면 일을 더 잘하게 된다
          - 숙련된 근로자가 오래 일해 상품의 품질이 좋아진다
          - 사고가 줄어 기업의 손해도 줄어든다
          - 임금을 적게 줄수록 기업은 무조건 성장한다
        answers:
          - 일하는 사람이 만족하면 일을 더 잘하게 된다
          - 숙련된 근로자가 오래 일해 상품의 품질이 좋아진다
          - 사고가 줄어 기업의 손해도 줄어든다
      - type: choice
        lv: A
        std: 6사11-01
        cat: 지식·이해
        card: { emoji: "📦", title: "주문이 밀려들었어요", text: "새 상품이 인기를 끌어 주문이 평소의 세 배로 늘었어요. 근로자들은 이미 정해진 시간만큼 일하고 있어요." }
        q: 경영자로서 가장 알맞은 선택은?
        options:
          - 일할 사람을 더 뽑거나, 추가로 일하는 근로자에게는 정당한 수당을 준다
          - 근로자들에게 수당 없이 밤늦게까지 일하라고 한다
          - 쉬는 시간을 없애 생산량을 늘린다
        answer: 일할 사람을 더 뽑거나, 추가로 일하는 근로자에게는 정당한 수당을 준다
      - type: sort
        lv: A
        std: 6사11-01
        cat: 지식·이해
        q: 근로자의 권리와 기업의 자유에 해당하는 것을 나누어 분석해 보세요.
        bins: [근로자의 권리, 기업의 자유]
        items:
          - { text: "근로자들이 노동조합을 만든다", bin: "근로자의 권리" }
          - { text: "일하다 다친 근로자가 치료비를 받는다", bin: "근로자의 권리" }
          - { text: "정해진 쉬는 시간에 쉰다", bin: "근로자의 권리" }
          - { text: "기업이 무엇을 만들지 스스로 정한다", bin: "기업의 자유" }
          - { text: "기업이 상품의 가격을 정한다", bin: "기업의 자유" }
          - { text: "기업이 새 공장을 어디에 지을지 정한다", bin: "기업의 자유" }

  # ════════════ 기업의 자유와 사회적 책임 ════════════
  - id: responsibility
    title: 자유롭게, 책임 있게
    emoji: 🌱
    lesson: '6'
    intro: 기업은 자유롭게 이윤을 추구하면서 사회적 책임도 다해야 해요.
    steps:
      - type: choice
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 시장경제에서 기업이 누리는 자유로 알맞은 것은?
        options:
          - 무엇을 만들어 얼마에 팔지 스스로 정할 수 있다
          - 다른 회사의 기술을 마음대로 가져다 쓸 수 있다
          - 소비자를 속여도 된다
        answer: 무엇을 만들어 얼마에 팔지 스스로 정할 수 있다
      - type: multi
        lv: C
        std: 6사11-01
        cat: 지식·이해
        q: 기업의 사회적 책임으로 알맞은 것을 모두 고르세요.
        options:
          - 환경을 오염시키지 않는다
          - 소비자에게 안전한 상품을 만든다
          - 세금을 성실하게 낸다
          - 다른 회사와 몰래 짜고 가격을 함께 올린다
        answers: [환경을 오염시키지 않는다, 소비자에게 안전한 상품을 만든다, 세금을 성실하게 낸다]

      - type: sort
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 공정한 경쟁과 불공정한 행동으로 나누어 보세요.
        bins: [공정한 경쟁, 불공정한 행동]
        items:
          - { text: "더 좋은 품질의 상품을 만든다", bin: "공정한 경쟁" }
          - { text: "기술을 개발해 값을 낮춘다", bin: "공정한 경쟁" }
          - { text: "친절한 서비스로 손님을 모은다", bin: "공정한 경쟁" }
          - { text: "다른 회사들과 몰래 짜고 가격을 올린다", bin: "불공정한 행동" }
          - { text: "사실과 다르게 부풀린 광고를 한다", bin: "불공정한 행동" }
          - { text: "작은 회사의 기술을 빼앗는다", bin: "불공정한 행동" }
      - type: choice
        lv: B
        std: 6사11-01
        cat: 지식·이해
        q: 공정 거래 위원회는 어떤 일을 할까요?
        options:
