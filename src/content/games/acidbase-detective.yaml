# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-1
title: 산·염기 성질 탐정
emoji: 🔍
summary: 산성 용액과 염기성 용액에 대리석, 달걀 껍데기, 두부, 삶은 달걀흰자를 넣어 성질을 알아보고, 두 용액을 섞을 때의 색깔 변화를 관찰해요.
story: 대리석 조각상이 녹고, 두부가 흐물흐물해지는 이상한 사건이 일어났어요! 탐정이 되어 산성 용액과 염기성 용액의 성질을 밝혀 보세요.
lessons:
- '4'
- '5'
standards:
- 6과09-02
minutes: 15
teacherGuide:
- 4차시 「여러 가지 물질을 넣으면」, 5차시 「두 용액을 섞으면」 스테이지로 나뉘어 있어요.
- 섞기 실험실에서 [넣기]를 누를 때마다 다른 용액이 조금씩 들어가고 지시약의 색깔이 변해요. 색은 예시예요.
- 교육과정에 따라 중성, pH, 중화라는 용어는 쓰지 않고 색깔 변화를 관찰하는 수준까지만 다뤄요.
stages:
- id: props
  title: 여러 가지 물질을 넣으면
  emoji: 🥚
  lesson: '4'
  intro: 산성 용액과 염기성 용액에 여러 가지 물질을 넣고 변화를 관찰해요.
  steps:
  - type: choice
    lv: C
    std: 6과09-02
    cat: 과정·기능
    q: 그림처럼 묽은 염산에 대리석 조각과 달걀 껍데기를 넣었더니 어떻게 되었나요?
    options:
    - 기포가 생기며 크기가 작아진다
    - 아무 변화가 없다
    - 흐물흐물해지고 용액이 뿌옇게 된다
    answer: 기포가 생기며 크기가 작아진다
    photo: illust/ab-marble
  - type: choice
    lv: C
    std: 6과09-02
    cat: 과정·기능
    q: 그림의 오른쪽 비커처럼 두부와 삶은 달걀흰자가 흐물흐물해지고 용액이 뿌옇게 된 것은 어떤 용액에 넣었을 때일까요?
    options:
    - 묽은 수산화 나트륨 용액
    - 묽은 염산
    - 물
    answer: 묽은 수산화 나트륨 용액
    photo: illust/ab-tofu
  - type: sort
    lv: B
    std: 6과09-02
    cat: 과정·기능
    q: 실험 결과를 어떤 용액에 넣었을 때인지 나누어 보세요.
    bins:
    - 산성 용액에 넣었을 때
    - 염기성 용액에 넣었을 때
    items:
    - text: 대리석 조각에서 기포가 생긴다
      bin: 산성 용액에 넣었을 때
    - text: 달걀 껍데기에서 기포가 생긴다
      bin: 산성 용액에 넣었을 때
    - text: 두부가 흐물흐물해진다
      bin: 염기성 용액에 넣었을 때
    - text: 삶은 달걀흰자가 녹아 용액이 뿌옇게 된다
      bin: 염기성 용액에 넣었을 때
  - type: choice
    lv: B
    std: 6과09-02
    cat: 지식·이해
    q: 대리석, 달걀 껍데기, 조개껍데기에 공통으로 들어 있어 산성 용액과 반응하는 물질은?
    options:
    - 탄산 칼슘
    - 단백질
    - 녹말
    answer: 탄산 칼슘
    explain: 산성 용액은 탄산 칼슘이 들어 있는 물질과 반응해 기포가 생겨요. 염기성 용액은 두부, 달걀흰자처럼 단백질이 들어 있는 물질을 녹여요.
  - type: choice
    lv: A
    std: 6과09-02
    cat: 지식·이해
    q: 대리석으로 만든 오래된 탑 주변에 산성을 띤 비가 오랫동안 내린다면 어떻게 될지 가장 알맞게 추론한 것은?
    options:
    - 산성 용액이 대리석의 탄산 칼슘과 반응해 탑의 겉면이 조금씩 녹아 손상될 것이다
    - 대리석은 단단해서 아무 변화가 없을 것이다
    - 대리석이 단백질처럼 흐물흐물해질 것이다
    answer: 산성 용액이 대리석의 탄산 칼슘과 반응해 탑의 겉면이 조금씩 녹아 손상될 것이다
    card:
      emoji: 🏛️
      title: 대리석 탑
      text: 대리석으로 만든 탑이 비를 맞으며 수백 년 동안 서 있어요.
  - type: multi
    lv: A
    std: 6과09-02
    cat: 가치·태도
    q: 산성 용액과 염기성 용액으로 실험할 때 지켜야 할 안전 수칙을 모두 골라 보세요.
    options:
    - 보안경과 실험용 장갑을 낀다
    - 용액이 손에 묻으면 흐르는 물로 바로 씻는다
    - 실험이 끝난 용액은 정해진 폐액 통에 모은다
    - 용액의 냄새를 코를 대고 직접 맡는다
    answers:
    - 보안경과 실험용 장갑을 낀다
    - 용액이 손에 묻으면 흐르는 물로 바로 씻는다
    - 실험이 끝난 용액은 정해진 폐액 통에 모은다
- id: mix
  title: 두 용액을 섞으면
  emoji: 🔄
  lesson: '5'
  intro: 지시약을 넣은 용액에 다른 용액을 조금씩 넣으며 색깔 변화를 관찰해요.
  steps:
  - type: choice
    lv: C
    std: 6과09-02
    cat: 과정·기능
    q: 실험실에서 붉은 양배추 지시약을 넣은 묽은 염산의 처음 색깔을 확인해 보세요. 어떤 색깔 계열인가요?
    options:
    - 붉은색 계열
    - 노란색 계열
    - 색깔이 없다
    answer: 붉은색 계열
    mix: true
  - type: choice
    lv: B
    std: 6과09-02
    cat: 과정·기능
    q: '[넣기]를 여러 번 눌러 묽은 수산화 나트륨 용액을 계속 넣어 보세요. 색깔은 어떻게 변하나요?'
    options:
    - 붉은색 계열에서 보라색, 푸른색을 거쳐 노란색 계열로 변한다
    - 처음 색깔 그대로이다
    - 점점 더 진한 붉은색이 된다
    answer: 붉은색 계열에서 보라색, 푸른색을 거쳐 노란색 계열로 변한다
    mix: true
  - type: order
    lv: B
    std: 6과09-02
    cat: 과정·기능
    q: 묽은 염산에 묽은 수산화 나트륨 용액을 넣을 때 붉은 양배추 지시약의 색깔이 변하는 순서대로 놓아 보세요.
    items:
    - 붉은색
    - 보라색
    - 푸른색
    - 초록색
    - 노란색
    mix: true
  - type: choice
    lv: A
    std: 6과09-02
    cat: 과정·기능
    q: 실험 결과로 추론할 수 있는 것으로 가장 알맞은 것은?
    options:
    - 산성 용액에 염기성 용액을 넣을수록 산성이 점점 약해지다가 염기성으로 변한다
    - 산성 용액에 염기성 용액을 넣어도 용액의 성질은 변하지 않는다
    - 지시약이 다 써서 색깔이 변한다
    answer: 산성 용액에 염기성 용액을 넣을수록 산성이 점점 약해지다가 염기성으로 변한다
    mix: true
  - type: choice
    lv: A
    std: 6과09-02
    cat: 과정·기능
    q: '[반대로] 버튼을 눌러 묽은 수산화 나트륨 용액에 묽은 염산을 넣어 보세요. 알맞게 추론한 것은?'
    options:
    - 염기성이 점점 약해지다가 산성으로 변한다
    - 염기성이 점점 강해진다
    - 용액의 성질은 그대로이다
    answer: 염기성이 점점 약해지다가 산성으로 변한다
    mix: true
