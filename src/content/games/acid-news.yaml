# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: shop
unit: sci-6-1-1
title: 산성화 알림 기자단
emoji: 📰
summary: 산성비, 해양 산성화, 토양 산성화로 인한 환경 피해 사례를 조사하고, 원인과 대책을 담은 알림 기사를 만들어 공유해요.
story: 숲과 바다, 문화재에서 산성화 피해 소식이 들어왔어요! 기자단이 되어 피해 현장을 취재하고 사람들에게 알려 보세요.
lessons:
- '8'
- '9'
standards:
- 6과09-04
minutes: 15
teacherGuide:
- 8~9차시에 써요. 기사 카드는 「나의 탐험 리포트」에 모여요.
- 디지털 소양 교육과 연계해 학급 누리집 등에 공유할 때는 출처 밝히기를 함께 지도해 주세요.
stages:
- id: news
  title: 피해 현장 취재
  emoji: 🎤
  lesson: '8'
  intro: 산성화로 인한 피해 사례를 조사하고 알리는 자료를 만들어요.
  steps:
  - type: choice
    lv: C
    std: 6과09-04
    cat: 지식·이해
    q: 그림 속 대리석 조각상이 녹고 숲의 나무가 말라 가는 피해는 무엇 때문일까요?
    options:
    - 산성비
    - 지진
    - 태풍
    answer: 산성비
    photo: illust/ab-acidrain
  - type: choice
    lv: C
    std: 6과09-04
    cat: 지식·이해
    q: 산성비가 내리는 까닭으로 알맞은 것은?
    options:
    - 석탄, 석유 같은 연료를 태울 때 나오는 기체가 빗물에 녹기 때문이다
    - 바닷물이 증발하기 때문이다
    - 나무가 너무 많기 때문이다
    answer: 석탄, 석유 같은 연료를 태울 때 나오는 기체가 빗물에 녹기 때문이다
  - type: sort
    lv: B
    std: 6과09-04
    cat: 지식·이해
    q: 산성화의 종류에 따라 피해 사례를 나누어 보세요.
    bins:
    - 산성비
    - 해양 산성화
    - 토양 산성화
    items:
    - text: 대리석으로 만든 건물과 조각상이 녹는다
      bin: 산성비
    - text: 숲의 나뭇잎이 누렇게 말라 간다
      bin: 산성비
    - text: 산호와 조개껍데기가 약해진다
      bin: 해양 산성화
    - text: 흙이 산성으로 변해 농작물이 잘 자라지 않는다
      bin: 토양 산성화
  - type: shop
    lv: B
    std: 6과09-04
    cat: 과정·기능
    q: 바닷속 연구원의 이야기를 듣고, 해양 산성화 알림 기사에 넣을 내용을 모두 골라 보세요.
    customer:
      emoji: 🪸
      name: 바닷속 산호 연구원
      place: 산호초 바다
      says: 공기 중의 이산화 탄소가 바닷물에 많이 녹으면서 바다가 산성으로 변하고 있어요. 산호가 하얗게 변해 죽고 있어요.
    features:
    - text: 산호가 하얗게 변하고 부서지는 모습
      fit: true
      why: 피해 모습을 보여 주면 문제를 쉽게 이해해요.
    - text: 조개껍데기가 얇아지는 피해
      fit: true
      why: 탄산 칼슘으로 된 껍데기가 산성 바닷물에 약해져요.
    - text: 이산화 탄소가 바닷물에 녹는 것이 원인이라는 설명
      fit: true
      why: 원인을 알아야 해결 방법을 찾을 수 있어요.
    - text: 바다가 산성으로 변하면 물이 더 맑아져 좋다는 내용
      fit: false
      why: 사실이 아니에요. 바다 생물이 살기 어려워져요.
    photo: illust/ab-ocean
    planLabels: &id001
      title: 📰 산성화 알림 기사 만들기 (선택)
      name: 기사 제목
      slogan: 꼭 알리고 싶은 한 문장
      when: '어디에 어떻게 공유할까? (예: 학급 누리집, 게시판)'
      save: 기사 카드 저장
      emoji: 📰
  - type: shop
    lv: A
    std: 6과09-04
    cat: 과정·기능
    q: 많은 사람이 믿고 함께하도록 설득력 있는 알림 자료를 만들려면 무엇을 갖추어야 할까요? 모두 골라 보세요.
    customer:
      emoji: 🏫
      name: 우리 학교 누리집 편집장
      place: 학교 누리집
      says: 산성화 피해를 알리는 기사를 올리고 싶어요. 어떻게 만들면 좋을까요?
    features:
    - text: 피해의 원인, 현재 모습, 앞으로의 전망, 대책을 함께 담는다
      fit: true
      why: 문제를 전체적으로 이해하고 행동할 수 있어요.
    - text: 사진과 자료의 출처를 밝힌다
      fit: true
      why: 믿을 수 있는 자료라는 것을 보여 줘요.
    - text: 우리가 실천할 수 있는 일을 제안한다
      fit: true
      why: 읽는 사람이 바로 행동할 수 있어요.
    - text: 관심을 끌려고 사실과 다르게 부풀려 쓴다
      fit: false
      why: 잘못된 정보는 믿음을 잃게 해요.
    planLabels: *id001
  - type: multi
    lv: A
    std: 6과09-04
    cat: 가치·태도
    q: 산성화를 줄이기 위해 우리가 실천할 수 있는 일을 모두 골라 보세요.
    options:
    - 가까운 거리는 걷거나 자전거를 탄다
    - 쓰지 않는 전기 제품의 플러그를 뽑는다
    - 쓰레기를 줄이고 분리배출한다
    - 자동차를 공회전시킨 채 오래 세워 둔다
    answers:
    - 가까운 거리는 걷거나 자전거를 탄다
    - 쓰지 않는 전기 제품의 플러그를 뽑는다
    - 쓰레기를 줄이고 분리배출한다
    explain: 연료를 덜 태우면 산성비와 해양 산성화의 원인이 되는 기체를 줄일 수 있어요.
