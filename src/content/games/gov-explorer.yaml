# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: soc-6-1-2
title: 국가기관 탐험대
emoji: 🏛️
summary: 국회, 행정부, 법원이 하는 일을 사례로 알아보고, 국가기관의 권력을 나누어 맡기는 까닭을 탐색해요.
story: 나라의 일은 누가 어떻게 할까요? 국회, 행정부, 법원을 차례로 방문해 하는 일을 조사하고, 세 기관이 서로 균형을 이루는 비밀을 밝혀 보세요.
lessons:
- '5'
- '6'
- '7'
- '8'
standards:
- 6사08-02
minutes: 15
teacherGuide:
- 5차시 국회, 6차시 행정부, 7차시 법원, 8차시 권력 분립 스테이지예요.
- 국가기관의 누리집이나 어린이용 누리집을 함께 탐색하면 좋아요.
stages:
- id: assembly
  title: 국회
  emoji: 🏛️
  lesson: '5'
  intro: 국회가 하는 일을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사08-02
    cat: 지식·이해
    q: 국민이 뽑은 국회의원들이 모여 법을 만들거나 고치는 국가기관은?
    options:
    - 국회
    - 법원
    - 행정부
    answer: 국회
  - type: multi
    lv: B
    std: 6사08-02
    cat: 지식·이해
    q: 국회가 하는 일을 모두 골라 보세요.
    options:
    - 법을 만들거나 고친다
    - 나라의 살림에 쓸 예산을 심의하여 확정한다
    - 행정부가 일을 잘하고 있는지 살펴본다
    - 법에 따라 재판을 한다
    answers:
    - 법을 만들거나 고친다
    - 나라의 살림에 쓸 예산을 심의하여 확정한다
    - 행정부가 일을 잘하고 있는지 살펴본다
  - type: choice
    lv: A
    std: 6사08-02
    cat: 과정·기능
    q: 어린이 보호 구역의 교통안전을 강화하는 새 법이 필요하다는 의견이 많아졌어요. 이 법을 만드는 일을 하는 국가기관과 그 까닭은?
    options:
    - 국회 — 국민의 대표가 모여 법을 만드는 곳이기 때문이다
    - 법원 — 재판을 하는 곳이기 때문이다
    - 행정부 — 대통령이 혼자 법을 만들기 때문이다
    answer: 국회 — 국민의 대표가 모여 법을 만드는 곳이기 때문이다
- id: executive
  title: 행정부
  emoji: 🏢
  lesson: '6'
  intro: 행정부가 하는 일을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사08-02
    cat: 지식·이해
    q: 법에 따라 나라의 살림을 맡아 하는 국가기관은?
    options:
    - 행정부
    - 국회
    - 법원
    answer: 행정부
  - type: sort
    lv: B
    std: 6사08-02
    cat: 지식·이해
    q: 행정부의 여러 부가 하는 일을 짝지어 보세요.
    bins:
    - 교육부
    - 보건복지부
    - 환경부
    - 국방부
    items:
    - text: 학교 교육 정책을 세운다
      bin: 교육부
    - text: 국민의 건강과 복지를 돌본다
      bin: 보건복지부
    - text: 깨끗한 환경을 지키는 정책을 세운다
      bin: 환경부
    - text: 나라를 지키는 일을 맡는다
      bin: 국방부
  - type: choice
    lv: A
    std: 6사08-02
    cat: 과정·기능
    q: 국회에서 만든 「어린이 놀이 시설 안전법」이 실제로 지켜지도록 놀이터를 점검하는 일은 어느 기관이 할까요?
    options:
    - 행정부 — 법에 따라 정책을 실행하기 때문이다
    - 국회 — 법을 만들었기 때문이다
    - 법원 — 재판을 하기 때문이다
    answer: 행정부 — 법에 따라 정책을 실행하기 때문이다
- id: court
  title: 법원
  emoji: ⚖️
  lesson: '7'
  intro: 법원이 하는 일을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6사08-02
    cat: 지식·이해
    q: 그림처럼 법에 따라 재판을 하여 다툼을 해결하고 잘잘못을 가리는 국가기관은?
    options:
    - 법원
    - 국회
    - 행정부
    answer: 법원
    photo: illust/so-court
  - type: choice
    lv: B
    std: 6사08-02
    cat: 지식·이해
    q: 재판 결과에 따르기 어려울 때 원칙적으로 세 번까지 재판을 받을 수 있게 한 제도는?
    options:
    - 3심 제도
    - 지방 자치 제도
    - 선거 제도
    answer: 3심 제도
    explain: 공정한 재판을 받을 권리를 보장하기 위해 지방 법원, 고등 법원, 대법원에서 재판을 받을 수 있어요.
  - type: choice
    lv: A
    std: 6사08-02
    cat: 지식·이해
    q: 법관이 다른 기관이나 사람의 간섭을 받지 않고 헌법과 법률, 양심에 따라 재판하도록 하는 까닭은?
    options:
    - 누구에게나 공정한 재판을 하여 국민의 권리를 지키기 위해서이다
    - 재판을 빨리 끝내기 위해서이다
    - 법관이 마음대로 판단하게 하기 위해서이다
    answer: 누구에게나 공정한 재판을 하여 국민의 권리를 지키기 위해서이다
- id: separation
  title: 권력 분립
  emoji: 🔺
  lesson: '8'
  intro: 국가기관의 권력을 나누는 까닭을 알아봐요.
  steps:
  - type: sort
    lv: C
    std: 6사08-02
    cat: 지식·이해
    q: 하는 일에 알맞은 국가기관을 찾아 나누어 보세요.
    bins:
    - 국회
    - 행정부
    - 법원
    items:
    - text: 법을 만든다
      bin: 국회
    - text: 예산을 확정한다
      bin: 국회
    - text: 법에 따라 나라 살림을 한다
      bin: 행정부
    - text: 정책을 실행한다
      bin: 행정부
    - text: 재판을 한다
      bin: 법원
  - type: choice
    lv: B
    std: 6사08-02
    cat: 지식·이해
    q: 국가의 권력을 국회, 행정부, 법원이 나누어 맡는 것을 무엇이라고 할까요?
    options:
    - 권력 분립
    - 지방 자치
    - 주민 투표
    answer: 권력 분립
  - type: choice
    lv: A
    std: 6사08-02
    cat: 지식·이해
    q: 권력을 한 기관이 모두 가지지 않고 나누어 맡게 하는 까닭으로 가장 알맞은 것은?
    options:
    - 서로 견제하고 균형을 이루어 권력이 함부로 쓰이는 것을 막고 국민의 자유와 권리를 지키기 위해서이다
    - 일을 천천히 하기 위해서이다
    - 국가기관의 수를 늘리기 위해서이다
    answer: 서로 견제하고 균형을 이루어 권력이 함부로 쓰이는 것을 막고 국민의 자유와 권리를 지키기 위해서이다
    card:
      emoji: 👑
      title: 만약 한 사람이 모든 권력을 가진다면?
      text: 법도 마음대로 만들고, 나라 살림도 마음대로 하고, 재판도 마음대로 한다면 어떤 일이 생길까요?
