template: mission
style: village
unit: sci-6-2-4
title: 미래 문제 해결 연구소
emoji: 🔭
summary: 지금의 자료를 근거로 미래 사회에 생길 문제를 예상하고, 과학이 도울 수 있는 방법과 과학만으로는 해결할 수 없는 부분을 함께 토의해요.
story: 과학 탐험대가 2050년에서 온 편지를 받았어요! 지금의 자료로 미래에 생길 문제를 예상하고, 과학으로 함께 해결할 방법을 연구해 주세요.
lessons: ['1', '2']
standards: [6과16-01]
minutes: 12
teacherGuide:
  - 1차시 '미래 사회의 문제', 2차시 '과학의 기여와 한계' 스테이지로 나뉘어 있어요.
  - 교육과정에 따라 단순한 상상이 아니라 현재의 정보를 근거로 미래를 예상하게 하고, 과학이 모든 문제를 해결할 수는 없다는 점도 함께 다뤄요.
  - 사회 3단원 「지구촌 사람들」에서 배운 인구·기후 자료를 다시 써요.
stages:
  - id: problems
    title: 지금의 자료로 미래 읽기
    emoji: 📈
    lesson: '1'
    intro: 현재의 자료를 근거로 미래 사회의 문제를 예상해요.
    steps:
      - type: choice
        lv: C
        std: 6과16-01
        cat: 과정·기능
        card: { emoji: "👵", title: "지금의 자료", text: "우리나라는 2024년에 65세 이상 인구가 20%를 넘었고, 2023년 합계 출산율은 0.72명이었어요." }
        q: 이 자료를 근거로 미래 사회에 생길 수 있는 문제를 예상하면?
        options: [노인을 돌보고 일할 사람이 부족해질 수 있다, 어린이가 아주 많아질 것이다, 아무 변화가 없을 것이다]
        answer: 노인을 돌보고 일할 사람이 부족해질 수 있다
      - type: choice
        lv: C
        std: 6과16-01
        cat: 과정·기능
        card: { emoji: "🌡️", title: "지금의 자료", text: "2024년 지구 평균 기온은 산업화 이전보다 약 1.55℃ 높았어요. (세계기상기구)" }
        q: 이 자료를 근거로 예상할 수 있는 미래의 문제는?
        options: [폭염·가뭄·홍수 같은 기상 재해가 잦아질 수 있다, 지구가 점점 추워질 것이다, 계절이 사라질 것이다]
        answer: 폭염·가뭄·홍수 같은 기상 재해가 잦아질 수 있다
      - type: sort
        lv: B
        std: 6과16-01
        cat: 과정·기능
        q: 근거가 있는 예상과 근거 없는 상상을 나누어 보세요.
        bins: [자료에 근거한 예상, 근거 없는 상상]
        items:
          - { text: "노인 인구가 늘어 돌봄 로봇이 더 필요해질 것이다", bin: "자료에 근거한 예상" }
          - { text: "기온이 올라 에너지를 아끼는 기술이 더 중요해질 것이다", bin: "자료에 근거한 예상" }
          - { text: "플라스틱 쓰레기가 늘어 분해되는 소재가 더 필요해질 것이다", bin: "자료에 근거한 예상" }
          - { text: "2050년에는 모든 사람이 하늘을 날아다닐 것이다", bin: "근거 없는 상상" }
          - { text: "미래에는 외계인이 우리 문제를 해결해 줄 것이다", bin: "근거 없는 상상" }
      - type: multi
        lv: A
        std: 6과16-01
        cat: 과정·기능
        q: 미래 사회의 문제를 예상할 때 갖추어야 할 태도를 모두 고르세요.
        options:
          - 믿을 만한 기관의 최신 자료를 찾아본다
          - 자료가 어떻게 변해 왔는지 흐름을 살핀다
          - 한 가지 자료만 믿지 않고 여러 자료를 비교한다
          - 재미있는 상상이면 근거가 없어도 된다
        answers: [믿을 만한 기관의 최신 자료를 찾아본다, 자료가 어떻게 변해 왔는지 흐름을 살핀다, 한 가지 자료만 믿지 않고 여러 자료를 비교한다]

  - id: contribute
    title: 과학이 도울 수 있는 것, 없는 것
    emoji: 🤝
    lesson: '2'
    intro: 과학의 기여와 한계를 함께 토의해요.
    steps:
      - type: sort
        lv: C
        std: 6과16-01
        cat: 지식·이해
        q: 미래의 문제와 과학이 도울 수 있는 방법을 짝지어 보세요.
        bins: [고령화, 기후 변화, 감염병, 플라스틱 쓰레기]
        items:
          - { text: "노인의 생활을 돕는 돌봄 로봇", bin: "고령화" }
          - { text: "햇빛·바람으로 전기를 만드는 기술", bin: "기후 변화" }
          - { text: "새로운 백신과 치료약 개발", bin: "감염병" }
          - { text: "자연에서 분해되는 플라스틱", bin: "플라스틱 쓰레기" }
      - type: choice
        lv: B
        std: 6과16-01
        cat: 지식·이해
        q: 이산화 탄소를 줄이는 기술이 개발되어도 기후 변화 문제가 바로 해결되지 않는 까닭으로 알맞은 것은?
        options:
          - 기술과 함께 사람들의 실천, 나라 사이의 약속과 협력이 필요하기 때문에
          - 과학 기술은 언제나 모든 문제를 바로 해결하기 때문에
          - 기후 변화는 과학과 아무 관계가 없기 때문에
        answer: 기술과 함께 사람들의 실천, 나라 사이의 약속과 협력이 필요하기 때문에
      - type: multi
        lv: B
        std: 6과16-01
        cat: 지식·이해
        q: 과학이 미래 사회의 문제 해결에 기여할 수 있는 방법을 모두 고르세요.
        options:
          - 문제의 원인을 조사하고 자료로 밝힌다
          - 새로운 기술과 물건을 만든다
          - 해결 방법이 정말 효과가 있는지 실험으로 확인한다
          - 사람들의 생각과 상관없이 모든 결정을 대신 내린다
        answers: [문제의 원인을 조사하고 자료로 밝힌다, 새로운 기술과 물건을 만든다, 해결 방법이 정말 효과가 있는지 실험으로 확인한다]
      - type: choice
        lv: A
        std: 6과16-01
        cat: 지식·이해
        card: { emoji: "🤖", title: "토의 주제", text: "\\\"돌봄 로봇이 있으면 고령화 문제는 모두 해결된다.\\\"" }
        q: 이 주장을 과학의 기여와 한계를 함께 생각해 가장 알맞게 고친 것은?
        options:
          - 돌봄 로봇은 노인의 생활을 도울 수 있지만, 사람 사이의 관계와 돌봄 제도처럼 과학만으로 해결할 수 없는 부분도 함께 준비해야 한다
          - 돌봄 로봇만 있으면 다른 노력은 필요 없다
          - 과학은 고령화 문제에 아무 도움이 되지 않는다
        answer: 돌봄 로봇은 노인의 생활을 도울 수 있지만, 사람 사이의 관계와 돌봄 제도처럼 과학만으로 해결할 수 없는 부분도 함께 준비해야 한다
      - type: shop
        lv: A
        std: 6과16-01
        cat: 과정·기능
        customer: { emoji: "📮", name: "2050년의 초등학생", place: "30년 뒤 우리 동네", says: "여름마다 폭염 때문에 밖에서 놀 수가 없어요. 2026년의 친구들이 지금부터 함께 준비해 줄래요?" }
        q: 과학과 실천을 함께 담은 해결 아이디어를 모두 골라 보세요.
        features:
          - { text: "그늘을 만들고 기온을 낮추는 학교 숲 가꾸기", fit: true, why: "나무가 그늘을 만들고 이산화 탄소도 흡수해요." }
          - { text: "햇빛을 반사하는 지붕 재료 연구를 알리기", fit: true, why: "건물이 덜 뜨거워져 냉방 전기를 아낄 수 있어요." }
          - { text: "우리 반 전기 절약 실천 약속 만들기", fit: true, why: "기술과 함께 생활 속 실천이 필요해요." }
          - { text: "미래의 과학자가 알아서 해결할 테니 기다리기", fit: false, why: "과학이 모든 문제를 혼자 해결할 수는 없어요." }
        planLabels: { title: "🔭 미래 해결 아이디어 카드 (선택)", name: "아이디어 이름", slogan: "2050년 친구에게 한마디", when: "지금부터 무엇을 할까?", save: "아이디어 카드 저장", emoji: "🔭" }
