# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-4
title: 자전 모형 실험실
emoji: 🌏
summary: 북극 위에서 내려다본 지구를 돌려 보며 지구의 자전과 낮과 밤이 생기는 까닭을 모형실험으로 알아봐요.
story: 우주 정거장에서 지구의 북극을 내려다보고 있어요! 지구를 돌려 우리나라에 낮과 밤이 어떻게 찾아오는지 확인해 보세요.
lessons:
- '4'
- '5'
standards:
- 6과12-02
minutes: 15
teacherGuide:
- 4차시 「지구의 자전」, 5차시 「낮과 밤」 스테이지예요.
- 자전 모형은 북극 위에서 내려다본 모습이라 시계 반대 방향으로 돌아요(서쪽 → 동쪽). 실제 지구의 자전축은 기울어져 있음을 함께 짚어 주세요.
stages:
- id: rotate
  title: 지구의 자전
  emoji: 🔄
  lesson: '4'
  intro: 지구가 어떻게 도는지 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과12-02
    cat: 지식·이해
    q: 지구가 자전축을 중심으로 하루에 한 바퀴씩 스스로 도는 것을 무엇이라고 할까요?
    options:
    - 자전
    - 공전
    - 계절
    answer: 자전
  - type: choice
    lv: C
    std: 6과12-02
    cat: 과정·기능
    q: 모형에서 [계속 돌리기]를 눌러 보세요. 지구는 어느 방향으로 자전할까요?
    options:
    - 서쪽에서 동쪽으로
    - 동쪽에서 서쪽으로
    - 북쪽에서 남쪽으로
    answer: 서쪽에서 동쪽으로
    rotation: true
  - type: choice
    lv: B
    std: 6과12-02
    cat: 지식·이해
    q: 지구가 한 바퀴 자전하는 데 걸리는 시간은?
    options:
    - 하루(약 24시간)
    - 한 달
    - 1년
    answer: 하루(약 24시간)
  - type: choice
    lv: A
    std: 6과12-02
    cat: 지식·이해
    q: 지구의 자전을 가장 바르게 설명한 것은?
    options:
    - 지구는 자전축이 기울어진 채 서쪽에서 동쪽으로 하루에 한 바퀴씩 돈다
    - 지구는 자전축이 똑바로 선 채 동쪽에서 서쪽으로 1년에 한 바퀴 돈다
    - 지구는 태양 둘레를 하루에 한 바퀴 돈다
    answer: 지구는 자전축이 기울어진 채 서쪽에서 동쪽으로 하루에 한 바퀴씩 돈다
- id: daynight
  title: 낮과 밤
  emoji: 🌗
  lesson: '5'
  intro: 모형실험으로 낮과 밤이 생기는 까닭을 알아봐요.
  steps:
  - type: choice
    lv: C
    std: 6과12-02
    cat: 과정·기능
    q: 그림처럼 전등과 지구의로 모형실험을 할 때, 전등 빛을 받는 쪽은 낮과 밤 가운데 무엇일까요?
    options:
    - 낮
    - 밤
    answer: 낮
    photo: illust/ea-globe-lamp
  - type: choice
    lv: B
    std: 6과12-02
    cat: 과정·기능
    q: 모형에서 우리나라가 「해가 뜰 무렵」이 되게 돌린 뒤 [6시간만큼 돌리기]를 한 번 눌러 보세요. 우리나라는 어떻게 되나요?
    options:
    - 낮(정오 무렵)
    - 한밤
    - 해가 질 무렵
    answer: 낮(정오 무렵)
    rotation: true
  - type: order
    lv: B
    std: 6과12-02
    cat: 과정·기능
    q: 지구가 자전할 때 우리나라에 찾아오는 때를 한밤부터 순서대로 놓아 보세요.
    items:
    - 한밤
    - 해가 뜰 무렵
    - 낮
    - 해가 질 무렵
    rotation: true
  - type: choice
    lv: A
    std: 6과12-02
    cat: 지식·이해
    q: 지구가 자전도 공전도 하지 않고 멈춰 있다면 낮과 밤은 어떻게 될까요?
    options:
    - 태양을 향한 쪽은 계속 낮이고, 반대쪽은 계속 밤일 것이다
    - 지금처럼 낮과 밤이 하루에 한 번씩 바뀔 것이다
    - 지구 전체가 계속 낮일 것이다
    answer: 태양을 향한 쪽은 계속 낮이고, 반대쪽은 계속 밤일 것이다
    rotation: true
  - type: sort
    lv: A
    std: 6과12-02
    cat: 과정·기능
    q: 모형실험의 각 부분이 실제로 무엇을 나타내는지 짝지어 보세요.
    bins:
    - 태양
    - 지구
    - 지구의 자전
    items:
    - text: 전등
      bin: 태양
    - text: 지구의
      bin: 지구
    - text: 지구의를 서쪽에서 동쪽으로 돌리기
      bin: 지구의 자전
    photo: illust/ea-globe-lamp
