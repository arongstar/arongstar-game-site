template: quizshow
unit: soc-6-2-2
title: 경제 탐험대 퀴즈쇼 — 시장경제와 경제성장
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 퀴즈쇼예요. 가계와 기업, 근로자와 기업의 책임, 경제성장, 문제 해결을 정리해요.
lessons: ['10']
standards: [6사11-01, 6사11-02]
minutes: 20
teacherGuide:
  - 10차시 '재미있게 확인해요'에서 전자칠판에 띄워 진행해요. 모둠 수(2~6)를 고르고 시작해요.
  - 100점은 살펴보기, 200점은 조사하기, 300점은 분석하기 문제예요. 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
  - name: 가계와 기업
    emoji: 💰
    items:
      - lv: C
        q: 일을 해서 소득을 얻고, 그 소득으로 필요한 물건을 사서 쓰는 경제 단위는?
        answer: 가계
      - lv: B
        q: 5,000원으로 책과 영화 중 책을 샀어요. 이때 포기한 '영화를 보는 즐거움'처럼, 하나를 고를 때 포기한 것의 가치를 무엇이라고 할까요?
        answer: 기회비용
      - lv: A
        q: 가계와 기업은 시장에서 서로 무엇을 주고받는지 두 가지 이상 설명해 보세요.
        answer: 가계는 기업에 노동력을 주고 임금을 받아요. 가계는 그 소득으로 기업의 상품을 사고, 기업은 판매한 돈으로 다시 상품을 만들어요.
  - name: 근로자와 기업의 책임
    emoji: 🤝
    items:
      - lv: C
        q: 일을 시작할 때 일하는 시간, 임금, 하는 일을 적어 서로 약속하는 문서는?
        answer: 근로 계약서
      - lv: B
        q: 기업들이 공정하게 경쟁하는지 살피고 불공정한 행동을 막는 나라의 기관은?
        answer: 공정 거래 위원회
      - lv: A
        q: 기업의 자유와 사회적 책임은 어떤 관계인지 예를 들어 설명해 보세요.
        answer: '기업은 무엇을 얼마에 팔지 자유롭게 정할 수 있지만, 환경을 오염시키거나 소비자를 속이면 안 돼요. 예) 재활용 소재 사용, 안전한 상품 만들기'
  - name: 경제성장
    emoji: 📈
    items:
      - lv: C
        photo: economy/chip
        q: 오늘날 우리나라의 대표 수출 상품 가운데 하나인 이것은?
        answer: 반도체
      - lv: B
        q: 1960년대 우리나라에서 섬유·신발·가발 같은 경공업이 먼저 발달한 까닭은?
        answer: 기술과 돈(자본)은 부족했지만 일할 사람이 많았기 때문이에요.
      - lv: A
        q: 1970년 경부 고속 국도 개통이 경제성장에 준 영향을 설명해 보세요.
        answer: 서울과 부산 사이에 사람과 물건이 빠르게 오가게 되어, 공장이 원료와 상품을 쉽게 실어 나를 수 있게 되었어요.
  - name: 문제와 해결
    emoji: 🧩
    items:
      - lv: C
        q: 빠른 경제성장으로 생긴 문제를 두 가지 말해 보세요.
        answer: 환경 오염, 소득 격차(빈부 격차), 노사 갈등, 수도권 집중 등
      - lv: B
        q: 질병·실업·가난으로 어려운 사람이 기본적인 생활을 할 수 있도록 나라가 돕는 제도는?
        answer: 사회 보장 제도
      - lv: A
        q: 공장이 마을의 일자리이면서 강을 오염시키고 있어요. 일자리와 환경을 함께 지킬 방법을 제안해 보세요.
        answer: 예) 공장이 정화 시설을 갖추게 하고 주민·기업·정부가 함께 지켜봐요. 친환경 기술로 바꾸도록 지원해요.
