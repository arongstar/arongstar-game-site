template: mission
style: detective
unit: sci-6-2-1
title: 태양 고도 관측소
emoji: 📐
summary: 태양 고도를 재는 방법을 익히고, 하루 동안 막대 그림자를 관측해 태양 고도·그림자 길이·기온의 관계를 찾아요.
story: 과학 탐험대가 운동장에 관측소를 세웠어요! 막대 하나와 그림자만으로 태양의 높이를 재고, 하루 동안 무엇이 함께 변하는지 찾아내 보세요.
lessons: ['2', '3']
standards: [6과13-01]
minutes: 12
teacherGuide:
  - 2차시 '태양 고도 측정기', 3차시 '하루 동안의 관측' 스테이지로 나뉘어 있어요.
  - 관측소 그림의 슬라이더로 시각을 바꾸면 해의 위치, 막대 그림자, 태양 고도, 기온이 함께 바뀌어요. 태양 고도와 그림자 길이는 서울 추분 무렵 낮을 계산한 값이고, 기온은 예시예요.
  - 실제 관측 때는 태양을 직접 보지 않도록 꼭 지도해 주세요.
stages:
  - id: measure
    title: 태양 고도를 재는 방법
    emoji: 📏
    lesson: '2'
    intro: 막대와 그림자로 태양 고도를 재요.
    steps:
      - type: choice
        lv: C
        std: 6과13-01
        cat: 지식·이해
        sunday: &day
          rows:
            - { time: "9시 30분", alt: 34, shadow: 15.0, temp: 17.0 }
            - { time: "10시 30분", alt: 43, shadow: 10.7, temp: 19.0 }
            - { time: "11시 30분", alt: 50, shadow: 8.5, temp: 21.0 }
            - { time: "12시 30분", alt: 52, shadow: 7.7, temp: 22.5 }
            - { time: "13시 30분", alt: 50, shadow: 8.4, temp: 23.5 }
            - { time: "14시 30분", alt: 44, shadow: 10.5, temp: 24.0 }
            - { time: "15시 30분", alt: 34, shadow: 14.6, temp: 23.0 }
        q: 태양 고도는 무엇일까요?
        hint: 그림 속 주황색으로 표시한 각을 살펴보세요.
        options:
          - 태양이 땅과 이루는 각
          - 태양까지의 거리
          - 그림자의 길이
        answer: 태양이 땅과 이루는 각
        explain: 막대의 그림자 끝과 막대 꼭대기를 이은 선이 땅과 이루는 각을 재면 태양 고도를 알 수 있어요.
      - type: choice
        lv: C
        std: 6과13-01
        cat: 지식·이해
        q: 태양 고도를 관측할 때 꼭 지켜야 할 안전 수칙은?
        options: [태양을 맨눈으로 직접 보지 않는다, 태양을 오랫동안 바라본다, 그늘에서만 관측한다]
        answer: 태양을 맨눈으로 직접 보지 않는다
      - type: order
        photo: illust/sun-measure
        lv: B
        std: 6과13-01
        cat: 과정·기능
        q: 막대를 이용한 태양 고도 측정 순서대로 놓아 보세요.
        items:
          - 햇빛이 잘 드는 평평한 곳에 막대를 땅과 수직으로 세운다
          - 막대 그림자의 끝을 표시한다
          - 막대 꼭대기와 그림자 끝을 실로 잇는다
          - 실과 그림자가 이루는 각을 각도기로 잰다
      - type: choice
        lv: B
        std: 6과13-01
        cat: 과정·기능
        q: 막대를 땅과 수직으로 세워야 하는 까닭은?
        options:
          - 막대가 기울어지면 그림자 길이와 각이 달라져 정확하게 잴 수 없기 때문에
          - 막대가 쓰러지면 위험하기 때문에
          - 그림자가 생기지 않게 하려고
        answer: 막대가 기울어지면 그림자 길이와 각이 달라져 정확하게 잴 수 없기 때문에
      - type: choice
        lv: A
        std: 6과13-01
        cat: 과정·기능
        q: 같은 시각에 막대 길이만 두 배로 길게 하면 어떻게 될까요?
        hint: 태양 고도는 막대 길이와 상관없이 태양의 위치로 정해져요.
        options:
          - 그림자 길이는 두 배가 되지만 태양 고도는 같다
          - 그림자 길이와 태양 고도가 모두 두 배가 된다
          - 그림자 길이는 같고 태양 고도만 높아진다
        answer: 그림자 길이는 두 배가 되지만 태양 고도는 같다
        explain: 그래서 하루 동안 그림자 길이를 비교할 때는 같은 막대로 재야 해요.
      - type: multi
        lv: A
        std: 6과13-01
        cat: 과정·기능
        q: 하루 동안 정확하게 관측하려면 어떤 조건을 같게 해야 할까요? 모두 고르세요.
        options:
          - 같은 막대를 쓴다
          - 같은 장소에서 잰다
          - 일정한 시간 간격으로 잰다
          - 잴 때마다 막대 길이를 바꾼다
        answers: [같은 막대를 쓴다, 같은 장소에서 잰다, 일정한 시간 간격으로 잰다]

  - id: oneday
    title: 하루 동안의 관측
    emoji: 🕒
    lesson: '3'
    intro: 시각을 바꾸며 태양 고도·그림자 길이·기온의 변화를 찾아요.
    steps:
      - type: choice
        lv: C
        std: 6과13-01
        cat: 과정·기능
        sunday: *day
        q: 슬라이더로 시각을 바꿔 보세요. 태양 고도가 가장 높은 시각은?
        options: [12시 30분, 9시 30분, 15시 30분]
        answer: 12시 30분
        explain: 태양이 정남쪽에 올 때 태양 고도가 가장 높아요. 이것을 '태양이 남중했다'고 하고, 이때의 태양 고도를 '태양의 남중 고도'라고 해요.
      - type: choice
        lv: C
        std: 6과13-01
        cat: 과정·기능
        sunday: *day
        q: 태양 고도가 높아지면 그림자 길이는 어떻게 될까요?
        options: [짧아진다, 길어진다, 변하지 않는다]
        answer: 짧아진다
      - type: choice
        lv: B
        std: 6과13-01
        cat: 과정·기능
        sunday: *day
        q: 측정 결과 표에서 기온이 가장 높은 시각은?
        options: [14시 30분, 12시 30분, 9시 30분]
        answer: 14시 30분
      - type: sort
        lv: B
        std: 6과13-01
        cat: 지식·이해
        sunday: *day
        q: 관측 결과를 정리해 보세요.
        bins: [태양 고도가 높아질 때, 태양 고도가 낮아질 때]
        items:
          - { text: "그림자 길이가 짧아진다", bin: "태양 고도가 높아질 때" }
          - { text: "기온이 대체로 높아진다", bin: "태양 고도가 높아질 때" }
          - { text: "그림자 길이가 길어진다", bin: "태양 고도가 낮아질 때" }
          - { text: "해가 동쪽 또는 서쪽 낮은 곳에 있다", bin: "태양 고도가 낮아질 때" }
      - type: choice
        lv: A
        std: 6과13-01
        cat: 지식·이해
        sunday: *day
        q: 태양 고도는 12시 30분쯤 가장 높은데, 기온은 14시 30분쯤 가장 높아요. 그 까닭을 가장 알맞게 설명한 것은?
        options:
          - 태양 에너지로 땅이 데워지고, 데워진 땅이 공기를 데우는 데 시간이 걸리기 때문에
          - 오후에는 태양이 더 가까워지기 때문에
          - 기온계가 늦게 움직이기 때문에
        answer: 태양 에너지로 땅이 데워지고, 데워진 땅이 공기를 데우는 데 시간이 걸리기 때문에
      - type: multi
        lv: A
        std: 6과13-01
        cat: 과정·기능
        sunday: *day
        q: 측정 결과를 분석한 것으로 알맞은 것을 모두 고르세요.
        options:
          - 태양 고도와 그림자 길이는 반대로 변한다
          - 9시 30분과 15시 30분은 태양 고도가 같아 그림자 길이도 비슷하다
          - 기온은 태양 고도가 가장 높은 때보다 조금 늦게 가장 높아진다
          - 그림자 길이가 가장 길 때 기온이 가장 높다
        answers:
          - 태양 고도와 그림자 길이는 반대로 변한다
          - 9시 30분과 15시 30분은 태양 고도가 같아 그림자 길이도 비슷하다
          - 기온은 태양 고도가 가장 높은 때보다 조금 늦게 가장 높아진다
