# 6학년 1학기 사회 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: bingo
unit: soc-6-1-3
title: 1학기 사회 탐험 빙고
emoji: 🎯
summary: 6학년 1학기 사회에서 배운 낱말로 태블릿 빙고판을 채우고, 전자칠판의 설명을 보고 낱말을 맞혀 표시해요.
