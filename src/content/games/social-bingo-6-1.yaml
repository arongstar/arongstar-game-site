teacherGuide:
- 1학기 사회를 마무리하는 교실 놀이로 써요. 전자칠판에는 이 화면을, 학생 태블릿에는 「내 빙고판」을 열어요.
- 평화 통일·민주화와 산업화·민주주의와 시민 참여·지구와 대륙 낱말 28개가 섞여 나와요.
words:
- word: 이산가족
  clue: 분단과 전쟁으로 헤어져 서로 만나지 못하는 가족이에요.
- word: 비무장 지대
  clue: 남북한 사이에 군대를 두지 않기로 한 곳으로, 자연이 잘 보존되어 있어요.
- word: 판문점
  clue: 남북한 대표가 만나 회담을 여는 곳이에요.
- word: 남북 정상 회담
  clue: 남북한의 최고 지도자가 만나 평화를 이야기하는 자리예요.
- word: 4·19 혁명
  clue: 1960년 부정 선거에 맞서 학생과 시민들이 일어난 사건이에요.
- word: 6월 민주 항쟁
  clue: 1987년 대통령 직선제를 요구하며 전국에서 일어난 시민들의 노력이에요.
- word: 지방 자치제
  clue: 주민이 지역의 대표를 뽑고 지역의 일을 스스로 결정하는 제도예요.
- word: 산업화
  clue: 공장과 산업이 발달하면서 도시와 생활 모습이 크게 달라진 과정이에요.
- word: 선거
  clue: 국민이 투표로 대표를 뽑는 일이에요.
- word: 보통 선거
  clue: 일정한 나이가 되면 누구나 투표할 수 있다는 원칙이에요.
- word: 비밀 선거
  clue: 누구에게 투표했는지 알 수 없게 하는 원칙이에요.
- word: 국회
  clue: 국민의 대표가 모여 법을 만들거나 고치는 국가기관이에요.
- word: 행정부
  clue: 법에 따라 나라 살림을 맡아 하는 국가기관이에요.
- word: 법원
  clue: 법에 따라 재판을 하는 국가기관이에요.
- word: 권력 분립
  clue: 국가의 권력을 여러 기관이 나누어 맡아 서로 견제하게 하는 것이에요.
- word: 3심 제도
  clue: 원칙적으로 세 번까지 재판을 받을 수 있게 한 제도예요.
- word: 미디어
  clue: 신문, 방송, 영상 누리집처럼 정보를 전하는 수단이에요.
- word: 가짜 뉴스
  clue: 사실이 아닌 내용을 사실처럼 꾸며 퍼뜨리는 정보예요.
- word: 지구본
  clue: 실제 지구를 작게 줄여 둥글게 만든 모형이에요.
- word: 디지털 영상 지도
  clue: 확대·축소하고 검색과 길 찾기를 할 수 있는 지도예요.
- word: 적도
  clue: 위도 0°인 선으로, 지구를 남반구와 북반구로 나눠요.
- word: 본초 자오선
  clue: 영국 그리니치 천문대를 지나는 경도 0°의 기준선이에요.
- word: 위도
  clue: 적도를 기준으로 남북으로 각각 90°까지 나타내요.
- word: 경도
  clue: 본초 자오선을 기준으로 동서로 각각 180°까지 나타내요.
- word: 태평양
  clue: 세계에서 가장 넓은 바다예요.
- word: 아시아
  clue: 면적이 가장 넓고 인구가 가장 많은 대륙이에요.
- word: 영해
  clue: 한 나라의 주권이 미치는 바다예요.
- word: 독도
  clue: 우리나라 영토의 가장 동쪽 끝에 있는 섬이에요.
