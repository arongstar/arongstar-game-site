# 6학년 1학기 과학 — 자동 생성한 뒤 손으로 고쳐도 돼요.
template: mission
style: detective
unit: sci-6-1-1
title: 지시약 실험실
emoji: 🧪
summary: 겉으로는 똑같아 보이는 용액에 리트머스 종이, 페놀프탈레인 용액, 붉은 양배추 지시약을 넣어 보고 산성 용액과 염기성 용액으로 분류해요.
story: 투명한 용액 여덟 병의 이름표가 모두 떨어졌어요! 지시약 실험실에서 용액들의 정체를 밝혀 보세요.
lessons:
- '2'
- '3'
standards:
- 6과09-01
minutes: 15
teacherGuide:
- 2차시 「지시약의 색깔 변화」, 3차시 「용액 분류하기」 스테이지로 나뉘어 있어요.
- 지시약 실험실에서 용액과 지시약을 골라 결과를 확인해요. 붉은 양배추 지시약의 색은 예시 색이에요.
- 교육과정에 따라 중성, pH라는 용어는 쓰지 않아요.
stages:
- id: colors
  title: 지시약의 색깔 변화
  emoji: 🎨
  lesson: '2'
  intro: 용액과 지시약을 골라 색깔이 어떻게 변하는지 관찰해요.
  steps:
  - type: choice
    lv: C
    std: 6과09-01
    cat: 과정·기능
    q: 실험실에서 「묽은 염산」과 「푸른 리트머스 종이」를 골라 보세요. 푸른 리트머스 종이는 어떻게 변하나요?
    options:
    - 붉은색으로 변한다
    - 색깔이 변하지 않는다
    - 노란색으로 변한다
    answer: 붉은색으로 변한다
    indicator: true
  - type: choice
    lv: C
    std: 6과09-01
    cat: 과정·기능
    q: 「묽은 수산화 나트륨 용액」에 「페놀프탈레인 용액」을 넣으면 어떻게 되나요? 실험실에서 확인해 보세요.
    options:
    - 붉은색으로 변한다
    - 색깔이 변하지 않는다
    - 푸른색으로 변한다
    answer: 붉은색으로 변한다
    indicator: true
  - type: sort
    lv: B
    std: 6과09-01
    cat: 과정·기능
    q: 실험실에서 여러 용액으로 확인한 결과를 산성 용액과 염기성 용액에서 나타나는 변화로 나누어 보세요.
    bins:
    - 산성 용액에서 나타나는 변화
    - 염기성 용액에서 나타나는 변화
    items:
    - text: 푸른 리트머스 종이가 붉은색으로 변한다
      bin: 산성 용액에서 나타나는 변화
    - text: 붉은 리트머스 종이가 푸른색으로 변한다
      bin: 염기성 용액에서 나타나는 변화
    - text: 페놀프탈레인 용액이 붉은색으로 변한다
      bin: 염기성 용액에서 나타나는 변화
    - text: 붉은 양배추 지시약이 붉은색 계열로 변한다
      bin: 산성 용액에서 나타나는 변화
    - text: 붉은 양배추 지시약이 노란색 계열로 변한다
      bin: 염기성 용액에서 나타나는 변화
    indicator: true
    hint: 한 용액에 여러 지시약을 차례로 넣어 보며 비교해 보세요.
  - type: multi
    lv: A
    std: 6과09-01
    cat: 과정·기능
    q: 그림의 용액들은 모두 투명해서 비슷해 보여요. 이 용액들을 분류하는 데 지시약이 필요한 까닭으로 알맞은 것을 모두 골라 보세요.
    options:
    - 색깔이나 냄새 같은 겉보기 성질만으로는 분류하기 어려운 용액이 많다
    - 지시약을 넣으면 용액의 성질에 따라 색깔이 달라진다
    - 맛을 보는 것은 위험해서 실험실에서 하면 안 된다
    - 지시약을 넣으면 용액의 양이 늘어난다
    answers:
    - 색깔이나 냄새 같은 겉보기 성질만으로는 분류하기 어려운 용액이 많다
    - 지시약을 넣으면 용액의 성질에 따라 색깔이 달라진다
    - 맛을 보는 것은 위험해서 실험실에서 하면 안 된다
    photo: illust/ab-solutions
    explain: 겉보기 성질이 비슷한 용액은 새로운 분류 기준이 필요해요. 지시약은 용액의 성질에 따라 색깔이 달라지는 물질이에요.
- id: classify
  title: 용액 분류하기
  emoji: 🗂️
  lesson: '3'
  intro: 지시약의 색깔 변화를 근거로 용액을 분류해요.
  steps:
  - type: choice
    lv: C
    std: 6과09-01
    cat: 과정·기능
    q: 「식초」에 「붉은 양배추 지시약」을 넣으면 어떤 색깔 계열이 되나요?
    options:
    - 붉은색 계열
    - 노란색 계열
    - 초록색 계열
    answer: 붉은색 계열
    indicator: true
  - type: sort
    lv: B
    std: 6과09-01
    cat: 지식·이해
    q: 실험실에서 확인한 결과를 바탕으로 용액을 분류해 보세요.
    bins:
    - 산성 용액
    - 염기성 용액
    items:
    - text: 식초
      bin: 산성 용액
    - text: 레몬즙
      bin: 산성 용액
    - text: 탄산수
      bin: 산성 용액
    - text: 묽은 염산
      bin: 산성 용액
    - text: 유리 세정제
      bin: 염기성 용액
    - text: 석회수
      bin: 염기성 용액
    - text: 빨랫비누 물
      bin: 염기성 용액
    - text: 묽은 수산화 나트륨 용액
      bin: 염기성 용액
    indicator: true
    hint: 리트머스 종이나 페놀프탈레인 용액으로 용액마다 확인해 보세요.
  - type: choice
    lv: B
    std: 6과09-01
    cat: 지식·이해
    q: 여러 용액에 페놀프탈레인 용액을 넣었더니 붉은색으로 변한 용액이 있었어요. 이 용액은 어떤 용액일까요?
    options:
    - 염기성 용액
    - 산성 용액
    - 알 수 없다
    answer: 염기성 용액
  - type: choice
    lv: A
    std: 6과09-01
    cat: 과정·기능
    q: 처음 보는 「수수께끼 용액」에 푸른 리트머스 종이를 대었더니 붉은색으로 변했고, 붉은 양배추 지시약을 넣었더니 붉은색 계열이 되었어요. 이 용액에 대해 가장 알맞게 판단한 것은?
    options:
    - 두 지시약의 결과가 모두 산성 용액을 가리키므로 산성 용액이다
    - 리트머스 종이가 붉어졌으므로 염기성 용액이다
    - 지시약을 두 가지나 써서 알 수 없다
    answer: 두 지시약의 결과가 모두 산성 용액을 가리키므로 산성 용액이다
    card:
      emoji: ❓
      title: 수수께끼 용액
      text: 푸른 리트머스 종이 → 붉은색 / 붉은 양배추 지시약 → 붉은색 계열
  - type: choice
    lv: A
    std: 6과09-01
    cat: 과정·기능
    q: 친구가 한 유리 막대로 여러 용액을 차례로 찍어 리트머스 종이에 묻혔더니 결과가 이상하게 나왔어요. 가장 알맞은 까닭은?
    options:
    - 유리 막대를 씻지 않아 앞의 용액이 섞였기 때문이다
    - 리트머스 종이는 한 번만 색이 변하기 때문이다
    - 유리 막대는 지시약과 반응하기 때문이다
    answer: 유리 막대를 씻지 않아 앞의 용액이 섞였기 때문이다
    explain: 용액을 바꿀 때마다 유리 막대를 물로 씻고 닦아야 정확한 결과를 얻을 수 있어요.
