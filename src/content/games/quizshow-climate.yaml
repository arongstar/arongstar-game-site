template: quizshow
unit: soc-6-2-1
title: 탐험대 퀴즈쇼 2부 — 세계의 기후
emoji: 🎤
summary: 전자칠판에 띄우고 모둠끼리 겨루는 기후 퀴즈쇼예요. 기후 그래프를 함께 읽으며 풀어요.
lessons: ['12']
standards: [6사10-02]
minutes: 20
teacherGuide:
  - 12차시 '재미있게 확인해요' 시간에 전자칠판에 띄워 진행해요.
  - 그래프 문제는 화면의 그래프를 모둠이 함께 읽고 답해요. 300점 문제는 근거를 들어 설명하면 정답으로 인정해 주세요.
categories:
  - name: 기후 그래프
    emoji: 📊
    items:
      - lv: C
        chart: seoul
        q: 서울에서 비가 가장 많이 내리는 달은?
        answer: 7월
      - lv: B
        chart: rome
        hideChartName: true
        q: 여름에 비가 적은 이 그래프는 런던·로마·서울 중 어디일까요?
        answer: 로마
      - lv: A
        chart: kualalumpur
        hideChartName: true
        q: 이 그래프가 열대 기후라는 근거를 두 가지 말해 보세요.
        answer: 일 년 내내 기온이 높고(27℃ 안팎), 비가 많이 내려요. (쿠알라룸푸르)
  - name: 열대·건조
    emoji: 🌴
    items:
      - lv: C
        q: 열대 기후 지역에서 볼 수 있는, 바닥을 땅에서 띄워 지은 집을 무엇이라고 할까요?
        answer: 고상 가옥
      - lv: B
        q: 건조 기후 지역 사람들이 온몸을 가리는 헐렁하고 긴 옷을 입는 까닭은?
        answer: 강한 햇볕과 모래바람을 막고, 옷 안으로 바람이 통하게 하려고요.
      - lv: A
        q: 쿠알라룸푸르와 므완자는 모두 열대 기후예요. 비가 내리는 모습은 어떻게 다를까요?
        answer: 쿠알라룸푸르는 일 년 내내 비가 많고, 므완자는 6~8월에 비가 거의 내리지 않는 건기가 있어요.
  - name: 온대·냉대
    emoji: 🍁
    items:
      - lv: C
        q: 일 년 내내 비가 고르게 내리는 영국의 수도는?
        answer: 런던
      - lv: B
        q: 로마에서 올리브와 포도를 많이 기르는 까닭은?
        answer: 여름이 덥고 건조해서 건조에 강한 나무가 잘 자라기 때문이에요.
      - lv: A
        chart: kiruna
        q: 키루나의 기후를 살린 겨울 관광 상품을 하나 제안하고, 그 까닭을 말해 보세요.
        answer: 예) 개썰매, 오로라 관찰, 얼음 호텔 체험 — 0℃보다 추운 겨울이 일곱 달이나 이어지기 때문이에요.
  - name: 한대·고산
    emoji: 🧊
    items:
      - lv: C
        q: 그린란드에 있고, 가장 따뜻한 달에도 평균 기온이 10℃가 되지 않는 도시는?
        answer: 누크
      - lv: B
        q: 적도 가까이에 있지만 해발 약 2,850m에 있어서 일 년 내내 봄 같은 에콰도르의 수도는?
        answer: 키토
      - lv: A
        q: 둘 다 적도 가까이 있는 쿠알라룸푸르와 키토의 기온이 크게 다른 까닭은?
        answer: 키토가 훨씬 높은 곳에 있기 때문이에요. 높이 올라갈수록 기온이 낮아져요.
