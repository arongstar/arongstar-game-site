# 6학년 영어 Lesson 2 — What Would You Like to Have? (동아출판 정은숙 외, 2022 개정)
# 성취기준: 교육부 고시 제2022-33호 [별책 14] 영어과 교육과정 (5~6학년군) — 동아출판 지도서에 실린 원문
# 의사소통 기능·신출 어휘·파닉스·문화는 지도서 104~107쪽(단원 지도 계획)을 따랐어요.
# 지도서 수행 평가가 Lesson 2 에 연결한 성취기준: 6영01-03·02-02·02-07·02-10. 나머지는 차시 목표(읽기·문화·파닉스·쓰기)에 맞춰 더했어요.
# 대화문·읽기 글·등장인물은 교과서 글을 옮기지 않고 이 사이트에서 새로 썼어요.
# ⚠ 성취수준(levels, domainLevels)은 지도서 수행 평가 기준을 바탕으로 만든 초안이에요.
