story: Lingo 섬의 음식 거리에 맛있는 냄새가 가득해요! 식당에서 영어로 음식을 주문하고, 맛을 표현하고, 세계 여러 나라의 간식 이야기를 읽어요. 마지막에는 요리 대회의 「주문 왕」에 도전해요.
textbookNote: "동아출판(정은숙 외) 6학년 영어 Lesson 2, 6차시 구성을 따랐어요. 의사소통 기능 — 음식 주문하기(What would you like to have? / I'd like to have a potato pizza, please.), 맛 표현하기(It's sweet.). 파닉스 — ch /tʃ/. 문화 — 세계 여러 나라의 대표 간식."
