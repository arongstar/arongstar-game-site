standards:
  - code: 6과16-01
    short: 미래 사회의 문제와 과학의 기여
    text: 미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다.
    levels:
      A: 현재의 자료를 근거로 미래 사회의 문제를 예상하고, 과학이 기여할 수 있는 방법과 그 한계를 함께 토의할 수 있다.
      B: 미래 사회에 일어날 수 있는 문제를 조사하고, 과학이 기여할 수 있는 방법을 토의할 수 있다.
      C: 미래 사회에 일어날 수 있는 문제와 과학이 도울 수 있는 예를 말할 수 있다.
  - code: 6과16-02
    short: 다양한 진로와 과학의 관계
    text: 다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다.
    levels:
      A: 여러 직업에 숨어 있는 과학적 요소를 분석하고, 자신의 진로를 과학과 관련지어 구체적으로 설명하며 준비 계획을 세울 수 있다.
      B: 다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다.
      C: 여러 직업이 과학과 관련 있음을 말할 수 있다.
domainLevels:
  A:
    지식·이해: 미래 사회의 문제와 진로에서 과학의 역할과 한계를 근거를 들어 설명할 수 있다.
    과정·기능: 현재의 정보를 바탕으로 미래를 예상하고 근거를 들어 토의할 수 있다.
    가치·태도: 과학과 관련지어 자신의 진로를 탐색하고 미래를 준비하려는 자세를 가진다.
  B:
    지식·이해: 미래 사회의 문제와 진로에서 과학의 역할을 설명할 수 있다.
    과정·기능: 미래 사회의 문제를 조사하고 토의할 수 있다.
    가치·태도: 과학과 관련지어 자신의 진로에 관심을 가지고 탐색한다.
  C:
    지식·이해: 미래 사회의 문제와 과학과 관련된 직업의 예를 말할 수 있다.
    과정·기능: 미래 사회에 관한 자료를 살펴볼 수 있다.
    가치·태도: 과학과 나의 진로에 관심을 가진다.
