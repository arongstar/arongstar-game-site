textbookNote: 차시 구성은 성취기준에 맞추어 제안한 4차시예요. 교육과정에 따라 과학자 직업이 아니라 학생이 희망하는 다양한 직업을 기준으로 과학적 요소를 찾아요.
domain: 과학과 나의 진로
