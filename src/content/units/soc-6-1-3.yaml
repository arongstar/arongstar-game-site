# 성취기준: 교육부 고시 제2022-33호 「초등학교 교육과정」 (사회 5~6학년군) [6사09]
# ⚠ 성취수준(levels, domainLevels)은 평가원 원문을 확인하지 못해 만든 초안이에요.
subject: 사회
