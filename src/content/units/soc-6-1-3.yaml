grade: 6
semester: 1
unitNo: 3
title: 지구, 대륙 그리고 국가들
emoji: 🌐
story: 탐험대가 세계 일주를 떠나기 전, 지구본과 세계지도를 챙겼어요! 위도와 경도로 위치를 읽는 법을 익히고, 여섯 대륙과 다섯 대양을 지나 세계 여러 나라의 위치와 영토의 특징을 탐험해 보세요.
textbookNote: 차시 구성은 성취기준에 맞추어 제안한 9차시예요. 대륙은 아시아·유럽·아프리카·북아메리카·남아메리카·오세아니아의 6대륙, 대양은 태평양·대서양·인도양·북극해·남극해의 5대양으로 다뤄요.
domain: 지구, 대륙 그리고 국가들
levelsDraft: true
standards:
  - code: 6사09-01
    short: 세계를 표현하는 공간 자료와 위치 표현 방법
    text: 세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다.
    levels:
      A: 여러 공간 자료의 특징을 비교하여 목적에 알맞은 자료를 고르고, 위도와 경도를 이용하여 여러 장소의 위치를 정확하게 표현할 수 있다.
      B: 지구본, 세계지도, 디지털 영상 지도의 특징을 설명하고, 위도와 경도를 이용하여 위치를 표현할 수 있다.
      C: 지구본과 세계지도의 차이를 한 가지 이상 말하고, 적도와 본초 자오선을 찾을 수 있다.
  - code: 6사09-02
    short: 대륙과 대양, 여러 국가의 위치와 영토의 특징
    text: 세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다.
    levels:
      A: 세계 여러 국가의 위치와 영토의 크기·모양을 비교·분석하고, 영토의 특징이 그 나라 사람들의 생활에 주는 영향을 설명할 수 있다.
      B: 세계의 대륙과 대양을 찾고, 우리나라와 여러 국가의 위치와 영토의 특징을 설명할 수 있다.
      C: 세계의 대륙과 대양의 이름을 말하고 세계지도에서 우리나라의 위치를 찾을 수 있다.
domainLevels:
  A:
    지식·이해: 공간 자료의 특징과 여러 국가의 위치·영토의 특징을 근거를 들어 설명할 수 있다.
    과정·기능: 위도와 경도, 여러 공간 자료를 활용하여 위치를 정확하게 표현하고 영토의 특징을 분석할 수 있다.
    가치·태도: 세계 여러 나라에 관심을 가지고 스스로 탐구를 이어 간다.
  B:
    지식·이해: 대륙과 대양, 여러 국가의 위치와 영토의 특징을 설명할 수 있다.
    과정·기능: 지구본과 세계지도에서 위도와 경도로 위치를 찾을 수 있다.
    가치·태도: 세계 여러 나라에 관심을 가진다.
  C:
    지식·이해: 대륙과 대양의 이름을 말할 수 있다.
    과정·기능: 안내에 따라 지구본과 세계지도에서 위치를 찾을 수 있다.
    가치·태도: 세계 지리 탐험에 즐겁게 참여한다.
