standards:
  - code: 6사11-01
    short: 가계와 기업의 역할, 근로자의 권리와 기업의 사회적 책임
    text: 시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 탐색한다.
    levels:
      A: 시장경제에서 가계와 기업의 역할을 분석하고, 근로자의 권리와 기업의 자유 및 사회적 책임의 중요성을 탐구할 수 있다.
      B: 시장경제에서 가계와 기업의 역할을 조사하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 설명할 수 있다.
      C: 시장경제에서 가계와 기업이 하는 일을 제시하고, 근로자의 권리와 기업의 사회적 책임이 있음을 말할 수 있다.
  - code: 6사11-02
    short: 경제성장이 생활에 미친 영향과 문제 해결
    text: 경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐색한다.
    levels:
      A: 경제성장이 우리 생활에 미친 영향을 분석하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐구할 수 있다.
      B: 경제성장이 우리 생활에 미친 영향을 조사하고, 빠른 경제성장으로 발생한 문제와 해결 방안을 설명할 수 있다.
      C: 경제성장으로 달라진 생활 모습을 제시하고, 빠른 경제성장으로 발생한 문제가 있음을 말할 수 있다.
  - code: 6사11-03
    short: 무역의 의미와 국가 간 무역이 일어나는 이유
    text: 사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다.
    levels:
      A: 무역 사례를 분석하여 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유와 나라 사이의 상호 의존 관계를 탐구할 수 있다.
      B: 무역 사례를 조사하여 무역의 의미와 국가 간 무역이 발생하는 이유를 설명할 수 있다.
      C: 우리 생활 속 무역 사례를 제시하고, 나라마다 무역을 하는 까닭이 있음을 말할 수 있다.

domainLevels:
  A:
    지식·이해: 가계와 기업의 역할, 경제성장이 생활에 미친 영향, 국가 간 무역이 발생하는 이유를 탐구할 수 있다.
    과정·기능: 경제활동과 관련된 자료와 사례를 분석하여 합리적인 선택을 하고 경제 문제의 해결 방안을 제시할 수 있다.
    가치·태도: 근로자의 권리와 기업의 사회적 책임을 존중하고, 경제 문제를 함께 해결하려는 자세를 가진다.
  B:
    지식·이해: 가계와 기업의 역할, 경제성장이 생활에 미친 영향, 국가 간 무역이 발생하는 이유를 설명할 수 있다.
    과정·기능: 경제활동과 관련된 자료와 사례를 조사할 수 있다.
    가치·태도: 근로자의 권리와 기업의 사회적 책임에 관심을 가지고, 이를 존중하는 데 흥미를 느낀다.
  C:
    지식·이해: 가계와 기업이 하는 일, 경제성장으로 달라진 생활, 우리 생활 속 무역 사례를 말할 수 있다.
    과정·기능: 경제활동과 관련된 자료를 살펴볼 수 있다.
    가치·태도: 우리 생활 속 경제활동에 관심을 가진다.

