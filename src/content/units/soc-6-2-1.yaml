# 교과서에 나오는 지형 15곳 (지형 도감 카드)
atlas:
  - id: himalaya
    name: 히말라야산맥
    country: 네팔·중국·인도 등 (아시아)
    type: 산지
    lat: 27.99
    lon: 86.93
    photo: landforms/himalaya
    feature: 에베레스트산처럼 세계에서 가장 높은 산들이 길게 이어진 산맥이에요. 꼭대기에는 일 년 내내 눈과 빙하가 있어요.
    life: 가파른 비탈을 깎아 계단식 밭을 만들고, 추위에 강한 야크를 길러요. 높은 산에 오르려는 등산 관광객을 안내하는 일도 해요.
  - id: abyssinia
    name: 아비시니아고원
    country: 에티오피아 (아프리카)
    type: 산지
    lat: 9.03
    lon: 38.74
    photo: landforms/abyssinia
    feature: 높이 솟아 있으면서 위쪽이 넓고 평평한 땅(고원)이에요. 대부분 해발 2,000m가 넘어요.
    life: 적도와 가까운 열대 지역이지만 높아서 서늘해요. 그래서 사람들이 많이 모여 살고, 수도 아디스아바바도 이 고원에 있어요. 커피를 많이 길러요.
  - id: parinacota
    name: 파리나코타 화산
    country: 칠레·볼리비아 (남아메리카)
    type: 산지
    lat: -18.17
    lon: -69.14
    photo: landforms/parinacota
    feature: 안데스산맥에 있는 원뿔 모양의 높은 화산(약 6,300m)이에요. 산 아래에는 높은 곳에 생긴 호수가 있어요.
    life: 높고 추운 고원에서 털이 많은 라마와 알파카를 길러요. 그 털로 따뜻한 옷감을 만들어요.
  - id: maunaloa
    name: 마우나로아
    country: 미국 하와이 (태평양)
    type: 산지
    lat: 19.48
    lon: -155.6
    photo: landforms/maunaloa
    feature: 묽은 용암이 여러 번 흘러 쌓여서 경사가 완만하고 넓게 퍼진 거대한 화산이에요. 지금도 활동하는 화산이에요.
    life: 높고 공기가 맑아서 대기를 관측하는 관측소가 있어요. 화산을 보러 오는 관광객도 많아요.
  - id: huanghe
    name: 황허강
    country: 중국 (아시아)
    type: 하천
    lat: 36.14
    lon: 110.44
    photo: landforms/huanghe
    feature: 누런 흙(황토)이 쌓인 고원을 지나며 흙을 많이 싣고 흘러서 강물이 누렇게 보여요.
    life: 강 하류의 넓은 평야에서 옛날부터 농사를 지었어요. 홍수를 막으려고 둑을 쌓았고, 황토 고원에서는 언덕을 파서 만든 동굴집에 살기도 했어요.
  - id: amazon
    name: 아마존강
    country: 브라질 등 (남아메리카)
    type: 하천
    lat: -3.1
    lon: -60.0
    photo: landforms/amazon
    feature: 세계에서 가장 많은 물이 흐르는 강이에요. 넓은 열대 우림 사이를 굽이쳐 흘러요.
    life: 길이 적어서 배가 중요한 교통수단이에요. 강물이 불어날 때를 대비해 기둥을 세워 바닥을 높인 집을 짓고, 물고기를 잡아요.
  - id: nile
    name: 나일강 평야
    country: 이집트 (아프리카)
    type: 하천
    lat: 25.7
    lon: 32.64
    photo: landforms/nile
    feature: 사막 한가운데를 흐르는 나일강 주변에 기름진 흙이 쌓여 생긴 평야예요. 강을 따라 초록색 띠가 이어져요.
    life: 강물을 끌어와 농사를 지어요. 옛날에는 강물이 넘친 뒤 남은 기름진 흙에서 농사를 지어 고대 이집트 문명이 발달했어요. 사람들 대부분이 강 주변에 모여 살아요.
  - id: horseshoe
    name: 호스슈 벤드
    country: 미국 애리조나주 (북아메리카)
    type: 하천
    lat: 36.88
    lon: -111.51
    photo: landforms/horseshoe
    feature: 콜로라도강이 말발굽 모양으로 크게 휘어 흐르면서 땅을 깊게 깎아 만든 골짜기예요.
    life: 절벽 위 전망대에서 굽이치는 강을 보려는 관광객이 많이 찾아와요.
  - id: victoria
    name: 빅토리아 폭포
    country: 잠비아·짐바브웨 (아프리카)
    type: 하천
    lat: -17.92
    lon: 25.86
    photo: landforms/victoria
    feature: 잠베지강이 넓은 절벽 아래로 한꺼번에 떨어지는 거대한 폭포예요. 물보라가 멀리서도 보여요.
    life: 폭포를 구경하고 래프팅, 번지 점프 같은 활동을 즐기려는 관광객이 많아 관광 산업이 발달했어요.
  - id: sognefjord
    name: 송네 피오르
    country: 노르웨이 (유럽)
    type: 해안
    lat: 61.1
    lon: 6.5
    photo: landforms/sognefjord
    feature: 빙하가 깎아 만든 깊은 골짜기에 바닷물이 들어와 생긴 좁고 긴 바다예요. 양쪽에 높은 절벽이 있어요.
    life: 아름다운 경치를 보러 유람선 관광객이 많이 와요. 잔잔하고 깊은 바다에서 연어를 기르고, 절벽이 가팔라서 배로 오가기도 해요.
  - id: fundy
    name: 펀디만 갯벌
    country: 캐나다 (북아메리카)
    type: 해안
    lat: 45.82
    lon: -64.57
    photo: landforms/fundy
    feature: 밀물과 썰물 때 바닷물 높이 차이가 세계에서 가장 큰 곳이에요. 썰물 때는 넓은 갯벌과 바위가 드러나요.
    life: 썰물 때 바다 밑을 걸어 보는 관광이 인기예요. 큰 물 높이 차이를 이용해 전기를 만드는 방법도 연구해요.
  - id: elarco
    name: 엘 아르코
    country: 멕시코 (북아메리카)
    type: 해안
    lat: 22.88
    lon: -109.89
    photo: landforms/elarco
    feature: 파도가 오랫동안 바위를 깎아 만든 아치(문) 모양의 바위예요.
    life: 배를 타고 아치 바위를 구경하는 관광객이 많아 관광과 해양 레저가 발달했어요.
  - id: makena
    name: 마케나 모래사장
    country: 미국 하와이 (태평양)
    type: 해안
    lat: 20.63
    lon: -156.45
    photo: landforms/makena
    feature: 파도가 모래를 실어 와 쌓아서 생긴 넓은 모래 해변이에요.
    life: 해수욕과 물놀이를 즐기려는 관광객이 많이 찾아와요.
  - id: portcampbell
    name: 포트 캠벨 국립 공원
    country: 오스트레일리아 (오세아니아)
    type: 해안
    lat: -38.66
    lon: 143.1
    photo: landforms/portcampbell
    feature: 파도에 깎인 절벽과 바다 위에 홀로 서 있는 바위 기둥들(열두 사도 바위)이 있어요.
    life: 해안 도로를 따라 관광객이 많이 와요. 바위가 계속 깎여 무너지기도 해서 보호가 필요해요.
  - id: sahara
    name: 사하라 사막
    country: 리비아 등 (아프리카)
    type: 사막
    lat: 26.6
    lon: 12.5
    photo: landforms/sahara
    feature: 세계에서 가장 넓은 열대 사막이에요. 비가 거의 내리지 않고, 모래 언덕과 바위 사막이 넓게 펼쳐져 있어요.
    life: 물이 솟는 오아시스 주변에 마을을 이루고 대추야자를 길러요. 두꺼운 흙벽돌집으로 뜨거운 햇볕을 막아요.
