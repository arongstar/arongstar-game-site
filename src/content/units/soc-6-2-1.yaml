# 6학년 2학기 사회 1단원 — 세계의 자연환경
# 성취 수준 출처: 한국교육과정평가원 「2022 개정 교육과정에 따른 초등학교 5~6학년군 성취 수준」 (교사용 지도서 수록본)
subject: 사회
subjectSlug: social
grade: 6
semester: 2
unitNo: 1
title: 세계의 자연환경
emoji: 🌏
story: 지구 탐험대에 들어온 것을 환영해요! 세계 곳곳의 산과 강, 바닷가, 그리고 덥고 추운 여러 기후 지역을 탐험하며 사람들이 자연환경에 맞추어 어떻게 살아가는지 알아내 보세요.
textbookNote: 차시 구성은 교사용 지도서의 '단원의 지도 계획'(14차시)을 따랐어요. 출판사가 다르면 차시 번호만 바꾸어 쓰면 돼요.
domain: 세계의 자연환경

standards:
  - code: 6사10-01
    short: 지형 경관과 다양한 삶의 모습
    text: 세계 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다.
    levels:
      A: 세계 여러 지역의 지형 경관의 특징을 분석하고, 세계 여러 지역에서 나타나는 다양한 삶의 모습을 탐구할 수 있다.
      B: 세계 여러 지역의 지형 경관을 조사하고, 다양한 삶의 모습을 설명할 수 있다.
      C: 세계 여러 지역의 지형 경관의 특징을 제시하고, 삶의 모습이 다양함을 말할 수 있다.
  - code: 6사10-02
    short: 세계의 기후와 인간생활
    text: 세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다.
    levels:
      A: 세계의 다양한 기후의 특징을 분석하고, 기후 환경과 인간생활 간의 관계를 탐구할 수 있다.
      B: 세계의 다양한 기후를 조사하고, 기후 환경과 인간생활 간의 관계를 설명할 수 있다.
      C: 세계의 다양한 기후를 제시하고 기후 환경이 인간생활과 관련이 있음을 말할 수 있다.

domainLevels:
  A:
    지식·이해: 세계 여러 지역에서 나타나는 다양한 삶의 모습 및 기후 환경과 인간생활 간의 관계를 탐구할 수 있다.
    과정·기능: 세계 여러 지역의 지형 경관과 다양한 기후의 특징을 분석할 수 있다.
    가치·태도: 세계 여러 지역의 자연환경에 관심과 호기심을 가지고, 이를 탐구하려는 자세를 가진다.
  B:
    지식·이해: 세계 여러 지역에서 나타나는 다양한 삶의 모습 및 기후 환경과 인간생활 간의 관계를 설명할 수 있다.
    과정·기능: 세계 여러 지역의 지형 경관과 다양한 기후를 조사할 수 있다.
    가치·태도: 세계 여러 지역의 자연환경에 관심과 호기심을 가지고, 이를 탐색하는 데 흥미를 느낀다.
  C:
    지식·이해: 세계 여러 지역의 경관과 기후가 다양함을 인식하고 기후 환경이 인간생활과 관계가 있음을 말할 수 있다.
    과정·기능: 세계 여러 지역의 지형 경관과 다양한 기후를 나타낸 자료를 살펴볼 수 있다.
    가치·태도: 세계 여러 지역의 자연환경에 관심을 가진다.

