# 6학년 1학기 과학 1단원 — 산과 염기
# 성취기준: 교육부 고시 제2022-33호 [별책 9] 과학과 교육과정 (5~6학년군) 원문
# ⚠ 성취수준(levels, domainLevels)은 평가원 원문을 확인하지 못해 만든 초안이에요. 지도서의 성취수준으로 바꾼 뒤 levelsDraft 를 false 로 고쳐 주세요.
subject: 과학
subjectSlug: science
grade: 6
semester: 1
unitNo: 1
title: 산과 염기
emoji: 🧪
story: 과학 탐험대가 투명한 용액이 가득한 실험실에 들어왔어요! 겉으로는 똑같아 보이는 용액들을 지시약으로 나누고, 산성 용액과 염기성 용액의 성질을 밝혀내고, 산성화로 아파하는 자연을 알리는 기자가 되어 보세요.
textbookNote: 차시 구성은 성취기준과 탐구 활동에 맞추어 제안한 10차시예요. 교육과정에 따라 중성, pH, 중화라는 용어는 다루지 않고, 용액을 섞을 때 지시약의 색깔 변화를 관찰하는 수준까지만 다뤄요.
domain: 산과 염기
levelsDraft: true
standards:
  - code: 6과09-01
    short: 지시약으로 용액 분류하기
    text: 여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.
    levels:
      A: 여러 가지 지시약의 색깔 변화를 종합하여 처음 보는 용액도 산성 용액과 염기성 용액으로 분류하고 그 근거를 설명할 수 있다.
      B: 지시약을 넣었을 때의 변화를 관찰하여 여러 가지 용액을 산성 용액과 염기성 용액으로 분류할 수 있다.
      C: 안내에 따라 용액에 지시약을 넣고 색깔 변화를 관찰할 수 있다.
  - code: 6과09-02
    short: 산성·염기성 용액의 성질과 섞을 때의 변화
    text: 산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액의 성질 변화를 실험을 통해 추론할 수 있다.
    levels:
      A: 산성 용액과 염기성 용액을 섞을 때 지시약의 색깔 변화를 근거로 용액의 성질이 어떻게 변하는지 추론하여 설명할 수 있다.
      B: 산성 용액은 탄산 칼슘과, 염기성 용액은 단백질과 반응하는 성질을 관찰하고, 두 용액을 섞을 때의 색깔 변화를 관찰할 수 있다.
      C: 산성 용액과 염기성 용액에 여러 가지 물질을 넣었을 때 나타나는 변화를 말할 수 있다.
  - code: 6과09-03
    short: 생활 속 산성·염기성 용액
    text: 우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다.
    levels:
      A: 생활 속에서 산성 용액과 염기성 용액을 이용하는 예를 찾아 그 성질과 관련지어 설명할 수 있다.
      B: 생활 속에서 산성 용액과 염기성 용액을 이용하는 예를 찾을 수 있다.
      C: 생활 속에서 산성 용액이나 염기성 용액을 이용하는 예를 한 가지 말할 수 있다.
  - code: 6과09-04
    short: 산성화로 인한 환경 피해 알리기
    text: 산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다.
    levels:
      A: 산성화로 인한 환경 피해 사례의 원인과 결과, 대책을 조사하여 설득력 있는 자료를 만들고 공유할 수 있다.
      B: 산성화로 인한 환경 피해 사례를 조사하여 소개하는 자료를 만들 수 있다.
      C: 산성화로 인한 환경 피해 사례를 한 가지 말할 수 있다.
domainLevels:
  A:
    지식·이해: 산성 용액과 염기성 용액의 성질을 근거를 들어 설명하고 생활에 적용할 수 있다.
    과정·기능: 지시약 실험 결과를 분석하여 용액을 분류하고 섞을 때의 변화를 추론할 수 있다.
    가치·태도: 산성화로 인한 환경 문제에 관심을 가지고 해결을 위해 실천한다.
  B:
    지식·이해: 산성 용액과 염기성 용액의 성질을 설명할 수 있다.
    과정·기능: 지시약으로 용액을 분류하고 실험 결과를 비교할 수 있다.
    가치·태도: 실험실 안전 수칙을 지키며 탐구에 참여한다.
  C:
    지식·이해: 산성 용액과 염기성 용액의 예를 말할 수 있다.
    과정·기능: 안내에 따라 지시약 실험을 하고 관찰할 수 있다.
    가치·태도: 산과 염기에 관심을 가진다.
