standards:
  - code: 6과13-01
    short: 하루 동안 태양 고도·그림자 길이·기온의 관계
    text: 태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다.
    levels:
      A: 하루 동안 태양 고도, 그림자 길이, 기온을 측정한 자료를 분석하여 이들의 관계를 찾고, 기온이 가장 높은 시각이 태양 고도가 가장 높은 시각보다 늦은 까닭을 설명할 수 있다.
      B: 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 표와 그래프로 나타내고, 이들의 관계를 말할 수 있다.
      C: 안내에 따라 태양 고도, 그림자 길이, 기온을 측정하고, 태양 고도가 높아지면 그림자 길이가 짧아짐을 말할 수 있다.
  - code: 6과13-02
    short: 계절별 태양의 남중 고도와 낮의 길이
    text: 계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다.
    levels:
      A: 계절별 태양의 남중 고도, 낮의 길이, 기온 자료를 분석하여 이들의 관계를 추론하고 근거를 들어 설명할 수 있다.
      B: 계절에 따른 태양의 남중 고도와 낮의 길이 자료를 해석하여 이들의 관계를 말할 수 있다.
      C: 자료를 살펴보고 여름에는 태양의 남중 고도가 높고 낮의 길이가 길다는 것을 말할 수 있다.
  - code: 6과13-03
    short: 계절 변화의 원인
    text: 계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다.
    levels:
      A: 자전축의 기울기를 바꾼 모형 실험 결과를 분석하여, 지구의 자전축이 기울어진 채 공전하기 때문에 계절이 변한다는 것을 근거를 들어 설명할 수 있다.
      B: 지구의 자전축이 기울어진 채 공전하면 계절에 따라 태양의 남중 고도가 달라져 계절이 변한다는 것을 설명할 수 있다.
      C: 계절이 변하는 것이 지구의 자전축 기울기, 공전과 관계있음을 말할 수 있다.
domainLevels:
  A:
    지식·이해: 태양 고도·그림자 길이·기온의 관계와 계절 변화의 원인을 근거를 들어 설명할 수 있다.
    과정·기능: 측정 자료와 모형 실험 결과를 분석하고 변인을 통제하여 결론을 이끌어 낼 수 있다.
    가치·태도: 계절 변화 현상에 호기심을 가지고 자료에 근거하여 끈기 있게 탐구한다.
  B:
    지식·이해: 태양 고도·그림자 길이·기온의 관계와 계절 변화의 원인을 설명할 수 있다.
    과정·기능: 측정 자료를 표와 그래프로 나타내고 해석할 수 있다.
    가치·태도: 계절 변화 현상에 관심을 가지고 탐구에 즐겁게 참여한다.
  C:
    지식·이해: 태양 고도와 그림자 길이, 계절에 따른 변화를 말할 수 있다.
    과정·기능: 안내에 따라 측정하고 자료를 살펴볼 수 있다.
    가치·태도: 하늘과 계절의 변화에 관심을 가진다.
