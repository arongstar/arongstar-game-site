standards:
  - code: 6사12-01
    short: 세계 인구 분포와 여러 국가의 인구 특징
    text: 세계 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다.
    levels:
      A: 세계 인구 분포의 특징을 분석하고, 여러 국가의 인구 특징과 그 까닭을 탐구할 수 있다.
      B: 세계 인구 분포를 조사하고, 여러 국가의 인구 특징을 설명할 수 있다.
      C: 세계 인구 분포를 제시하고, 나라마다 인구 특징이 다름을 말할 수 있다.
  - code: 6사12-02
    short: 지구촌 문제와 지속가능한 미래
    text: 지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색한다.
    levels:
      A: 지구촌을 위협하는 문제들의 원인과 영향을 분석하고, 지속가능한 미래를 위한 해결 방안을 탐구할 수 있다.
      B: 지구촌을 위협하는 문제들을 조사하고, 지속가능한 미래를 위한 해결 방안을 설명할 수 있다.
      C: 지구촌을 위협하는 문제들을 제시하고, 지속가능한 미래를 위해 함께 노력해야 함을 말할 수 있다.

domainLevels:
  A:
    지식·이해: 세계 인구 분포와 여러 국가의 인구 특징, 지구촌 문제의 원인과 해결 방안을 탐구할 수 있다.
    과정·기능: 인구와 지구촌 문제에 관한 지도·그래프·사례 자료를 분석하여 해결 방안을 제안할 수 있다.
    가치·태도: 지구촌 문제를 나의 문제로 인식하고, 지속가능한 미래를 위해 실천하려는 자세를 가진다.
  B:
    지식·이해: 세계 인구 분포와 여러 국가의 인구 특징, 지구촌 문제와 해결 방안을 설명할 수 있다.
    과정·기능: 인구와 지구촌 문제에 관한 지도·그래프·사례 자료를 조사할 수 있다.
    가치·태도: 지구촌 문제에 관심을 가지고, 해결을 위한 노력에 참여하는 데 흥미를 느낀다.
  C:
    지식·이해: 세계 인구 분포와 지구촌 문제의 예를 말할 수 있다.
    과정·기능: 인구와 지구촌 문제에 관한 자료를 살펴볼 수 있다.
    가치·태도: 지구촌 사람들과 지구촌 문제에 관심을 가진다.

