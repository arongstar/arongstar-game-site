# 6학년 영어 Lesson 1 — I'm in the Sixth Grade (동아출판 정은숙 외, 2022 개정)
# 성취기준: 교육부 고시 제2022-33호 [별책 14] 영어과 교육과정 (5~6학년군) — 동아출판 지도서 18·20쪽에 실린 원문
# 차시·의사소통 기능·신출 어휘·파닉스·문화는 지도서 54~55쪽(Master Plan)과 72~73쪽(단원 지도 계획)을 따랐어요.
# 대화문·읽기 글·등장인물은 교과서 글을 옮기지 않고 이 사이트에서 새로 썼어요.
# 성취기준 6영01-02·01-03·01-04·01-07·02-02·02-10 은 지도서 수행 평가(572~576쪽)가 Lesson 1 에 연결한 것이고,
# 01-05·01-10·02-01·02-03·02-07·02-08 은 4~6차시(읽기·문화·말하기·쓰기) 목표에 맞춰 더했어요.
# ⚠ 성취수준(levels, domainLevels)은 지도서 수행 평가의 잘함·보통·노력 요함 기준을 바탕으로 만든 초안이에요.
