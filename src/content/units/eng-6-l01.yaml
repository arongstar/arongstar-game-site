story: 새 학년 첫날, 학교에 온 세계 친구들이 서로 인사를 나눠요! 학년과 동아리를 영어로 묻고 답하며 친구를 사귀고, 동아리 박람회와 세계 어린이 화상 모임에도 참여해 보세요. 마지막에는 나를 소개하는 글을 써서 카드로 만들어요.
