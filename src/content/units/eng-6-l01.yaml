standards:
  - code: 6영01-02
    short: 강세·리듬·억양에 맞게 소리 내어 읽기
    text: 간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 소리 내어 읽는다.
    levels:
      A: 학년과 동아리를 묻고 답하는 문장과 th /θ/ 소리가 든 낱말을 강세, 리듬, 억양에 맞게 정확하게 소리 내어 읽는다.
      B: 학년과 동아리를 묻고 답하는 문장과 th /θ/ 소리가 든 낱말을 대체로 바르게 소리 내어 읽는다.
      C: 본보기를 듣고 학년과 동아리를 나타내는 낱말을 부분적으로 소리 내어 읽는다.
  - code: 6영01-07
    short: 적절한 전략을 활용하여 듣거나 읽기
    text: 적절한 전략을 활용하여 일상생활 주제에 관한 담화나 글을 듣거나 읽는다.
    levels:
      A: 다시 듣기, 천천히 듣기, 그림 단서 활용 같은 전략을 스스로 골라 대화의 세부 정보를 정확하게 파악한다.
      B: 안내된 전략을 활용하여 대화의 세부 정보를 대체로 파악한다.
      C: 교사의 도움을 받아 전략을 활용하여 대화의 세부 정보를 부분적으로 파악한다.
  - code: 6영02-02
    short: 그림을 보고 말하거나 쓰기
    text: 실물, 그림, 동작 등을 보고 간단한 단어, 어구, 문장으로 말하거나 쓴다.
    levels:
      A: 그림을 보고 학년과 동아리를 나타내는 낱말과 문장을 정확하게 말하거나 쓴다.
      B: 그림을 보고 학년과 동아리를 나타내는 낱말과 문장을 틀리더라도 고쳐 가며 말하거나 쓴다.
      C: 교사의 도움을 받아 그림을 보고 학년과 동아리를 나타내는 낱말을 말하거나 쓴다.
  - code: 6영02-10
    short: 흥미와 자신감을 가지고 협력적으로 참여하기
    text: 의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다.
    levels:
      A: 학년과 동아리를 묻고 답하는 활동에 흥미와 자신감을 가지고 적극적으로 참여한다.
      B: 학년과 동아리를 묻고 답하는 활동에 자신감은 다소 부족하나 성실하게 참여한다.
      C: 교사의 격려를 받아 학년과 동아리를 묻고 답하는 활동에 참여한다.
  - code: 6영01-03
    short: 낱말·어구·문장의 의미 이해
    text: 간단한 단어, 어구, 문장의 의미를 이해한다.
    levels:
      A: 학년과 동아리를 나타내는 낱말과 문장을 듣거나 읽고 그 의미를 정확하게 이해한다.
      B: 학년과 동아리를 나타내는 낱말과 문장을 듣거나 읽고 그 의미를 대체로 이해한다.
      C: 그림이나 도움 자료를 참고하여 학년과 동아리를 나타내는 낱말의 의미를 부분적으로 이해한다.
  - code: 6영01-04
    short: 담화나 글의 세부 정보 파악
    text: 일상생활 주제에 관한 담화나 글의 세부 정보를 파악한다.
    levels:
      A: 자기소개 대화나 글을 듣거나 읽고 인물의 학년, 동아리, 좋아하는 것 등 세부 정보를 정확하게 파악한다.
      B: 자기소개 대화나 글을 듣거나 읽고 인물의 학년이나 동아리 같은 세부 정보를 대체로 파악한다.
      C: 그림이나 도움 자료를 참고하여 자기소개 대화나 글의 세부 정보를 부분적으로 파악한다.
  - code: 6영01-05
    short: 담화나 글의 중심 내용 파악
    text: 일상생활 주제에 관한 담화나 글의 중심 내용을 파악한다.
    levels:
      A: 자기소개 대화나 글을 듣거나 읽고 중심 내용을 정확하게 파악하여 말할 수 있다.
      B: 자기소개 대화나 글을 듣거나 읽고 중심 내용을 대체로 파악한다.
      C: 그림이나 도움 자료를 참고하여 자기소개 대화나 글의 중심 내용을 부분적으로 파악한다.
  - code: 6영01-10
    short: 문화를 포용의 태도로 듣거나 읽기
    text: 일상생활 주제나 문화에 관한 담화나 글을 포용의 태도로 듣거나 읽는다.
    levels:
      A: 다른 나라의 학교생활에 관한 글을 읽고 우리와의 차이를 존중하며 더 알아보려는 태도를 보인다.
      B: 다른 나라의 학교생활에 관한 글을 읽고 우리와의 차이를 존중한다.
      C: 다른 나라의 학교생활에 관한 글에 관심을 가진다.
  - code: 6영02-01
    short: 강세·리듬·억양에 맞게 말하기
    text: 간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 말한다.
    levels:
      A: 학년과 동아리를 묻고 답하는 문장을 강세, 리듬, 억양에 맞게 자연스럽게 말한다.
      B: 학년과 동아리를 묻고 답하는 문장을 강세, 리듬, 억양에 대체로 맞게 말한다.
      C: 본보기를 듣고 학년과 동아리를 묻고 답하는 문장을 부분적으로 따라 말한다.
  - code: 6영02-03
    short: 대소문자와 문장 부호 바르게 쓰기
    text: 알파벳 대소문자와 문장 부호를 문장에서 바르게 사용한다.
    levels:
      A: 학년과 동아리를 묻고 답하는 문장을 쓸 때 대소문자와 문장 부호를 정확하게 사용한다.
      B: 학년과 동아리를 묻고 답하는 문장을 쓸 때 대소문자와 문장 부호를 대체로 바르게 사용한다.
      C: 도움 자료를 참고하여 문장의 첫 글자와 문장 끝 부호를 부분적으로 바르게 쓴다.
  - code: 6영02-07
    short: 세부 정보를 묻고 답하기
    text: 일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다.
    levels:
      A: 학년과 동아리를 묻고 답하는 말을 상황에 맞게 정확하게 하고 대화를 이어 간다.
      B: 학년과 동아리를 묻고 답하는 말을 대체로 바르게 한다.
      C: 도움 자료를 참고하여 학년과 동아리를 묻고 답하는 말을 부분적으로 한다.
  - code: 6영02-08
    short: 예시문을 참고하여 글쓰기
    text: 예시문을 참고하여 목적에 맞는 간단한 글을 쓴다.
    levels:
      A: 예시문을 참고하여 자신의 학년, 동아리, 좋아하는 것, 장래 희망을 담은 소개 글을 정확하게 쓴다.
      B: 예시문을 참고하여 자신의 학년과 동아리, 좋아하는 것을 담은 소개 글을 대체로 바르게 쓴다.
      C: 예시문과 낱말 도움을 참고하여 자신의 이름, 학년, 동아리를 부분적으로 쓴다.
domainLevels:
  A:
    지식·이해: 학년과 동아리를 나타내는 낱말과 문장의 의미와 쓰임을 정확하게 이해한다.
    과정·기능: 자기소개 대화와 글을 듣고 읽으며 세부 정보와 중심 내용을 파악하고, 강세·억양에 맞게 묻고 답하며 소개 글을 쓴다.
    가치·태도: 다른 나라 친구들의 학교생활을 존중하며 자신감 있게 의사소통 활동에 참여한다.
  B:
    지식·이해: 학년과 동아리를 나타내는 낱말과 문장의 의미를 대체로 이해한다.
    과정·기능: 자기소개 대화와 글의 세부 정보를 대체로 파악하고, 학년과 동아리를 묻고 답하는 말을 하거나 쓴다.
    가치·태도: 의사소통 활동에 흥미를 가지고 참여한다.
  C:
    지식·이해: 학년과 동아리를 나타내는 낱말의 의미를 부분적으로 이해한다.
    과정·기능: 도움 자료를 참고하여 학년과 동아리를 묻고 답하는 말을 부분적으로 하거나 쓴다.
    가치·태도: 의사소통 활동에 관심을 가진다.
