title: 전기의 이용
emoji: 💡
story: 과학 탐험대가 전기 연구소에 들어왔어요! 전구에 불이 켜지는 회로를 설계하고, 전자석의 비밀을 밝혀내고, 전기를 안전하고 알뜰하게 쓰는 실천 계획을 세워 보세요.
textbookNote: 차시 구성은 성취기준과 탐구 활동에 맞추어 제안한 10차시예요. 교육과정에 따라 전구의 직렬·병렬연결은 다루지 않고, 전지는 직렬연결만 다뤄요.
domain: 전기의 이용
levelsDraft: true
standards:
  - code: 6과15-01
    short: 전구에 불이 켜지는 전기 회로
    text: 전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말할 수 있다.
    levels:
      A: 불이 켜지는 회로와 켜지지 않는 회로를 비교·분석하여 불이 켜지는 전기 회로의 특징을 근거를 들어 설명할 수 있다.
      B: 전지와 전구, 전선을 연결하여 전구에 불을 켜고, 불이 켜지는 전기 회로의 특징을 말할 수 있다.
      C: 안내에 따라 전지와 전구, 전선을 연결하여 전구에 불을 켤 수 있다.
  - code: 6과15-02
    short: 전지 한 개와 두 개를 직렬연결한 회로 비교
    text: 전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다.
    levels:
      A: 전지 한 개와 두 개를 직렬연결한 회로의 실험 결과를 분석하여 차이를 설명하고, 생활 속 예에 적용할 수 있다.
      B: 전지 한 개를 연결한 회로와 전지 두 개를 직렬연결한 회로에서 전구의 밝기를 비교할 수 있다.
      C: 전지 두 개를 직렬연결하면 전구가 더 밝아짐을 말할 수 있다.
  - code: 6과15-03
    short: 전자석의 성질과 쓰임
    text: 전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다.
    levels:
      A: 전자석과 영구 자석의 성질을 비교·분석하고, 전자석의 성질이 생활 속 도구에 어떻게 이용되는지 설명할 수 있다.
      B: 전자석을 만들어 전지의 수와 연결 방향에 따른 변화를 탐색하고, 전자석이 사용되는 예를 조사할 수 있다.
      C: 전자석은 전기가 흐를 때만 자석의 성질을 가진다는 것을 말할 수 있다.
  - code: 6과15-04
    short: 전기의 효율적이고 안전한 사용
    text: 전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다.
    levels:
      A: 전기를 효율적이고 안전하게 사용하는 방법을 조사·분석하여 구체적인 실천 계획을 세우고 실천 결과를 평가할 수 있다.
      B: 전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세울 수 있다.
      C: 전기를 아끼고 안전하게 사용하는 방법을 말할 수 있다.
domainLevels:
  A:
    지식·이해: 전기 회로와 전자석의 특징을 근거를 들어 설명하고 생활에 적용할 수 있다.
    과정·기능: 변인을 통제하여 실험하고 결과를 분석하여 결론을 이끌어 낼 수 있다.
    가치·태도: 전기를 효율적이고 안전하게 사용하는 습관을 스스로 실천한다.
  B:
    지식·이해: 전기 회로와 전자석의 특징을 설명할 수 있다.
    과정·기능: 실험을 수행하고 결과를 비교할 수 있다.
    가치·태도: 전기를 효율적이고 안전하게 사용하는 방법에 관심을 가지고 실천하려 한다.
  C:
    지식·이해: 전구에 불이 켜지는 회로와 전자석의 예를 말할 수 있다.
    과정·기능: 안내에 따라 회로를 꾸미고 관찰할 수 있다.
    가치·태도: 전기 안전에 관심을 가진다.
