emoji: 🌏
story: 과학 탐험대가 밤하늘 천문대에 들어왔어요! 남쪽 하늘에서 태양과 별이 움직이는 규칙을 찾고, 지구가 돌면 왜 낮과 밤이 생기는지, 계절마다 왜 다른 별자리가 보이는지 우주에서 내려다보며 밝혀 보세요.
textbookNote: 차시 구성은 성취기준과 탐구 활동에 맞추어 제안한 8차시예요. 남쪽 하늘을 바라보는 관측자를 기준으로 하고, 별자리는 이름보다 계절에 따라 보이는 별자리가 달라지는 까닭에 초점을 둬요.
domain: 지구의 운동
levelsDraft: true
standards:
  - code: 6과12-01
    short: 하루 동안 태양과 별의 위치 변화
    text: 하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다.
    levels:
      A: 하루 동안 태양과 별의 위치 변화를 관찰한 결과를 분석하여 공통된 규칙성을 찾고, 그 까닭을 지구의 자전과 관련지어 설명할 수 있다.
      B: 하루 동안 태양과 별을 관찰하여 동쪽에서 서쪽으로 위치가 변하는 규칙성을 찾을 수 있다.
      C: 하루 동안 태양의 위치가 변한다는 것을 말할 수 있다.
  - code: 6과12-02
    short: 지구의 자전과 낮과 밤
    text: 지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다.
    levels:
      A: 모형실험 결과를 근거로 지구의 자전과 낮과 밤이 생기는 까닭을 설명하고, 자전하지 않는다면 어떻게 될지 추론할 수 있다.
      B: 지구가 자전축을 중심으로 서쪽에서 동쪽으로 하루에 한 바퀴씩 도는 자전을 알고, 낮과 밤이 생기는 까닭을 설명할 수 있다.
      C: 지구가 하루에 한 바퀴씩 돈다는 것을 말할 수 있다.
  - code: 6과12-03
    short: 지구의 공전과 계절별 별자리
    text: 지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다.
    levels:
      A: 지구의 공전과 관련지어 계절에 따라 보이는 별자리가 달라지는 까닭을 설명할 수 있다.
      B: 지구의 공전을 알고, 천체 관측 프로그램 등으로 계절별 대표적인 별자리를 관찰할 수 있다.
      C: 계절에 따라 보이는 별자리가 다르다는 것을 말할 수 있다.
domainLevels:
  A:
    지식·이해: 지구의 자전과 공전으로 생기는 현상을 근거를 들어 설명할 수 있다.
    과정·기능: 관찰과 모형실험 결과를 분석하여 규칙성을 찾고 설명할 수 있다.
    가치·태도: 천체 현상에 호기심을 가지고 스스로 관찰을 이어 간다.
  B:
    지식·이해: 지구의 자전과 공전을 설명할 수 있다.
    과정·기능: 태양과 별을 관찰하고 모형실험을 수행할 수 있다.
    가치·태도: 천체 관찰에 즐겁게 참여한다.
  C:
    지식·이해: 낮과 밤, 계절별 별자리의 예를 말할 수 있다.
    과정·기능: 안내에 따라 태양과 별을 관찰할 수 있다.
    가치·태도: 밤하늘에 관심을 가진다.
