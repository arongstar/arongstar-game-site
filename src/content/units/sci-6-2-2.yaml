story: 과학 탐험대의 실험실에 불이 켜졌어요! 물질이 변하는 모습을 관찰하고, 물질이 탈 때 필요한 것과 생기는 것을 밝혀낸 뒤, 연소로 생긴 이산화 탄소 문제의 해결책을 찾아보세요.
textbookNote: 차시 구성은 성취기준과 탐구 활동에 맞추어 제안한 9차시예요. 실험할 때는 보안경 등 안전 장구를 착용하도록 지도해 주세요.
