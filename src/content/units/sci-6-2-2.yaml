standards:
  - code: 6과14-01
    short: 성질이 달라지는 변화와 달라지지 않는 변화
    text: 물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다.
    levels:
      A: 여러 가지 변화를 관찰한 결과를 분석하여 물질의 성질이 달라지는 변화와 달라지지 않는 변화를 근거를 들어 구분할 수 있다.
      B: 여러 가지 변화를 관찰하여 물질의 성질이 달라지는 변화와 달라지지 않는 변화를 비교할 수 있다.
      C: 안내에 따라 변화를 관찰하고 물질의 성질이 달라지는 변화의 예를 말할 수 있다.
  - code: 6과14-02
    short: 연소할 때의 공통적인 현상과 연소의 조건
    text: 물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다.
    levels:
      A: 연소 실험 결과를 분석하여 연소의 공통적인 현상과 세 가지 연소 조건을 찾고, 이를 새로운 상황에 적용할 수 있다.
      B: 물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 실험을 통해 연소의 조건을 찾을 수 있다.
      C: 물질이 연소할 때 빛과 열이 나는 것을 관찰하고, 연소에 필요한 것을 말할 수 있다.
  - code: 6과14-03
    short: 연소 전과 후 물질의 비교
    text: 연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.
    levels:
      A: 연소 후 생성되는 물질을 확인하는 실험 결과를 분석하여 연소 과정에서 물질의 성질이 달라짐을 근거를 들어 설명할 수 있다.
      B: 실험으로 연소 후 물과 이산화 탄소가 생기는 것을 확인하고, 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다.
      C: 연소 후 새로운 물질이 생긴다는 것을 말할 수 있다.
  - code: 6과14-04
    short: 연소로 생긴 이산화 탄소의 피해와 해결책
    text: 연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다.
    levels:
      A: 이산화 탄소로 인한 생태계 피해 사례의 원인과 영향을 분석하여 실천 가능한 해결책을 제안하고 공유할 수 있다.
      B: 이산화 탄소로 인한 생태계 피해 사례를 수집하고 해결책을 제안할 수 있다.
      C: 연소로 생긴 이산화 탄소가 생태계에 피해를 줄 수 있음을 말할 수 있다.
domainLevels:
  A:
    지식·이해: 물질의 변화, 연소의 조건과 연소 생성물을 근거를 들어 설명할 수 있다.
    과정·기능: 실험을 설계하고 결과를 분석하여 결론을 이끌어 내고, 해결책을 제안하여 공유할 수 있다.
    가치·태도: 안전 수칙을 지키며 실험하고, 생태계를 보호하려는 태도로 해결책을 실천한다.
  B:
    지식·이해: 물질의 변화, 연소의 조건과 연소 생성물을 설명할 수 있다.
    과정·기능: 실험을 수행하고 결과를 비교할 수 있다.
    가치·태도: 안전 수칙을 지키며 실험하고 생태계 피해 문제에 관심을 가진다.
  C:
    지식·이해: 물질의 변화와 연소에 필요한 것을 말할 수 있다.
    과정·기능: 안내에 따라 실험하고 결과를 관찰할 수 있다.
    가치·태도: 연소와 관련된 안전 수칙에 관심을 가진다.
