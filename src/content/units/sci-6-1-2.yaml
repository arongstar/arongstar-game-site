# 6학년 1학기 과학 2단원 — 물체의 운동
# 성취기준: 교육부 고시 제2022-33호 [별책 9] 과학과 교육과정 (5~6학년군) 원문
# ⚠ 성취수준(levels, domainLevels)은 평가원 원문을 확인하지 못해 만든 초안이에요. 지도서의 성취수준으로 바꾼 뒤 levelsDraft 를 false 로 고쳐 주세요.
subject: 과학
subjectSlug: science
grade: 6
semester: 1
unitNo: 2
title: 물체의 운동
emoji: 🏃
story: 과학 탐험대가 운동회 기록 본부에 들어왔어요! 좌표판으로 움직임을 추적하고, 이동 거리와 걸린 시간으로 누가 더 빠른지 가려내고, 우리 동네를 안전하게 만드는 교통안전 지킴이가 되어 보세요.
textbookNote: 차시 구성은 성취기준과 탐구 활동에 맞추어 제안한 8차시예요. 교육과정에 따라 두 위치 사이의 거리는 구하지 않고, 한 방향으로 움직이는 물체의 속력만 다루며, 속력 단위 바꾸기는 중점으로 다루지 않아요.
domain: 물체의 운동
levelsDraft: true
standards:
  - code: 6과10-01
    short: 시간에 따른 위치 변화 표현하기
    text: 운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다.
    levels:
      A: 여러 물체의 위치 변화를 좌표 평면에 표현하고, 이를 해석하여 운동하는 물체와 운동하지 않는 물체를 구별하고 설명할 수 있다.
      B: 운동하는 물체의 처음 위치와 나중 위치를 간단한 좌표 평면 위에 표현할 수 있다.
      C: 운동하는 물체는 시간에 따라 위치가 변한다는 것을 말할 수 있다.
  - code: 6과10-02
    short: 속력을 구하고 빠르기 비교하기
    text: 물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다.
    levels:
      A: 이동 거리와 걸린 시간이 모두 다른 물체의 속력을 구하여 빠르기를 비교하고, 속력의 의미를 근거를 들어 설명할 수 있다.
      B: 물체의 이동 거리와 걸린 시간으로 속력을 구하고 빠르기를 비교할 수 있다.
      C: 같은 거리를 이동한 물체의 걸린 시간을 비교하여 더 빠른 물체를 고를 수 있다.
  - code: 6과10-03
    short: 속력과 교통안전
    text: 속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다.
    levels:
      A: 속력과 관련된 안전장치가 필요한 까닭을 속력과 관련지어 설명하고, 교통안전 실천 계획을 세워 스스로 실천할 수 있다.
      B: 속력과 관련된 안전 수칙과 안전장치를 조사하여 공유할 수 있다.
      C: 교통안전 수칙을 한 가지 이상 말할 수 있다.
domainLevels:
  A:
    지식·이해: 위치 변화와 속력의 의미를 근거를 들어 설명하고 생활에 적용할 수 있다.
    과정·기능: 이동 거리와 걸린 시간을 측정한 자료를 분석하여 빠르기를 비교할 수 있다.
    가치·태도: 속력과 관련된 교통안전 수칙을 스스로 실천한다.
  B:
    지식·이해: 위치 변화와 속력을 설명할 수 있다.
    과정·기능: 이동 거리와 걸린 시간으로 속력을 구할 수 있다.
    가치·태도: 교통안전 수칙을 지키려 한다.
  C:
    지식·이해: 운동하는 물체의 예를 말할 수 있다.
    과정·기능: 안내에 따라 이동 거리와 걸린 시간을 측정할 수 있다.
    가치·태도: 교통안전에 관심을 가진다.
