textbookNote: 차시 구성은 성취기준에 맞추어 제안한 11차시예요. 교과서에 따라 「민주주의와 선거」, 「국가기관이 하는 일」, 「민주주의와 미디어」 같은 중단원으로 나뉘어 있어요.
