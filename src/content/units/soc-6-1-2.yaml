standards:
  - code: 6사08-01
    short: 선거의 의미와 역할, 선거 참여 태도
    text: 민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다.
    levels:
      A: 민주주의에서 선거의 의미와 역할을 민주 선거의 원칙과 관련지어 설명하고, 바람직한 선거 참여 태도를 스스로 실천할 수 있다.
      B: 민주주의에서 선거의 의미와 역할, 민주 선거의 원칙을 설명하고, 선거에 참여하는 바람직한 태도를 말할 수 있다.
      C: 선거가 대표를 뽑는 방법임을 알고, 선거에 참여해야 하는 까닭을 말할 수 있다.
  - code: 6사08-02
    short: 국회·행정부·법원이 하는 일과 권력 분립
    text: 민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립하는 이유를 탐색한다.
    levels:
      A: 국회, 행정부, 법원이 하는 일을 사례와 관련지어 설명하고, 권력을 분립하는 이유를 국민의 자유와 권리 보장과 관련지어 설명할 수 있다.
      B: 국회, 행정부, 법원이 하는 일을 구분하여 설명하고, 권력을 분립하는 이유를 말할 수 있다.
      C: 국회, 행정부, 법원이 하는 일을 한 가지씩 말할 수 있다.
  - code: 6사08-03
    short: 민주주의와 미디어, 비판적 이용
    text: 민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다.
    levels:
      A: 미디어의 내용을 여러 기준으로 비판적으로 분석하여 신뢰성을 판단하고, 미디어를 올바르게 이용하는 방법을 스스로 실천할 수 있다.
      B: 민주주의에서 미디어의 역할을 설명하고, 미디어의 내용을 비판적으로 분석하는 방법을 말할 수 있다.
      C: 여러 가지 미디어의 예를 들고, 미디어를 올바르게 이용하는 방법을 한 가지 이상 말할 수 있다.
domainLevels:
  A:
    지식·이해: 선거, 국가기관, 미디어가 민주주의에서 하는 역할을 근거를 들어 설명할 수 있다.
    과정·기능: 사례와 자료를 비판적으로 분석하여 판단하고 의견을 제시할 수 있다.
    가치·태도: 민주 시민으로서 선거와 미디어 이용에 책임 있게 참여한다.
  B:
    지식·이해: 선거, 국가기관, 미디어의 역할을 설명할 수 있다.
    과정·기능: 사례를 조사하여 국가기관이 하는 일을 구분하고 미디어 내용을 분석할 수 있다.
    가치·태도: 민주적인 의사 결정과 시민 참여에 관심을 가진다.
  C:
    지식·이해: 선거와 국가기관, 미디어의 예를 말할 수 있다.
    과정·기능: 안내에 따라 자료를 찾아 정리할 수 있다.
    가치·태도: 학급과 학교의 일에 참여하려 한다.
