title: 식물의 구조와 기능
emoji: 🌱
story: 과학 탐험대가 몸이 작아지는 약을 먹고 식물 속으로 들어왔어요! 현미경으로 세포를 들여다보고, 뿌리에서 잎까지 물방울과 함께 여행하며 각 기관이 하는 일을 밝히고, 나만의 식물 도감을 만들어 보세요.
textbookNote: 차시 구성은 성취기준과 탐구 활동에 맞추어 제안한 10차시예요. 교육과정에 따라 세포의 구조는 핵, 세포막, 세포벽을 용어 수준에서만 다뤄요.
domain: 식물의 구조와 기능
levelsDraft: true
standards:
  - code: 6과11-01
    short: 현미경으로 세포 관찰하기
    text: 생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.
    levels:
      A: 현미경으로 식물 세포를 관찰하고, 관찰 결과를 바탕으로 세포의 구조(핵, 세포막, 세포벽)와 생물을 이루는 기본 단위로서의 세포를 설명할 수 있다.
      B: 현미경 사용 방법에 따라 식물 세포를 관찰하고 핵, 세포막, 세포벽을 찾을 수 있다.
      C: 안내에 따라 현미경으로 식물 세포를 관찰할 수 있다.
  - code: 6과11-02
    short: 식물 기관의 구조와 기능
    text: 식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다.
    levels:
      A: 실험 결과를 근거로 식물 각 기관의 구조와 기능을 설명하고, 물과 양분의 이동을 통해 기관들이 서로 연결되어 있음을 설명할 수 있다.
      B: 식물 각 기관의 구조를 관찰하고 기능을 알아보는 실험을 수행하여 각 기관의 기능을 말할 수 있다.
      C: 식물의 뿌리, 줄기, 잎, 꽃이 하는 일을 한 가지씩 말할 수 있다.
  - code: 6과11-03
    short: 여러 가지 식물의 특징을 소개하는 자료
    text: 여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다.
    levels:
      A: 관심 있는 식물의 구조와 기능을 조사하여 특징이 잘 드러나는 자료를 만들고, 다른 식물과 비교하며 공유할 수 있다.
      B: 관심 있는 식물의 특징을 조사하여 설명하는 자료를 만들 수 있다.
      C: 관심 있는 식물의 특징을 한 가지 이상 말할 수 있다.
domainLevels:
  A:
    지식·이해: 식물 기관의 구조와 기능을 실험 결과를 근거로 설명하고 기관 사이의 연결을 이해한다.
    과정·기능: 실험을 설계·수행하고 결과를 분석하여 결론을 이끌어 낼 수 있다.
    가치·태도: 생명을 존중하며 식물에 대한 탐구를 스스로 이어 간다.
  B:
    지식·이해: 식물 기관의 구조와 기능을 설명할 수 있다.
    과정·기능: 현미경을 사용하고 식물 기관의 기능을 알아보는 실험을 수행할 수 있다.
    가치·태도: 식물에 관심을 가지고 탐구에 참여한다.
  C:
    지식·이해: 식물 기관의 이름과 하는 일을 말할 수 있다.
    과정·기능: 안내에 따라 관찰하고 실험할 수 있다.
    가치·태도: 식물에 관심을 가진다.
